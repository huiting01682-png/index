的事，例如洗臉、穿衣、吃飯，請讓他自己做。家屬在旁邊看著、必要時協助，不要全部代勞。"},{"t":"h","x":"保護無力的那一側"},{"t":"ul","x":["扶病人起身或移動時，不要拉無力那一側的手臂，以免肩膀受傷。","躺著或坐著時，用枕頭把無力的手臂托好。","長時間臥床時，大約每 2 小時協助翻身一次。"]},{"t":"fig","id":"arm"},{"t":"weak"},{"t":"warn","h":"出現這些情形，請先停下來並告訴醫護人員","ul":["頭暈、臉色蒼白、冒冷汗","胸悶、呼吸很喘","突然劇烈頭痛","手腳比平常更無力，或說話突然變得不清楚"]},{"t":"key","h":"進步有快有慢","p":"每個人恢復的速度不同。團隊每 3 週會評估一次，並依結果調整復健內容。持續練習比一次練很多更重要。"}]},{"title":"吞嚥與飲食安全","desc":"嗆咳的警訊、安全進食的方法","body":[{"t":"h","x":"為什麼要注意吞嚥"},{"t":"p","x":"中風後常見吞嚥變差。食物或水如果嗆進氣管，可能造成吸入性肺炎。有些病人嗆到時不會咳嗽，所以要靠家屬一起觀察。"},{"t":"warn","h":"吞嚥有問題的警訊","ul":["吃東西或喝水時咳嗽、嗆到","吃完後聲音變得濕濕的、有痰音","食物含在嘴裡吞不下去，或從嘴角流出來","吃一餐要花很久的時間","反覆發燒、痰變多"],"p":"出現這些情形，請告訴護理師或語言治療師。"},{"t":"h","x":"安全進食的方法"},{"t":"fig","id":"eat"},{"t":"ul","x":["病人完全清醒時才進食。","坐直再吃，姿勢依語言治療師教的方式調整。","小口慢慢吃，確定吞乾淨了再吃下一口。","餵食時，食物從有力的那一側放進嘴裡。","吃飯時專心，不邊吃邊說話。","吃完後至少坐 30 分鐘再躺下。","餐後清潔口腔，並檢查無力那一側的臉頰內有沒有食物殘留。"]},{"t":"fig","id":"after"},{"t":"h","x":"食物的軟硬與濃稠度"},{"t":"p","x":"食物要切多細、水要不要加增稠劑，請依語言治療師和營養師的建議，不要自己更改。"},{"t":"key","h":"使用鼻胃管的病人","ul":["灌食前先確認管子的位置和刻度。","灌食時把床頭抬高 30–45 度。","灌食後維持同樣姿勢至少 30 分鐘到 1 小時。"],"figBottom":"angle"}]},{"title":"預防跌倒","desc":"下床三步驟、病房與居家的安全重點","body":[{"t":"h","x":"中風後為什麼容易跌倒"},{"t":"p","x":"一側手腳無力、平衡變差、頭暈、急著上廁所，都會增加跌倒的機會。跌倒可能造成骨折或頭部受傷，讓復健中斷。"},{"t":"key","h":"下床三步驟","figTop":"steps","ul":["先在床上坐起來，坐 30 秒。","把腳放下，在床邊再坐 30 秒。","站起來，站穩 30 秒，沒有頭暈再開始走。"]},{"t":"h","x":"住院期間"},{"t":"ul","x":["下床和上廁所都要有人陪。需要幫忙請按呼叫鈴，不要勉強自己來。","床欄拉起，床的高度調到最低，床輪固定。","常用的物品放在有力那一側、伸手拿得到的地方。","穿合腳的防滑鞋，不穿拖鞋。褲子不要太長。","地板濕了請通知工作人員。"]},{"t":"h","x":"坐輪椅與移位"},{"t":"ul","x":["上下輪椅前，先把兩邊的煞車固定，腳踏板收起來。","移位的方法請照治療師教的步驟做。"]},{"t":"h","x":"回家以後"},{"t":"ul","x":["浴室和馬桶旁加裝扶手，地上鋪防滑墊。","走道上的雜物、電線、小地毯收起來。","晚上留一盞小燈。"]},{"t":"fig","id":"safe"},{"t":"warn","h":"萬一跌倒了","ul":["不要急著把病人拉起來，先看他是否清醒、哪裡痛。","住院中請立刻按呼叫鈴。","在家如果撞到頭、痛到不能動，或意識不清楚，請撥 119。"]}]},{"title":"預防再次中風","desc":"按時服藥、量血壓、認識再中風警訊","body":[{"t":"h","x":"中風過的人，要預防再發生"},{"t":"p","x":"中風過的人，再次中風的機會比一般人高。把血壓、血糖、血脂控制好，可以降低機會。"},{"t":"fig","id":"three"},{"t":"h","x":"按時服藥"},{"t":"ul","x":["預防血栓的藥，以及控制血壓、血糖、血脂的藥，都要照醫師指示每天服用。","不要因為覺得好多了就自己停藥或減藥。","如果有不容易止住的出血、解黑便或血便，請儘快告訴醫師。"]},{"t":"key","h":"量血壓「722」","figTop":"bp722","ul":["7：連續量 7 天。","2：早上起床後、晚上睡覺前各量一次。","2：每次量兩遍。"],"p":"把數字記下來，回診時帶給醫師看。血壓的目標值依醫師指示。"},{"t":"h","x":"生活習慣"},{"t":"fig","id":"life"},{"t":"ul","x":["不吸菸，少喝酒。","飲食少油、少糖、少鹽，多吃蔬菜和高纖食物。","依治療師的建議持續活動。","如果覺得心跳不規則、心悸或胸悶，請告訴醫師。","按時回診。"]},{"t":"sos"},{"t":"ul","x":["不要自己開車或騎車去醫院。","等救護車時，不要餵病人吃東西、喝水或吃藥。","不要等症狀自己好。"]}]},{"title":"情緒與溝通","desc":"中風後的情緒變化、怎麼和病人說話、照顧者的休息","body":[{"t":"h","x":"中風後的情緒變化"},{"t":"p","x":"中風後心情低落、容易哭或發脾氣，是常見的情形，和腦部受傷與生活突然改變都有關係，不是病人不夠堅強。"},{"t":"warn","h":"這些情形持續兩週以上，請告訴醫療團隊","ul":["整天悶悶不樂，對什麼事都沒興趣","不想復健、不想說話","睡不好或吃不下","常說自己拖累家人"],"p":"情緒問題可以治療，也會影響復健成果，值得提出來討論。"},{"t":"h","x":"和說話有困難的病人溝通"},{"t":"fig","id":"talk"},{"t":"ul","x":["面對面說話，速度放慢，句子短一點。","一次只說一件事。","多用可以回答「是」或「不是」的問題。","搭配手勢、圖片或實物。","給病人時間回答，不要急著替他說完。","用對大人說話的方式，不要當成小孩。"]},{"t":"h","x":"照顧者也要照顧自己"},{"t":"ul","x":["家人輪流照顧，不要一個人全部承擔。","照顧者要有固定的休息和吃飯時間。","覺得撐不住時，可以找護理師或社工師談。"]},{"t":"fig","id":"rest"},{"t":"key","h":"長照專線 1966","p":"撥 1966 可以詢問喘息服務、居家服務等長期照顧資源。"}]},{"title":"出院返家準備","desc":"出院前要學會的事、居家環境、長照資源","body":[{"t":"h","x":"出院前要學會的事"},{"t":"ul","x":["安全地幫病人翻身、上下床和上下輪椅。","餵食或鼻胃管灌食的方法。","每一種藥的作用和服用時間。","在家要繼續做的復健動作。","如果有管路，例如鼻胃管或尿管，要學會照護方法。"]},{"t":"p","x":"沒把握的地方，出院前請護理師或治療師再教一次，並實際操作給他們看。"},{"t":"h","x":"居家環境"},{"t":"ul","x":["床的高度要方便上下，床邊留輪椅可以靠近的空間。","浴室和馬桶旁加裝扶手，地面防滑。","走道保持寬敞，收起雜物和電線。"]},{"t":"fig","id":"safe"},{"t":"h","x":"輔具"},{"t":"fig","id":"devices"},{"t":"p","x":"需要哪一種輔具，例如助行器、輪椅或便盆椅，請先問治療師再準備。輔具補助可以向各縣市長期照顧管理中心詢問。"},{"t":"h","x":"長照資源"},{"t":"p","x":"住院期間就可以請出院準備服務的護理師協助轉介長照評估，也可以自己撥 1966。服務包括居家服務、居家復能、交通接送和喘息服務等。"},{"t":"key","h":"出院後","figTop":"three","ul":["記下回診日期和科別。","按時服藥，每天量血壓。","持續復健，不要中斷。"]},{"t":"warn","h":"出現這些情形，請立刻就醫","ul":["再中風的警訊：嘴歪、單側手腳無力、說話不清楚，請撥 119","發燒、咳嗽、痰變多","意識不清楚，或叫不太醒","跌倒受傷","抽搐"]}]}],"daily":["今天的復健課都有參加","自己做得到的事自己做（洗臉、穿衣、吃飯）","吃飯時坐直、小口慢吃，吃完坐 30 分鐘","餐後清潔口腔，檢查有沒有食物殘留","下床前先坐 30 秒、站 30 秒，並有人陪","臥床時約每 2 小時翻身，無力的手臂有枕頭托著","今天的藥都按時吃了","量血壓並記錄","今天有和病人聊天、鼓勵他","照顧者自己有休息和吃飯"],"ready":["會安全地協助上下床、上下輪椅","會餵食或鼻胃管灌食","知道每種藥的作用和服用時間","會做居家復健動作","已依治療師建議準備輔具","家裡已加裝扶手、鋪防滑墊、收好雜物","已撥 1966 或請護理師轉介長照評估","知道回診日期和科別","知道再中風的警訊和什麼時候要撥 119","家裡有血壓計，並且會記錄"],"quiz":[{"q":"中風病情穩定後，及早開始復健，比較有機會恢復功能。","why":"病情穩定後的這段時間恢復較快，PAC 就是在這段時間安排密集復健。"},{"q":"為了讓病人多休息，穿衣、吃飯最好都由家屬代勞。","why":"病人自己做得到的事請讓他自己做，這也是復健的一部分。家屬在旁邊看著、必要時協助就好。"},{"q":"扶病人起身時，不可以拉他無力那一側的手臂。","why":"拉無力那一側的手臂容易讓肩膀受傷。"},{"q":"病人吃飯時偶爾咳一下沒關係，不用告訴醫護人員。","why":"吃東西或喝水時咳嗽是吞嚥有問題的警訊，請告訴護理師或語言治療師。"},{"q":"餵食時，食物要從病人有力的那一側放進嘴裡。","why":"從有力的那一側放入，比較容易咀嚼和吞嚥，也比較不會殘留。"},{"q":"半夜想上廁所，為了不吵醒家屬，病人可以自己慢慢走去。","why":"下床和上廁所都要有人陪。住院中請按呼叫鈴，不要勉強自己來。"},{"q":"血壓穩定、沒有不舒服，就可以自己把藥停掉。","why":"血壓穩定是因為有按時服藥。要不要調整藥物，請由醫師決定。"},{"q":"突然嘴歪、一隻手無力或說話不清楚，先休息觀察半天再說。","why":"這是再中風的警訊。出現任何一項請立刻撥 119，並記下發作時間。"},{"q":"PAC 照護期間，團隊每 3 週會評估一次進步情形。","why":"團隊在收案、每 3 週和結案時都會評估，並依結果調整復健內容。"},{"q":"照顧者也需要休息，可以撥 1966 詢問喘息服務。","why":"照顧是長期的事。1966 長照專線可以詢問喘息服務和居家服務等資源。"}]},"en":{"code":"en","name":"English","htmlLang":"en","speech":"en-US","locale":"en-GB","glyph":"A","rangeWord":" to ","say":[["119","one one nine"],["1966","one nine six six"],["722","seven two two"]],"ui":{"brand":"Stroke PAC Education","trial":"Trial version","tabHome":"Home","tabLearn":"Learn","tabCheck":"Checklist","tabQuiz":"Quiz","homeTitle":"The golden period for rehabilitation after a stroke","homeIntro":"Post-acute care education for patients and families. Each unit takes about 3 minutes. You can read it or listen to it.","todayTitle":"Today's care checklist","todayDone":"Done: {n} / {m} items","unitsHeading":"Education units","aboutTitle":"About this education material","about":["This is a trial version. The medical team must review the content before it goes online.","The content is general information. Every patient is different. Please follow the instructions of your attending doctor and care team.","Your check marks are saved only on this device. They are not uploaded, and no names or medical record data are recorded.","This translation is a draft and has not yet been reviewed by a native-speaking healthcare professional."],"sourcesLabel":"Sources: ","src1":"National Health Insurance Administration, Post-Acute Care (PAC) program","src2":"Health Promotion Administration, stroke education","learnTitle":"Education units","learnIntro":"{n} units in total. Tap any unit you want to read.","back":"All units","unitMeta":"Unit {i} of {n}","speak":"Read this unit aloud","stop":"Stop reading aloud","rate":"Reading speed","rateNormal":"Normal","rateSlow":"Slow","noSpeech":"This browser cannot read text aloud. Please read the text instead.","speechFail":"This device cannot read aloud right now. Please read the text instead.","noVoice":"This device has no English voice. Please read the text instead.","prev":"Previous","next":"Next","toQuiz":"Take the quiz","checkTitle":"Care checklists","listDaily":"Daily care","listReady":"Discharge preparation","progDone":"Done: {n} / {m}","dailyHint":"{date}. Starts again every day","readyHint":"Check each item when it is ready","clearAll":"Uncheck all","privacy":"Your check marks are saved only on this device. They are not uploaded, and no names or medical record data are recorded.","quizTitle":"Quiz","quizIntro":"{n} true-or-false questions. See how many key points you remember.","quizNo":"Question {i} of {n}","yes":"True","no":"False","markOk":"✓","right":"Correct.","correctIs":"The correct answer is \"{a}\".","nextQ":"Next question","seeResult":"See result","resultTitle":"Quiz result","scoreOf":"/ {n} correct","reviewTitle":"Content you can read again","correctAnswer":"Correct answer: {a}.","readUnit":"Read \"{t}\"","allRight":"All correct. Please keep using these key points in everyday care.","retry":"Try again","weakNote":"In the pictures, orange shows the weak side.","fontAria":"Text size","fontS":"Standard text","fontM":"Large text","fontL":"Extra large text","langAria":"Language","listAria":"Checklist type","navAria":"Main menu"},"sos":{"title":"Warning signs of another stroke","items":[["Smile","The mouth is crooked, or the two sides of the face do not match"],["Raise both arms","Hold both arms out straight. One arm is weak and drops"],["Say hello","Speech is unclear, or the words do not come out"]],"call":"If any one of these happens, call {n} right away and write down the time it started."},"caps":{"journey":[["Acute treatment",""],["PAC rehab",""],["Going home",""]],"team":[["Physical therapy","Walking and balance"],["Occupational therapy","Daily activities"],["Speech therapy","Speaking and swallowing"]],"arm":[["Do this","Support arm with a pillow"],["Do not do this","Pull the weak arm"]],"eat":[["Do this","Sit up. Small, slow bites"],["Do not do this","Eat lying down"]],"after":[["Sit 30 minutes","Do not lie down right away"],["Clean the mouth","After every meal"],["Check the cheeks","For leftover food"]],"steps":[["Sit up in bed","30 seconds"],["Sit on edge of bed","30 seconds"],["Stand steady","30 seconds, then walk"]],"safe":[["Grab bars","Bathroom, beside toilet"],["Non-slip mat","Bathroom floor"],["Night light","Leave one on at night"],["Clear walkways","Remove clutter and cords"]],"three":[["Medicine on time",""],["Blood pressure daily",""],["Follow-up visits",""]],"bp722":[["7 days","In a row"],["2 times a day","Morning and night"],["2 readings","Each time"]],"life":[["No smoking",""],["Less salt and oil",""],["More vegetables",""],["Keep active",""]],"talk":[["Face to face","Slow, short sentences"],["Pictures, gestures","Help to communicate"]],"rest":[["Regular rest","Caregivers eat, sleep too"],["Call 1966","Ask about respite care"]],"devices":[["Walker",""],["Wheelchair",""],["Quad cane",""]],"angle":{"cap":"During and after tube feeding, raise the head of the bed 30–45 degrees","aria":"During tube feeding, the head of the bed is raised 30 to 45 degrees"},"weeks":{"cap":"PAC care period (weeks)","legend":["As a rule, 3–6 weeks","Can be extended once after assessment, up to 12 weeks","Assessment every 3 weeks"],"aria":"PAC care period: as a rule 3 to 6 weeks, can be extended once up to 12 weeks, with an assessment every 3 weeks"}},"units":[{"title":"About PAC post-acute care","desc":"What PAC is, who can join, how long care lasts","body":[{"t":"h","x":"What is post-acute care"},{"t":"p","x":"After the acute treatment for a stroke ends and the patient's condition is stable, there is a period when body functions recover faster. The National Health Insurance (NHI) Post-Acute Care program is called PAC for short. During this period, a team of different professionals arranges intensive rehabilitation. This helps the patient regain the ability to take care of themselves in daily life and go home smoothly."},{"t":"fig","id":"journey"},{"t":"h","x":"Who can join"},{"t":"p","x":"The medical team assesses whether a patient is suitable. The main conditions are:"},{"t":"ul","x":["Within 1 month after an acute stroke. In special cases this can be extended to within 40 days.","After the stroke, the patient has moderate to moderately severe loss of function.","The patient's condition has been stable for 72 hours or more.","The patient has potential for rehabilitation: can cooperate and learn, can sit with support for a full 1 hour, and is willing to take an active part in rehabilitation."]},{"t":"h","x":"How long care lasts"},{"t":"p","x":"As a rule, it is 3–6 weeks. If the team's assessment shows there is still a need, it can be extended once, up to 12 weeks at most. During this time, progress is assessed every 3 weeks."},{"t":"fig","id":"weeks"},{"t":"h","x":"Three models of care"},{"t":"modes","x":[{"dt":"Inpatient model","dd":"The patient stays in the hospital for rehabilitation. High intensity: 3–5 therapy sessions a day. Regular intensity: 1–2 sessions a day."},{"dt":"Day care model","dd":"The patient comes to the hospital for rehabilitation in the daytime, from about 9 in the morning to 5 in the afternoon, with 2–4 therapy sessions a day. The patient goes home to rest at night."},{"dt":"Home model","dd":"For patients who cannot use inpatient care, day care or outpatient rehabilitation, a therapist comes to the home to give therapy. Each session is 30–50 minutes, 1–6 times a week."}]},{"t":"p","x":"Each hospital offers different models. Please check with the PAC case manager."},{"t":"h","x":"When it ends"},{"t":"ul","x":["Function has clearly improved, and the patient can go home and do rehabilitation on their own.","No progress in 2 assessments in a row.","The patient's condition changes, and other treatment is needed first.","The 12-week limit has been reached."]},{"t":"key","h":"What family members can do","ul":["Join the team's briefings and discussions to understand the rehabilitation goals.","Learn care skills from the therapists and nurses.","Talk with the team early about the plans after discharge."]}]},{"title":"How rehabilitation is done","desc":"The team members, how family can help, when to stop","body":[{"t":"h","x":"What the rehabilitation team does"},{"t":"ul","x":["Physical therapy: practice turning over, sitting, standing, walking and balance.","Occupational therapy: practice hand movements and daily activities such as dressing, eating and using the toilet.","Speech therapy: practice speaking, understanding and swallowing."]},{"t":"fig","id":"team"},{"t":"p","x":"The team also includes doctors, nurses, dietitians, pharmacists and social workers. You can bring any question to them."},{"t":"h","x":"Every moment in the ward is rehabilitation"},{"t":"p","x":"The movements the therapist teaches should be used in everyday life. Please let the patient do the things he or she can do alone, such as washing the face, dressing and eating. Family members stay close and watch, and help when needed. Do not do everything for the patient."},{"t":"h","x":"Protect the weak side"},{"t":"ul","x":["When you help the patient get up or move, do not pull the arm on the weak side, so that the shoulder is not injured.","When the patient is lying down or sitting, support the weak arm well with a pillow.","When the patient stays in bed for a long time, help the patient turn over about every 2 hours."]},{"t":"fig","id":"arm"},{"t":"weak"},{"t":"warn","h":"If any of these happen, stop first and tell the medical staff","ul":["Dizziness, pale face, cold sweat","Chest tightness, or very short of breath","Sudden severe headache","Arms or legs weaker than usual, or speech suddenly becomes unclear"]},{"t":"key","h":"Progress can be fast or slow","p":"Each person recovers at a different speed. The team assesses the patient every 3 weeks and adjusts the rehabilitation based on the results. Practicing regularly is more important than practicing a lot at one time."}]},{"title":"Swallowing and safe eating","desc":"Warning signs of choking, ways to eat safely","body":[{"t":"h","x":"Why swallowing needs attention"},{"t":"p","x":"Swallowing often becomes worse after a stroke. If food or water goes into the airway, it may cause aspiration pneumonia (a lung infection). Some patients do not cough when they choke, so family members need to help watch."},{"t":"warn","h":"Warning signs of a swallowing problem","ul":["Coughing or choking when eating or drinking water","After eating, the voice sounds wet, as if there is phlegm","Food stays in the mouth and cannot be swallowed, or leaks out from the corner of the mouth","A meal takes a very long time to finish","Fever again and again, or more phlegm"],"p":"If any of these happen, please tell the nurse or speech therapist."},{"t":"h","x":"Ways to eat safely"},{"t":"fig","id":"eat"},{"t":"ul","x":["The patient should eat only when fully awake.","Sit upright before eating. Adjust the position the way the speech therapist taught.","Take small bites and eat slowly. Make sure everything is swallowed before the next bite.","When feeding the patient, put the food into the mouth from the strong side.","Pay attention during meals. Do not talk while eating.","After eating, sit for at least 30 minutes before lying down.","After meals, clean the mouth and check inside the cheek on the weak side for leftover food."]},{"t":"fig","id":"after"},{"t":"h","x":"How soft and how thick food should be"},{"t":"p","x":"How finely to cut the food and whether to add thickener to water: please follow the advice of the speech therapist and dietitian. Do not change it yourself."},{"t":"key","h":"Patients with a feeding tube (nasogastric tube)","ul":["Before feeding, first check the position of the tube and its length mark.","During feeding, raise the head of the bed 30–45 degrees.","After feeding, keep the same position for at least 30 minutes to 1 hour."],"figBottom":"angle"}]},{"title":"Preventing falls","desc":"Three steps for getting out of bed, key safety points in the ward and at home","body":[{"t":"h","x":"Why falls are more likely after a stroke"},{"t":"p","x":"Weakness in the arm and leg on one side, poorer balance, dizziness and rushing to the toilet all increase the chance of falling. A fall may cause a broken bone or a head injury, and interrupt rehabilitation."},{"t":"key","h":"Three steps for getting out of bed","figTop":"steps","ul":["First sit up in bed and sit for 30 seconds.","Put your feet down and sit on the edge of the bed for another 30 seconds.","Stand up and stand steady for 30 seconds. Start walking only if there is no dizziness."]},{"t":"h","x":"During the hospital stay"},{"t":"ul","x":["Someone must be with the patient when getting out of bed and going to the toilet. Press the call bell if you need help. Do not try to do it alone.","Keep the bed rails up, set the bed to its lowest height and lock the bed wheels.","Put often-used items on the strong side, within easy reach.","Wear non-slip shoes that fit well. Do not wear slippers. Pants should not be too long.","If the floor is wet, please tell the staff."]},{"t":"h","x":"Using a wheelchair and transferring"},{"t":"ul","x":["Before getting in or out of the wheelchair, first lock the brakes on both sides and fold up the footrests.","When transferring the patient, follow the steps the therapist taught."]},{"t":"h","x":"After going home"},{"t":"ul","x":["Install grab bars in the bathroom and beside the toilet, and put non-slip mats on the floor.","Put away clutter, electric cords and small rugs from the walkways.","Leave a small light on at night."]},{"t":"fig","id":"safe"},{"t":"warn","h":"If a fall happens","ul":["Do not rush to pull the patient up. First check whether the patient is awake and where it hurts.","In the hospital, press the call bell right away.","At home, if the patient hit the head, is in too much pain to move, or is not fully conscious, call 119."]}]},{"title":"Preventing another stroke","desc":"Taking medicine on time, measuring blood pressure, knowing the warning signs of another stroke","body":[{"t":"h","x":"People who have had a stroke need to prevent another one"},{"t":"p","x":"People who have had a stroke have a higher chance of another stroke than other people. Keeping blood pressure, blood sugar and blood lipids (fats) under good control can lower this chance."},{"t":"fig","id":"three"},{"t":"h","x":"Take medicine on time"},{"t":"ul","x":["Medicines that prevent blood clots, and medicines that control blood pressure, blood sugar and blood lipids (fats), must all be taken every day as the doctor instructed.","Do not stop or reduce the medicine yourself just because you feel much better.","If there is bleeding that is hard to stop, or black or bloody stools, tell the doctor as soon as possible."]},{"t":"key","h":"Measuring blood pressure: \"722\"","figTop":"bp722","ul":["7: measure for 7 days in a row.","2: measure once after getting up in the morning and once before going to bed at night.","2: take 2 readings each time."],"p":"Write the numbers down and bring them to show the doctor at the follow-up visit. For the target blood pressure, follow the doctor's instructions."},{"t":"h","x":"Daily habits"},{"t":"fig","id":"life"},{"t":"ul","x":["Do not smoke. Drink less alcohol.","Eat less oil, sugar and salt. Eat more vegetables and high-fiber foods.","Keep active as the therapist advises.","If you feel an irregular heartbeat, a pounding heart (palpitations) or chest tightness, please tell the doctor.","Go to follow-up visits on time."]},{"t":"sos"},{"t":"ul","x":["Do not drive a car or ride a motorcycle to the hospital yourself.","While waiting for the ambulance, do not give the patient food, water or medicine.","Do not wait for the symptoms to go away on their own."]}]},{"title":"Emotions and communication","desc":"Mood changes after a stroke, how to talk with the patient, rest for the caregiver","body":[{"t":"h","x":"Mood changes after a stroke"},{"t":"p","x":"After a stroke, it is common to feel low, cry easily or get angry easily. This is related to both the injury to the brain and the sudden change in life. It does not mean the patient is not strong enough."},{"t":"warn","h":"If these last for 2 weeks or more, please tell the medical team","ul":["Feeling down all day, with no interest in anything","Does not want to do rehabilitation or talk","Cannot sleep well or cannot eat","Often says he or she is a burden to the family"],"p":"Emotional problems can be treated. They also affect the results of rehabilitation, so they are worth bringing up and discussing."},{"t":"h","x":"Communicating with a patient who has difficulty speaking"},{"t":"fig","id":"talk"},{"t":"ul","x":["Speak face to face, slow down, and use shorter sentences.","Say only one thing at a time.","Use more questions that can be answered with \"yes\" or \"no\".","Use gestures, pictures or real objects together with your words.","Give the patient time to answer. Do not rush to finish the sentence for the patient.","Speak the way you speak to an adult. Do not treat the patient like a child."]},{"t":"h","x":"Caregivers need to take care of themselves too"},{"t":"ul","x":["Family members should take turns giving care. One person should not carry it all alone.","Caregivers need regular times to rest and to eat.","When you feel it is too much for you, you can talk with a nurse or social worker."]},{"t":"fig","id":"rest"},{"t":"key","h":"Long-term care hotline 1966","p":"Call 1966 to ask about long-term care resources such as respite care (someone else gives care for a short time so the caregiver can rest) and home care services."}]},{"title":"Getting ready for discharge and going home","desc":"What to learn before discharge, the home environment, long-term care resources","body":[{"t":"h","x":"What to learn before discharge"},{"t":"ul","x":["How to safely help the patient turn over, get in and out of bed, and get in and out of the wheelchair.","How to feed the patient, or how to feed through a feeding tube (nasogastric tube).","What each medicine does and when to take it.","The rehabilitation exercises to continue at home.","If the patient has a tube, such as a feeding tube (nasogastric tube) or a urinary catheter, learn how to care for it."]},{"t":"p","x":"For anything you are not sure about, ask the nurse or therapist to teach you again before discharge, and do it yourself while they watch."},{"t":"h","x":"The home environment"},{"t":"ul","x":["The bed height should make it easy to get in and out. Leave space beside the bed so a wheelchair can come close.","Install grab bars in the bathroom and beside the toilet, and make the floor non-slip.","Keep the walkways wide. Put away clutter and electric cords."]},{"t":"fig","id":"safe"},{"t":"h","x":"Assistive devices"},{"t":"fig","id":"devices"},{"t":"p","x":"Ask the therapist first which assistive device is needed, such as a walker, a wheelchair or a commode chair, and then get it. For subsidies for assistive devices, ask the long-term care management center of your city or county."},{"t":"h","x":"Long-term care resources"},{"t":"p","x":"While the patient is still in the hospital, you can ask the discharge planning nurse to help with a referral for a long-term care assessment. You can also call 1966 yourself. Services include home care, home-based reablement (training to do daily activities again), transport and respite care."},{"t":"key","h":"After discharge","figTop":"three","ul":["Write down the dates and departments of the follow-up visits.","Take medicine on time and measure blood pressure every day.","Keep doing rehabilitation. Do not stop."]},{"t":"warn","h":"If any of these happen, get medical care right away","ul":["Warning signs of another stroke: crooked mouth, weakness in the arm or leg on one side, unclear speech. Call 119","Fever, cough, more phlegm","Not fully conscious, or hard to wake up","Injury from a fall","Convulsions (seizures)"]}]}],"daily":["Joined all of today's rehabilitation sessions","The patient did the things he or she can do alone (washing the face, dressing, eating)","Sat upright at meals, took small bites slowly, and sat for 30 minutes after eating","Cleaned the mouth after meals and checked for leftover food","Before getting out of bed, sat for 30 seconds and stood for 30 seconds, with someone there","In bed, turned over about every 2 hours, with the weak arm supported by a pillow","Took all of today's medicine on time","Measured blood pressure and wrote it down","Talked with the patient and encouraged the patient today","The caregiver rested and ate"],"ready":["Can safely help the patient get in and out of bed and the wheelchair","Can feed the patient, or feed through a feeding tube (nasogastric tube)","Know what each medicine does and when to take it","Can do the home rehabilitation exercises","Have prepared assistive devices as the therapist advised","Grab bars and non-slip mats are installed at home, and clutter is put away","Have called 1966 or asked the nurse for a referral for a long-term care assessment","Know the dates and departments of the follow-up visits","Know the warning signs of another stroke and when to call 119","Have a blood pressure monitor at home and know how to record the readings"],"quiz":[{"q":"After a stroke, once the condition is stable, starting rehabilitation early gives a better chance of recovering function.","why":"Recovery is faster in the period after the condition becomes stable. PAC arranges intensive rehabilitation during this period."},{"q":"To let the patient rest more, it is best for family members to do the dressing and feeding for the patient.","why":"Please let the patient do the things he or she can do alone. This is also part of rehabilitation. Family members only need to stay close and watch, and help when needed."},{"q":"When helping the patient get up, you must not pull the arm on the weak side.","why":"Pulling the arm on the weak side can easily injure the shoulder."},{"q":"It is fine if the patient coughs once in a while during meals. There is no need to tell the medical staff.","why":"Coughing when eating or drinking water is a warning sign of a swallowing problem. Please tell the nurse or speech therapist."},{"q":"When feeding the patient, the food should be put into the mouth from the strong side.","why":"Food put in from the strong side is easier to chew and swallow, and less food is left in the mouth."},{"q":"If the patient needs the toilet in the middle of the night, the patient can walk there slowly alone so that the family is not woken up.","why":"Someone must be with the patient when getting out of bed and going to the toilet. In the hospital, press the call bell. Do not try to do it alone."},{"q":"If blood pressure is stable and the patient feels fine, the patient can stop taking the medicine on his or her own.","why":"Blood pressure is stable because the medicine is taken on time. Whether to change the medicine is for the doctor to decide."},{"q":"If the mouth suddenly becomes crooked, one arm becomes weak or speech becomes unclear, the patient should first rest and wait half a day to see if it gets better.","why":"These are warning signs of another stroke. If any one of them happens, call 119 right away and write down the time it started."},{"q":"During PAC care, the team assesses the patient's progress every 3 weeks.","why":"The team assesses the patient at the start of the program, every 3 weeks and at the end of the program, and adjusts the rehabilitation based on the results."},{"q":"Caregivers also need rest. They can call 1966 to ask about respite care.","why":"Caregiving is long-term work. You can call the 1966 long-term care hotline to ask about resources such as respite care and home care services."}]},"id":{"code":"id","name":"Indonesia","htmlLang":"id","speech":"id-ID","locale":"id-ID","glyph":"A","rangeWord":" sampai ","say":[["119","satu satu sembilan"],["1966","satu sembilan enam enam"],["722","tujuh dua dua"]],"ui":{"brand":"Edukasi Stroke PAC","trial":"Versi uji coba","tabHome":"Beranda","tabLearn":"Materi","tabCheck":"Daftar","tabQuiz":"Kuis","homeTitle":"Masa emas rehabilitasi setelah stroke","homeIntro":"Edukasi perawatan pasca-akut untuk pasien dan keluarga. Setiap materi sekitar 3 menit. Bisa dibaca, bisa juga didengarkan.","todayTitle":"Daftar perawatan hari ini","todayDone":"Selesai {n} / {m} hal","unitsHeading":"Materi edukasi","aboutTitle":"Tentang materi edukasi ini","about":["Ini versi uji coba. Sebelum diluncurkan, isinya harus diperiksa oleh tim medis.","Isinya adalah penjelasan umum. Keadaan setiap pasien berbeda. Ikutilah petunjuk dokter penanggung jawab dan tim perawatan.","Catatan centang hanya disimpan di perangkat ini. Catatan tidak diunggah. Nama dan data rekam medis juga tidak dicatat.","Terjemahan ini masih berupa draf dan belum diperiksa oleh tenaga kesehatan penutur asli."],"sourcesLabel":"Sumber rujukan:","src1":"Program Perawatan Pasca-Akut (PAC), Badan Asuransi Kesehatan Nasional Taiwan (NHI)","src2":"Edukasi stroke, Badan Promosi Kesehatan Taiwan (HPA)","learnTitle":"Materi edukasi","learnIntro":"Ada {n} materi. Ketuk materi yang ingin Anda baca.","back":"Semua materi","unitMeta":"Materi {i} dari {n}","speak":"Bacakan materi ini","stop":"Hentikan pembacaan","rate":"Kecepatan pembacaan","rateNormal":"Normal","rateSlow":"Lambat","noSpeech":"Browser ini tidak mendukung pembacaan dengan suara. Silakan baca teksnya.","speechFail":"Perangkat ini sedang tidak bisa membacakan dengan suara. Silakan baca teksnya.","noVoice":"Perangkat ini tidak memiliki suara bahasa Indonesia. Silakan baca teksnya.","prev":"Sebelumnya","next":"Berikutnya","toQuiz":"Kerjakan kuis","checkTitle":"Daftar perawatan","listDaily":"Perawatan harian","listReady":"Persiapan pulang","progDone":"Selesai {n} / {m}","dailyHint":"{date}, dihitung ulang setiap hari","readyHint":"Centang setiap hal yang sudah siap","clearAll":"Hapus semua centang","privacy":"Catatan centang hanya disimpan di perangkat ini. Catatan tidak diunggah. Nama dan data rekam medis juga tidak dicatat.","quizTitle":"Kuis","quizIntro":"Ada {n} soal benar atau salah. Lihat seberapa banyak hal penting yang Anda ingat.","quizNo":"Soal {i} dari {n}","yes":"Benar","no":"Salah","markOk":"✓","right":"Jawaban Anda benar.","correctIs":"Jawaban yang benar adalah “{a}”.","nextQ":"Soal berikutnya","seeResult":"Lihat hasil","resultTitle":"Hasil kuis","scoreOf":"/ {n} soal dijawab benar","reviewTitle":"Materi yang bisa dibaca lagi","correctAnswer":"Jawaban yang benar: {a}.","readUnit":"Baca “{t}”","allRight":"Semua jawaban benar. Teruslah gunakan hal-hal penting ini dalam perawatan setiap hari.","retry":"Ulangi kuis","weakNote":"Warna oranye pada gambar menunjukkan sisi yang lemah.","fontAria":"Ukuran huruf","fontS":"Huruf standar","fontM":"Huruf besar","fontL":"Huruf sangat besar","langAria":"Bahasa","listAria":"Jenis daftar","navAria":"Menu utama"},"sos":{"title":"Tanda peringatan stroke berulang","items":[["Senyum","Sudut mulut miring, kedua sisi wajah tidak sama"],["Angkat kedua tangan","Kedua tangan diangkat lurus ke depan, satu tangan lemah dan turun"],["Ucapkan halo","Bicara tidak jelas atau tidak bisa bicara"]],"call":"Jika ada salah satu tanda ini, segera telepon {n} dan catat waktu mulai gejalanya."},"caps":{"journey":[["Pengobatan akut",""],["Rehab PAC",""],["Pulang ke rumah",""]],"team":[["Fisioterapi","Berjalan dan keseimbangan"],["Terapi okupasi","Kegiatan sehari-hari"],["Terapi wicara","Bicara dan menelan"]],"arm":[["Lakukan ini","Topang lengan pakai bantal"],["Jangan begini","Menarik lengan yang lemah"]],"eat":[["Lakukan ini","Duduk tegak, suapan kecil"],["Jangan begini","Makan sambil berbaring"]],"after":[["Duduk 30 menit","Jangan langsung berbaring"],["Bersihkan mulut","Setiap selesai makan"],["Periksa pipi","Ada sisa makanan?"]],"steps":[["Di tempat tidur","Duduk 30 detik"],["Di tepi tempat tidur","Duduk 30 detik"],["Berdiri mantap","30 detik, baru jalan"]],"safe":[["Pegangan","Kamar mandi, dekat kloset"],["Alas antiselip","Lantai kamar mandi"],["Lampu malam","Nyalakan satu saat malam"],["Jalur bebas barang","Rapikan barang dan kabel"]],"three":[["Obat tepat waktu",""],["Tensi setiap hari",""],["Kontrol terjadwal",""]],"bp722":[["7 hari","Ukur berturut-turut"],["2 kali","Sekali pagi, sekali malam"],["Ukur 2 kali","Setiap kali mengukur"]],"life":[["Tidak merokok",""],["Irit garam, minyak",""],["Makan banyak sayur",""],["Terus bergerak",""]],"talk":[["Berhadapan","Pelan, kalimat pendek"],["Gambar dan isyarat","Bantu sampaikan maksud"]],"rest":[["Istirahat teratur","Pendamping pun makan, tidur"],["Telepon 1966","Tanya layanan pengganti"]],"devices":[["Walker",""],["Kursi roda",""],["Tongkat kaki empat",""]],"angle":{"cap":"Saat dan setelah memberi makan lewat selang, naikkan bagian kepala tempat tidur 30–45 derajat","aria":"Saat memberi makan lewat selang, bagian kepala tempat tidur dinaikkan 30 sampai 45 derajat"},"weeks":{"cap":"Lama perawatan PAC (minggu)","legend":["Pada dasarnya 3–6 minggu","Setelah dinilai, bisa diperpanjang satu kali, paling lama 12 minggu","Dinilai setiap 3 minggu"],"aria":"Lama perawatan PAC: pada dasarnya 3 sampai 6 minggu, bisa diperpanjang satu kali sampai paling lama 12 minggu, dinilai setiap 3 minggu"}},"units":[{"title":"Mengenal PAC, perawatan pasca-akut","desc":"Apa itu PAC, siapa yang bisa ikut, berapa lama perawatannya","body":[{"t":"h","x":"Apa itu perawatan pasca-akut"},{"t":"p","x":"Setelah pengobatan akut stroke selesai dan kondisi pasien stabil, ada masa ketika fungsi tubuh pulih lebih cepat. Program Perawatan Pasca-Akut dari Asuransi Kesehatan Nasional Taiwan (NHI) disingkat PAC. Pada masa inilah tim dari berbagai profesi mengatur rehabilitasi yang intensif. Tujuannya membantu pasien kembali mampu mengurus diri sendiri sehari-hari dan pulang ke rumah dengan lancar."},{"t":"fig","id":"journey"},{"t":"h","x":"Siapa yang bisa ikut"},{"t":"p","x":"Tim medis menilai apakah pasien cocok untuk ikut. Syarat utamanya sebagai berikut:"},{"t":"ul","x":["Dalam 1 bulan setelah serangan stroke akut. Pada keadaan khusus, bisa dilonggarkan sampai dalam 40 hari.","Setelah stroke, ada gangguan fungsi tingkat sedang sampai sedang-berat.","Kondisi sudah stabil selama 72 jam atau lebih.","Punya potensi rehabilitasi: bisa bekerja sama untuk belajar, bisa duduk selama 1 jam penuh dengan ditopang, dan mau ikut rehabilitasi secara aktif."]},{"t":"h","x":"Berapa lama perawatannya"},{"t":"p","x":"Pada dasarnya 3–6 minggu. Jika setelah dinilai tim masih diperlukan, perawatan bisa diperpanjang satu kali, paling lama sampai 12 minggu. Selama itu, kemajuan pasien dinilai setiap 3 minggu."},{"t":"fig","id":"weeks"},{"t":"h","x":"Tiga model perawatan"},{"t":"modes","x":[{"dt":"Model rawat inap","dd":"Pasien tinggal di rumah sakit untuk rehabilitasi. Intensitas tinggi: terapi 3–5 kali sehari. Intensitas biasa: terapi 1–2 kali sehari."},{"dt":"Model perawatan siang hari","dd":"Pasien datang ke rumah sakit pada siang hari untuk rehabilitasi, kira-kira dari pukul 9 pagi sampai pukul 5 sore. Terapi 2–4 kali sehari. Malam hari pasien pulang ke rumah untuk beristirahat."},{"dt":"Model di rumah","dd":"Untuk pasien yang tidak bisa rawat inap, ikut perawatan siang hari, atau datang ke rawat jalan untuk rehabilitasi. Terapis datang ke rumah untuk memberikan terapi. Setiap kali 30–50 menit, 1–6 kali seminggu."}]},{"t":"p","x":"Model yang tersedia di setiap rumah sakit berbeda. Silakan pastikan kepada manajer kasus PAC."},{"t":"h","x":"Kapan perawatan berakhir"},{"t":"ul","x":["Fungsi pasien maju dengan jelas, sehingga bisa pulang dan melakukan rehabilitasi sendiri.","Tidak ada kemajuan pada 2 kali penilaian berturut-turut.","Kondisi penyakit berubah dan pasien perlu menjalani pengobatan lain lebih dahulu.","Sudah mencapai batas 12 minggu."]},{"t":"key","h":"Yang bisa dilakukan keluarga","ul":["Ikut penjelasan dan diskusi dengan tim, dan pahami tujuan rehabilitasi.","Belajar cara merawat dari terapis dan perawat.","Sejak awal, bicarakan dengan tim tentang rencana setelah pasien pulang dari rumah sakit."]}]},{"title":"Cara menjalani rehabilitasi","desc":"Anggota tim, cara keluarga membantu, kapan harus berhenti","body":[{"t":"h","x":"Apa yang dikerjakan tim rehabilitasi"},{"t":"ul","x":["Fisioterapi: latihan membalik badan, duduk, berdiri, berjalan, dan keseimbangan.","Terapi okupasi: latihan gerakan tangan, serta kegiatan sehari-hari seperti berpakaian, makan, dan ke toilet.","Terapi wicara: latihan berbicara, memahami, dan menelan."]},{"t":"fig","id":"team"},{"t":"p","x":"Dalam tim juga ada dokter, perawat, ahli gizi, apoteker, dan pekerja sosial. Jika ada pertanyaan, silakan sampaikan."},{"t":"h","x":"Setiap saat di kamar rawat adalah rehabilitasi"},{"t":"p","x":"Gerakan yang diajarkan terapis harus dipakai dalam kehidupan sehari-hari. Hal yang bisa dilakukan pasien sendiri, misalnya mencuci muka, berpakaian, dan makan, biarkan pasien melakukannya sendiri. Keluarga mengawasi di dekatnya dan membantu bila perlu. Jangan mengerjakan semuanya untuk pasien."},{"t":"h","x":"Lindungi sisi yang lemah"},{"t":"ul","x":["Saat membantu pasien bangun atau berpindah, jangan menarik lengan di sisi yang lemah, supaya bahu tidak cedera.","Saat pasien berbaring atau duduk, topang lengan yang lemah dengan bantal.","Jika pasien lama berbaring di tempat tidur, bantu membalik badannya kira-kira setiap 2 jam."]},{"t":"fig","id":"arm"},{"t":"weak"},{"t":"warn","h":"Jika ada keadaan berikut, berhenti dahulu dan beri tahu tenaga medis","ul":["Pusing, wajah pucat, keringat dingin","Dada terasa tertekan, napas sangat terengah-engah","Sakit kepala hebat yang tiba-tiba","Tangan dan kaki lebih lemah dari biasanya, atau bicara tiba-tiba menjadi tidak jelas"]},{"t":"key","h":"Kemajuan bisa cepat, bisa lambat","p":"Kecepatan pemulihan setiap orang berbeda. Tim menilai setiap 3 minggu dan menyesuaikan isi rehabilitasi menurut hasilnya. Berlatih terus-menerus lebih penting daripada berlatih banyak dalam satu kali."}]},{"title":"Menelan dan keamanan makan","desc":"Tanda peringatan tersedak, cara makan yang aman","body":[{"t":"h","x":"Mengapa menelan perlu diperhatikan"},{"t":"p","x":"Setelah stroke, kemampuan menelan sering menurun. Jika makanan atau air tersedak masuk ke saluran napas, bisa terjadi radang paru-paru (pneumonia aspirasi). Sebagian pasien tidak batuk saat tersedak, jadi keluarga perlu ikut mengamati."},{"t":"warn","h":"Tanda peringatan gangguan menelan","ul":["Batuk atau tersedak saat makan atau minum air","Setelah makan, suara menjadi basah dan terdengar berdahak","Makanan tertahan di mulut dan tidak bisa ditelan, atau keluar dari sudut mulut","Satu kali makan memakan waktu sangat lama","Demam berulang, dahak bertambah banyak"],"p":"Jika ada keadaan ini, beri tahu perawat atau terapis wicara."},{"t":"h","x":"Cara makan yang aman"},{"t":"fig","id":"eat"},{"t":"ul","x":["Pasien makan hanya saat sudah benar-benar sadar dan terjaga.","Duduk tegak dahulu, baru makan. Atur posisi sesuai cara yang diajarkan terapis wicara.","Makan dengan suapan kecil dan pelan-pelan. Pastikan makanan sudah tertelan habis sebelum suapan berikutnya.","Saat menyuapi, masukkan makanan ke mulut dari sisi yang kuat.","Saat makan, pusatkan perhatian pada makan. Jangan makan sambil berbicara.","Setelah makan, duduk paling sedikit 30 menit sebelum berbaring.","Setelah makan, bersihkan mulut. Periksa juga apakah ada sisa makanan di dalam pipi pada sisi yang lemah."]},{"t":"fig","id":"after"},{"t":"h","x":"Kelunakan dan kekentalan makanan"},{"t":"p","x":"Seberapa halus makanan harus dipotong dan apakah air perlu diberi pengental, ikutilah saran terapis wicara dan ahli gizi. Jangan mengubahnya sendiri."},{"t":"key","h":"Pasien yang memakai selang makan (selang NGT)","ul":["Sebelum memberi makan lewat selang, pastikan dahulu posisi selang dan tanda ukurannya.","Saat memberi makan lewat selang, naikkan bagian kepala tempat tidur 30–45 derajat.","Setelah memberi makan lewat selang, pertahankan posisi yang sama paling sedikit 30 menit sampai 1 jam."],"figBottom":"angle"}]},{"title":"Mencegah jatuh","desc":"Tiga langkah turun dari tempat tidur, hal penting keamanan di kamar rawat dan di rumah","body":[{"t":"h","x":"Mengapa mudah jatuh setelah stroke"},{"t":"p","x":"Tangan dan kaki di satu sisi lemah, keseimbangan menurun, pusing, dan terburu-buru ke toilet. Semua ini menambah kemungkinan jatuh. Jatuh bisa menyebabkan patah tulang atau cedera kepala, sehingga rehabilitasi terhenti."},{"t":"key","h":"Tiga langkah turun dari tempat tidur","figTop":"steps","ul":["Bangun dan duduk dahulu di atas tempat tidur selama 30 detik.","Turunkan kaki, lalu duduk lagi di tepi tempat tidur selama 30 detik.","Berdiri, lalu berdiri dengan mantap selama 30 detik. Jika tidak pusing, baru mulai berjalan."]},{"t":"h","x":"Selama dirawat di rumah sakit"},{"t":"ul","x":["Turun dari tempat tidur dan ke toilet harus selalu ditemani. Jika perlu bantuan, tekan bel panggil. Jangan memaksakan diri melakukannya sendiri.","Naikkan pagar tempat tidur, atur tinggi tempat tidur ke posisi paling rendah, dan kunci roda tempat tidur.","Letakkan barang yang sering dipakai di sisi yang kuat, di tempat yang bisa dijangkau tangan.","Pakai sepatu antiselip yang pas di kaki. Jangan pakai sandal. Celana jangan terlalu panjang.","Jika lantai basah, beri tahu petugas."]},{"t":"h","x":"Duduk di kursi roda dan berpindah"},{"t":"ul","x":["Sebelum naik ke atau turun dari kursi roda, kunci dahulu rem di kedua sisi dan lipat pijakan kaki.","Untuk cara berpindah, ikuti langkah-langkah yang diajarkan terapis."]},{"t":"h","x":"Setelah pulang ke rumah"},{"t":"ul","x":["Pasang pegangan di kamar mandi dan di samping kloset. Pasang alas antiselip di lantai.","Singkirkan barang-barang, kabel listrik, dan karpet kecil dari jalur jalan.","Nyalakan satu lampu kecil pada malam hari."]},{"t":"fig","id":"safe"},{"t":"warn","h":"Jika pasien jatuh","ul":["Jangan terburu-buru menarik pasien untuk bangun. Lihat dahulu apakah pasien sadar dan bagian mana yang sakit.","Jika sedang dirawat di rumah sakit, segera tekan bel panggil.","Jika di rumah kepala pasien terbentur, sakit sampai tidak bisa bergerak, atau kesadarannya menurun, telepon 119."]}]},{"title":"Mencegah stroke berulang","desc":"Minum obat tepat waktu, mengukur tekanan darah, mengenal tanda peringatan stroke berulang","body":[{"t":"h","x":"Orang yang pernah stroke perlu mencegah stroke terjadi lagi"},{"t":"p","x":"Orang yang pernah stroke lebih besar kemungkinannya terkena stroke lagi dibandingkan orang pada umumnya. Mengendalikan tekanan darah (tensi), gula darah, dan lemak darah dengan baik bisa menurunkan kemungkinan itu."},{"t":"fig","id":"three"},{"t":"h","x":"Minum obat tepat waktu"},{"t":"ul","x":["Obat pencegah gumpalan darah, serta obat pengendali tekanan darah, gula darah, dan lemak darah, semuanya harus diminum setiap hari sesuai petunjuk dokter.","Jangan menghentikan atau mengurangi obat sendiri karena merasa sudah jauh lebih baik.","Jika ada perdarahan yang sulit berhenti, tinja berwarna hitam, atau tinja berdarah, secepatnya beri tahu dokter."]},{"t":"key","h":"Mengukur tekanan darah “722”","figTop":"bp722","ul":["7: ukur selama 7 hari berturut-turut.","2: ukur satu kali setelah bangun pagi dan satu kali sebelum tidur malam.","2: setiap kali mengukur, ukur dua kali."],"p":"Catat angkanya dan bawa saat kontrol untuk diperlihatkan kepada dokter. Target tekanan darah mengikuti petunjuk dokter."},{"t":"h","x":"Kebiasaan hidup"},{"t":"fig","id":"life"},{"t":"ul","x":["Tidak merokok, kurangi minuman beralkohol.","Makan dengan sedikit minyak, sedikit gula, dan sedikit garam. Perbanyak sayur dan makanan berserat tinggi.","Terus bergerak aktif sesuai saran terapis.","Jika merasa detak jantung tidak teratur, berdebar-debar, atau dada terasa tertekan, beri tahu dokter.","Kontrol ke dokter sesuai jadwal."]},{"t":"sos"},{"t":"ul","x":["Jangan menyetir mobil atau mengendarai motor sendiri ke rumah sakit.","Saat menunggu ambulans, jangan beri pasien makanan, minuman, atau obat.","Jangan menunggu gejala hilang sendiri."]}]},{"title":"Emosi dan komunikasi","desc":"Perubahan emosi setelah stroke, cara berbicara dengan pasien, istirahat bagi pendamping pasien","body":[{"t":"h","x":"Perubahan emosi setelah stroke"},{"t":"p","x":"Setelah stroke, suasana hati yang murung, mudah menangis, atau mudah marah adalah hal yang sering terjadi. Hal ini berkaitan dengan cedera pada otak dan perubahan hidup yang tiba-tiba. Ini bukan karena pasien kurang tegar."},{"t":"warn","h":"Jika keadaan berikut berlangsung dua minggu atau lebih, beri tahu tim medis","ul":["Murung sepanjang hari, tidak berminat pada apa pun","Tidak mau rehabilitasi, tidak mau berbicara","Tidur tidak nyenyak atau tidak nafsu makan","Sering berkata bahwa dirinya membebani keluarga"],"p":"Masalah emosi bisa diobati. Masalah ini juga memengaruhi hasil rehabilitasi, jadi layak disampaikan dan dibicarakan."},{"t":"h","x":"Berkomunikasi dengan pasien yang sulit berbicara"},{"t":"fig","id":"talk"},{"t":"ul","x":["Berbicaralah berhadapan, lebih pelan, dengan kalimat yang lebih pendek.","Sampaikan satu hal saja setiap kali.","Lebih sering gunakan pertanyaan yang bisa dijawab “ya” atau “tidak”.","Sertai dengan isyarat tangan, gambar, atau benda nyata.","Beri pasien waktu untuk menjawab. Jangan terburu-buru menyelesaikan ucapannya.","Berbicaralah seperti kepada orang dewasa. Jangan memperlakukan pasien seperti anak kecil."]},{"t":"h","x":"Orang yang merawat pasien (pendamping) juga perlu menjaga diri sendiri"},{"t":"ul","x":["Anggota keluarga merawat secara bergantian. Jangan satu orang menanggung semuanya sendiri.","Pendamping perlu punya waktu istirahat dan waktu makan yang tetap.","Jika merasa tidak sanggup lagi, Anda bisa berbicara dengan perawat atau pekerja sosial."]},{"t":"fig","id":"rest"},{"t":"key","h":"Saluran telepon perawatan jangka panjang 1966","p":"Telepon 1966 untuk bertanya tentang sumber daya perawatan jangka panjang, seperti layanan pengganti sementara bagi pendamping (respite) dan layanan di rumah."}]},{"title":"Persiapan pulang dari rumah sakit","desc":"Hal yang harus dikuasai sebelum pulang, lingkungan rumah, sumber daya perawatan jangka panjang","body":[{"t":"h","x":"Hal yang harus dikuasai sebelum pulang"},{"t":"ul","x":["Membantu pasien membalik badan, naik-turun tempat tidur, dan naik-turun kursi roda dengan aman.","Cara menyuapi atau memberi makan lewat selang makan (selang NGT).","Kegunaan setiap obat dan waktu minumnya.","Gerakan rehabilitasi yang harus diteruskan di rumah.","Jika ada selang, misalnya selang makan (selang NGT) atau selang kencing (kateter urine), pelajari cara merawatnya."]},{"t":"p","x":"Untuk hal yang belum Anda yakini, sebelum pulang mintalah perawat atau terapis mengajarkannya sekali lagi, lalu praktikkan langsung di depan mereka."},{"t":"h","x":"Lingkungan rumah"},{"t":"ul","x":["Tinggi tempat tidur harus memudahkan naik dan turun. Sisakan ruang di samping tempat tidur agar kursi roda bisa mendekat.","Pasang pegangan di kamar mandi dan di samping kloset. Lantai harus antiselip.","Jaga jalur jalan tetap lapang. Singkirkan barang-barang dan kabel listrik."]},{"t":"fig","id":"safe"},{"t":"h","x":"Alat bantu"},{"t":"fig","id":"devices"},{"t":"p","x":"Alat bantu mana yang diperlukan, misalnya alat bantu jalan (walker), kursi roda, atau kursi toilet (commode), tanyakan dahulu kepada terapis sebelum menyiapkannya. Tentang bantuan biaya alat bantu, Anda bisa bertanya ke Pusat Manajemen Perawatan Jangka Panjang di tiap kabupaten atau kota."},{"t":"h","x":"Sumber daya perawatan jangka panjang"},{"t":"p","x":"Sejak masih dirawat di rumah sakit, Anda sudah bisa meminta perawat layanan persiapan pulang untuk membantu merujuk ke penilaian perawatan jangka panjang. Anda juga bisa menelepon 1966 sendiri. Layanannya antara lain layanan di rumah, pemulihan kemampuan di rumah, antar-jemput, dan layanan pengganti sementara bagi pendamping (respite)."},{"t":"key","h":"Setelah pulang dari rumah sakit","figTop":"three","ul":["Catat tanggal kontrol dan poli (bagian) yang dituju.","Minum obat tepat waktu dan ukur tekanan darah setiap hari.","Teruskan rehabilitasi, jangan terputus."]},{"t":"warn","h":"Jika ada keadaan berikut, segera cari pertolongan medis","ul":["Tanda peringatan stroke berulang: mulut miring, tangan dan kaki di satu sisi lemah, bicara tidak jelas. Telepon 119","Demam, batuk, dahak bertambah banyak","Kesadaran menurun, atau sulit dibangunkan","Jatuh dan cedera","Kejang"]}]}],"daily":["Hari ini ikut semua sesi rehabilitasi","Hal yang bisa dilakukan sendiri, dilakukan sendiri (mencuci muka, berpakaian, makan)","Saat makan duduk tegak, suapan kecil dan pelan-pelan; setelah makan duduk 30 menit","Setelah makan, mulut dibersihkan dan diperiksa apakah ada sisa makanan","Sebelum turun dari tempat tidur, duduk 30 detik, berdiri 30 detik, dan ada yang menemani","Saat berbaring di tempat tidur, badan dibalik kira-kira setiap 2 jam, dan lengan yang lemah ditopang bantal","Semua obat hari ini sudah diminum tepat waktu","Tekanan darah diukur dan dicatat","Hari ini sudah mengobrol dengan pasien dan menyemangatinya","Pendamping pasien sendiri sudah istirahat dan makan"],"ready":["Bisa membantu pasien naik-turun tempat tidur dan kursi roda dengan aman","Bisa menyuapi atau memberi makan lewat selang makan (selang NGT)","Tahu kegunaan setiap obat dan waktu minumnya","Bisa melakukan gerakan rehabilitasi di rumah","Alat bantu sudah disiapkan sesuai saran terapis","Di rumah sudah dipasang pegangan dan alas antiselip, dan barang-barang sudah dirapikan","Sudah menelepon 1966 atau meminta perawat merujuk ke penilaian perawatan jangka panjang","Tahu tanggal kontrol dan poli (bagian) yang dituju","Tahu tanda peringatan stroke berulang dan kapan harus menelepon 119","Di rumah ada alat pengukur tekanan darah (tensimeter), dan bisa mencatat hasilnya"],"quiz":[{"q":"Setelah kondisi stroke stabil, memulai rehabilitasi sejak dini memberi peluang lebih besar untuk memulihkan fungsi.","why":"Pada masa setelah kondisi stabil, pemulihan berlangsung lebih cepat. PAC mengatur rehabilitasi intensif pada masa ini."},{"q":"Agar pasien lebih banyak beristirahat, berpakaian dan makan sebaiknya semuanya dikerjakan oleh keluarga.","why":"Hal yang bisa dilakukan pasien sendiri, biarkan pasien melakukannya sendiri. Ini juga bagian dari rehabilitasi. Keluarga cukup mengawasi di dekatnya dan membantu bila perlu."},{"q":"Saat membantu pasien bangun, lengan di sisi yang lemah tidak boleh ditarik.","why":"Menarik lengan di sisi yang lemah mudah membuat bahu cedera."},{"q":"Jika pasien sesekali batuk saat makan, itu tidak apa-apa dan tidak perlu diberitahukan kepada tenaga medis.","why":"Batuk saat makan atau minum air adalah tanda peringatan gangguan menelan. Beri tahu perawat atau terapis wicara."},{"q":"Saat menyuapi, makanan harus dimasukkan ke mulut pasien dari sisi yang kuat.","why":"Jika dimasukkan dari sisi yang kuat, makanan lebih mudah dikunyah dan ditelan, dan lebih jarang tersisa di mulut."},{"q":"Jika ingin ke toilet tengah malam, pasien boleh berjalan pelan-pelan sendiri supaya tidak membangunkan keluarga.","why":"Turun dari tempat tidur dan ke toilet harus selalu ditemani. Selama dirawat di rumah sakit, tekan bel panggil. Jangan memaksakan diri melakukannya sendiri."},{"q":"Jika tekanan darah stabil dan tidak ada keluhan, obat boleh dihentikan sendiri.","why":"Tekanan darah stabil karena obat diminum tepat waktu. Perlu atau tidaknya obat diubah, biarkan dokter yang memutuskan."},{"q":"Jika tiba-tiba mulut miring, satu tangan lemah, atau bicara tidak jelas, sebaiknya istirahat dan amati dahulu selama setengah hari.","why":"Ini tanda peringatan stroke berulang. Jika ada salah satu tanda, segera telepon 119 dan catat waktu mulai gejalanya."},{"q":"Selama perawatan PAC, tim menilai kemajuan pasien setiap 3 minggu.","why":"Tim melakukan penilaian saat pasien masuk program, setiap 3 minggu, dan saat program selesai, lalu menyesuaikan isi rehabilitasi menurut hasilnya."},{"q":"Pendamping pasien juga perlu beristirahat dan bisa menelepon 1966 untuk bertanya tentang layanan pengganti sementara bagi pendamping (respite).","why":"Merawat adalah pekerjaan jangka panjang. Saluran telepon perawatan jangka panjang 1966 bisa dihubungi untuk bertanya tentang sumber daya seperti layanan pengganti sementara bagi pendamping (respite) dan layanan di rumah."}]},"vi":{"code":"vi","name":"Tiếng Việt","htmlLang":"vi","speech":"vi-VN","locale":"vi-VN","glyph":"A","rangeWord":" đến ","say":[["119","một một chín"],["1966","một chín sáu sáu"],["722","bảy hai hai"]],"ui":{"brand":"Hướng dẫn đột quỵ PAC","trial":"Bản dùng thử","tabHome":"Trang chủ","tabLearn":"Bài học","tabCheck":"Danh sách","tabQuiz":"Câu hỏi","homeTitle":"Giai đoạn vàng để phục hồi sau đột quỵ","homeIntro":"Hướng dẫn chăm sóc sau giai đoạn cấp dành cho người bệnh và gia đình. Mỗi bài khoảng 3 phút, có thể đọc hoặc nghe.","todayTitle":"Danh sách chăm sóc hôm nay","todayDone":"Đã xong {n} / {m} việc","unitsHeading":"Các bài học","aboutTitle":"Về tài liệu hướng dẫn này","about":["Đây là bản dùng thử. Nội dung phải được đội ngũ y tế xem xét trước khi đưa vào sử dụng.","Nội dung chỉ là hướng dẫn chung. Tình trạng của mỗi người bệnh khác nhau, xin làm theo chỉ dẫn của bác sĩ điều trị và đội ngũ chăm sóc.","Các dấu đánh chọn chỉ được lưu trên thiết bị này, không được tải lên, cũng không ghi lại họ tên hay hồ sơ bệnh án.","Bản dịch này là bản nháp, chưa được nhân viên y tế nói tiếng Việt bản ngữ xem xét."],"sourcesLabel":"Nguồn tham khảo:","src1":"Chương trình Chăm sóc Sau giai đoạn cấp (PAC) của Cơ quan Bảo hiểm Y tế Toàn dân Đài Loan (NHI)","src2":"Tài liệu hướng dẫn về đột quỵ của Cục Sức khỏe Quốc dân Đài Loan (HPA)","learnTitle":"Các bài học","learnIntro":"Có {n} bài. Muốn xem bài nào thì bấm vào bài đó.","back":"Tất cả bài học","unitMeta":"Bài {i} trong {n} bài","speak":"Nghe đọc bài này","stop":"Dừng đọc","rate":"Tốc độ đọc","rateNormal":"Bình thường","rateSlow":"Chậm","noSpeech":"Trình duyệt này không hỗ trợ đọc thành tiếng. Xin hãy tự đọc chữ.","speechFail":"Thiết bị này hiện không đọc thành tiếng được. Xin hãy tự đọc chữ.","noVoice":"Thiết bị này không có giọng đọc tiếng Việt. Xin hãy tự đọc chữ.","prev":"Bài trước","next":"Bài sau","toQuiz":"Làm câu hỏi ôn tập","checkTitle":"Danh sách chăm sóc","listDaily":"Chăm sóc hằng ngày","listReady":"Chuẩn bị xuất viện","progDone":"Đã xong {n} / {m}","dailyHint":"{date}, mỗi ngày tính lại từ đầu","readyHint":"Chuẩn bị xong việc nào thì đánh dấu việc đó","clearAll":"Bỏ chọn tất cả","privacy":"Các dấu đánh chọn chỉ được lưu trên thiết bị này, không được tải lên, cũng không ghi lại họ tên hay hồ sơ bệnh án.","quizTitle":"Câu hỏi ôn tập","quizIntro":"Có {n} câu đúng/sai. Hãy xem bạn nhớ được bao nhiêu điểm chính.","quizNo":"Câu {i} trong {n} câu","yes":"Đúng","no":"Sai","markOk":"✓","right":"Bạn trả lời đúng.","correctIs":"Đáp án đúng là “{a}”.","nextQ":"Câu tiếp theo","seeResult":"Xem kết quả","resultTitle":"Kết quả","scoreOf":"/ {n} câu trả lời đúng","reviewTitle":"Nội dung nên xem lại","correctAnswer":"Đáp án đúng: {a}.","readUnit":"Đọc bài “{t}”","allRight":"Bạn trả lời đúng tất cả. Xin tiếp tục áp dụng những điểm chính này vào việc chăm sóc hằng ngày.","retry":"Làm lại","weakNote":"Trong hình, màu cam là bên yếu.","fontAria":"Cỡ chữ","fontS":"Chữ chuẩn","fontM":"Chữ lớn","fontL":"Chữ rất lớn","langAria":"Ngôn ngữ","listAria":"Loại danh sách","navAria":"Menu chính"},"sos":{"title":"Dấu hiệu cảnh báo đột quỵ tái phát","items":[["Cười","Miệng méo, hai bên mặt không cân đối"],["Giơ hai tay","Giơ ngang hai tay, một tay yếu và rơi xuống"],["Nói xin chào","Nói không rõ, không nói ra được"]],"call":"Có bất kỳ dấu hiệu nào, hãy gọi {n} ngay và ghi lại giờ bắt đầu có triệu chứng."},"caps":{"journey":[["Điều trị cấp tính",""],["Tập phục hồi PAC",""],["Về nhà",""]],"team":[["Vật lý trị liệu","Đi lại và thăng bằng"],["Hoạt động trị liệu","Sinh hoạt hằng ngày"],["Ngôn ngữ trị liệu","Nói và nuốt"]],"arm":[["Làm như thế này","Dùng gối đỡ cánh tay"],["Đừng làm thế này","Kéo cánh tay bên yếu"]],"eat":[["Làm như thế này","Ngồi thẳng, ăn từng chút"],["Đừng làm thế này","Ăn khi đang nằm"]],"after":[["Ngồi 30 phút","Ăn xong không nằm ngay"],["Vệ sinh miệng","Sau mỗi bữa ăn"],["Kiểm tra má","Còn sót thức ăn không"]],"steps":[["Ngồi trên giường","30 giây"],["Ngồi mép giường","30 giây"],["Đứng vững","30 giây rồi mới đi"]],"safe":[["Tay vịn","Phòng tắm, cạnh bồn cầu"],["Thảm chống trượt","Sàn phòng tắm"],["Đèn ngủ nhỏ","Để một đèn ban đêm"],["Lối đi thoáng","Cất đồ đạc, dây điện"]],"three":[["Uống thuốc đúng giờ",""],["Đo huyết áp mỗi ngày",""],["Tái khám đúng hẹn",""]],"bp722":[["7 ngày","Đo liên tục"],["2 lần","Sáng một lần, tối một lần"],["2 lượt","Mỗi lần đo hai lượt"]],"life":[["Không hút thuốc",""],["Ít muối, ít dầu mỡ",""],["Ăn nhiều rau",""],["Duy trì vận động",""]],"talk":[["Mặt đối mặt","Nói chậm, câu ngắn"],["Hình ảnh, cử chỉ","Giúp diễn đạt"]],"rest":[["Giờ nghỉ cố định","Người chăm sóc cần ăn, ngủ"],["Gọi 1966","Hỏi về chăm sóc thay thế"]],"devices":[["Khung tập đi",""],["Xe lăn",""],["Gậy bốn chân",""]],"angle":{"cap":"Khi cho ăn qua ống và sau khi cho ăn, nâng đầu giường cao 30–45 độ","aria":"Khi cho ăn qua ống, nâng đầu giường cao 30 đến 45 độ"},"weeks":{"cap":"Thời gian chăm sóc PAC (tuần)","legend":["Về nguyên tắc 3–6 tuần","Sau khi đánh giá có thể kéo dài một lần, tối đa 12 tuần","Đánh giá 3 tuần một lần"],"aria":"Thời gian chăm sóc PAC: về nguyên tắc 3 đến 6 tuần, có thể kéo dài một lần, tối đa đến 12 tuần, đánh giá 3 tuần một lần"}},"units":[{"title":"Tìm hiểu về PAC, chăm sóc sau giai đoạn cấp","desc":"PAC là gì, ai được tham gia, chăm sóc trong bao lâu","body":[{"t":"h","x":"Chăm sóc sau giai đoạn cấp là gì"},{"t":"p","x":"Sau khi việc điều trị cấp tính cho đột quỵ kết thúc và bệnh đã ổn định, có một khoảng thời gian chức năng cơ thể hồi phục khá nhanh. Chương trình Chăm sóc Sau giai đoạn cấp của Bảo hiểm Y tế Toàn dân Đài Loan (NHI), gọi tắt là PAC. Trong chương trình này, một đội ngũ gồm nhiều chuyên ngành sắp xếp cho người bệnh tập phục hồi chức năng tích cực ngay trong khoảng thời gian đó, giúp người bệnh lấy lại khả năng tự lo sinh hoạt và về nhà thuận lợi."},{"t":"fig","id":"journey"},{"t":"h","x":"Ai được tham gia"},{"t":"p","x":"Người bệnh có phù hợp để tham gia hay không là do đội ngũ y tế đánh giá. Các điều kiện chính như sau:"},{"t":"ul","x":["Trong vòng 1 tháng sau khi bị đột quỵ não cấp. Trường hợp đặc biệt có thể nới rộng đến trong vòng 40 ngày.","Sau đột quỵ có suy giảm chức năng ở mức trung bình đến trung bình nặng.","Bệnh đã ổn định từ 72 giờ trở lên.","Có khả năng phục hồi: có thể phối hợp và học theo hướng dẫn, ngồi được đủ 1 giờ khi được đỡ, sẵn lòng chủ động tham gia tập phục hồi chức năng."]},{"t":"h","x":"Chăm sóc trong bao lâu"},{"t":"p","x":"Về nguyên tắc là 3–6 tuần. Sau khi đội ngũ y tế đánh giá, nếu vẫn còn cần thì có thể kéo dài một lần, tối đa đến 12 tuần. Trong thời gian này, cứ 3 tuần đánh giá mức tiến bộ một lần."},{"t":"fig","id":"weeks"},{"t":"h","x":"Ba hình thức chăm sóc"},{"t":"modes","x":[{"dt":"Hình thức nội trú","dd":"Ở lại bệnh viện để tập phục hồi chức năng. Cường độ cao: mỗi ngày trị liệu 3–5 lần. Cường độ thông thường: mỗi ngày 1–2 lần."},{"dt":"Hình thức chăm sóc ban ngày","dd":"Ban ngày đến bệnh viện tập phục hồi chức năng, thời gian khoảng từ 9 giờ sáng đến 5 giờ chiều, mỗi ngày trị liệu 2–4 lần, buổi tối về nhà nghỉ ngơi."},{"dt":"Hình thức tại nhà","dd":"Với người bệnh không thể nằm viện, không thể tham gia chăm sóc ban ngày hoặc không thể đến phòng khám ngoại trú để tập phục hồi chức năng, chuyên viên trị liệu sẽ đến nhà để trị liệu. Mỗi lần 30–50 phút, mỗi tuần 1–6 lần."}]},{"t":"p","x":"Mỗi bệnh viện cung cấp các hình thức khác nhau, xin hỏi lại người quản lý ca bệnh PAC cho chắc."},{"t":"h","x":"Khi nào kết thúc"},{"t":"ul","x":["Chức năng tiến bộ rõ rệt, có thể về nhà tự tập phục hồi chức năng.","2 lần đánh giá liên tiếp không có tiến bộ.","Bệnh thay đổi, cần điều trị khác trước.","Đã đến giới hạn tối đa 12 tuần."]},{"t":"key","h":"Những việc gia đình có thể làm","ul":["Tham gia các buổi giải thích và thảo luận của đội ngũ y tế để hiểu mục tiêu phục hồi chức năng.","Học kỹ năng chăm sóc từ chuyên viên trị liệu và điều dưỡng.","Sớm thảo luận với đội ngũ y tế về việc sắp xếp sau khi xuất viện."]}]},{"title":"Tập phục hồi chức năng như thế nào","desc":"Các thành viên trong đội ngũ, gia đình giúp như thế nào, khi nào cần dừng lại","body":[{"t":"h","x":"Đội ngũ phục hồi chức năng làm gì"},{"t":"ul","x":["Vật lý trị liệu: tập lật người, ngồi, đứng, đi lại và giữ thăng bằng.","Hoạt động trị liệu: tập các động tác của tay và các sinh hoạt hằng ngày như mặc quần áo, ăn cơm, đi vệ sinh.","Ngôn ngữ trị liệu: tập nói, tập hiểu lời nói và tập nuốt."]},{"t":"fig","id":"team"},{"t":"p","x":"Trong đội ngũ còn có bác sĩ, điều dưỡng, chuyên viên dinh dưỡng, dược sĩ và nhân viên công tác xã hội. Có thắc mắc gì đều có thể nêu ra."},{"t":"h","x":"Mỗi giây phút trong phòng bệnh đều là tập phục hồi chức năng"},{"t":"p","x":"Những động tác chuyên viên trị liệu dạy cần được dùng trong sinh hoạt hằng ngày. Những việc người bệnh tự làm được, ví dụ rửa mặt, mặc quần áo, ăn cơm, xin hãy để người bệnh tự làm. Người nhà ở bên cạnh trông chừng, giúp khi cần thiết, đừng làm thay tất cả."},{"t":"h","x":"Bảo vệ bên yếu"},{"t":"ul","x":["Khi đỡ người bệnh ngồi dậy hoặc di chuyển, không kéo cánh tay bên yếu, để tránh làm tổn thương vai.","Khi nằm hoặc ngồi, dùng gối đỡ chắc cánh tay bên yếu.","Khi nằm trên giường lâu, cứ khoảng 2 giờ giúp người bệnh lật người một lần."]},{"t":"fig","id":"arm"},{"t":"weak"},{"t":"warn","h":"Nếu có những biểu hiện sau, xin dừng lại trước và báo cho nhân viên y tế","ul":["Chóng mặt, mặt tái nhợt, vã mồ hôi lạnh","Tức ngực, thở rất gấp","Đột ngột đau đầu dữ dội","Tay chân yếu hơn bình thường, hoặc đột nhiên nói không rõ"]},{"t":"key","h":"Tiến bộ có nhanh có chậm","p":"Tốc độ hồi phục của mỗi người khác nhau. Đội ngũ y tế đánh giá 3 tuần một lần và điều chỉnh nội dung tập phục hồi chức năng theo kết quả. Tập đều đặn liên tục quan trọng hơn là tập thật nhiều trong một lần."}]},{"title":"Nuốt và ăn uống an toàn","desc":"Dấu hiệu cảnh báo bị sặc, cách ăn an toàn","body":[{"t":"h","x":"Vì sao cần chú ý việc nuốt"},{"t":"p","x":"Sau đột quỵ, khả năng nuốt thường kém đi. Nếu thức ăn hoặc nước bị sặc vào khí quản, có thể gây viêm phổi do hít sặc. Có người bệnh bị sặc mà không ho, vì vậy cần người nhà cùng quan sát."},{"t":"warn","h":"Dấu hiệu cảnh báo có vấn đề về nuốt","ul":["Ho, sặc khi ăn hoặc uống nước","Sau khi ăn, giọng nói nghe ướt, có tiếng đờm","Ngậm thức ăn trong miệng không nuốt xuống được, hoặc thức ăn chảy ra ở khóe miệng","Ăn một bữa mất rất nhiều thời gian","Sốt nhiều lần, đờm nhiều hơn"],"p":"Nếu có những biểu hiện này, xin báo cho điều dưỡng hoặc chuyên viên ngôn ngữ trị liệu."},{"t":"h","x":"Cách ăn an toàn"},{"t":"fig","id":"eat"},{"t":"ul","x":["Chỉ ăn khi người bệnh hoàn toàn tỉnh táo.","Ngồi thẳng rồi mới ăn, điều chỉnh tư thế theo cách chuyên viên ngôn ngữ trị liệu đã dạy.","Ăn từng miếng nhỏ, chậm rãi, chắc chắn đã nuốt hết rồi mới ăn miếng tiếp theo.","Khi đút ăn, đưa thức ăn vào miệng từ bên khỏe.","Tập trung khi ăn, không vừa ăn vừa nói chuyện.","Ăn xong ngồi ít nhất 30 phút rồi mới nằm xuống.","Sau bữa ăn, vệ sinh miệng và kiểm tra xem bên trong má bên yếu có còn sót thức ăn không."]},{"t":"fig","id":"after"},{"t":"h","x":"Độ mềm cứng và độ đặc của thức ăn"},{"t":"p","x":"Thức ăn cần cắt nhỏ đến mức nào, nước có cần thêm chất làm đặc hay không, xin làm theo lời khuyên của chuyên viên ngôn ngữ trị liệu và chuyên viên dinh dưỡng, đừng tự ý thay đổi."},{"t":"key","h":"Người bệnh dùng ống thông mũi dạ dày (ống cho ăn)","ul":["Trước khi cho ăn qua ống, kiểm tra vị trí và vạch đánh dấu của ống.","Khi cho ăn qua ống, nâng đầu giường cao 30–45 độ.","Sau khi cho ăn qua ống, giữ nguyên tư thế đó ít nhất 30 phút đến 1 giờ."],"figBottom":"angle"}]},{"title":"Phòng ngừa té ngã","desc":"Ba bước xuống giường, các điểm an toàn chính ở phòng bệnh và ở nhà","body":[{"t":"h","x":"Vì sao sau đột quỵ dễ té ngã"},{"t":"p","x":"Tay chân một bên yếu, thăng bằng kém đi, chóng mặt, vội đi vệ sinh đều làm tăng khả năng té ngã. Té ngã có thể gây gãy xương hoặc chấn thương đầu, làm việc tập phục hồi chức năng bị gián đoạn."},{"t":"key","h":"Ba bước xuống giường","figTop":"steps","ul":["Trước tiên ngồi dậy trên giường, ngồi 30 giây.","Thả chân xuống, ngồi ở mép giường thêm 30 giây.","Đứng dậy, đứng vững 30 giây, không chóng mặt rồi mới bắt đầu đi."]},{"t":"h","x":"Trong thời gian nằm viện"},{"t":"ul","x":["Xuống giường và đi vệ sinh đều phải có người đi cùng. Cần giúp thì xin bấm chuông gọi, đừng cố tự làm.","Kéo thanh chắn giường lên, hạ giường xuống mức thấp nhất, khóa bánh xe giường.","Đồ thường dùng để ở bên khỏe, nơi với tay lấy được.","Mang giày chống trượt vừa chân, không mang dép lê. Quần không nên quá dài.","Sàn nhà bị ướt thì xin báo cho nhân viên."]},{"t":"h","x":"Ngồi xe lăn và chuyển chỗ"},{"t":"ul","x":["Trước khi lên xuống xe lăn, khóa phanh hai bên trước và gập chỗ để chân lên.","Cách chuyển chỗ xin làm theo các bước chuyên viên trị liệu đã dạy."]},{"t":"h","x":"Sau khi về nhà"},{"t":"ul","x":["Lắp thêm tay vịn trong phòng tắm và bên cạnh bồn cầu, trải thảm chống trượt trên sàn.","Cất đồ đạc lặt vặt, dây điện, thảm nhỏ trên lối đi.","Buổi tối để một ngọn đèn nhỏ."]},{"t":"fig","id":"safe"},{"t":"warn","h":"Nếu lỡ bị té ngã","ul":["Đừng vội kéo người bệnh dậy, trước tiên xem người bệnh có tỉnh táo không, đau ở đâu.","Nếu đang nằm viện, xin bấm chuông gọi ngay.","Ở nhà, nếu bị đập đầu, đau đến mức không cử động được, hoặc không tỉnh táo, xin gọi 119."]}]},{"title":"Phòng ngừa đột quỵ tái phát","desc":"Uống thuốc đúng giờ, đo huyết áp, nhận biết dấu hiệu cảnh báo đột quỵ tái phát","body":[{"t":"h","x":"Người đã từng đột quỵ cần phòng ngừa bị lại"},{"t":"p","x":"Người đã từng đột quỵ có khả năng bị đột quỵ lần nữa cao hơn người bình thường. Kiểm soát tốt huyết áp, đường huyết và mỡ máu có thể làm giảm khả năng này."},{"t":"fig","id":"three"},{"t":"h","x":"Uống thuốc đúng giờ"},{"t":"ul","x":["Thuốc phòng cục máu đông và các thuốc kiểm soát huyết áp, đường huyết, mỡ máu đều phải uống mỗi ngày theo chỉ dẫn của bác sĩ.","Đừng vì thấy khỏe hơn nhiều mà tự ý ngừng thuốc hoặc giảm thuốc.","Nếu bị chảy máu khó cầm, đi ngoài phân đen hoặc phân có máu, xin báo cho bác sĩ càng sớm càng tốt."]},{"t":"key","h":"Đo huyết áp “722”","figTop":"bp722","ul":["7: đo liên tục 7 ngày.","2: buổi sáng sau khi thức dậy và buổi tối trước khi đi ngủ, mỗi buổi đo một lần.","2: mỗi lần đo hai lượt."],"p":"Ghi lại các con số, khi tái khám mang cho bác sĩ xem. Mức huyết áp cần đạt theo chỉ dẫn của bác sĩ."},{"t":"h","x":"Thói quen sinh hoạt"},{"t":"fig","id":"life"},{"t":"ul","x":["Không hút thuốc, hạn chế uống rượu bia.","Ăn ít dầu mỡ, ít đường, ít muối, ăn nhiều rau và thực phẩm giàu chất xơ.","Duy trì vận động theo lời khuyên của chuyên viên trị liệu.","Nếu thấy tim đập không đều, hồi hộp đánh trống ngực hoặc tức ngực, xin báo cho bác sĩ.","Tái khám đúng hẹn."]},{"t":"sos"},{"t":"ul","x":["Đừng tự lái ô tô hoặc đi xe máy đến bệnh viện.","Trong lúc chờ xe cấp cứu, đừng cho người bệnh ăn, uống nước hay uống thuốc.","Đừng chờ triệu chứng tự hết."]}]},{"title":"Cảm xúc và giao tiếp","desc":"Thay đổi cảm xúc sau đột quỵ, cách nói chuyện với người bệnh, việc nghỉ ngơi của người chăm sóc","body":[{"t":"h","x":"Thay đổi cảm xúc sau đột quỵ"},{"t":"p","x":"Sau đột quỵ, tâm trạng buồn chán, dễ khóc hoặc dễ nổi nóng là điều thường gặp. Điều này liên quan đến tổn thương não và cả việc cuộc sống thay đổi đột ngột, không phải do người bệnh không đủ mạnh mẽ."},{"t":"warn","h":"Nếu những biểu hiện sau kéo dài từ hai tuần trở lên, xin báo cho đội ngũ y tế","ul":["Buồn rầu cả ngày, không còn hứng thú với việc gì","Không muốn tập phục hồi chức năng, không muốn nói chuyện","Ngủ không ngon hoặc không ăn nổi","Thường nói mình là gánh nặng cho gia đình"],"p":"Vấn đề cảm xúc có thể điều trị được, và cũng ảnh hưởng đến kết quả phục hồi chức năng, nên rất đáng được nêu ra để thảo luận."},{"t":"h","x":"Giao tiếp với người bệnh gặp khó khăn khi nói"},{"t":"fig","id":"talk"},{"t":"ul","x":["Nói chuyện mặt đối mặt, nói chậm lại, câu ngắn hơn.","Mỗi lần chỉ nói một việc.","Dùng nhiều câu hỏi có thể trả lời “có” hoặc “không”.","Kết hợp cử chỉ, hình ảnh hoặc đồ vật thật.","Cho người bệnh thời gian trả lời, đừng vội nói thay cho hết câu.","Nói chuyện theo cách nói với người lớn, đừng coi người bệnh như trẻ con."]},{"t":"h","x":"Người chăm sóc cũng cần chăm sóc bản thân"},{"t":"ul","x":["Người nhà thay phiên nhau chăm sóc, đừng để một người gánh hết.","Người chăm sóc cần có giờ nghỉ và giờ ăn cố định.","Khi cảm thấy không chịu nổi nữa, có thể tìm điều dưỡng hoặc nhân viên công tác xã hội để nói chuyện."]},{"t":"fig","id":"rest"},{"t":"key","h":"Đường dây chăm sóc dài hạn 1966","p":"Gọi 1966 để hỏi về các nguồn hỗ trợ chăm sóc dài hạn như dịch vụ chăm sóc thay thế tạm thời, dịch vụ chăm sóc tại nhà."}]},{"title":"Chuẩn bị xuất viện về nhà","desc":"Những việc cần học trước khi xuất viện, môi trường trong nhà, nguồn hỗ trợ chăm sóc dài hạn","body":[{"t":"h","x":"Những việc cần học được trước khi xuất viện"},{"t":"ul","x":["Giúp người bệnh lật người, lên xuống giường và lên xuống xe lăn một cách an toàn.","Cách đút ăn hoặc cho ăn qua ống thông mũi dạ dày.","Tác dụng và giờ uống của từng loại thuốc.","Các động tác phục hồi chức năng cần tiếp tục tập ở nhà.","Nếu có ống thông, ví dụ ống thông mũi dạ dày hoặc ống thông tiểu, cần học cách chăm sóc."]},{"t":"p","x":"Những chỗ chưa chắc chắn, trước khi xuất viện xin nhờ điều dưỡng hoặc chuyên viên trị liệu dạy lại một lần nữa, và tự tay làm cho họ xem."},{"t":"h","x":"Môi trường trong nhà"},{"t":"ul","x":["Chiều cao của giường phải thuận tiện cho việc lên xuống, bên cạnh giường chừa chỗ để xe lăn có thể vào sát.","Lắp thêm tay vịn trong phòng tắm và bên cạnh bồn cầu, sàn chống trượt.","Giữ lối đi rộng rãi, cất đồ đạc lặt vặt và dây điện."]},{"t":"fig","id":"safe"},{"t":"h","x":"Dụng cụ hỗ trợ"},{"t":"fig","id":"devices"},{"t":"p","x":"Cần loại dụng cụ hỗ trợ nào, ví dụ khung tập đi, xe lăn hoặc ghế bô, xin hỏi chuyên viên trị liệu trước rồi mới chuẩn bị. Về trợ cấp dụng cụ hỗ trợ, có thể hỏi Trung tâm Quản lý Chăm sóc Dài hạn của các huyện, thành phố."},{"t":"h","x":"Nguồn hỗ trợ chăm sóc dài hạn"},{"t":"p","x":"Ngay trong thời gian nằm viện đã có thể nhờ điều dưỡng của dịch vụ chuẩn bị xuất viện giúp giới thiệu để được đánh giá chăm sóc dài hạn, cũng có thể tự gọi 1966. Các dịch vụ gồm có dịch vụ chăm sóc tại nhà, phục hồi khả năng sinh hoạt tại nhà, đưa đón đi lại và dịch vụ chăm sóc thay thế tạm thời, v.v."},{"t":"key","h":"Sau khi xuất viện","figTop":"three","ul":["Ghi lại ngày tái khám và chuyên khoa.","Uống thuốc đúng giờ, đo huyết áp mỗi ngày.","Tiếp tục tập phục hồi chức năng, không gián đoạn."]},{"t":"warn","h":"Nếu có những biểu hiện sau, xin đi khám ngay","ul":["Dấu hiệu cảnh báo đột quỵ tái phát: méo miệng, yếu tay chân một bên, nói không rõ, xin gọi 119","Sốt, ho, đờm nhiều hơn","Không tỉnh táo, hoặc gọi khó tỉnh","Té ngã bị thương","Co giật"]}]}],"daily":["Hôm nay đã tham gia đủ các buổi tập phục hồi chức năng","Việc tự làm được thì tự làm (rửa mặt, mặc quần áo, ăn cơm)","Khi ăn ngồi thẳng, ăn miếng nhỏ, chậm rãi, ăn xong ngồi 30 phút","Sau bữa ăn vệ sinh miệng, kiểm tra xem còn sót thức ăn không","Khi xuống giường: ngồi 30 giây, đứng 30 giây rồi mới đi, và có người đi cùng","Khi nằm trên giường, cứ khoảng 2 giờ lật người một lần, cánh tay bên yếu có gối đỡ","Hôm nay đã uống đủ thuốc đúng giờ","Đo huyết áp và ghi lại","Hôm nay đã trò chuyện và động viên người bệnh","Bản thân người chăm sóc đã nghỉ ngơi và ăn cơm"],"ready":["Biết cách giúp lên xuống giường, lên xuống xe lăn an toàn","Biết đút ăn hoặc cho ăn qua ống thông mũi dạ dày","Biết tác dụng và giờ uống của từng loại thuốc","Biết làm các động tác phục hồi chức năng tại nhà","Đã chuẩn bị dụng cụ hỗ trợ theo lời khuyên của chuyên viên trị liệu","Ở nhà đã lắp tay vịn, trải thảm chống trượt, cất gọn đồ đạc lặt vặt","Đã gọi 1966 hoặc nhờ điều dưỡng giới thiệu để được đánh giá chăm sóc dài hạn","Biết ngày tái khám và chuyên khoa","Biết dấu hiệu cảnh báo đột quỵ tái phát và khi nào cần gọi 119","Ở nhà có máy đo huyết áp và biết cách ghi lại"],"quiz":[{"q":"Sau khi bệnh đột quỵ ổn định, bắt đầu tập phục hồi chức năng sớm thì có nhiều cơ hội hồi phục chức năng hơn.","why":"Khoảng thời gian sau khi bệnh ổn định là lúc hồi phục khá nhanh. PAC sắp xếp tập phục hồi chức năng tích cực chính trong khoảng thời gian này."},{"q":"Để người bệnh được nghỉ ngơi nhiều hơn, tốt nhất người nhà nên làm thay hết việc mặc quần áo và ăn cơm.","why":"Những việc người bệnh tự làm được, xin hãy để người bệnh tự làm, đây cũng là một phần của phục hồi chức năng. Người nhà chỉ cần ở bên cạnh trông chừng và giúp khi cần thiết."},{"q":"Khi đỡ người bệnh ngồi dậy, không được kéo cánh tay bên yếu của người bệnh.","why":"Kéo cánh tay bên yếu dễ làm vai bị tổn thương."},{"q":"Khi ăn, người bệnh thỉnh thoảng ho một chút thì không sao, không cần báo cho nhân viên y tế.","why":"Ho khi ăn hoặc uống nước là dấu hiệu cảnh báo có vấn đề về nuốt, xin báo cho điều dưỡng hoặc chuyên viên ngôn ngữ trị liệu."},{"q":"Khi đút ăn, phải đưa thức ăn vào miệng từ bên khỏe của người bệnh.","why":"Đưa vào từ bên khỏe thì dễ nhai và nuốt hơn, cũng ít bị sót thức ăn hơn."},{"q":"Nửa đêm muốn đi vệ sinh, để không đánh thức người nhà, người bệnh có thể tự đi chậm chậm một mình.","why":"Xuống giường và đi vệ sinh đều phải có người đi cùng. Nếu đang nằm viện, xin bấm chuông gọi, đừng cố tự làm."},{"q":"Huyết áp ổn định, không thấy khó chịu thì có thể tự ngừng thuốc.","why":"Huyết áp ổn định là nhờ uống thuốc đúng giờ. Có điều chỉnh thuốc hay không, xin để bác sĩ quyết định."},{"q":"Đột nhiên méo miệng, một tay yếu hoặc nói không rõ thì trước tiên cứ nghỉ ngơi, theo dõi nửa ngày rồi tính sau.","why":"Đây là dấu hiệu cảnh báo đột quỵ tái phát. Có bất kỳ dấu hiệu nào, xin gọi 119 ngay và ghi lại giờ bắt đầu có triệu chứng."},{"q":"Trong thời gian chăm sóc PAC, đội ngũ y tế đánh giá mức tiến bộ 3 tuần một lần.","why":"Đội ngũ y tế đánh giá khi nhận vào chương trình, 3 tuần một lần và khi kết thúc chương trình, rồi điều chỉnh nội dung tập phục hồi chức năng theo kết quả."},{"q":"Người chăm sóc cũng cần nghỉ ngơi, có thể gọi 1966 để hỏi về dịch vụ chăm sóc thay thế tạm thời.","why":"Chăm sóc là việc lâu dài. Có thể gọi đường dây chăm sóc dài hạn 1966 để hỏi về các nguồn hỗ trợ như dịch vụ chăm sóc thay thế tạm thời và dịch vụ chăm sóc tại nhà."}]},"th":{"code":"th","name":"ไทย","htmlLang":"th","speech":"th-TH","locale":"th-TH","glyph":"A","rangeWord":" ถึง ","say":[["119","หนึ่ง หนึ่ง เก้า"],["1966","หนึ่ง เก้า หก หก"],["722","เจ็ด สอง สอง"]],"ui":{"brand":"ความรู้โรคหลอดเลือดสมอง PAC","trial":"รุ่นทดลอง","tabHome":"หน้าแรก","tabLearn":"ความรู้","tabCheck":"รายการ","tabQuiz":"แบบทดสอบ","homeTitle":"ช่วงเวลาทองของการฟื้นฟูหลังเป็นโรคหลอดเลือดสมอง","homeIntro":"ความรู้เรื่องการดูแลหลังระยะเฉียบพลัน สำหรับผู้ป่วยและญาติ แต่ละเรื่องใช้เวลาประมาณ 3 function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmt(s,o){return String(s).replace(/\{([a-z]+)\}/g,function(m,k){return o[k]!==undefined?o[k]:m;});}
function T(k,o){return esc(o?fmt(L.ui[k],o):L.ui[k]);}
function load(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function pad(n){return n<10?"0"+n:""+n;}

  try{return new Intl.DateTimeFormat(L.locale,{dateStyle:"full"}).format(now);}catch(e){return ISO;}
}
function detectLang(){
  var saved=load("pac.lang",null);
  if(saved&&PACKS[saved])return saved;
  var list=[];
  try{list=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||""]);}catch(e){}
  for(var i=0;i<list.length;i++){
    var p=String(list[i]).toLowerCase().slice(0,2);
    if(p==="in")p="id";
    if(PACKS[p])return p;
  }
  return "zh";
}

/* ---------- 語音朗讀 ---------- */
var synth=("speechSynthesis" in window)?window.speechSynthesis:null;
if(synth){try{synth.getVoices();}catch(e){}}
var sp={on:false,q:[],i:-1,run:0,err:""};
function findVoice(){
  try{
    var v=synth.getVoices()||[];
    if(!v.length)return {none:false,voice:null};
    var want=L.speech.toLowerCase(),pre=want.slice(0,2),exact=null,loose=null;
    for(var k=0;k<v.length;k++){
      var lg=String(v[k].lang||"").toLowerCase().replace("_","-");
      if(lg===want&&!exact)exact=v[k];
      if(lg.indexOf(pre)===0&&!loose)loose=v[k];
    }
    return {none:!(exact||loose),voice:exact||loose};
  }catch(e){return {none:false,voice:null};}
}
function speakText(el){
  var t=el.textContent.replace(/(\d)\s*[–\-]\s*(\d)/g,"$1"+L.rangeWord+"$2");
  (L.say||[]).forEach(function(p){t=t.split(p[0]).join(p[1]);});
  return t;
}
function clearMark(){var m=view.querySelectorAll(".speaking");for(var k=0;k<m.length;k++)m[k].classList.remove("speaking");}
function stopSpeak(){sp.run++;sp.on=false;if(synth){try{synth.cancel();}catch(e){}}clearMark();paintSpeak();}
function nextSpeak(){
  clearMark();sp.i++;
  if(!sp.on||sp.i>=sp.q.length){stopSpeak();return;}
  var el=sp.q[sp.i],run=sp.run;
  el.classList.add("speaking");
  try{el.scrollIntoView({block:"center",behavior:"smooth"});}catch(e){}
  var u=new SpeechSynthesisUtterance(speakText(el));
  u.lang=L.speech;u.rate=parseFloat(S.rate)||1;
  if(sp.voice)u.voice=sp.voice;
  u.onend=function(){if(run===sp.run)nextSpeak();};
  u.onerror=function(ev){
    if(run!==sp.run)return;
    if(ev&&(ev.error==="interrupted"||ev.error==="canceled"))return;
    sp.err=L.ui.speechFail;stopSpeak();
  };
  synth.speak(u);
}
function startSpeak(){
  if(!synth)return;
  stopSpeak();sp.err="";
  var fv=findVoice();
  if(fv.none){sp.err=L.ui.noVoice;paintSpeak();return;}
  sp.voice=fv.voice;
  var all=view.querySelectorAll(".art-h h1,.article h2,.article h3,.article p,.article li,.article dt,.article dd");
  sp.q=[];
  for(var k=0;k<all.length;k++){if(!all[k].closest(".nospeak"))sp.q.push(all[k]);}
  sp.on=true;sp.i=-1;sp.run++;paintSpeak();nextSpeak();
}
function paintSpeak(){
  var b=document.getElementById("speak-btn"),n=document.getElementById("speak-note");
  if(!b)return;
  b.innerHTML=sp.on?ic("stop")+T("stop"):ic("play")+T("speak");
  b.setAttribute("aria-pressed",String(sp.on));
  if(n){n.textContent=sp.err;n.hidden=!sp.err;}
}
