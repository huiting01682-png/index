ัง"},{"t":"key","h":"อย่าฝึกแค่เดิน","ul":["ถ้าไม่ฝึกมือ ถึงจะเดินได้มั่นคง มือก็ยากที่จะกลับมาทำท่าเล็กๆ ได้ ต้องฝึกมือทุกวันด้วย","ขั้นแรก คลาย: ค่อยๆ ยืดเหยียด ให้กล้ามเนื้อที่ตึงมากคลายลง","ขั้นต่อไป ขยับ: ขยับไหล่ ข้อศอก ข้อมือ และนิ้วมือให้ครบทุกส่วน","ขั้นต่อไป ออกแรง: ฝึกยกมือเอง และฝึกกำมือหยิบจับ","อย่าดัดมือแรงๆ เวลาพักให้วางมือบนหมอนให้มั่นคง ให้นิ้วมือกางออกตามธรรมชาติ อย่าปล่อยให้มือห้อยลงหรืองอกำอยู่ตลอด","มือแต่ละคนฟื้นตัวไม่เท่ากัน นักบำบัดจะสอนวิธีใช้มืออีกข้างหรืออุปกรณ์ช่วยทำกิจวัตรประจำวันด้วย ต้องฝึกทั้ง 2 แบบ"]},{"t":"unitlink","x":"ดูหัวข้อ “การจัดท่าและการพลิกตัว”","unit":"u11"},{"t":"h","x":"ฝึกมือด้วยไม้และแท่งเสียบ"},{"t":"fig","id":"stickex"},{"t":"ul","x":["จับไม้ 2 มือ: นั่งให้มั่นคง ใช้ 2 มือจับไม้ไว้ ค่อยๆ ยื่นไปข้างหน้า แล้วค่อยๆ ดึงกลับ หรือค่อยๆ เลื่อนไปซ้ายขวาก็ได้ ที่บ้านใช้ไม้คลึงแป้งหรือผ้าขนหนูม้วนแทนได้","มือข้างที่อ่อนแรงก็ต้องออกแรงด้วย อย่าให้มือข้างที่มีแรงพาไปอย่างเดียว ถ้ามือข้างที่อ่อนแรงจับไม้ไม่อยู่ ให้คนในครอบครัวช่วยประคอง","อย่าดึงแขนข้างที่อ่อนแรง ถ้าไหล่ไม่มีแรง ปวดไหล่ หรือไหล่มีรอยบุ๋ม อย่าเพิ่งยกมือสูงเกินระดับไหล่ ยกได้สูงแค่ไหนให้ถามนักบำบัดก่อน","แท่งเสียบ: เริ่มจากแท่งไม้อันใหญ่ก่อน จะทำได้ง่ายกว่า ตามองที่รู ค่อยๆ เลื่อนมือเข้าไปใกล้ ให้ข้อมือนิ่งแล้วจึงเสียบลงไป ที่บ้านฝึกใส่หลอดดูดอันใหญ่ลงในแก้วได้","จำนวนครั้ง เริ่มจากชุดละ 8 ถึง 12 ครั้ง วันละ 2 ชุด เมื่อทำได้มั่นคงแล้ว ค่อยๆ เพิ่มตามที่นักบำบัดแนะนำ ทำเท่าที่ไหว"]},{"t":"warn","h":"ข้อควรระวังเวลาฝึกมือ","ul":["ปวดไหล่ มือชา เวียนหัว แน่นหน้าอก หรือหอบมาก: หยุดทันที","ถ้ามือตึงมาก หรือมีภาวะกล้ามเกร็งชัดเจน ให้พักก่อน อย่าฝืนฝึก","อย่าดัดนิ้วมือและข้อมือแรงๆ และอย่ากลั้นหายใจเบ่งแรง","นั่งให้มั่นคงตลอดเวลา และต้องมีคนอยู่ดูข้างๆ"]},{"t":"h","x":"ปลายเท้าตกลง (เท้าตก)"},{"t":"fig","id":"footdrop"},{"t":"ul","x":["สาเหตุ: กล้ามเนื้อที่ใช้กระดกหลังเท้าขึ้นไม่มีแรง และกล้ามเนื้อน่องด้านหลังมักตึงเกินไป","ถ้าปลายเท้าชี้ลงนานๆ เอ็นด้านหลังส้นเท้าจะค่อยๆ หดสั้นลง ข้อเท้าจะตึง ต่อไปจะแก้ได้ยากขึ้น","เวลาเดิน ปลายเท้ามักลากพื้น ทำให้สะดุดล้มง่าย"]},{"t":"key","h":"ป้องกันอย่างไร","ul":["เวลานอน อย่าให้ผ้าห่มกดทับปลายเท้า จัดท่าตามวิธีที่นักบำบัดสอน","ขยับข้อเท้าทุกวัน กระดกหลังเท้าขึ้น ถ้าทำเองไม่ได้ ให้คนในครอบครัวประคองส้นเท้าแล้วค่อยๆ ช่วยทำ ถ้ารู้สึกตึงให้หยุดค้างไว้ อย่ากดแรง ถ้าข้อเท้าแข็งมากหรือสั่นกระตุกไม่หยุด ให้ถามนักบำบัดก่อน","ถ้าน่องบวมขึ้นมาทันที ปวด แดง หรือจับแล้วอุ่นๆ ร้อนๆ: อย่าทำท่านี้ และให้บอกแพทย์หรือพยาบาล","ใส่อุปกรณ์พยุงข้อเท้า และรองเท้าหุ้มเท้าที่กันลื่น ตามที่นักบำบัดแนะนำ ถอดอุปกรณ์แล้วให้ดูผิวหนัง ถ้าแดงนานไม่หาย ให้บอกนักบำบัด"]},{"t":"unitlink","x":"ดูหัวข้อ “การใช้อุปกรณ์ช่วย”","unit":"u9"}]}],"daily":["วันนี้เข้าร่วมการฝึกฟื้นฟูครบทุกครั้ง","สิ่งที่ทำเองได้ ก็ทำเอง (ล้างหน้า แต่งตัว กินข้าว)","เวลากิน นั่งตัวตรง กินคำเล็กๆ ช้าๆ กินเสร็จนั่งต่อ 30 นาที","หลังอาหาร ทำความสะอาดช่องปาก และตรวจดูว่ามีเศษอาหารค้างหรือไม่","ก่อนลงจากเตียง นั่ง 30 วินาที ยืน 30 วินาทีก่อน และมีคนอยู่ด้วย","ตอนนอนบนเตียง พลิกตัวประมาณทุก 2 ชั่วโมง และมีหมอนรองแขนข้างที่อ่อนแรง","วันนี้กินยาครบและตรงเวลา","วัดความดันและจดบันทึก","วันนี้ได้พูดคุยกับผู้ป่วยและให้กำลังใจ","ผู้ดูแลเองได้พักและได้กินข้าว","วันนี้ออกกำลังกายที่บ้านตามวิธีที่นักบำบัดสอนแล้ว","วันนี้ได้ใช้ของในบ้านฝึกขยับมือแล้ว","หลังพลิกตัว ได้ตรวจผิวหนังตรงที่กระดูกยื่น เช่น ก้น ส้นเท้า","วันนี้ดื่มน้ำทีละน้อยแต่บ่อยๆ (ผู้ที่แพทย์จำกัดปริมาณน้ำ ให้ทำตามที่แพทย์สั่ง)","เวลานอนหรือนั่งนาน ได้ขยับข้อเท้าแล้ว","วันนี้ระหว่างฝึกได้พักเป็นช่วงๆ ไม่ได้ฝึกจนเหนื่อยเกินไป","วันนี้นอกจากฝึกเดินแล้ว ได้ฝึกมือด้วย"],"ready":["ช่วยผู้ป่วยขึ้นลงเตียงและขึ้นลงรถเข็นนั่งได้อย่างปลอดภัย","ป้อนอาหาร หรือให้อาหารทางสายที่ใส่ทางจมูกเป็น","รู้ว่ายาแต่ละชนิดใช้ทำอะไร และกินเวลาไหน","ทำท่าฟื้นฟูที่บ้านเป็น","เตรียมอุปกรณ์ช่วยตามคำแนะนำของนักบำบัดแล้ว","ที่บ้านติดราวจับ ปูแผ่นกันลื่น และเก็บของเกะกะแล้ว","โทร 1966 แล้ว หรือขอให้พยาบาลส่งต่อเพื่อประเมินการดูแลระยะยาวแล้ว","รู้วันนัดตรวจและแผนก","รู้สัญญาณเตือนโรคหลอดเลือดสมองซ้ำ และรู้ว่าเมื่อไรต้องโทร 119","ที่บ้านมีเครื่องวัดความดัน และจดบันทึกเป็น","รู้ว่าต้องถือไม้เท้าข้างไหน และรู้วิธีขึ้นลงบันได","ที่บ้านเตรียมกระดิ่งเล็กไว้เรียกคนแล้ว และแปะเทปสีที่ธรณีประตูแล้ว","จัดท่าได้ถูกต้อง และช่วยพลิกตัวได้","รู้สัญญาณเตือนลิ่มเลือดที่ขา และรู้ว่ามาตรวจตามนัดต้องนำบันทึกความดัน บันทึกน้ำตาล และซองยามาด้วย","รู้ระดับกำลังกล้ามเนื้อและการทรงตัวของผู้ป่วยในตอนนี้ และปริมาณการฝึกที่นักบำบัดแนะนำ"],"quiz":[{"q":"เมื่ออาการของโรคหลอดเลือดสมองคงที่แล้ว การเริ่มฟื้นฟูแต่เนิ่นๆ ทำให้มีโอกาสฟื้นความสามารถได้มากกว่า","why":"ช่วงเวลาหลังอาการคงที่เป็นช่วงที่ฟื้นตัวได้เร็วกว่า PAC คือการจัดการฟื้นฟูอย่างเข้มข้นในช่วงเวลานี้"},{"q":"เพื่อให้ผู้ป่วยได้พักมากขึ้น การแต่งตัวและกินข้าว ให้ญาติทำแทนทั้งหมดจะดีที่สุด","why":"สิ่งที่ผู้ป่วยทำเองได้ โปรดให้ผู้ป่วยทำเอง นี่ก็เป็นส่วนหนึ่งของการฟื้นฟู ญาติคอยดูอยู่ข้างๆ และช่วยเมื่อจำเป็นก็พอ"},{"q":"เวลาพยุงผู้ป่วยลุกขึ้น ห้ามดึงแขนข้างที่อ่อนแรงของผู้ป่วย","why":"การดึงแขนข้างที่อ่อนแรง ทำให้ไหล่บาดเจ็บได้ง่าย"},{"q":"ผู้ป่วยไอบ้างเป็นครั้งคราวตอนกินข้าวไม่เป็นไร ไม่ต้องแจ้งแพทย์หรือพยาบาล","why":"การไอเวลากินอาหารหรือดื่มน้ำ เป็นสัญญาณเตือนว่าการกลืนมีปัญหา โปรดแจ้งพยาบาลหรือนักแก้ไขการพูด"},{"q":"เวลาป้อนอาหาร ต้องใส่อาหารเข้าปากทางข้างที่มีแรงของผู้ป่วย","why":"ใส่ทางข้างที่มีแรง จะเคี้ยวและกลืนได้ง่ายกว่า และอาหารค้างน้อยกว่า"},{"q":"กลางดึกอยากเข้าห้องน้ำ ผู้ป่วยค่อยๆ เดินไปเองได้ เพื่อไม่ให้ญาติตื่น","why":"ลงจากเตียงและเข้าห้องน้ำ ต้องมีคนอยู่ด้วยทุกครั้ง ถ้าอยู่ในโรงพยาบาล โปรดกดกริ่งเรียก อย่าฝืนทำเอง"},{"q":"ถ้าความดันคงที่และไม่มีอาการไม่สบาย ก็หยุดยาเองได้","why":"ความดันคงที่เพราะกินยาตรงเวลา จะปรับยาหรือไม่ ให้แพทย์เป็นผู้ตัดสินใจ"},{"q":"จู่ๆ ปากเบี้ยว แขนอ่อนแรงข้างหนึ่ง หรือพูดไม่ชัด ให้พักและสังเกตอาการครึ่งวันก่อน","why":"นี่คือสัญญาณเตือนโรคหลอดเลือดสมองซ้ำ ถ้ามีอาการข้อใดข้อหนึ่ง โปรดโทร 119 ทันที และจดเวลาที่เริ่มมีอาการไว้"},{"q":"ระหว่างการดูแลแบบ PAC ทีมจะประเมินความก้าวหน้าทุก 3 สัปดาห์","why":"ทีมจะประเมินเมื่อรับเข้าโครงการ ทุก 3 สัปดาห์ และเมื่อสิ้นสุดการดูแล แล้วปรับเนื้อหาการฟื้นฟูตามผล"},{"q":"ผู้ดูแลก็ต้องได้พัก และโทร 1966 เพื่อสอบถามเรื่องบริการดูแลแทนชั่วคราวได้","why":"การดูแลเป็นเรื่องระยะยาว โทรสายด่วนการดูแลระยะยาว 1966 เพื่อสอบถามเรื่องแหล่งช่วยเหลือได้ เช่น บริการดูแลแทนชั่วคราวเพื่อให้ผู้ดูแลได้พัก และบริการดูแลที่บ้าน"},{"q":"ควรถือไม้เท้าข้างที่อ่อนแรง จึงจะช่วยขาข้างที่อ่อนแรงได้","why":"ต้องถือไม้เท้าข้างที่มีแรง เวลาเดิน ให้ไม้เท้ากับเท้าข้างที่อ่อนแรงก้าวไปข้างหน้าพร้อมกัน"},{"q":"ถ้าเจ็บหน้าอกหรือเวียนหัวขึ้นมาทันทีระหว่างออกกำลังกาย ควรหยุดออกกำลังกายทันที","why":"เจ็บหน้าอก เวียนหัว เหงื่อออกตัวเย็น หรือหายใจหอบมาก ต้องหยุดออกกำลังกายทันที ถ้าพักไม่กี่นาทีแล้วไม่ดีขึ้น หรือแขนขาอ่อนแรงมากขึ้นทันที โปรดโทร 119"},{"q":"ฝึกหยิบกระดุมหรือตัวต่อเสร็จแล้ว วางทิ้งไว้ใกล้ผู้ป่วยได้ จะได้ฝึกได้ตลอดเวลา","why":"ของชิ้นเล็กฝึกเสร็จแล้วต้องเก็บให้เรียบร้อย เพื่อไม่ให้ผู้ป่วยกลืนเข้าไปโดยไม่ตั้งใจ"},{"q":"เวลาช่วยผู้ป่วยพลิกตัว ดึงแขนข้างที่อ่อนแรงเพื่อพาตัวพลิกไปได้","why":"การดึงแขนข้างที่อ่อนแรงทำให้ไหล่บาดเจ็บ ต้องประคองไหล่และสะโพกแล้วพลิกไปพร้อมกัน"},{"q":"ผู้ป่วยสำลักอาหาร แต่ยังไอได้ พูดได้ ควรตบหลังแรงๆ","why":"ถ้ายังไอได้ ให้ผู้ป่วยโน้มตัวไปข้างหน้าและไอแรงๆ เอง ห้ามตบหลัง ถ้าไอไม่มีเสียง พูดไม่ได้ หรือหายใจไม่ได้ จึงโทร 119 และตบหลังสลับกับกดท้อง"},{"q":"ถ้ารู้สึกว่าความดันสูงนิดหน่อย กินยาลดความดันเพิ่มเองอีก 1 เม็ดได้","why":"อย่าเพิ่มยา ลดยา หรือหยุดยาเอง ควรคุมความดันให้ถึงเป้าหมายที่แพทย์กำหนด แต่ไม่ใช่ยิ่งต่ำยิ่งดี มีข้อสงสัยให้ถามแพทย์"},{"q":"ถ้าขาข้างหนึ่งของผู้ป่วยบวมขึ้นทันทีและเจ็บ ควรนวดแรงๆ ให้ยุบบวม","why":"นี่อาจเป็นสัญญาณเตือนของลิ่มเลือด ห้ามนวด ให้ไปพบแพทย์ภายในวันเดียวกัน ถ้าจู่ๆ เจ็บหน้าอก หายใจหอบมาก ให้โทร 119 ทันที"},{"q":"เวลานอนหรือนั่งนาน การขยับข้อเท้าบ่อยๆ โดยกระดกปลายเท้าขึ้นและเหยียดลง ช่วยป้องกันลิ่มเลือดที่ขาได้","why":"การขยับข้อเท้าช่วยให้เลือดที่ขาไหลเวียน ช่วยป้องกันลิ่มเลือด ขาข้างที่อ่อนแรง ญาติช่วยขยับให้ได้"},{"q":"ถ้ากล้ามเนื้อแขนขาของผู้ป่วยตึงมาก ให้ออกแรงดัดให้ตรงจะได้ผลดีกว่า","why":"การออกแรงดัดทำให้กล้ามเนื้อหรือข้อต่อบาดเจ็บได้ ต้องยืดช้าๆ ค้างไว้ครู่หนึ่งแล้วค่อยคลาย ถ้าเจ็บให้หยุด"},{"q":"ฝึกฟื้นฟูยิ่งมากยิ่งดี จึงเพิ่มการฝึกเป็น 2 เท่าเองได้","why":"ต้องฝึกให้จำนวนและความหนักพอจึงจะได้ผล แต่นักบำบัดต้องเป็นผู้จัดให้ตามอาการของผู้ป่วย และค่อยๆ เพิ่ม ถ้าเพิ่มเป็น 2 เท่าเองทันที จะเหนื่อยเกินไปหรือบาดเจ็บได้ง่าย"},{"q":"ถ้าข้างที่เป็นโรคหลอดเลือดสมองรับความรู้สึกได้น้อยลง การใช้ประคบร้อนหรือแผ่นให้ความร้อนทำให้ผิวไหม้ได้ง่าย","why":"เมื่อรับความรู้สึกได้น้อยลง จะไม่ค่อยรู้สึกร้อนหรือเย็น ผิวไหม้แล้วก็อาจไม่รู้ตัว ก่อนใช้ให้ถามนักบำบัดก่อน"},{"q":"ถ้านิ้วมือตึงมาก กำมือแล้วกางไม่ออก ควรฝึกบีบลูกบอลแรงๆ ทั้งวัน","why":"เมื่อนิ้วมือตึงมาก การฝึกออกแรงกำอย่างเดียวอาจไม่เหมาะ และอย่าฝึกนานเกินไปในครั้งเดียว ให้ค่อยๆ เหยียดนิ้วมือให้ตรงก่อน ฝึกกางมือให้มาก และถามนักบำบัดว่าควรฝึกแบบไหน"},{"q":"หลังเป็นโรคหลอดเลือดสมอง เดินได้แล้วแต่มือฟื้นช้ากว่า แปลว่ามือไม่มีหวังแล้ว ฝึกแค่เดินก็พอ","why":"มือฟื้นช้ากว่าเป็นเรื่องที่พบได้บ่อย ถ้าไม่ฝึกมือ มือจะกลับมาทำท่าเล็กๆ ได้ยาก ต้องฝึกมือทุกวันด้วย"},{"q":"ผู้ป่วยกินไปหลายคำแล้วไม่สำลัก แปลว่ากลืนได้ปลอดภัยแล้ว ไม่ต้องประเมิน","why":"บางคนมีอาหารหรือน้ำเข้าไปในหลอดลมแต่ไม่ไอเลย (สำลักแบบเงียบ) การกลืนปลอดภัยหรือไม่ ต้องให้นักแก้ไขการพูดประเมิน"},{"q":"เพื่อป้องกันกล้ามเนื้อข้อมือและนิ้วตึงขึ้น (ภาวะกล้ามเกร็ง) ครอบครัวซื้อเฝือกหรือเทปมาให้ผู้ป่วยใช้เองได้","why":"ไม่แนะนำให้ใช้เฝือกหรือเทปเพื่อป้องกันกล้ามเนื้อข้อมือและนิ้วตึงขึ้น จะใช้เฝือกหรือไม่ และใช้อย่างไร ให้นักบำบัดประเมินและสอน"}],"res":{"ui":{"tab":"บริการ","title":"บริการช่วยเหลือในเมืองไทเป","intro":"แหล่งความช่วยเหลือสำหรับผู้ป่วยโรคหลอดเลือดสมองและครอบครัว ด้านอาหาร เสื้อผ้า ที่อยู่อาศัย การเดินทาง การแพทย์ การดูแลระยะยาว และเงินช่วยเหลือ กดเปิดแต่ละรายการเพื่อดูวิธีสมัครและเบอร์โทร","searchLabel":"ค้นหา","searchPh":"พิมพ์คำค้น เช่น ส่งอาหาร, รถเข็น, ซงซาน","catLabel":"หมวด","catAll":"ทุกหมวด","count":"ทั้งหมด {n} รายการ","none":"ไม่พบบริการที่ตรงกัน กรุณาลองคำค้นอื่น หรือเลือก “ทุกหมวด”","clear":"ล้าง","who":"ใครใช้ได้","how":"วิธีสมัคร","phone":"โทรศัพท์","ext":"ต่อ","web":"เว็บไซต์ทางการ","note":"โปรดทราบ","zhName":"ชื่อภาษาจีน","tip1999":"1999 คือสายด่วนของเทศบาลไทเป ในไทเปโทรได้ทั้งจากโทรศัพท์บ้านและมือถือ ถ้าอยู่นอกไทเป กรุณาโทร 02-2720-8889 แทน","checked":"ตรวจสอบข้อมูลเมื่อ: วันที่ 14 เดือน 10 ปี 115 ตามปฏิทินไต้หวัน (ค.ศ. 2026) รายละเอียดบริการและจำนวนเงินอาจเปลี่ยนแปลง กรุณาโทรสอบถามก่อนสมัคร","homeCard":"บริการช่วยเหลือในเมืองไทเป","homeCardSub":"ส่งอาหาร อุปกรณ์ช่วย รถรับส่ง การดูแลระยะยาว เงินช่วยเหลือ"},"cats":{"medical":"การแพทย์","care":"การดูแลระยะยาว","food":"อาหาร","clothing":"เสื้อผ้าและอุปกรณ์ช่วย","housing":"ที่อยู่อาศัย","transport":"การเดินทาง","money":"ความช่วยเหลือด้านการเงิน","caregiver":"การสนับสนุนผู้ดูแล"},"order":["medical","care","food","clothing","housing","transport","money","caregiver"],"items":[{"id":"er119","cats":["medical"],"name":"สงสัยว่าเป็นโรคหลอดเลือดสมอง: โทร 119 ทันที","agency":"สำนักงานดับเพลิง เทศบาลไทเป; กระทรวงสาธารณสุขและสวัสดิการไต้หวัน","what":"ถ้าจู่ ๆ มีอาการปากเบี้ยว แขนขาอ่อนแรงข้างเดียว หรือพูดไม่ชัด ต้องโทร 119 ทันที เจ้าหน้าที่กู้ชีพจะพาผู้ป่วยไปโรงพยาบาลที่รักษาโรคหลอดเลือดสมองระยะเฉียบพลันได้","who":"ทุกคน","how":"โทร 119 แล้วบอกที่อยู่ อาการ และเวลาที่เริ่มมีอาการให้ชัดเจน อย่าขับรถยนต์หรือขี่รถจักรยานยนต์พาไปโรงพยาบาลเอง ถ้าอยากรู้ก่อนว่าในไทเปมีโรงพยาบาลที่รับผิดชอบการรักษาฉุกเฉินแห่งใดบ้าง ดูรายชื่อที่กระทรวงสาธารณสุขและสวัสดิการประกาศไว้ได้","note":"","tels":[{"label":"บริการรถพยาบาลฉุกเฉิน","tel":"119","ext":"","addr":""}],"url":"https://www.mohw.gov.tw/dl-97025-23d029a4-14c2-4ae9-a057-7a32d3885839.html"},{"id":"pac","cats":["medical"],"name":"การดูแลแบบบูรณาการระยะหลังเฉียบพลันสำหรับโรคหลอดเลือดสมอง (PAC)","agency":"สำนักงานประกันสุขภาพแห่งชาติ กระทรวงสาธารณสุขและสวัสดิการไต้หวัน","what":"หลังอาการโรคหลอดเลือดสมองคงที่แล้ว ผู้ป่วยไปรับการฟื้นฟูอย่างเข้มข้นที่โรงพยาบาลที่ร่วมโครงการช่วงหนึ่ง มี 3 แบบ คือ นอนโรงพยาบาล ดูแลช่วงกลางวัน และดูแลที่บ้าน","who":"ผู้ป่วยที่อยู่ภายใน 1 เดือนหลังเกิดโรคหลอดเลือดสมองเฉียบพลัน มีความบกพร่องของร่างกายระดับปานกลางถึงค่อนข้างรุนแรง อาการคงที่ และมีโอกาสฟื้นฟูได้ โดยทีมแพทย์เป็นผู้ประเมิน","how":"ระหว่างนอนโรงพยาบาล ขอให้ทีมแพทย์หรือทีมวางแผนก่อนจำหน่ายช่วยประเมินและส่งต่อ ดูรายชื่อโรงพยาบาลที่ให้บริการได้ที่เว็บไซต์ของสำนักงานประกันสุขภาพแห่งชาติ ระยะเวลาดูแลโดยหลักคือ 3–6 สัปดาห์ นานที่สุด 12 สัปดาห์","note":"","tels":[{"label":"สายด่วนสอบถามประกันสุขภาพ","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-5499-734a5-2898-1.html"},{"id":"catastrophic","cats":["medical","money"],"name":"สถานะโรคร้ายแรง (โรคหลอดเลือดสมองเฉียบพลัน)","agency":"สำนักงานประกันสุขภาพแห่งชาติ กระทรวงสาธารณสุขและสวัสดิการไต้หวัน","what":"โรคหลอดเลือดสมองเฉียบพลันจัดเป็นโรคร้ายแรง ภายใน 1 เดือนหลังเกิดอาการ การรักษาที่เกี่ยวกับโรคหลอดเลือดสมองไม่ต้องจ่ายเงินส่วนร่วมจ่ายของประกันสุขภาพ","who":"ผู้ป่วยโรคหลอดเลือดสมองเฉียบพลัน สิทธิ์นี้ใช้ได้ภายใน 1 เดือนหลังเกิดอาการ","how":"ไม่ต้องยื่นสมัครเอง แพทย์เป็นผู้รับรอง ถ้าย้ายโรงพยาบาลภายใน 1 เดือน กรุณาขอใบรับรองแพทย์ที่ระบุวันที่วินิจฉัยจากโรงพยาบาลเดิม แล้วนำไปให้โรงพยาบาลถัดไป","note":"หลัง 1 เดือน ถ้ายังมีอาการหลงเหลือจากโรค สมัครหนังสือรับรองความพิการหรือบริการดูแลระยะยาวแยกต่างหากได้","tels":[{"label":"สายด่วนสอบถามประกันสุขภาพ","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-13699-f25bd-2957-1.html"},{"id":"homemed","cats":["medical"],"name":"การรักษาที่บ้าน (โครงการดูแลรักษาที่บ้านแบบบูรณาการของประกันสุขภาพ)","agency":"สำนักงานประกันสุขภาพแห่งชาติ กระทรวงสาธารณสุขและสวัสดิการไต้หวัน","what":"แพทย์ พยาบาล และบุคลากรอื่น ไปตรวจรักษา จ่ายยา และดูแลที่บ้าน สำหรับผู้ป่วยที่ออกไปพบแพทย์ได้ยากมาก","who":"ผู้ที่อยู่ที่บ้าน ออกไปพบแพทย์ได้ยากเพราะมีภาวะพึ่งพิงหรือเจ็บป่วย และแพทย์ประเมินแล้วว่ามีความจำเป็นทางการแพทย์","how":"ถามโรงพยาบาลหรือคลินิกที่รักษาอยู่เดิมว่ามีบริการรักษาที่บ้านหรือไม่ หรือขอให้ศูนย์จัดการการดูแลระยะยาวส่งต่อ หรือโทรสายด่วนสอบถามประกันสุขภาพ","note":"","tels":[{"label":"สายด่วนสอบถามประกันสุขภาพ","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-5195-2e804-2875-1.html"},{"id":"disacert","cats":["medical","money"],"name":"หนังสือรับรองความพิการ (การประเมินความพิการ)","agency":"สำนักงานสวัสดิการสังคม และสำนักงานสาธารณสุข เทศบาลไทเป; สำนักงานเขตตามทะเบียนบ้าน","what":"ถ้าหลังเป็นโ รไว้ก่อน เมื่อผู้ป่วยกลับบ้าน จะเริ่มใช้ความช่วยเหลือได้เร็ว เช่น บริการดูแลที่บ้าน อุปกรณ์ช่วย หรือรถรับส่ง","who":"ผู้ป่วยที่ความสามารถในการใช้ชีวิตประจำวันลดลงหลังนอนโรงพยาบาล และต้องใช้บริการดูแลระยะยาวเมื่อกลับบ้าน","how":"ระหว่างนอนโรงพยาบาล บอกผู้จัดการรายกรณีด้านการวางแผนก่อนจำหน่าย หรือนักสังคมสงเคราะห์ของโรงพยาบาล","note":"","tels":[{"label":"สายด่วนบริการดูแลระยะยาว","tel":"1966","ext":"","addr":""}],"url":"https://health.gov.taipei/News_Content.aspx?n=BB5A41BA1E6CA260&sms=72544237BBE4C5F6&s=51A8504C99587CA7"},{"id":"homecare","cats":["care"],"name":"บริการดูแลที่บ้าน (ผู้ช่วยดูแลมาที่บ้าน)","agency":"สำนักงานสาธารณสุข และสำนักงานสวัสดิการสังคม เทศบาลไทเป; กระทรวงสาธารณสุขและสวัสดิการไต้หวัน","what":"ผู้ช่วยดูแลมาช่วยที่บ้าน เช่น อาบน้ำ แต่งตัว กินข้าว กินยา พลิกตัว ขึ้นลงเตียง และพาไปพบแพทย์","who":"ผู้ที่ศูนย์จัดการการดูแลระยะยาวประเมินแล้วว่ามีระดับความต้องการการดูแลระยะยาวตั้งแต่ระดับ 2 ขึ้นไป","how":"โทร 1966 เพื่อสมัคร หลังประเมินแล้ว ผู้จัดการรายกรณีจะจัดหน่วยบริการให้","note":"รัฐช่วยจ่ายค่าใช้จ่ายส่วนใหญ่ สัดส่วนที่ต้องจ่ายเองขึ้นอยู่กับฐานะการเงินของครอบครัว โดยยึดตามที่ศูนย์จัดการการดูแลระยะยาวอนุมัติ ถ้าบ้านจ้างผู้ดูแลต่างชาติอยู่แล้ว โดยหลักใช้บริการดูแลที่บ้านไม่ได้ แต่เฉพาะช่วงที่ยังไม่มีผู้ดูแลต่างชาติอยู่ เช่น ผู้ดูแลกลับประเทศชั่วคราว หรือออกจากไต้หวันไปแล้ว ถ้ามีหลักฐาน ใช้ได้","tels":[{"label":"สายด่วนบริการดูแลระยะยาว","tel":"1966","ext":"","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=D46C608F5B4E3D8D"},{"id":"daycare","cats":["care"],"name":"บริการดูแลช่วงกลางวัน (ศูนย์ดูแลกลางวัน)","agency":"สำนักงานสวัสดิการสังคม และสำนักงานสาธารณสุข เทศบาลไทเป","what":"ตอนกลางวันพาผู้ป่วยไปศูนย์ดูแลกลางวัน มีคนดูแล มีอาหารกลางวัน พักกลางวัน และกิจกรรม แล้วกลับบ้านตอนเย็น","who":"ผู้ที่มีระดับความต้องการการดูแลระยะยาวตั้งแต่ระดับ 2 ขึ้นไป และเป็นผู้อายุ 65 ปีขึ้นไป, มีหนังสือรับรองความพิการ, มีภาวะสมองเสื่อม, เป็นชนพื้นเมืองอายุ 55 ปีขึ้นไป, หรือเป็นผู้ป่วยที่อยู่ในโครงการ PAC","how":"โทร 1966 หรือสมัครทางเว็บไซต์ข้อมูลการดูแลระยะยาวของเทศบาลไทเป หลังประเมินแล้ว ผู้จัดการรายกรณีจะหาศูนย์ดูแลกลางวันที่เหมาะสมให้","note":"","tels":[{"label":"สายด่วนบริการดูแลระยะยาว","tel":"1966","ext":"","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=3E3C1D86A51BF473"},{"id":"reable","cats":["care"],"name":"บริการวิชาชีพด้านการดูแลระยะยาว (ฟื้นฟูความสามารถที่บ้าน)","agency":"กระทรวงสาธารณสุขและสวัสดิการไต้หวัน; ศูนย์จัดการการดูแลระยะยาว เทศบาลไทเป","what":"นักบำบัด พยาบาล หรือนักโภชนาการมาที่บ้านในระยะสั้น สอนผู้ป่วยให้ทำกิจวัตรประจำวันเอง และสอนครอบครัวกับผู้ดูแลถึงวิธีดูแล เช่น การย้ายตัว การกินอาหาร และความปลอดภัยในบ้าน","who":"ผู้รับบริการดูแลระยะยาวที่ศูนย์จัดการการดูแลระยะยาวประเมินแล้ว","how":"แจ้งขอที่ 1966 หรือกับผู้จัดการรายกรณี เป้าหมายการฝึกแต่ละเรื่อง โดยหลักให้ทำให้เสร็จภายใน 6 เดือน","note":"","tels":[{"label":"สายด่วนบริการดูแลระยะยาว","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/cp-6451-70123-207.html"},{"id":"respite","cats":["care","caregiver"],"name":"บริการดูแลแทนชั่วคราว (ให้ผู้ดูแลได้พัก)","agency":"กระทรวงสาธารณสุขและสวัสดิการไต้หวัน; ศูนย์จัดการการดูแลระยะยาว เทศบาลไทเป","what":"ให้ครอบครัวหรือผู้ดูแลที่ดูแลผู้ป่วยได้พัก โดยให้ผู้ช่วยดูแลมาที่บ้าน หรือให้ผู้ป่วยเข้าพักในสถานดูแลระยะสั้น หรือไปศูนย์ดูแลกลางวันตอนกลางวัน","who":"ผู้ที่มีระดับความต้องการการดูแลระยะยาวระดับ 2–8 และมีผู้ดูแลอยู่ที่บ้าน ครอบครัวที่จ้างผู้ดูแลต่างชาติแล้วก็ใช้ได้","how":"โทร 1966 เพื่อขอรับการประเมิน แล้วผู้จัดการรายกรณีจะจัดบริการให้","note":"สิทธิ์ที่ใช้ได้ในแต่ละปี ยึดตามที่ศูนย์จัดการการดูแลระยะยาวอนุมัติ","tels":[{"label":"สายด่วนบริการดูแลระยะยาว","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/np-6454-207.html"},{"id":"meals","cats":["food"],"name":"บริการอาหารสำหรับผู้มีภาวะพึ่งพิง (ส่งอาหารถึงบ้าน)","agency":"สำนักงานสวัสดิการสังคม เทศบาลไทเป; ศูนย์จัดการการดูแลระยะยาว เทศบาลไทเป","what":"ผู้มีภาวะพึ่งพิงที่ซื้ออาหารหรือทำอาหารเองไม่ได้ มีคนนำอาหารมาส่งถึงบ้านได้ ครัวเรือนรายได้น้อยและครัวเรือนรายได้ปานกลางค่อนข้างต่ำ รัฐช่วยจ่ายค่าอาหาร","who":"ผู้สูงอายุ 65 ปีขึ้นไ function detectLang(){
  var saved=load("pac.lang",null);
  if(saved&&PACKS[saved])return saved;
  var list=[];
  try{list=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||""]);}catch(e){}
  for(var i=0;i<list.length;i++){
    var p=String(list[i]).toLowerCase().slice(0,2);
    if(p==="in")p="id";
    if(PACKS[p])return p;
  }
  return "zh";
}

/* ---------- 語音朗讀 ---------- */
var synth=("speechSynthesis" in window)?window.speechSynthesis:null;
if(synth){try{synth.getVoices();}catch(e){}}
var sp={on:false,q:[],i:-1,run:0,err:""};
function findVoice(){
  try{
    var v=synth.getVoices()||[];
    if(!v.length)return {none:false,voice:null};
    var want=L.speech.toLowerCase(),pre=want.slice(0,2),exact=null,loose=null;
    for(var k=0;k<v.length;k++){
      var lg=String(v[k].lang||"").toLowerCase().replace("_","-");
      if(lg===want&&!exact)exact=v[k];
      if(lg.indexOf(pre)===0&&!loose)loose=v[k];
    }
    return {none:!(exact||loose),voice:exact||loose};
  }catch(e){return {none:false,voice:null};}
}
function speakText(el){
  var t=el.textContent.replace(/(\d)\s*[–\-]\s*(\d)/g,"$1"+L.rangeWord+"$2");
  (L.say||[]).forEach(function(p){t=t.split(p[0]).join(p[1]);});
  return t;
}
function clearMark(){var m=view.querySelectorAll(".speaking");for(var k=0;k<m.length;k++)m[k].classList.remove("speaking");}
function stopSpeak(){sp.run++;sp.on=false;if(synth){try{synth.cancel();}catch(e){}}clearMark();paintSpeak();}
function nextSpeak(){
  clearMark();sp.i++;
  if(!sp.on||sp.i>=sp.q.length){stopSpeak();return;}
  var el=sp.q[sp.i],run=sp.run;
  el.classList.add("speaking");
  try{el.scrollIntoView({block:"center",behavior:"smooth"});}catch(e){}
  var u=new SpeechSynthesisUtterance(speakText(el));
  u.lang=L.speech;u.rate=parseFloat(S.rate)||1;
  if(sp.voice)u.voice=sp.voice;
  u.onend=function(){if(run===sp.run)nextSpeak();};
  u.onerror=function(ev){
    if(run!==sp.run)return;
    if(ev&&(ev.error==="interrupted"||ev.error==="canceled"))return;
    sp.err=L.ui.speechFail;stopSpeak();
  };
  synth.speak(u);
}
function startSpeak(){
  if(!synth)return;
  stopSpeak();sp.err="";
  var fv=findVoice();
  if(fv.none){sp.err=L.ui.noVoice;paintSpeak();return;}
  sp.voice=fv.voice;
  var all=view.querySelectorAll(".art-h h1,.article h2,.article h3,.article p,.article li,.article dt,.article dd");
  sp.q=[];
  for(var k=0;k<all.length;k++){if(!all[k].closest(".nospeak"))sp.q.push(all[k]);}
  sp.on=true;sp.i=-1;sp.run++;paintSpeak();nextSpeak();
}
function paintSpeak(){
  var b=document.getElementById("speak-btn"),n=document.getElementById("speak-note");
  if(!b)return;
  b.innerHTML=sp.on?ic("stop")+T("stop"):ic("play")+T("speak");
  b.setAttribute("aria-pressed",String(sp.on));
  if(n){n.textContent=sp.err;n.hidden=!sp.err;}
}

/* ---------- 圖解 ---------- */
function pg(n){return '<svg class="pg" viewBox="0 0 64 64" aria-hidden="true">'+PIC[n]+'</svg>';}
function pic(n,cap,sub,cls,pre){
  return '<figure class="pic'+(cls?" "+cls:"")+'">'+pg(n)+'<figcaption><b>'+(pre||"")+esc(cap)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</figcaption></figure>';
}
function fig(id){
  var c=L.caps[id];
  if(id==="angle"){
    return '<figure class="fig nospeak"><svg class="pg" viewBox="0 0 120 70" role="img" aria-label="'+esc(c.aria)+'">'+
      '<path class="s" d="M8 58h104M12 58v8M108 58v8"/><path class="s" d="M50 54H12" stroke-dasharray="3 4"/>'+
      '<path d="M17 28L50 54h58"/><path class="p" d="M32 54A18 18 0 0135.800 42.900" stroke-width="2.5"/>'+
      '<circle class="f" cx="27.500" cy="26.500" r="5"/><path d="M32.600 34L53 50h45"/><text x="1" y="49">30–45°</text></svg>'+
      '<figcaption>'+esc(c.cap)+'</figcaption></figure>';
  }
  if(id==="weeks"){
    return '<div class="weeks nospeak" role="img" aria-label="'+esc(c.aria)+'"><div class="cap">'+esc(c.cap)+'</div>'+
      '<div class="scale"><i class="base"></i><i class="ext"></i></div>'+
      '<div class="ticks"><span style="left:0%">0</span><span style="left:25%">3</span><span style="left:50%">6</span><span style="left:75%">9</span><span style="left:100%">12</span></div>'+
      '<div class="legend"><span><i class="l1"></i>'+esc(c.legend[0])+'</span><span><i class="l2"></i>'+esc(c.legend[1])+'</span><span><i class="l3"></i>'+esc(c.legend[2])+'</span></div></div>';
  }
  var F=FIGS[id];
  var items=F.items.map(function(n,i){
    var cls="",pre="";
    if(F.marks){cls=i===0?"ok":"no";pre=(i===0?esc(L.ui.markOk):"✕")+" ";}
    if(F.num){cls="step";pre='<i class="num">'+(i+1)+'</i>';}
    if(F.allNo){cls="no";pre="✕ ";}
    return pic(n,c[i][0],c[i][1],cls,pre);
  });
  if(F.flow)return '<div class="pics flow nospeak">'+items.join(ic("right"))+'</div>';
  return '<div class="pics nospeak '+F.cols+'">'+items.join("")+'</div>';
}
function sosHtml(tag){
  var sep=L.code==="zh"?"，":", ";
  return '<'+tag+'>'+ic("alert")+esc(L.sos.title)+'</'+tag+'><ol>'+L.sos.items.map(function(it,i){
    return '<li>'+pg(SOS_ICONS[i])+'<div><b>'+esc(it[0])+'<i class="vh">'+sep+'</i></b><span>'+esc(it[1])+'</span></div></li>';
  }).join("")+'</ol><p class="call">'+esc(L.sos.call).replace("{n}",'<a class="tel" href="tel:119"><em>119</em></a>')+'</p>';
}
function ulHtml(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>';}
function blocks(body){
  return body.map(function(b){
    switch(b.t){
      case "h":return '<h2>'+esc(b.x)+'</h2>';
      case "p":return '<p>'+esc(b.x)+'</p>';
      case "ul":return ulHtml(b.x);
      case "fig":return fig(b.id);
      case "weak":return '<p class="hint nospeak">'+T("weakNote")+'</p>';
      case "unitlink":return '<button type="button" class="btn ghost golink nospeak" data-unit="'+esc(b.unit)+'">'+ic("book")+esc(b.x)+ic("right")+'</button>';
      case "golink":return '<button type="button" class="btn ghost golink nospeak" data-tab="'+esc(b.tab)+'" data-rescat="'+esc(b.rescat)+'">'+ic("pin")+esc(b.x)+ic("right")+'</button>';
      case "sos":return '<div class="sos">'+sosHtml("h3")+'</div>';
      case "modes":return '<dl class="modes">'+b.x.map(function(m,i){
        return '<div><dt>'+pg(MODE_ICONS[i])+esc(m.dt)+'</dt><dd>'+esc(m.dd)+'</dd></div>';}).join("")+'</dl>';
      case "key":
      case "warn":return '<div class="'+b.t+'"><h3>'+esc(b.h)+'</h3>'+(b.figTop?fig(b.figTop):"")+(b.ul?ulHtml(b.ul):"")+
        (b.p?'<p>'+esc(b.p)+'</p>':"")+(b.figBottom?fig(b.figBottom):"")+'</div>';
    }
    return "";
  }).join("");
}

function RU(k,o){return esc(o?fmt(L.res.ui[k],o):L.res.ui[k]);}
function norm(x){return String(x||"").toLowerCase().replace(/臺/g,"台").replace(/[\s\-－–()（）]/g,"");}
function resHay(i){
  var parts=[],zh=PACKS.zh.res.items[i];
  [L.res.items[i],zh].forEach(function(it){
    parts.push(it.name,it.agency,it.what,it.who,it.how,it.note);
    it.tels.forEach(function(t){parts.push(t.label,t.tel,t.ext,t.addr);});
    it.cats.forEach(function(c){parts.push(L.res.cats[c],PACKS.zh.res.cats[c]);});
  });
  return norm(parts.join(" "));
}
function resMatches(){
  var q=norm(S.resQ),out=[];
  L.res.items.forEach(function(it,i){
    if(S.resCat!=="all"&&it.cats.indexOf(S.resCat)<0)return;
    if(q&&resHay(i).indexOf(q)<0)return;
    out.push(i);
  });
  return out;
}

  return '<span class="num">'+ic("phone")+shown+'</span>';

}
function resView(){
  var opts='<option value="all">'+RU("catAll")+'</option>'+L.res.order.map(function(c){
    return '<option value="'+c+'"'+(S.resCat===c?' selected':'')+'>'+esc(L.res.cats[c])+'</option>';}).join("");
  return '<section class="intro"><h1>'+RU("title")+'</h1><p>'+RU("intro")+'</p></section>'+
    '<div class="rfilter" role="search">'+
      '<label class="rq" for="res-q"><span class="vh">'+RU("searchLabel")+'</span>'+ic("search")+
        '<input type="search" id="res-q" autocomplete="off" placeholder="'+RU("searchPh")+'" value="'+esc(S.resQ)+'">'+
        '<button type="button" class="rclear" data-act="res-clear"'+(S.resQ?'':' hidden')+'>'+RU("clear")+'</button></label>'+
      '<label class="rc" for="res-cat"><span>'+RU("catLabel")+'</span><select id="res-cat">'+opts+'</select></label>'+
    '</div>'+
    '<p class="rcount" id="res-count" role="status">'+RU("count",{n:resMatches().length})+'</p>'+
    '<p class="hint">'+RU("tip1999")+'</p>'+
    '<div class="rlist" id="res-list">'+resListHtml()+'</div>'+
    '<p class="hint">'+RU("checked")+'</p>';
}
function paintRes(){
  var l=document.getElementById("res-list"),c=document.getElementById("res-count"),x=view.querySelector(".rclear");
  if(!l)return;
  l.innerHTML=resListHtml();
  c.textContent=fmt(L.res.ui.count,{n:resMatches().length});
  if(x)x.hidden=!S.resQ;
}

function render(keepScroll){
  stopSpeak();
  var html;
  if(S.tab==="learn"&&S.unit)html=unitView(S.unit);
  else if(S.tab==="learn")html=learnView();
  else if(S.tab==="check")html=checkView();
  else if(S.tab==="quiz")html=quizView();
  else if(S.tab==="res")html=resView();
  else if(S.tab==="src")html=srcView();
  else html=homeView();
  view.innerHTML=html;
  paintTabs();paintSpeak();
  var r=document.getElementById("rate");if(r)r.value=S.rate;
  if(!keepScroll){try{window.scrollTo(0,0);}catch(e){}}
  try{var h=S.tab==="learn"&&S.unit?S.unit:S.tab;if(location.hash!=="#"+h)history.replaceState(null,"","#"+h);}catch(e){}
}
function go(tab,unit){S.tab=tab;S.unit=unit||null;render();}
function fromHash(){
  var h=(location.hash||"").replace("#","");
  if(/^u(1[0-5]|[1-9])$/.test(h)){S.tab="learn";S.unit=h;}
  else if(["home","learn","res","check","quiz","src"].indexOf(h)>-1){S.tab=h;S.unit=null;}
}

/* ---------- 事件 ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  var d=t.dataset;
  if(d.fs){S.fs=d.fs;save("pac.fs",S.fs);paintChrome();return;}
  if(d.rescat){S.resCat=d.rescat;S.resQ="";}
  if(d.tab){go(d.tab);return;}
  if(d.unit){go("learn",d.unit);return;}
  if(d.list){S.list=d.list;render(true);return;}
  if(d.ans){S.quiz.picked=d.ans==="1";S.quiz.ans[S.quiz.i]=S.quiz.picked;render(true);return;}
  if(d.act==="next"){S.quiz.i++;S.quiz.picked=null;render();return;}
  if(d.act==="retry"){S.quiz={i:0,ans:[],picked:null};render();return;}
  if(d.act==="speak"){if(sp.on)stopSpeak();else startSpeak();return;}
  if(d.act==="res-clear"){S.resQ="";var qi=document.getElementById("res-q");if(qi){qi.value="";qi.focus();}paintRes();return;}
  if(d.act==="clear"){
    if(S.list==="daily"){S.daily=[];save(DAYKEY,S.daily);}else{S.ready=[];save("pac.ready",S.ready);}
    render(true);return;
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="lang"){
    if(!PACKS[t.value])return;
    S.lang=t.value;L=PACKS[S.lang];save("pac.lang",S.lang);
    paintChrome();render(true);return;
  }
  if(t.id==="res-cat"){S.resCat=t.value;paintRes();return;}
  if(t.id==="rate"){S.rate=t.value;save("pac.rate",S.rate);if(sp.on)startSpeak();return;}
  if(t.dataset&&t.dataset.ck!==undefined){
    var i=parseInt(t.dataset.ck,10),daily=S.list==="daily",arr=daily?S.daily:S.ready,at=arr.indexOf(i);
    if(t.checked&&at<0)arr.push(i);
    if(!t.checked&&at>-1)arr.splice(at,1);
    save(daily?DAYKEY:"pac.ready",arr);
    var n=(daily?L.daily:L.ready).length;
    document.getElementById("prog-n").textContent=fmt(L.ui.progDone,{n:arr.length,m:n});
    document.getElementById("prog-bar").style.width=Math.round(arr.length/n*100)+"%";
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="res-q"){S.resQ=e.target.value;paintRes();}
});
window.addEventListener("hashchange",function(){fromHash();render();});
window.addEventListener("pagehide",function(){if(synth){try{synth.cancel();}catch(e){}}});

fromHash();paintChrome();render();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
</body>
</html>
