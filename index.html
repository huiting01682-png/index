<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>腦中風 PAC 衛教</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#245F94">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PAC 衛教">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* 版面概念：手機單欄 App——上方固定列（名稱＋字級）、中間內容、下方四個分頁；長輩可讀的大字與大按鍵 */
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --surface-2:#F4F8FB;
  --ink:#1B2559; --text:#27324A; --muted:#556178; --line:#D3DFEA;
  --primary:#245F94; --on-primary:#FFFFFF; --primary-soft:#E1EDF8;
  --ok:#0B7A57; --ok-soft:#DCF2E9;
  --alert:#B92335; --alert-soft:#FDECEE; --alert-line:#F0B5BC;
  --speak:#FFF1C2; --weak:#C9590F; --pic-soft:#CFE3F3;
  --tile-ink:#14213D;
  --tile-blue:#7FB3D9; --tile-teal:#7ECBC4; --tile-green:#86C5A0; --tile-orange:#EFA97A;
  --tile-pink:#E793A0; --tile-purple:#B49AD1; --tile-sky:#9CC9E8;
  --shadow:0 1px 2px rgba(27,37,89,.06),0 6px 18px rgba(27,37,89,.06);
  --font:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --surface:#17223A; --surface-2:#1D2A45;
    --ink:#EDF3FB; --text:#D6DFEC; --muted:#A3B2C9; --line:#2D3D5C;
    --primary:#86BDEA; --on-primary:#0E1626; --primary-soft:#1F3352;
    --ok:#5FD0A6; --ok-soft:#153A31;
    --alert:#FF9AA5; --alert-soft:#3A1920; --alert-line:#6E2B36;
    --speak:#4B4012; --weak:#F5A462; --pic-soft:#2A4467;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#17223A; --surface-2:#1D2A45;
  --ink:#EDF3FB; --text:#D6DFEC; --muted:#A3B2C9; --line:#2D3D5C;
  --primary:#86BDEA; --on-primary:#0E1626; --primary-soft:#1F3352;
  --ok:#5FD0A6; --ok-soft:#153A31;
  --alert:#FF9AA5; --alert-soft:#3A1920; --alert-line:#6E2B36;
  --speak:#4B4012; --weak:#F5A462; --pic-soft:#2A4467;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
html{font-size:18px}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.75;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
h1,h2,h3{color:var(--ink);line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
ul{margin:0;padding-left:1.3em}
li+li{margin-top:.35em}
a{color:var(--primary)}
svg.i{width:1.5em;height:1.5em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:640px;margin-inline:auto}

/* 上方固定列（字級固定，不隨放大而擠壓） */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 16px}
.brand{font-size:18px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;min-width:0}
.chip{font-size:16px;font-weight:600;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:0 10px;line-height:1.6;white-space:nowrap}
.fs{display:flex;align-items:center;gap:6px;font-size:16px}
.fs span{color:var(--muted)}
.fs button{min-width:44px;min-height:40px;padding:0 8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:16px}
.fs button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:700}

main{padding-inline:16px;padding-block:20px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;min-width:0}
main > *{min-width:0}

/* 下方分頁 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:min(.9rem,20px);color:var(--muted);min-height:64px}
.tabs button[aria-current="page"]{color:var(--primary);font-weight:700}
.tabs button[aria-current="page"] svg{stroke-width:2.4}

/* 首頁 */
.intro h1{font-size:1.55rem}
.intro .chip{display:inline-block;margin-bottom:8px}
.intro p{margin-top:8px;color:var(--muted)}
.today{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--primary);color:var(--on-primary);
  border:0;border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.today b{display:block;font-size:1.1rem}
.today .meter{flex:1;min-width:0}
.track{height:10px;border-radius:999px;background:color-mix(in srgb,var(--on-primary) 28%,transparent);margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;background:var(--on-primary);border-radius:999px}
.sec-h{font-size:1.15rem;margin-bottom:10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.unit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;
  background:none;border:0;border-top:1px solid var(--line);padding:14px}
.unit:first-child{border-top:0}
.unit:active{background:var(--surface-2)}
.tile{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:var(--tile-ink)}
.tile svg{width:28px;height:28px}
.t-blue{background:var(--tile-blue)}.t-teal{background:var(--tile-teal)}.t-green{background:var(--tile-green)}
.t-orange{background:var(--tile-orange)}.t-pink{background:var(--tile-pink)}.t-purple{background:var(--tile-purple)}.t-sky{background:var(--tile-sky)}
.unit b{display:block;color:var(--ink);font-size:1.05rem;line-height:1.4}
.unit small{display:block;color:var(--muted);font-size:.9rem;line-height:1.5;margin-top:2px}
.unit .go{color:var(--muted)}

/* 警訊區 */
.sos{background:var(--alert-soft);border:1px solid var(--alert-line);border-radius:16px;padding:16px}
.sos h2,.sos h3{color:var(--alert);font-size:1.15rem;display:flex;align-items:center;gap:8px}
.sos ol{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.sos ol li{margin:0;background:var(--surface);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:12px;align-items:center}
.sos ol b{display:block;color:var(--ink);font-size:1.1rem}
.sos ol span{display:block;line-height:1.5;color:var(--text)}
.sos .call{margin-top:12px;font-weight:700;color:var(--ink)}
.sos .call em{font-style:normal;color:var(--alert);font-size:1.5rem;font-variant-numeric:tabular-nums;padding-inline:4px}

.about{color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:8px}
.about h2{font-size:1rem;color:var(--ink)}
.about ul{display:flex;flex-direction:column;gap:4px}
.about li+li{margin-top:0}

/* 文章 */
.back{align-self:flex-start;border:0;background:none;color:var(--primary);font-weight:600;padding:6px 0;min-height:44px;display:flex;align-items:center;gap:4px}
.art-h{display:flex;flex-direction:column;gap:6px}
.art-h h1{font-size:1.5rem}
.art-h p{color:var(--muted);font-size:.9rem}
.speakbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.btn{border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:700;border-radius:12px;
  min-height:52px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--primary)}
.btn[disabled]{opacity:.45;cursor:default}
.speakbar label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
.speakbar select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;font-size:1rem;color:var(--text)}
.speakbar .note{flex-basis:100%;color:var(--muted);font-size:.9rem}
.article{display:flex;flex-direction:column;gap:14px;max-width:34em}
.article h2{font-size:1.2rem;margin-top:10px;padding-top:14px;border-top:1px solid var(--line)}
.article h2:first-child{margin-top:0;padding-top:0;border-top:0}
.article .speaking{background:var(--speak);border-radius:6px;box-shadow:0 0 0 6px var(--speak)}
.key{background:var(--primary-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.key h3{font-size:1.05rem}
.warn{background:var(--alert-soft);border:1px solid var(--alert-line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.warn h3{font-size:1.05rem;color:var(--alert)}
dl.modes{margin:0;display:flex;flex-direction:column;gap:10px}
dl.modes div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
dl.modes dt{font-weight:700;color:var(--ink)}
dl.modes dd{margin:2px 0 0}

/* PAC 期程圖：0–12 週，同一比例尺 */
.weeks{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px}
.weeks .cap{font-weight:700;color:var(--ink);font-size:1rem;margin-bottom:12px}
.weeks .scale{position:relative;height:22px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.weeks .scale i{position:absolute;top:0;bottom:0}
.weeks .scale .base{left:0;width:50%;background:var(--primary)}
.weeks .scale .ext{left:50%;width:50%;background:repeating-linear-gradient(135deg,var(--tile-teal) 0 8px,transparent 8px 14px)}
.weeks .ticks{position:relative;height:3.6em;margin-top:6px;font-size:.9rem;line-height:1.3;font-variant-numeric:tabular-nums}
.weeks .ticks span{position:absolute;top:0;transform:translateX(-50%);text-align:center;color:var(--text);white-space:nowrap}
.weeks .ticks span::before{content:"";display:block;width:2px;height:8px;background:var(--muted);margin:0 auto 2px}
.weeks .ticks span:first-child{transform:none}
.weeks .ticks span:first-child::before{margin-left:0}
.weeks .ticks span:last-child{transform:translateX(-100%)}
.weeks .ticks span:last-child::before{margin-right:0}
.weeks .legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;color:var(--text)}
.weeks .legend span{display:flex;align-items:center;gap:8px}
.weeks .legend i{width:22px;height:12px;border-radius:4px;flex:none}
.weeks .legend .l1{background:var(--primary)}
.weeks .legend .l2{background:repeating-linear-gradient(135deg,var(--tile-teal) 0 5px,transparent 5px 9px);border:1px solid var(--line)}

/* 圖解：象形圖一律用主題色，橘色只代表「無力的那一側」 */
svg.pg{display:block;width:100%;max-width:5.6rem;height:auto;margin-inline:auto;fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
svg.pg .f{fill:var(--ink);stroke:none}
svg.pg .w{stroke:var(--weak)}
svg.pg .wf{fill:var(--weak);stroke:none}
svg.pg .s{stroke:var(--muted);stroke-width:2.5}
svg.pg .sf{fill:var(--pic-soft);stroke:none}
svg.pg .g{stroke:var(--ok)}
svg.pg .r{stroke:var(--alert)}
svg.pg .p{stroke:var(--primary)}
svg.pg text{fill:var(--ink);stroke:none;font-size:7.5px;font-weight:700;font-family:var(--font)}
.pics{display:grid;gap:8px}
.pics.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pics.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pics.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:560px){.pics.c4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pics.flow{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px}
.pics.flow > svg.i{color:var(--muted);width:1.1em;height:1.1em}
.pic{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;height:100%}
.pic figcaption{display:flex;flex-direction:column;line-height:1.4;text-wrap:balance}
.pic b{color:var(--ink);font-size:.95rem}
.pic span{font-size:.9rem;color:var(--text)}
.pic.ok{border:2px solid var(--ok)}
.pic.ok b{color:var(--ok)}
.pic.no{border:2px solid var(--alert)}
.pic.no b{color:var(--alert)}
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.fig svg.pg{max-width:22rem;stroke-width:2.2}
.fig svg.pg .s{stroke-width:1.4}
.fig figcaption{text-align:center;font-size:.9rem;color:var(--text);margin-top:6px}
dl.modes dt{display:flex;align-items:center;gap:10px}
dl.modes dt svg.pg{width:2.6rem;margin:0;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.pager{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* 清單 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.seg button{border:0;background:none;border-radius:10px;min-height:48px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.prog{display:flex;flex-direction:column;gap:8px}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.prog b{color:var(--ink);font-size:1.15rem;font-variant-numeric:tabular-nums}
.prog .line{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.prog .line i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .25s}
.checks{list-style:none;margin:0;padding:0}
.checks li{margin:0;border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:14px;min-height:60px;cursor:pointer}
.checks input{appearance:none;-webkit-appearance:none;width:32px;height:32px;border:2px solid var(--muted);border-radius:9px;background:var(--surface);margin:0;display:grid;place-items:center;cursor:pointer}
.checks input:checked{background:var(--ok);border-color:var(--ok)}
.checks input:checked::after{content:"";width:9px;height:16px;border:solid var(--surface);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.checks input:checked + span{color:var(--muted)}
.hint{color:var(--muted);font-size:.9rem}

/* 測驗 */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.quiz .no{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.quiz .q{font-size:1.2rem;font-weight:700;color:var(--ink);line-height:1.5}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.15rem;font-weight:700;color:var(--ink)}
.ans button.pick{border-color:var(--primary);background:var(--primary-soft)}
.ans button[disabled]{cursor:default}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.right{background:var(--ok-soft)}
.fb.wrong{background:var(--primary-soft)}
.fb b{color:var(--ink)}
.score{font-size:2.4rem;font-weight:800;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.score small{font-size:1.1rem;font-weight:600;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:10px}
.review div{border-top:1px solid var(--line);padding-top:10px}
.linkbtn{border:0;background:none;color:var(--primary);font-weight:600;padding:6px 0;text-decoration:underline;text-align:left}

@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* 多語言版調整 */
:root{--font:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC","Leelawadee UI","Thonburi","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif}
html:lang(th) body{line-height:1.9}
.bar{flex-wrap:nowrap}
.brand{display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:560px){.brand{display:block}}
.lang{display:flex;align-items:center;gap:6px;color:var(--muted);min-width:0}
.lang select{min-height:40px;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-size:16px;padding:0 8px}
.fs{flex:none}
.fs button{display:grid;place-items:center;min-width:42px;padding:0 6px}
.fs button span{color:inherit;line-height:1;font-weight:700}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;font-weight:700;color:var(--primary)}
.intro .eyebrow .chip{display:inline-block;margin-bottom:0}
.unit b,.unit small,.pic b,.pic span,.checks span,.quiz .q{overflow-wrap:anywhere}
.pic .num{font-style:normal;display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--primary);color:var(--on-primary);margin-right:.35em;font-size:.9em;line-height:1}
.pic.step b{display:flex;flex-direction:column;align-items:center;gap:4px}
.pic.step .num{margin-right:0}
.weeks .ticks{height:1.9em}
.weeks .legend .l3{width:2px;height:12px;background:var(--muted);border-radius:0;margin-inline:10px}
.tabs button span{text-align:center;line-height:1.25;overflow-wrap:anywhere}
.seg button{padding:8px 6px;line-height:1.3}
.today b{overflow-wrap:anywhere}
.ans button{padding:8px 6px;line-height:1.3}
.btn{padding:8px 14px;line-height:1.3;text-align:center}
.pager .btn{min-width:0;overflow-wrap:anywhere}
.pics.flow{gap:2px}
.pics.flow .pic{padding:8px 4px}
.pics.flow .pic b{font-size:.9rem}
.pics.flow > svg.i{width:.9em;height:.9em}
.pic b,.pic span{hyphens:auto}
.pics.flow .pic b{font-size:16px}
/* 英文、印尼文單字較長：手機上三欄圖卡改為一列一張（圖左字右） */
@media (max-width:559px){
  html:lang(en) .pics.c3,html:lang(id) .pics.c3{grid-template-columns:minmax(0,1fr)}
  html:lang(en) .pics.c3 .pic,html:lang(id) .pics.c3 .pic{flex-direction:row;align-items:center;text-align:left;gap:14px;padding:10px 14px}
  html:lang(en) .pics.c3 .pic svg.pg,html:lang(id) .pics.c3 .pic svg.pg{width:3.6rem;margin:0;flex:none}
  html:lang(en) .pics.c3 .pic figcaption,html:lang(id) .pics.c3 .pic figcaption{min-width:0}
  html:lang(en) .pics.c3 .pic.step b,html:lang(id) .pics.c3 .pic.step b{flex-direction:row;gap:8px}
}

/* ---------- 資源頁 ---------- */
.tabs div{grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs button{padding-inline:2px}
.rescard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.rescard b{display:block;color:var(--ink);font-size:1.05rem;line-height:1.4;overflow-wrap:anywhere}

.rtels .addr{font-size:.9rem;color:var(--muted)}

一次口水"],["坐直練","不要躺著練"]]},"units":[{"title":"認識 PAC 急性後期照護","desc":"什麼是 PAC、誰可以參加、照護多久","body":[{"t":"h","x":"什麼是急性後期照護"},{"t":"p","x":"中風的急性治療結束、病情穩定之後，有一段身體功能恢復比較快的時間。健保的「急性後期整合照護計畫」簡稱 PAC，就是在這段時間由跨專業團隊安排密集復健，幫助病人恢復生活自理能力，順利回家。"},{"t":"fig","id":"journey"},{"t":"h","x":"誰可以參加"},{"t":"p","x":"是否適合參加，由醫療團隊評估。主要條件如下："},{"t":"ul","x":["急性腦中風發病後 1 個月內。特殊情況可放寬到 40 天內。","中風後有中度到中重度的功能障礙。","病情已經穩定 72 小時以上。","有復健潛能：能配合學習、在支撐下可以坐滿 1 小時、願意主動參與復健。"]},{"t":"h","x":"照護多久"},{"t":"p","x":"原則上是 3–6 週。團隊評估後如果還有需要，可以延長一次，最長到 12 週。期間每 3 週評估一次進步情形。"},{"t":"fig","id":"weeks"},{"t":"h","x":"三種照護模式"},{"t":"modes","x":[{"dt":"住院模式","dd":"住在醫院接受復健。高強度每天治療 3–5 次，一般強度每天 1–2 次。"},{"dt":"日間照護模式","dd":"白天到醫院復健，時間大約是上午 9 點到下午 5 點，每天治療 2–4 次，晚上回家休息。"},{"dt":"居家模式","dd":"沒辦法住院、日間照護或到門診復健的病人，由治療師到家裡治療。每次 30–50 分鐘，每週 1–6 次。"}]},{"t":"p","x":"每家醫院提供的模式不同，請向 PAC 個案管理師確認。"},{"t":"h","x":"什麼時候結束"},{"t":"ul","x":["功能明顯進步，可以回家自己復健。","連續 2 次評估沒有進步。","病情變化，需要先接受其他治療。","已達 12 週上限。"]},{"t":"key","h":"PAC 結束，復健還沒結束","p":"恢復可能持續好幾個月到好幾年。PAC 結束後，可以在門診、社區或家裡繼續練習。功能有變化，或有新的目標時，可以請醫師重新評估，再安排復健。"},{"t":"key","h":"家屬可以做的事","ul":["參加團隊的說明與討論，了解復健目標。","跟著治療師和護理師學照顧技巧。","及早和團隊討論出院後的安排。"]},{"t":"key","h":"復健怎麼開始","ul":["中風後的第一天（24 小時內），不適合做高強度的下床活動。之後由醫療團隊依病情，一步一步安排下床和復健。","由醫師、護理師、治療師等跨專業團隊一起合作的復健，效果比較好。出院後在家復健，也要由專業團隊評估和安排；家人照團隊的計畫陪著練，不是只靠家人自己帶著練。"]}]},{"title":"復健怎麼做","desc":"團隊成員、家屬怎麼幫忙、什麼時候要停下來","body":[{"t":"h","x":"復健團隊在做什麼"},{"t":"ul","x":["物理治療：練習翻身、坐、站、走路和平衡。","職能治療：練習手的動作，以及穿衣、吃飯、上廁所等日常活動。","語言治療：練習說話、理解，以及吞嚥。"]},{"t":"fig","id":"team"},{"t":"p","x":"團隊裡還有醫師、護理師、營養師、藥師、心理師和社工師，有問題都可以提出來。"},{"t":"h","x":"病房裡的每一刻都是復健"},{"t":"p","x":"治療師教的動作，要用在每天的生活裡。病人自己做得到的事，例如洗臉、穿衣、吃飯，請讓他自己做。家屬在旁邊看著、必要時協助，不要全部代勞。"},{"t":"h","x":"保護無力的那一側"},{"t":"ul","x":["扶病人起身或移動時，不要拉無力那一側的手臂，以免肩膀受傷。","躺著或坐著時，用枕頭把無力的手臂托好。","長時間臥床時，大約每 2 小時協助翻身一次。"]},{"t":"fig","id":"arm"},{"t":"weak"},{"t":"key","h":"肩膀痛要說出來","ul":["中風後肩膀痛很常見。肩膀痛、肩膀有凹陷（半脫位）或很緊時，請醫師和治療師評估。","擺位用具或吊帶可以支撐肩膀，避免凹陷變嚴重；打針、電刺激等方法可以幫助減輕肩膀痛。適不適合，請問醫療團隊。","出院前，請治療師教家屬怎麼擺放和活動無力的肩膀，並實際做給治療師看。"]},{"t":"warn","h":"出現這些情形，請先停下來並告訴醫護人員","ul":["頭暈、臉色蒼白、冒冷汗","胸悶、呼吸很喘","突然劇烈頭痛","手腳比平常更無力，或說話突然變得不清楚"]},{"t":"key","h":"進步有快有慢","p":"每個人恢復的速度不同。團隊每 3 週會評估一次，並依結果調整復健內容。練習的次數和強度要足夠才有效果，由治療師依病人的狀況安排。"}]},{"title":"吞嚥與飲食安全","desc":"嗆咳的警訊、安全進食的方法","body":[{"t":"h","x":"為什麼要注意吞嚥"},{"t":"p","x":"中風後常見吞嚥變差。食物或水如果嗆進氣管，可能造成吸入性肺炎。有些病人嗆到時不會咳嗽，所以要靠家屬一起觀察。"},{"t":"warn","h":"吞嚥有問題的警訊","ul":["吃東西或喝水時咳嗽、嗆到","吃完後聲音變得濕濕的、有痰音","食物含在嘴裡吞不下去，或從嘴角流出來","吃一餐要花很久的時間","反覆發燒、痰變多"],"p":"出現這些情形，請告訴護理師或語言治療師。"},{"t":"key","h":"先做吞嚥評估","ul":["中風後第一次吃東西、喝水或吃藥之前，要先做吞嚥評估。","懷疑有吞嚥問題時，醫師可能安排吞嚥攝影或內視鏡檢查，看看有沒有嗆進氣管，並找出最安全的食物種類。","藥丸吞不下去時，不要自己磨碎或想其他辦法，先問醫護人員或藥師。","吞嚥不好的人容易吃太少、體重下降，請營養師一起評估。"]},{"t":"h","x":"安全進食的方法"},{"t":"fig","id":"eat"},{"t":"ul","x":["病人完全清醒時才進食。","坐直再吃，姿勢依語言治療師教的方式調整。","小口慢慢吃，確定吞乾淨了再吃下一口。","餵食時，食物從有力的那一側放進嘴裡。","語言治療師如果有教「吞完再空吞一次」（嘴裡沒有食物，再吞一次口水），就照著做。","吃飯時專心，不邊吃邊說話。","吃完後至少坐 30 分鐘再躺下。","餐後清潔口腔，並檢查無力那一側的臉頰內有沒有食物殘留。"]},{"t":"fig","id":"after"},{"t":"warn","h":"吃東西嗆到時怎麼辦","ul":["還能咳嗽、說話時：立刻停止餵食，讓病人身體往前傾，鼓勵他自己用力咳嗽。這時不要拍背，也不要繼續餵。","咳不出聲音、不能說話、不能呼吸，或嘴唇發紫：立刻撥 119，並輪流拍背 5 下、壓肚子 5 下（哈姆立克法），直到東西吐出來或救護人員到達。","病人叫不醒時，開始 CPR，並照 119 人員的指示做。","建議家屬和看護去上 CPR 和哈姆立克法的課程。","嗆到後幾天內如果發燒、一直咳嗽或呼吸很喘，請盡快就醫，可能是吸入性肺炎。","平穩之後，請語言治療師重新評估。"]},{"t":"h","x":"食物的軟硬與濃稠度"},{"t":"p","x":"食物要切多細、水要不要加增稠劑，請依語言治療師和營養師的建議，不要自己更改。"},{"t":"key","h":"使用鼻胃管的病人","ul":["灌食前先確認管子的位置和刻度。","灌食時把床頭抬高 30–45 度。","灌食後維持同樣姿勢至少 30 分鐘到 1 小時。"],"figBottom":"angle"},{"t":"h","x":"吞嚥練習"},{"t":"fig","id":"swallowex"},{"t":"p","x":"吞嚥練習要先經過語言治療師評估，再照計畫做。下面是常見的練習，做哪些、做幾次，請先問語言治療師。"},{"t":"ul","x":["坐直或半坐著練習，不要躺著練。","臉頰：鼓起臉頰、嘟嘴、張嘴。","舌頭：往外伸、左右擺、往上抬。","空吞：嘴裡沒有食物，吞一次口水。口水很多、常常嗆到口水的人，先問語言治療師。","動作輕、慢，不要憋氣用力；累了就停。","練習時嗆咳、呼吸很喘或臉色改變：馬上停下來，並告訴醫護人員。"]},{"t":"key","h":"這些食物要先小心","ul":["清水和稀的湯最容易嗆到。","乾的飯粒、堅果、菜葉、碎屑多的食物，也容易嗆到或卡住。","稀飯、湯泡飯這類湯和顆粒混在一起的食物，以及湯圓、麻糬、年糕等黏的食物，也很容易嗆到或噎住。","這些能不能吃、要怎麼調整，例如加增稠劑或打成泥，照語言治療師和營養師的建議。","不要強迫餵、不要催促，也不要讓病人大口喝水。"]},{"t":"warn","h":"吞嚥要經過評估","ul":["不能只看吃了幾口沒事，就覺得吞嚥安全。","吃喝後聲音變得濕濕的、有咕嚕聲或變啞，吃完常常胸悶、呼吸變快，或不明原因發燒，都要告訴醫護人員。"]}]},{"title":"預防跌倒","desc":"下床三步驟、病房與居家的安全重點","body":[{"t":"h","x":"中風後為什麼容易跌倒"},{"t":"p","x":"一側手腳無力、平衡變差、頭暈、急著上廁所，都會增加跌倒的機會。跌倒可能造成骨折或頭部受傷，讓復健中斷。"},{"t":"key","h":"下床三步驟","figTop":"steps","ul":["先在床上坐起來，坐 30 秒。","把腳放下，在床邊再坐 30 秒。","站起來，站穩 30 秒，沒有頭暈再開始走。"]},{"t":"h","x":"住院期間"},{"t":"ul","x":["下床和上廁所都要有人陪。需要幫忙請按呼叫鈴，不要勉強自己來。","床欄拉起，床的高度調到最低，床輪固定。","常用的物品放在有力那一側、伸手拿得到的地方。","穿合腳的防滑鞋，不穿拖鞋。褲子不要太長。","地板濕了請通知工作人員。"]},{"t":"h","x":"坐輪椅與移位"},{"t":"ul","x":["上下輪椅前，先把兩邊的煞車固定，腳踏板收起來。","移位的方法請照治療師教的步驟做。"]},{"t":"h","x":"回家以後"},{"t":"ul","x":["浴室和馬桶旁加裝扶手，地上鋪防滑墊。","走道上的雜物、電線、小地毯收起來。","晚上留一盞小燈。"]},{"t":"key","h":"防跌計畫","ul":["請治療師評估跌倒的風險，並依結果訂防跌計畫。","回家後，每年至少請醫療團隊再評估一次；最近有跌倒或差點跌倒，要提早告訴團隊。","平衡運動可以減少跌倒。可以問治療師是否適合練太極拳，或「邊走路邊做簡單的事」的練習，例如邊走邊數數字；先在治療師指導下練。","中風後少活動，骨頭容易變得疏鬆，跌倒時更容易骨折。可以問醫師是否需要評估骨折的風險。","適合的拐杖、助行器或足踝支架可以幫助平衡、減少跌倒，請治療師評估並調整好再使用。"]},{"t":"fig","id":"safe"},{"t":"warn","h":"萬一跌倒了","ul":["不要急著把病人拉起來，先看他是否清醒、哪裡痛。","住院中請立刻按呼叫鈴。","在家如果撞到頭、痛到不能動，或意識不清楚，請撥 119。"]}]},{"title":"預防再次中風","desc":"按時服藥、量血壓、認識再中風警訊","body":[{"t":"h","x":"中風過的人，要預防再發生"},{"t":"p","x":"中風過的人，再次中風的機會比一般人高。把血壓、血糖、血脂控制好，可以降低機會。"},{"t":"fig","id":"three"},{"t":"h","x":"按時服藥"},{"t":"ul","x":["預防血栓的藥，以及控制血壓、血糖、血脂的藥，都要照醫師指示每天服用。","不要因為覺得好多了就自己停藥或減藥。","如果有不容易止住的出血、解黑便或血便，請儘快告訴醫師。","預防血栓的藥，醫師會依中風的原因選擇。有些人中風後一開始會短期同時吃兩種抗血小板藥，之後通常改回一種；什麼時候換，由醫師決定。","有心房顫動的人，醫師通常會開抗凝血藥預防再次中風。吃這類藥的人，要照醫師安排定期抽血，檢查肝和腎的功能。","中風後通常也要控制血脂。有血管硬化問題的人，醫師可能把壞的膽固醇（LDL）目標訂在 70 mg/dL 以下。"]},{"t":"key","h":"量血壓「722」","figTop":"bp722","ul":["7：連續量 7 天。","2：早上起床後、晚上睡覺前各量一次。","2：每次量兩遍。"],"p":"把數字記下來，回診時帶給醫師看。中風後一般建議血壓低於 130/80 mmHg（高的數字低於 130、低的數字低於 80）。血壓要達到目標，但太低又頭暈也不好。每個人的目標請依醫師指示，不要自己調整藥物。量血壓時，量沒有中風影響的那隻手，每次量同一隻手。"},{"t":"h","x":"生活習慣"},{"t":"fig","id":"life"},{"t":"ul","x":["不吸菸，少喝酒。","飲食少油、少糖、少鹽，多吃蔬菜和高纖食物。","依治療師的建議持續活動。","如果覺得心跳不規則、心悸或胸悶，請告訴醫師。","按時回診。","身體可以的話，每週至少 4 次、每次至少 10 分鐘做中等強度的運動，例如快走到有點喘但還能說話。做不到的人，有活動總比完全不動好。開始前，請先問醫師或治療師適合的運動量。","可以參考「地中海飲食」：多吃蔬菜、水果、全穀、豆類、堅果和魚，用橄欖油等植物油取代豬油、奶油，少吃紅肉和加工食品。有吞嚥問題、糖尿病或腎臟病的人，請先問營養師。"]},{"t":"sos"},{"t":"ul","x":["不要自己開車或騎車去醫院。","等救護車時，不要餵病人吃東西、喝水或吃藥。","不要等症狀自己好。","越早到醫院越好：打通血管的治療有時間限制，例如血栓溶解藥一般要在發作後 4.5 小時內使用。所以出現警訊要馬上撥 119，不要等。"]}]},{"title":"情緒與溝通","desc":"中風後的情緒變化、怎麼和病人說話、照顧者的休息","body":[{"t":"h","x":"中風後的情緒變化"},{"t":"p","x":"中風後心情低落、容易哭或發脾氣，是常見的情形，和腦部受傷與生活突然改變都有關係，不是病人不夠堅強。"},{"t":"warn","h":"情緒問題要早點發現","ul":["整天悶悶不樂，對什麼事都沒興趣","常常緊張、擔心、坐立不安","不想復健、不想說話","睡不好或吃不下","常說自己拖累家人"],"p":"中風後憂鬱和焦慮很常見，可能在任何時候出現，不用等到持續很久才說。建議定期做情緒篩檢，例如住院期間、中風後大約 3 個月和 6 個月，以及之後的回診；還沒做過的話，可以主動請醫療團隊評估。說話有困難的人也有適合的評估方法。憂鬱和焦慮可以治療，醫師可能轉介精神科醫師或心理師，用心理治療或藥物。不要自己買藥吃。病人說想死或想傷害自己時，請立刻告訴醫護人員，或撥 1925 安心專線（24 小時）。"},{"t":"key","h":"睡好也是復健","ul":["固定時間睡覺和起床。白天多起來活動，想睡可以小睡一下，但不要睡太久。","睡前少看手機和電視，下午以後不喝咖啡、濃茶。","睡覺時打呼很大聲、呼吸會停一下，或白天一直很想睡，可能是睡眠呼吸中止，請告訴醫師。","晚上一直睡不著、常常焦慮或心情低落，請告訴醫師。不要自己長期吃安眠藥或鎮靜的藥，也不要喝酒幫助睡眠。"]},{"t":"key","h":"中風後容易累","p":"中風後很容易累，休息了也不太會好，這叫中風後疲勞，很常見。請告訴醫療團隊，有方法可以改善疲累和睡眠。不要自己買提神或改善疲勞的藥。"},{"t":"h","x":"和說話有困難的病人溝通"},{"t":"fig","id":"talk"},{"t":"ul","x":["面對面說話，速度放慢，句子短一點。","一次只說一件事。","多用可以回答「是」或「不是」的問題。","搭配手勢、圖片或實物。","給病人時間回答，不要急著替他說完。","用對大人說話的方式，不要當成小孩。","病人好像聽不清楚時，請安排聽力檢查。說話很困難的人，語言治療師可以教家人溝通技巧，也可以用溝通板、圖卡或平板等輔助方式。"]},{"t":"key","h":"說話練習一步一步來","ul":["說話練習要依問題不同來練，練什麼、怎麼練，先照語言治療師的建議。","如果治療師建議這樣練：先練簡單的單字，例如「好」「水」；再練說出常用東西的名字，例如杯子、湯匙；最後練短句，例如「我要喝水」。","也可以先練聽懂簡單的指令，例如「舉手」「張嘴」，說的時候配合手勢示範，再跟著治療師慢慢說。","說話不清楚的人，治療師可能會教他說慢一點、大聲一點、嘴巴張大一點。","每天練一點。給他時間慢慢說，不要催，也不要一直糾正；說不出來時，可以用手指、用寫的或用圖卡。說對了就鼓勵他。"]},{"t":"h","x":"照顧者也要照顧自己"},{"t":"ul","x":["家人輪流照顧，不要一個人全部承擔。","照顧者要有固定的休息和吃飯時間。","照顧者從住院開始就可以參加衛教和照顧技巧訓練，學完請示範給護理師或治療師看，確定學會。","覺得撐不住、睡不好或心情低落時，可以找護理師或社工師談，也可以請團隊轉介照顧者支持團體。","覺得孤單、很少和人來往時，可以參加病友會或支持團體。性生活的改變、漏尿等不好意思開口的問題也很常見，可以放心問醫師或護理師。"]},{"t":"fig","id":"rest"},{"t":"key","h":"長照專線 1966","p":"撥 1966 可以詢問喘息服務、居家服務等長期照顧資源。"}]},{"title":"出院返家準備","desc":"出院前要學會的事、居家環境、長照資源","body":[{"t":"h","x":"出院前要學會的事"},{"t":"ul","x":["安全地幫病人翻身、上下床和上下輪椅。","餵食或鼻胃管灌食的方法。","每一種藥的作用和服用時間。","在家要繼續做的復健動作。","如果有管路，例如鼻胃管或尿管，要學會照護方法。"]},{"t":"p","x":"沒把握的地方，出院前請護理師或治療師再教一次，並實際操作給他們看。"},{"t":"h","x":"居家環境"},{"t":"ul","x":["床的高度要方便上下，床邊留輪椅可以靠近的空間。","浴室和馬桶旁加裝扶手，地面防滑。","走道保持寬敞，收起雜物和電線。"]},{"t":"fig","id":"safe"},{"t":"h","x":"輔具"},{"t":"fig","id":"devices"},{"t":"p","x":"需要哪一種輔具，例如助行器、輪椅或便盆椅，請先問治療師再準備。輔具補助可以向各縣市長期照顧管理中心詢問。"},{"t":"h","x":"長照資源"},{"t":"p","x":"住院期間就可以請出院準備服務的護理師協助轉介長照評估，也可以自己撥 1966。服務包括居家服務、居家復能、交通接送和喘息服務等。"},{"t":"key","h":"出院後","figTop":"three","ul":["記下回診日期和科別。","按時服藥，每天量血壓。","持續復健，不要中斷。"]},{"t":"key","h":"出院以後","ul":["出院後沒辦法常到醫院時，可以問醫療團隊是否能用視訊回診或視訊復健，或安排治療師到家裡。","中風後不要自己決定重新開車或騎車。有視力、注意力、判斷力或手腳問題的人，要先經過正式的駕駛能力評估，請問醫師怎麼安排。","想回去工作的人，請及早告訴醫療團隊，團隊可以評估能力，並轉介職業重建。","把病人以前喜歡的活動告訴團隊，例如唱歌、園藝、下棋或社團活動，這些也可以成為復健的一部分。","回診時，可以請醫師用「中風後問題檢查表」一起檢查：預防再中風、生活自理、活動、肌肉張力、疼痛、大小便、溝通、情緒、記憶和思考、生活參與、家人關係等，有問題就轉介適合的服務。"]},{"t":"warn","h":"出現這些情形，請立刻就醫","ul":["再中風的警訊：嘴歪、單側手腳無力、說話不清楚，請撥 119","發燒、咳嗽、痰變多","意識不清楚，或叫不太醒","跌倒受傷","抽搐"]}]},{"title":"居家運動","desc":"回家後怎麼持續運動、怎麼保護肩膀、什麼時候要停","body":[{"t":"h","x":"回家後為什麼還要運動"},{"t":"p","x":"中風後的功能恢復需要持續練習。回家後如果都不動，肌肉會變弱、關節會變緊，也比較容易跌倒。每天固定運動，才能維持復健的成果。"},{"t":"key","h":"開始運動之前","ul":["運動的種類和次數，請照治療師為病人設計的方式做。","選精神好的時候，不要剛吃飽就運動。","旁邊要有人看著，周圍不要有雜物。","有量血壓的，先量一次。血壓比平常高很多，或身體不舒服時，先不要運動，並告訴醫護人員。"]},{"t":"h","x":"躺在床上可以做的運動"},{"t":"fig","id":"exer1"},{"t":"ul","x":["抬臀：躺著，兩腳彎曲平踩在床上，慢慢把屁股抬起來，停幾秒再放下。不要憋氣；無力的腳如果會往旁邊倒，請家人扶住膝蓋。","雙手上舉：兩手手指交握，用有力的手帶著無力的手慢慢往上舉，先舉到肩膀的高度就好。想舉得更高，請先問治療師。","腳踝運動：腳掌往上勾、再往下踩，可以幫助血液循環。"]},{"t":"weak"},{"t":"h","x":"坐著和站著的運動"},{"t":"fig","id":"exer2"},{"t":"ul","x":["坐到站：坐在穩固、有扶手的椅子上，兩腳平踩、稍微往後收，身體往前傾再站起來，然後慢慢坐下。家人站在無力的那一側保護。","重心轉移：坐著時，身體慢慢往左、往右移動，練習平衡。","走路：一定要有人陪，陪的人站在無力那一側的稍後方。照治療師建議使用輔具，再慢慢增加走路的時間。"]},{"t":"h","x":"扶著站的四個運動"},{"t":"fig","id":"standex"},{"t":"key","h":"先問治療師","p":"這四個運動適合已經可以扶著站穩的人。要不要做、做幾次，先問治療師。下面的次數只是參考，可以從少一點開始。做的時候如果胸痛、頭暈、很喘，馬上停下來坐著休息。"},{"t":"ul","x":["用有力的手扶穩桌子或扶手；無力的手如果能放在桌上就放好，不要讓它垂著或被拉扯。站的地方要平穩、穿防滑的鞋，身後放一張椅子，累了可以直接坐下。","弓步：有力的腳往前跨一小步，無力的腳留在後面，腳跟踩平、膝蓋伸直但不要鎖死。前腳膝蓋微彎，身體慢慢往前，停約 5 秒，再慢慢回來，把腳收回兩腳站穩。可做 8–10 次。後腳的膝蓋如果會軟掉，先不要做。","踮腳跟：雙腳一起慢慢踮起腳跟，再慢慢放下，身體不要往前倒。8 次為一組，做 2 組。","轉身：雙腳站穩不動，上半身慢慢轉向左邊，再慢慢轉向右邊，只轉到舒服的地方。頭跟著身體慢慢轉，覺得頭暈就停。每邊 10 次，做 2 組。","抬膝蓋：無力的腳慢慢抬起膝蓋，再慢慢放下。身體保持直立，不要往旁邊歪。8–12 次為一組，做 2 組。不要抬太高；站不穩時，改坐在椅子上抬。","全程不要憋氣。家人站在無力的那一側保護。"]},{"t":"key","h":"保護無力那一側的肩膀","ul":["扶病人起身、翻身、移位或穿衣服時，不要拉無力的手臂。","坐著時，把無力的手放在扶手、桌面或枕頭上撐好。","不要用掛在高處的拉繩或滑輪拉手臂練習。","手舉高時會痛，就先停下來，並告訴治療師。"]},{"t":"warn","h":"出現這些情形，請立刻停止運動","ul":["胸痛、胸悶、呼吸很喘：先停下來休息，幾分鐘後沒有好轉，請撥 119","頭暈、冒冷汗、臉色蒼白","關節或肌肉劇烈疼痛","突然劇烈頭痛、看不清楚，或跌倒撞到頭：請撥 119","手腳突然更無力、嘴歪或說話不清楚：可能是再次中風，請立刻撥 119"]},{"t":"key","h":"每天練，而且要練夠","p":"每天固定時間運動。練習的次數和強度要足夠才有效果，由治療師依病人的狀況安排，並慢慢增加；一天可以分成幾段練，中間休息。可以在「清單」勾選今天有沒有運動。"},{"t":"key","h":"運動要全面","ul":["居家運動要包括讓心跳加快的有氧運動，例如走路、踩固定式腳踏車，以及肌力運動。兩隻腳都要練，不只練有力的那一隻。","PAC 結束後，可以問治療師是否適合參加社區的運動班。"]}]},{"title":"輔具使用","desc":"拐杖、助行器、上下樓梯、輪椅與居家輔具","body":[{"t":"h","x":"先評估，再選輔具"},{"t":"p","x":"輔具要依病人的能力來選。請先讓治療師或輔具中心評估，再購買或租用。臺北市的輔具中心可以評估、借用二手輔具，長照和身心障礙也有輔具補助。"},{"t":"golink","x":"查看臺北市輔具中心與補助","tab":"res","rescat":"clothing"},{"t":"h","x":"拐杖與助行器"},{"t":"fig","id":"cane"},{"t":"weak"},{"t":"ul","x":["拐杖要拿在有力的那一側手上。","走路時，拐杖和無力的腳一起往前，再跨出有力的腳。","使用助行器時，先把助行器往前放穩，無力的腳先走進去，再跨有力的腳。不要推著走。有輪子的助行器，請照治療師教的方法使用。","定期檢查拐杖和助行器底部的橡膠墊，磨損了就要換。"]},{"t":"h","x":"上下樓梯"},{"t":"fig","id":"stairs"},{"t":"ul","x":["上樓：有力的腳先上，無力的腳再跟上。","下樓：無力的腳先下，有力的腳再跟下。","用有力的手扶著扶手，拐杖可以請家人幫忙拿。","家人站在無力的那一側：上樓時站在病人後面低一階，下樓時站在病人前面低一階。","沒有扶手的樓梯，請先讓治療師教過再走。"]},{"t":"h","x":"輪椅"},{"t":"ul","x":["上下輪椅前，兩邊的煞車都要拉好，腳踏板收起來。","坐的時候屁股要坐到底，背靠好，無力的手放在扶手或桌板上。","長時間坐輪椅的人，可以用減壓坐墊，並照治療師教的方法定時改變姿勢，預防壓傷。"]},{"t":"h","x":"居家輔具"},{"t":"fig","id":"homeaids"},{"t":"ul","x":["洗澡椅：坐著洗澡比較安全，椅腳要有防滑墊。先用有力那一側的手試水溫，避免燙傷。","便盆椅：晚上可以放在床邊，減少走到廁所的距離。","足踝支架：照治療師的指示穿戴，每天檢查皮膚有沒有發紅或破皮。","氣墊床：長時間臥床的病人可以使用，但還是要大約每 2 小時翻身一次。","腳尖下垂、走路容易拖地的人，足踝支架或治療師使用的電刺激，可以幫助走路和平衡；適不適合，請治療師評估。"]},{"t":"key","h":"走路訓練用的綁帶","ul":["有些治療會用綁帶幫忙穩住身體或腳踝，要由治療師決定是否使用，並教過怎麼穿。","綁帶不是防跌的安全帶，練習時還是要有人在旁邊保護。","鬆緊要能放進 1 到 2 根手指，避免勒到皮膚和血管。","練完就解開；疼痛、手腳發麻、皮膚發紅或肌肉變得很緊，就馬上取下。","感覺不好的人可能不會喊痛，家人要看皮膚有沒有壓紅。綁帶不能用來把病人綁在床上或椅子上，睡覺和沒人看著時不要穿。"]},{"t":"warn","h":"使用輔具時，有這些情形請找治療師或輔具中心","ul":["輔具鬆動、損壞或高度不合適：先停止使用，修好或調整後再用。","使用後皮膚發紅或破皮：先停止穿戴，並詢問治療師。","用了輔具還是常常差點跌倒：不要自己停用輔具。走路時要有人在旁邊扶著，並請治療師重新評估。"]}]},{"title":"生活用品變復健工具","desc":"用毛巾、杯子、曬衣夾、椅子在家練習，以及用家裡東西維護安全","body":[{"t":"h","x":"家裡的東西也能幫忙復健"},{"t":"p","x":"不一定要買器材。毛巾、杯子、曬衣夾、穩固的椅子這些家裡現成的東西，都可以拿來練習。每天在生活中多用、多練，比偶爾練很久更有效。"},{"t":"key","h":"開始之前","ul":["先把想練的項目告訴治療師，請治療師確認適不適合、要練幾次。","做手部和說話練習時，病人要坐穩，坐在有靠背、有扶手的椅子上。","旁邊要有人陪，練習時不要催促病人。","會痛就停下來，不要勉強。"]},{"t":"h","x":"手和手臂"},{"t":"fig","id":"handtools"},{"t":"weak"},{"t":"ul","x":["毛巾擦桌子：坐在桌前，兩手壓在毛巾上，慢慢往前推、再拉回來，也可以畫圓。有力的手可以帶著無力的手一起動。","曬衣夾：用無力的手的拇指和食指捏開曬衣夾，夾在杯緣或紙盒邊，再拿下來。","撿東西放進杯子：用手指撿起大顆的積木或鈕扣，放進杯子裡。練習時旁邊一定要有人看著。有吞嚥問題、記性或判斷力變差的人，不要用豆子這類吃的東西，改用大積木。","翻撲克牌或翻書頁：練習手指的細小動作。","擰毛巾：在臉盆上方，雙手一起把濕毛巾擰乾，水不要太燙，地上的水要擦乾。手指很緊、張不開的人，先問治療師。"]},{"t":"h","x":"坐站與平衡"},{"t":"fig","id":"balancetools"},{"t":"ul","x":["坐到站：用穩固、不會滑動、有扶手的椅子練習，椅子可以靠牆放。不要用有輪子或會旋轉的椅子。家人站在無力的那一側，扶著腰部，不要拉無力的手臂。","扶著流理台或穩固的桌子站：先關掉爐火、收好刀子。雙手扶穩，無力的手扶不住時，請家人幫忙放好。練習站一下，再慢慢把身體的重量移到左腳、再移到右腳。家人站在無力的那一側保護。","不要扶會滑動或不穩的東西，例如推車、曬衣架或椅背。"]},{"t":"h","x":"說話、臉部和頭腦"},{"t":"fig","id":"mindtools"},{"t":"ul","x":["照鏡子做表情：對著鏡子練習微笑、嘟嘴、鼓起臉頰，看看兩邊是否一樣。","說出物品名稱：拿起杯子、湯匙、毛巾，請病人說出名字和用途。","看月曆、唸報紙：每天一起看日期，唸新聞標題或廣告上的大字。常常漏看某一邊的人，可以在那一邊畫一條有顏色的線，提醒從那裡開始讀。","做家事：摺毛巾、把襪子配對，這些都是很好的練習。","記性、注意力或判斷力變差，或常常忽略某一邊的人，可以請職能治療師或語言治療師安排專門的訓練。家裡的練習是輔助，不能取代治療師的訓練。"]},{"t":"p","x":"有吞嚥問題的病人，用吸管喝水或練習吹氣之前，請先問語言治療師。"},{"t":"h","x":"用家裡的東西維護安全"},{"t":"fig","id":"safetools"},{"t":"ul","x":["小鈴鐺或哨子：放在有力的那一側、病人看得到的地方，需要幫忙時可以叫人。","手機：設定緊急聯絡人，把常用電話寫成大字貼在旁邊。","有顏色的膠帶：貼在門檻、台階邊緣和電燈開關，比較看得清楚。","小夜燈：放在床到廁所的路上。","洗澡前試水溫：用有力那一側的手試，或用溫度計，避免燙傷。","常用的東西放在病人看得到、伸手拿得到的地方，不要放太高或太低。治療師如果要求把某些東西放在無力的那一側練習，請照治療師的安排。"]},{"t":"warn","h":"練習時要注意","ul":["鈕扣、積木、硬幣這類小東西練完要收好，不要留在病人身邊，避免誤吞。","用穩固的東西練習，不要用會滑、會滾或容易倒的東西。","不要用裝水的寶特瓶當啞鈴舉手臂，以免拉傷無力那一側的肩膀，除非治療師同意。","出現胸痛、呼吸很喘、冒冷汗，或突然嘴歪、手舉不起來、說話不清楚：立刻停止，撥 119，並記下發生的時間。","只是頭暈：先坐下或躺下休息，沒有好轉再聯絡醫護人員。"]}]},{"title":"擺位與翻身","desc":"躺和坐的正確姿勢、翻身四步驟、常見錯誤","body":[{"t":"h","x":"擺位也是治療的一部分"},{"t":"p","x":"中風後躺著或坐著的姿勢，會影響肩膀、關節和皮膚。正確的擺位可以保護無力的肩膀，預防關節變緊、腳掌下垂和壓傷。擺位不只是為了舒服，也是治療的一部分。"},{"t":"fig","id":"posture"},{"t":"weak"},{"t":"key","h":"躺向無力的那一側","ul":["從背後托住肩胛骨，把無力的肩膀輕輕帶到前面，不要拉手臂，也不要壓在身體下面。","無力的手往前伸，手肘伸直、手心朝上，放在床上或枕頭上。","無力的腳在下面，稍微彎曲。","背後用枕頭撐住，避免身體往後倒。","有力的腳往前彎曲，放在枕頭上。","這個姿勢讓無力的那一側有感覺刺激。肩膀如果會痛，請調整姿勢並告訴治療師。"]},{"t":"key","h":"躺向有力的那一側","ul":["無力的手往前伸，放在胸前的枕頭上。","無力的腳彎曲往前，放在枕頭上，不要懸空。","背後可以墊枕頭，避免身體往後倒。"]},{"t":"key","h":"平躺","ul":["無力的肩膀下面墊薄枕頭，手臂稍微離開身體，手肘伸直，放在枕頭上。","無力那一側的屁股下面可以墊小枕頭，避免腳往外倒。","膝蓋下面不要長時間墊高；可以在小腿下面墊枕頭，讓腳跟懸空、不碰到床。","被子不要壓住腳尖。","平躺的時間不要太久，要和側躺輪流。"]},{"t":"key","h":"坐在床上","ul":["坐在床上只適合短時間。不要半躺半坐，容易往下滑、壓傷屁股；能下床時，改坐有扶手的椅子。","背後用枕頭撐穩，身體坐正，不要歪向一邊。","前面放餐桌板，兩手都放在桌板上。","坐的時間依治療師建議慢慢增加。","頭暈就讓病人躺平，並告訴醫護人員。"]},{"t":"key","h":"預防關節變緊","ul":["躺著時，治療師可能建議穿休息用的足踝支架，預防腳踝變緊。","無力的手臂可以在不痛的範圍內，稍微往外打開、往外轉（手心朝上），手肘伸直擺放。","要不要用、怎麼擺，照治療師的指導。"]},{"t":"h","x":"翻身的四個步驟"},{"t":"fig","id":"turning"},{"t":"ul","x":["翻身前先把無力的手臂放好，不要壓在身體下面；翻完再檢查手的位置。","托住肩膀和屁股一起翻，把身體抬起來移動，不要拖，也不要拉無力的手臂。","側躺後，身體稍微往後靠，背後和腰部用枕頭墊滿空隙，不要讓身體懸空、扭著睡。","兩腿之間夾一個枕頭，腳跟、腳踝和膝蓋內側不要互相壓到。"]},{"t":"p","x":"大約每 2 小時翻身一次，實際間隔依護理師評估。翻身後檢查骨頭突出的地方，例如屁股、腳跟和腳踝，看看皮膚有沒有發紅。發紅的地方不要按摩。皮膚要保持清潔、乾爽，太乾可以擦乳液；尿布濕了或大便後要馬上清洗、更換。吃得夠、有足夠的蛋白質，也能幫助預防壓傷；有腎臟病或飲食限制的人，吃多少請問營養師。"},{"t":"h","x":"這些錯誤不要做"},{"t":"fig","id":"donts"},{"t":"warn","h":"家屬和看護常見的錯誤","ul":["不要拉無力的手臂。","膝蓋下面不要長時間墊硬的或很高的枕頭。","被子不要壓住腳尖。","手裡不要塞硬的東西，除非治療師建議。","不要整天只平躺。","不要忽略皮膚：發紅的地方按壓後不會褪色，請告訴護理師。"]}]},{"title":"中風位置與練習順序","desc":"左腦、右腦中風的常見困難，以及一步一步的練習","body":[{"t":"h","x":"中風的位置不同，困難也不同"},{"t":"p","x":"大腦分成左右兩邊。一邊受傷，通常是另一邊的手腳無力。不論是腦梗塞或腦出血，受傷的位置不同，常見的困難也不一樣，但不一定每一項都會出現。病人實際的情形，請問主治醫師或治療師。不論哪一邊中風，都可能容易哭、容易生氣或心情低落，這是中風造成的，請告訴醫護人員。"},{"t":"fig","id":"brain"},{"t":"key","h":"左腦中風：右邊手腳無力","ul":["常見說話或理解困難，例如想說說不出來，或聽不懂別人的話。","計算、讀和寫也可能變差。","和病人說話要慢、句子要短，搭配手勢和圖片。","依治療師的建議，鼓勵病人用右手做日常動作。"]},{"t":"unitlink","x":"看「情緒與溝通」","unit":"u6"},{"t":"key","h":"右腦中風：左邊手腳無力","ul":["可能會忽略左邊，例如只吃盤子右邊的食物，或撞到左邊的門框。","距離和空間感可能變差。","做事可能比較急、比較衝動。","病人可能覺得自己做得到，但實際上需要幫忙，所以更容易跌倒。","下床和走路一定要有人陪；站起來前先扶穩，避免往左邊倒。","提醒病人注意左邊的方法，請照治療師的指導。"]},{"t":"key","h":"腦幹或小腦中風","ul":["腦幹負責呼吸、心跳和吞嚥等重要功能。腦幹中風後常有吞嚥困難，喝水容易嗆到；有些人嗆到了也不會咳。吃東西和喝水的方法，請照語言治療師的評估。","常見頭暈、平衡變差、走路不穩。","可能有吞嚥困難、說話不清楚，或看東西有兩個影子。","腦幹中風可能兩邊都無力，或臉和身體無力的那一邊不一樣。","起身動作要慢，預防跌倒；吞嚥問題請語言治療師評估。"]},{"t":"h","x":"大腦各區負責的事"},{"t":"p","x":"一次中風常常影響好幾個區域，下面只是常見的情形，不一定都會出現。"},{"t":"fig","id":"lobes"},{"t":"ul","x":["額葉：動作、計畫和做決定、個性。受傷時可能無力、做事沒有計畫，或個性改變、比較衝動。","頂葉：感覺和空間判斷。受傷時可能感覺變差、抓不準距離，或忽略某一邊（右邊受傷時比較常見，會忽略左邊）。","顳葉：記憶和聽懂別人說話。受傷時可能記性變差、想不起最近的人和事；左邊受傷時，可能聽不懂別人的話。","枕葉：看東西。受傷時可能兩隻眼睛都看不到同一邊的東西（不是一隻眼睛看不到），或看不清楚。和病人說話、放東西時，先從他看得到的那一邊。","小腦：平衡和協調，請看本頁「腦幹或小腦中風」。"]},{"t":"key","h":"看東西有問題時","p":"看東西缺一邊、有兩個影子或看不清楚時，請安排視力和視野檢查。治療師可以依結果，安排練習轉頭和用眼睛掃視的訓練。"},{"t":"h","x":"不同的血管阻塞，症狀也不同"},{"t":"p","x":"腦部由幾條主要的血管供應血液。哪一條血管阻塞，就會影響它負責的區域，症狀也不一樣。下面是常見的情形，病人實際是哪一條血管，請問主治醫師。"},{"t":"ul","x":["大腦中動脈：最常見。對側的臉和手比腳更無力，也可能感覺變差；左腦常有說話或理解困難，右腦常有忽略一邊的情形。","大腦前動脈：對側的腳比手更無力；也可能變得比較被動、做事提不起勁、反應變慢，或控制不住小便。","大腦後動脈：兩隻眼睛都看不到同一邊（阻塞的對側）的東西；左邊阻塞時，有些人看得到字卻讀不懂。","後腦循環（腦幹、小腦的血管）：可能頭暈、走路不穩、吞嚥困難、聲音沙啞、看東西有兩個影子；有時一邊臉和另一邊身體對冷熱或疼痛的感覺變差，或一邊眼皮稍微下垂。","知道是哪一條血管，可以幫助家屬了解病人的困難，練習重點仍然照治療師的安排。"]},{"t":"h","x":"復健要一步一步來"},{"t":"fig","id":"progress"},{"t":"ul","x":["先坐穩，再練站起來，再練走路。","腳無力的人，先練扶著穩固、不會滑動的椅子站，再練走路，不要自己上下樓梯。","手的練習從大的東西開始，再練小的東西，例如先拿大杯子、大積木，再練扣扣子。手指累了就休息。","練習時不要憋氣，不要用力拉扯關節。疼痛、抽筋、胸悶、頭暈或冒冷汗時就停下來。","照治療師的計畫一步一步練習，不要自己跳過步驟。"]},{"t":"unitlink","x":"看「居家運動」","unit":"u8"}]},{"title":"回家後每天的照護重點","desc":"量血壓血糖、喝水、預防腳的血栓、排痰、吃藥回診、什麼時候要就醫","body":[{"t":"h","x":"回家後，每天都要注意的事"},{"t":"p","x":"出院不代表照護結束。回家後每天量血壓、喝足夠的水、多活動、按時吃藥和回診，可以降低再次中風和其他併發症的機會。"},{"t":"fig","id":"homecare"},{"t":"h","x":"血壓和血糖：穩定最重要"},{"t":"key","h":"每天固定時間量","ul":["早上起床後（上完廁所、吃早餐和吃藥前）和晚上睡覺前，各量一次血壓，並且記下來。","量沒有中風影響的那隻手，每次量同一隻手。","有糖尿病的人，照醫師指示的時間量血糖，並且記下來。","中風後一般建議血壓低於 130/80 mmHg，每個人的目標由醫師決定。","血壓要控制在醫師訂的目標內，但也不是越低越好：量到比平常低很多，又頭暈、快要昏倒，要告訴醫師。","不要自己加藥、減藥或停藥。"]},{"t":"warn","h":"量血壓時遇到這些情形","ul":["血壓 180/120 mmHg 以上（高的數字 180 以上，或低的數字 120 以上），而且頭痛、胸痛、呼吸很喘、看不清楚、說話不清楚、意識混亂，或手腳突然無力：立刻撥 119。","血壓 180/120 mmHg 以上，但沒有不舒服：坐著休息幾分鐘後再量一次。還是這麼高，請當天聯絡醫師或就醫。不要自己多吃降血壓藥。","血壓比醫師給的目標高，但沒有到 180/120：照常吃藥、記下來，回診時告訴醫師。","冒冷汗、發抖、心跳很快、頭暈或意識不清楚，可能是血糖太低：有血糖機就先量。低於 70 mg/dL，而且病人清醒、能安全吞嚥：照醫師或衛教師教的方法吃含糖食物（有吞嚥困難的人照語言治療師建議的稠度），15 分鐘後再量一次。","病人意識不清楚、叫不醒，或吞不好：不要餵任何東西，立刻撥 119。"]},{"t":"unitlink","x":"看「量血壓 722」","unit":"u5"},{"t":"h","x":"少量多次喝水"},{"t":"ul","x":["水分不足時血液會變濃，要喝足夠的水。一次喝一點，一天分很多次喝。","有心臟病、腎臟病，或醫師有限制喝水量的人，照醫師指示的量喝。","有吞嚥困難的人，水要不要加增稠劑、要多稠，照語言治療師的建議。","喝加了增稠劑的水的人，常常不知不覺喝太少，家人要幫忙留意喝了多少。","喝水時坐直，慢慢喝。","尿量變少、尿的顏色很深、嘴唇很乾，可能是水喝不夠，請告訴醫護人員。"]},{"t":"unitlink","x":"看「吞嚥與飲食安全」","unit":"u3"},{"t":"h","x":"預防腳的血栓"},{"t":"p","x":"躺著或坐著不動太久，腳的血液流得慢，容易形成血栓（血塊）。"},{"t":"ul","x":["躺著或久坐時，常常做腳踝運動：腳尖往上勾，再往下踩，慢慢做。無力的腳可以由家人幫忙動。","能下床以後，照治療師的計畫多下床活動。","一般的彈性襪不能預防中風後腳的血栓，不要自己買來穿。住院中行動很不方便的人，醫療團隊可能使用會定時充氣的腿部加壓套來預防血栓，要不要使用由醫療團隊決定。如果醫師因為其他原因要病人穿彈性襪，每天脫下來檢查皮膚有沒有破皮或發紅。"]},{"t":"warn","h":"可能是血栓的警訊","ul":["一隻腳突然腫起來、會痛、發紅或摸起來熱熱的：不要按摩這隻腳，當天就醫，晚上或假日請去急診。","突然胸痛、呼吸很喘或咳出血：立刻撥 119。"]},{"t":"key","h":"大小便的問題","ul":["中風後常有漏尿、急尿、解不出來或便秘，請告訴護理師，並說明中風前的大小便習慣。護理師可能用超音波看膀胱裡有沒有剩下的尿。","有尿管的人，請問醫護人員什麼時候可以拔掉，不要放太久。","漏尿的人，可以照護理師訂的時間定時提醒上廁所；可以問是否適合做骨盆底肌肉運動。"]},{"t":"key","h":"中風後的疼痛","p":"中風那一側如果出現燒灼、刺痛、像冰一樣冷的痛，或輕輕碰到就很痛，可能是中風後的神經痛。請告訴醫師，這種痛有藥物和其他方法可以減輕，不要忍著，也不要自己買止痛藥吃。"},{"t":"h","x":"幫忙把痰咳出來"},{"t":"ul","x":["常常翻身；能坐起來時多坐起來，痰比較容易咳出來。","鼓勵病人深呼吸，再用力咳。","拍背要先請護理師或治療師教過，確認病人適合再做。吃預防血栓的藥、骨質疏鬆、骨折或胸部開過刀的人，先問醫師。","吃飯或灌食後 1 小時內不要拍。手掌拱成杯狀，拍在背部肋骨的地方，避開脊椎和腰部。","痰變多、變黃或變綠、發燒，或吃東西常常嗆到：請就醫。呼吸很喘、嘴唇發紫：立刻撥 119。"]},{"t":"unitlink","x":"看「擺位與翻身」","unit":"u11"},{"t":"h","x":"按時吃藥，按時回診"},{"t":"ul","x":["預防血栓的藥，以及控制血壓、血脂、血糖的藥，就算覺得好了，也不要自己停藥、減藥或換藥。","吃預防血栓的藥時，如果解黑色大便、尿有血、牙齦出血或流鼻血止不住、身上有很多瘀青，請告訴醫師；吐血或解大量血便，立刻撥 119。","要看牙、開刀或做檢查前，先告訴醫師正在吃預防血栓的藥。","回診時，醫師可能會安排抽血（例如血糖、血脂、凝血功能），或做腦部、血管的檢查。","回診時帶著血壓、血糖紀錄和藥袋。","不抽菸，也遠離二手菸；不喝酒，或照醫師建議少量喝。"]},{"t":"h","x":"吃得清淡、均衡"},{"t":"ul","x":["少鹽：少用醬油和沾醬，少吃醃漬食物、加工食品，泡麵的湯不要喝。","少油：少吃油炸食物和肥肉。","每餐要有蛋白質，例如魚、蛋、豆腐、瘦肉。","多吃蔬菜，主食可以換成部分全穀類，例如糙米。","不要自己改用低鈉鹽：腎臟病或吃某些降血壓藥的人可能不適合，先問醫師或營養師。","吃 warfarin（抗凝血藥）的人，深綠色蔬菜每天吃的量要差不多，不要突然多吃或少吃。","有糖尿病或腎臟病的人，照營養師的建議吃；食物的軟硬度，照語言治療師的建議。"]},{"t":"h","x":"心情和安全也要顧"},{"t":"p","x":"情緒穩定、避免跌倒，同樣是回家後很重要的事。"},{"t":"unitlink","x":"看「預防跌倒」","unit":"u4"},{"t":"unitlink","x":"看「情緒與溝通」","unit":"u6"},{"t":"h","x":"什麼時候要立刻撥 119"},{"t":"sos"},{"t":"warn","h":"出現這些情形，也要立刻撥 119","ul":["突然劇烈頭痛。","突然看不清楚，或看東西有兩個影子。","突然頭暈、站不穩或走路不穩。","臉、手或腳突然變得無力或發麻，包括原本就無力的那一側突然變得更無力。","突然意識不清楚、叫不醒，或全身抽搐。","記下最後一次看到病人正常的時間。就算症狀很快消失，也要撥 119。","等救護車時，不要給病人吃東西、喝水或吃藥，也不要自己開車去醫院。"]}]},{"title":"復健的基本觀念","desc":"先評估、肌力分級、平衡、肌肉緊繃、關節活動、走路、儀器治療、練習量","body":[{"t":"h","x":"復健從評估開始"},{"t":"p","x":"PAC 期間，治療團隊會在剛開始、過程中（大約每 3 週一次）和結束前評估病人的能力，依結果訂計畫、調整練習。先評估、再練習，不要只憑感覺自己加練或換動作。"},{"t":"fig","id":"evalflow"},{"t":"h","x":"肌力分成 0 到 5 級"},{"t":"p","x":"治療師常用 0 到 5 級描述肌肉的力量。知道病人在第幾級，比較能理解治療師為什麼這樣安排練習。"},{"t":"key","h":"肌力分級","ul":["0 級：看不到、也摸不到肌肉在用力。","1 級：看得到或摸得到肌肉微微用力，但關節動不了。","2 級：手腳放在床面上可以平平地移動，但抬不起來（對抗不了地心引力）。","3 級：可以自己抬起來，動完整個範圍，但別人輕輕一壓就撐不住。","4 級：抬起來後，別人用一些力量壓，還撐得住，但比正常弱。","5 級：正常的力量。"]},{"t":"p","x":"練習要配合目前的級數。力量很小時，多由治療師或家人協助活動；可以自己動以後，再練習自己動；要不要加阻力或重量，照治療師的安排，不要自己加。級數由治療師評估，家屬不要自己用力壓病人的手腳來測試。治療師也可能用其他方法評估中風後的動作。"},{"t":"h","x":"平衡分成三級"},{"t":"fig","id":"balance3"},{"t":"ul","x":["一級：不用扶，可以自己坐穩或站穩。","二級：自己伸手拿東西、身體往前後左右傾的時候，也不會倒。","三級：被輕輕推一下，也能穩住。","坐和站都分這三級，通常先練坐，再練站。","先穩、再動，最後才練抵抗外力。輕推的練習只由治療師做，家屬不要自己推病人。","防跌倒永遠是第一。"]},{"t":"unitlink","x":"看「預防跌倒」","unit":"u4"},{"t":"h","x":"肌肉很緊時，要慢慢拉"},{"t":"p","x":"中風後，無力的手腳有時會變得很緊、很硬，彎不過來或伸不直，這是肌肉張力太高，醫護人員常叫它「痙攣」。這和抽筋、癲癇發作不一樣。"},{"t":"fig","id":"stretch"},{"t":"ul","x":["拉的時候要慢，拉到有點緊的地方停住一下，再慢慢放鬆。停多久照治療師的建議。","會痛就停，不要用力扳，以免拉傷肌肉或關節。","天冷、緊張、疼痛、便秘或尿道發炎時，肌肉可能更緊。","肌肉突然變得比平常緊很多，請告訴醫護人員。","肌肉很緊，影響穿衣、清潔、擺位或走路時，可以問醫師是否適合打針放鬆肌肉等治療。","副木或貼布不建議用來預防手腕和手指的肌肉張力變高（痙攣），不要自己買來用。手腕已經變緊、彎不動時，治療師可能另外評估是否使用副木；要用時，照治療師的指示。"]},{"t":"h","x":"關節活動：慢、輕、穩"},{"t":"ul","x":["照治療師教的順序活動。常見的做法是從靠近身體的關節開始：肩膀、手肘、手腕、手指。","動作慢、輕、穩，在不痛的範圍內活動，不要硬拉。病人說不出來時，看他的表情：皺眉、縮手、叫出聲或身體變緊，就要停下來。","幫無力的手臂活動時，一手托住手肘，一手托住手腕，不要拉手。","肩膀舉多高照治療師教的；沒有特別說明時，先不要舉超過肩膀。不要用繩子或滑輪把手臂拉高。"]},{"t":"h","x":"走路先練重心"},{"t":"ul","x":["先能站穩，再練跨步。","扶著穩固的桌子或扶手，在有人保護下，練習把身體的重量慢慢移到無力的腳上。膝蓋站不穩或往後頂直時，請治療師教怎麼做。","跨步時，腳跟先著地。","無力的腳走路時如果往外畫圈，請治療師教正確的走法；需要時，照治療師建議使用輔具或足踝支架。","練走路一定要有人陪，站在無力那一側稍微後面的地方。","會走路的人，建議在地面上實際練走路、跨步和平衡；用跑步機或機器練走路並沒有比較好，不需要為了復健特地買跑步機或機器。"]},{"t":"unitlink","x":"看「輔具使用」","unit":"u9"},{"t":"h","x":"儀器治療要對症"},{"t":"p","x":"電療、熱敷、冷敷、超音波等儀器，治療師會依病人的情況和時期選擇，不是每個人都需要。"},{"t":"ul","x":["沒有治療師建議，不要自己買電療器材在家使用；裝心律調節器的人更不能自己用。","中風那一側常常感覺變差，對冷熱不敏感，燙到或凍傷了，病人也可能說不出來。熱敷、電熱毯、暖暖包容易燙傷，冰敷也可能凍傷。要用之前先問治療師。"]},{"t":"h","x":"練習要量力而行"},{"t":"ul","x":["練習的次數和強度要足夠才有效果，由治療師依病人的狀況安排，並慢慢增加。一天可以分成幾段練，中間休息，不要累到喘不過氣。","練完隔天還是很累、很痠痛，或比較沒力氣，表示練太多了，要減量，並告訴治療師。","不要為了快點好而自己加練，照治療師的計畫慢慢增加。","練習時頭暈、胸悶、很喘、冒冷汗，馬上停下來休息，並告訴醫護人員。"]},{"t":"key","h":"復健也是在練大腦","p":"中風是大腦受傷。大腦可以靠反覆練習，重新學會控制動作。所以練習時要專心，反覆做正確的動作，並在安全的情況下，鼓勵病人多用無力的那一側。硬扳手腳不會讓大腦學會。"},{"t":"h","x":"動作練習三步驟：想動、找動、帶動"},{"t":"fig","id":"mindmove"},{"t":"ul","x":["想動：先在心裡想著無力的手腳正在做動作，例如想著手往前伸。想完接著真的練，不要只停在想。","找動：自己試著用力，找找看哪裡能動一點點，例如手指或手腕。","帶動：自己動不了的部分，由治療師或家人托著，帶著做完整個動作，病人同時一起用力。只能托著，不要拉無力的手。","每個步驟做多少、怎麼帶，照治療師教的方法。"]},{"t":"h","x":"手和手臂的練習"},{"t":"fig","id":"handex"},{"t":"ul","x":["抓：握住軟球或捲起來的毛巾。","放：把手指張開，放下手裡的東西。","碰：伸手去碰桌上的杯子或其他目標。手臂沒力時，可以讓手在桌面上滑過去，或有人托著。","抬：前臂放在桌上，手腕往上抬，再慢慢放下。","手指很緊、握拳張不開的人，不要一直練抓握。先慢慢把手指和手腕伸直，多練把手張開，並問治療師適合的練法。"]},{"t":"fig","id":"armex"},{"t":"ul","x":["前伸：坐穩，手往前伸，像要拿前面的東西。","上抬、往旁邊打開：先請治療師教過再做。家人一手托住手肘、一手托住手腕，慢慢帶著做，不要拉手。","沒有治療師說可以，手臂往上或往旁邊都先不要舉超過肩膀；肩膀痛或手發麻就停。","不要自己把有力的手綁起來逼病人用無力的手，這種方法只適合部分病人，要由治療師安排。"]},{"t":"h","x":"腳的練習順序"},{"t":"fig","id":"legsteps"},{"t":"ul","x":["要先坐得穩，再練站。站起來 → 扶著移動重心 → 抬腿 → 跨步，一步一步來，前一步穩了再練下一步。","抬腿時是用一隻腳站，最容易跌倒，一定要扶著固定的扶手或穩固的桌子。","練習時一定要有人陪在無力的那一側，照治療師建議使用助行器或支架。"]},{"t":"unitlink","x":"看「居家運動」","unit":"u8"}]},{"title":"恢復過程與手腳練習","desc":"恢復的時間、為什麼手比較慢、木棒與插棒練習、腳尖下垂","body":[{"t":"h","x":"恢復需要一段時間"},{"t":"fig","id":"timeline"},{"t":"ul","x":["中風後的前 3 個月，通常進步最快，要把握時間練習。","3 到 6 個月：進步通常變慢，但仍然可能進步。","6 到 12 個月：進步更慢，持續練習仍可能改善。","1 年以後：持續練習還是有幫助，可以維持和改善功能。","每個人恢復的速度不一樣，不要和別人比較，照治療師的計畫持續練習。","正式復健結束後，恢復還會繼續。建議定期回診評估，有新的困難或目標時，可以再接受一段復健。"]},{"t":"key","h":"每天穩住三件事","p":"規律吃飯、好好休息、每天練習。吃東西、喝水會嗆或會咳的人，吃喝前先經過語言治療師評估；說話不清楚，也可以請語言治療師幫忙練習。突然說話不清楚或比原本更嚴重，馬上撥 119。"},{"t":"unitlink","x":"看「吞嚥與飲食安全」","unit":"u3"},{"t":"h","x":"為什麼腳先會走，手卻比較慢？"},{"t":"p","x":"走路用的是比較大的動作，手和手指要做細小、精準的動作，所以手通常恢復得比較慢，手指又更慢。這是常見的情形，不代表手沒有希望。"},{"t":"key","h":"不要只練走路","ul":["手不練，就算走得穩，手的細小動作也很難恢復。每天也要練手。","先放鬆：慢慢伸展，讓很緊的肌肉放鬆。","再活動：肩膀、手肘、手腕、手指都要動到。","再出力：練習自己抬手、抓握。","不要硬扳手；休息時把手放在枕頭上撐好，手指自然張開，不要讓手一直垂著或捲著。","手的恢復因人而異。治療師也會教用另一隻手或輔具完成日常生活，兩種都要練。"]},{"t":"unitlink","x":"看「擺位與翻身」","unit":"u11"},{"t":"h","x":"用木棒和插棒練手"},{"t":"fig","id":"stickex"},{"t":"ul","x":["雙手握棒：坐穩，雙手握住木棒，慢慢往前伸，再慢慢收回，也可以左右慢慢移動。家裡可以用擀麵棍或捲起來的毛巾代替。","無力的手也要一起出力，不要只靠有力的手帶動。無力的手握不住時，請家人幫忙扶著。","不要拉扯無力的手臂。肩膀沒力、會痛或肩膀有凹陷時，手先不要舉過肩膀，要舉多高先問治療師。","插棒：先選粗的木棍，比較容易成功。眼睛看著孔，手慢慢靠近，穩住手腕再插進去。家裡可以練把粗吸管放進杯子裡。","次數可以從每組 8 到 12 次、一天 2 組開始，做得穩了再依治療師的建議慢慢增加，量力而行。"]},{"t":"warn","h":"練手時要注意","ul":["肩膀痛、手發麻、頭暈、胸悶或很喘：馬上停下來。","手很緊、痙攣明顯時，先暫停，不要硬練。","不要硬扳手指和手腕，也不要憋氣用力。","全程坐穩，旁邊要有人看著。"]},{"t":"h","x":"腳尖往下垂（垂足）"},{"t":"fig","id":"footdrop"},{"t":"ul","x":["原因：把腳背往上勾的肌肉沒有力，小腿後面的肌肉又常常太緊。","腳尖長時間朝下，腳跟後面的筋會慢慢變短，腳踝變緊，之後更難改善。","走路時腳尖容易拖地，容易絆倒。"]},{"t":"key","h":"怎麼預防","ul":["躺著時被子不要壓住腳尖，擺位照治療師教的方法。","每天活動腳踝，把腳背往上勾；自己做不到時，請家人托住腳跟慢慢幫忙，覺得緊就停住，不要用力壓。腳踝很僵硬或會一直抖動時，先問治療師。","小腿突然腫起來、會痛、發紅或摸起來熱熱的：不要做這個運動，並告訴醫護人員。","照治療師的建議穿足踝支架和包腳、防滑的鞋。脫下支架後看看皮膚，紅了很久沒退要告訴治療師。"]},{"t":"unitlink","x":"看「輔具使用」","unit":"u9"}]}],"daily":["今天的復健課都有參加","自己做得到的事自己做（洗臉、穿衣、吃飯）","吃飯時坐直、小口慢吃，吃完坐 30 分鐘","餐後清潔口腔，檢查有沒有食物殘留","下床前先坐 30 秒、站 30 秒，並有人陪","臥床時約每 2 小時翻身，無力的手臂有枕頭托著","今天的藥都按時吃了","量血壓並記錄","今天有和病人聊天、鼓勵他","照顧者自己有休息和吃飯","今天有照治療師教的方式做居家運動","今天有用家裡的東西練習手部動作","翻身後有檢查屁股、腳跟等骨頭突出處的皮膚","今天有少量多次喝水（醫師有限制喝水量的人，照醫師指示）","躺著或久坐時，有做腳踝運動","今天練習時有中間休息，沒有練到過度疲累","今天除了走路，也有練手"],"ready":["會安全地協助上下床、上下輪椅","會餵食或鼻胃管灌食","知道每種藥的作用和服用時間","會做居家復健動作","已依治療師建議準備輔具","家裡已加裝扶手、鋪防滑墊、收好雜物","已撥 1966 或請護理師轉介長照評估","知道回診日期和科別","知道再中風的警訊和什麼時候要撥 119","家裡有血壓計，並且會記錄","知道拐杖拿哪一側，以及上下樓梯的方法","家裡已準備叫人用的小鈴鐺，門檻已貼上有顏色的膠帶","會正確擺位，也會協助翻身","知道腳的血栓警訊，以及回診時要帶血壓、血糖紀錄和藥袋","知道病人目前的肌力和平衡程度，以及治療師建議的練習量"],"quiz":[{"q":"中風病情穩定後，及早開始復健，比較有機會恢復功能。","why":"病情穩定後的這段時間恢復較快，PAC 就是在這段時間安排密集復健。"},{"q":"為了讓病人多休息，穿衣、吃飯最好都由家屬代勞。","why":"病人自己做得到的事請讓他自己做，這也是復健的一部分。家屬在旁邊看著、必要時協助就好。"},{"q":"扶病人起身時，不可以拉他無力那一側的手臂。","why":"拉無力那一側的手臂容易讓肩膀受傷。"},{"q":"病人吃飯時偶爾咳一下沒關係，不用告訴醫護人員。","why":"吃東西或喝水時咳嗽是吞嚥有問題的警訊，請告訴護理師或語言治療師。"},{"q":"餵食時，食物要從病人有力的那一側放進嘴裡。","why":"從有力的那一側放入，比較容易咀嚼和吞嚥，也比較不會殘留。"},{"q":"半夜想上廁所，為了不吵醒家屬，病人可以自己慢慢走去。","why":"下床和上廁所都要有人陪。住院中請按呼叫鈴，不要勉強自己來。"},{"q":"血壓穩定、沒有不舒服，就可以自己把藥停掉。","why":"血壓穩定是因為有按時服藥。要不要調整藥物，請由醫師決定。"},{"q":"突然嘴歪、一隻手無力或說話不清楚，先休息觀察半天再說。","why":"這是再中風的警訊。出現任何一項請立刻撥 119，並記下發作時間。"},{"q":"PAC 照護期間，團隊每 3 週會評估一次進步情形。","why":"團隊在收案、每 3 週和結案時都會評估，並依結果調整復健內容。"},{"q":"照顧者也需要休息，可以撥 1966 詢問喘息服務。","why":"照顧是長期的事。1966 長照專線可以詢問喘息服務和居家服務等資源。"},{"q":"拐杖要拿在無力的那一側，才能幫助無力的腳。","why":"拐杖要拿在有力的那一側。走路時，拐杖和無力的腳一起往前。"},{"q":"運動時突然胸痛或頭暈，應該立刻停止運動。","why":"胸痛、頭暈、冒冷汗或呼吸很喘，都要立刻停止運動。休息幾分鐘沒有好轉，或手腳突然更無力，請撥 119。"},{"q":"練習撿鈕扣或積木後，可以把它們留在病人身邊，方便隨時練習。","why":"小東西練完要收好，避免病人誤吞。"},{"q":"幫病人翻身時，可以拉他無力的手臂把身體帶過去。","why":"拉無力的手臂會傷到肩膀。要先托住肩膀和屁股一起翻。"},{"q":"病人吃東西嗆到，但還能咳嗽、說話時，應該用力拍他的背。","why":"還能咳嗽時，要讓病人身體往前傾、自己用力咳嗽，不要拍背。咳不出聲音、不能說話或不能呼吸時，才要撥 119，並輪流拍背和壓肚子。"},{"q":"覺得血壓有點高時，可以自己多吃一顆降血壓藥。","why":"不要自己加藥、減藥或停藥。血壓要達到醫師訂的目標，但也不是越低越好；有問題請問醫師。"},{"q":"病人一隻腳突然腫起來、會痛，應該用力按摩讓它消腫。","why":"這可能是血栓的警訊，不要按摩，請當天就醫。突然胸痛、呼吸很喘時，立刻撥 119。"},{"q":"躺著或久坐時，常常做腳尖上勾、往下踩的腳踝運動，可以幫助預防腳的血栓。","why":"腳踝運動可以讓腳的血液流動，幫助預防血栓。無力的腳可以由家人幫忙動。"},{"q":"病人的手腳肌肉很緊時，用力把它扳直，效果比較好。","why":"用力扳會拉傷肌肉或關節。要慢慢拉，停一下再放鬆，會痛就停。"},{"q":"復健練得越多越好，所以可以自己加倍練習。","why":"練習量和強度要足夠才有效，但要由治療師依病人的狀況安排、慢慢增加。自己突然加倍練，容易太累或受傷。"},{"q":"中風那一側感覺變差時，用熱敷或暖暖包容易燙傷。","why":"感覺變差時對冷熱不敏感，燙到了也可能不知道。要用之前先問治療師。"},{"q":"手指很緊、握拳張不開的人，應該整天用力捏球練習。","why":"手指很緊時，只練用力抓握不一定適合，也不要一次練太久。先慢慢把手指伸直、多練張開，並問治療師適合的練法。"},{"q":"中風後腳已經會走了，手恢復得比較慢，就表示手沒有希望，可以只練走路。","why":"手恢復得比較慢是常見的情形。手不練，細小動作很難恢復，每天也要練手。"},{"q":"病人吃了幾口都沒有嗆到，就表示吞嚥已經安全，不需要評估。","why":"有些人食物或水跑進氣管也不會咳（無聲吸入）。吞嚥是否安全要經過語言治療師評估。"},{"q":"為了預防手腕和手指的肌肉張力變高（痙攣），家屬可以自己買副木或貼布給病人用。","why":"副木或貼布不建議用來預防手腕和手指的肌肉張力變高。要不要用副木、怎麼用，由治療師評估和指導。"}],"res":{"ui":{"tab":"資源","title":"臺北市友善服務","intro":"給中風病人和家屬的食、衣、住、行、醫療、長照與補助資源。點開每一項，可以看申請方式和電話。","searchLabel":"搜尋","searchPh":"輸入關鍵字，例如：送餐、輪椅、松山","catLabel":"類別","catAll":"全部類別","count":"共 {n} 項","none":"找不到符合的服務。請換個關鍵字，或選「全部類別」。","clear":"清除","who":"誰可以用","how":"怎麼申請","phone":"電話","ext":"轉","web":"官方網頁","note":"請注意","zhName":"中文名稱","tip1999":"1999 是臺北市民當家熱線，在臺北市用市話或手機都可以撥。在外縣市請改撥 02-2720-8889。","checked":"資料查證日期：115 年 10 月 14 日。服務內容和金額可能變動，申請前請先打電話確認。","homeCard":"臺北市友善服務","homeCardSub":"送餐、輔具、交通接送、長照、補助"},"cats":{"medical":"醫療","care":"長照","food":"食","clothing":"衣・輔具","housing":"住","transport":"行","money":"經濟補助","caregiver":"照顧者支持"},"order":["medical","care","food","clothing","housing","transport","money","caregiver"],"items":[{"id":"er119","cats":["medical"],"name":"懷疑中風：立刻撥 119","agency":"臺北市政府消防局；衛生福利部","what":"突然嘴歪、單側手腳無力、說話不清楚，要立刻撥 119。救護人員會把病人送到能處理急性中風的醫院。","who":"所有人。","how":"撥 119，說清楚地址、症狀和發作時間。不要自己開車或騎車送醫。想先了解臺北市有哪些急救責任醫院，可以看衛福部公告的名單。","note":"","tels":[{"label":"緊急救護","tel":"119","ext":"","addr":""}],"url":"https://www.mohw.gov.tw/dl-97025-23d029a4-14c2-4ae9-a057-7a32d3885839.html"},{"id":"pac","cats":["medical"],"name":"腦中風急性後期整合照護（PAC）","agency":"衛生福利部中央健康保險署","what":"中風病情穩定後，到合作醫院接受一段時間的密集復健。有住院、日間照護和居家三種模式。","who":"急性中風發作後 1 個月內、有中度到中重度功能障礙、病情穩定且有復健潛能的病人，由醫療團隊評估。","how":"住院時請醫療團隊或出院準備小組評估，並協助轉介。可承作的醫院可以在健保署網站查詢。照護期間原則 3–6 週，最長 12 週。","note":"","tels":[{"label":"健保諮詢服務專線","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-5499-734a5-2898-1.html"},{"id":"catastrophic","cats":["medical","money"],"name":"重大傷病（急性腦血管疾病）","agency":"衛生福利部中央健康保險署","what":"急性中風屬於重大傷病。發作後 1 個月內，和中風有關的就醫免付健保部分負擔。","who":"急性腦血管疾病的病人。效期是發作後 1 個月內。","how":"不用另外申請，由醫師認定。1 個月內轉院時，請原醫院開立寫有確診日期的診斷證明書，帶到下一家醫院。","note":"1 個月後如果還有後遺症，可以另外申請身心障礙證明或長照服務。","tels":[{"label":"健保諮詢服務專線","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-13699-f25bd-2957-1.html"},{"id":"homemed","cats":["medical"],"name":"居家醫療（健保居家醫療照護整合計畫）","agency":"衛生福利部中央健康保險署","what":"醫師、護理師等到家裡看病、開藥和照護，給很難出門就醫的病人。","who":"住在家裡、因失能或疾病很難外出就醫，且醫師評估有醫療需求的人。","how":"問原本看診的醫院或診所有沒有提供居家醫療，也可以請長照管理中心轉介，或打健保諮詢專線。","note":"","tels":[{"label":"健保諮詢服務專線","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-5195-2e804-2875-1.html"},{"id":"disacert","cats":["medical","money"],"name":"身心障礙證明（身心障礙鑑定）","agency":"臺北市政府社會局、衛生局；戶籍地區公所","what":"中風後如果留下長期的功能障礙，可以申請鑑定。拿到身心障礙證明後，才能申請身障補助、復康巴士、停車證等福利。","who":"中風後留下長期功能障礙的人，由指定醫院鑑定。","how":"帶申請書、身分證影本、3 個月內 1 吋照片 3 張和印章，到戶籍地區公所申請，再到指定醫院鑑定。臥床無法出門的人，可以申請到宅鑑定。","note":"什麼時候適合申請，請問主治醫師。","tels":[{"label":"社會局身心障礙者福利科","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=26BB4C5F2992FAFB"},{"id":"ltc1966","cats":["care"],"name":"長照服務專線 1966／臺北市長期照顧管理中心","agency":"衛生福利部；臺北市政府衛生局","what":"申請長照服務的總窗口。申請後，照管專員會到家評估，核定長照等級和可以使用的服務。","who":"住在臺北市、需要別人照顧，且符合其中一項：65 歲以上、55 歲以上原住民、有身心障礙證明、失智症，或 PAC 收案的病人。","how":"撥 1966，或上臺北市長期照顧資訊網申請。住院中可以直接找醫院的出院準備小組。","note":"","tels":[{"label":"長照服務專線","tel":"1966","ext":"","addr":""},{"label":"臺北市長期照顧管理中心","tel":"02-2537-1099","ext":"","addr":"臺北市中山區錦州街233號1樓"},{"label":"松山區健康服務中心（就近詢問）","tel":"02-2767-1757","ext":"","addr":""}],"url":"https://ltc.health.gov.taipei/tplcPublic/"},{"id":"discharge","cats":["care"],"name":"出院準備銜接長照服務","agency":"臺北市政府衛生局；衛生福利部","what":"住院期間，醫院先完成長照評估並安排服務。病人回家後，很快就能開始用居家服務、輔具或交通接送等協助。","who":"住院後生活能力變差、回家需要長照服務的病人。","how":"住院時告訴醫院的出院準備個管師或社工。","note":"","tels":[{"label":"長照服務專線","tel":"1966","ext":"","addr":""}],"url":"https://health.gov.taipei/News_Content.aspx?n=BB5A41BA1E6CA260&sms=72544237BBE4C5F6&s=51A8504C99587CA7"},{"id":"homecare","cats":["care"],"name":"長照居家服務（居服員到家）","agency":"臺北市政府衛生局、社會局；衛生福利部","what":"照顧服務員到家協助洗澡、穿衣、吃飯、吃藥、翻身、上下床和陪同就醫。","who":"經長照管理中心評估，長照需要等級 2 級以上的人。","how":"撥 1966 申請，評估後由個案管理員安排服務單位。","note":"政府補助大部分費用，自付比例依家庭經濟狀況而定，以長照管理中心核定為準。家裡已請外籍看護的，原則上不能使用居家服務；外籍看護返鄉、離境等空窗期，有證明的可以使用。","tels":[{"label":"長照服務專線","tel":"1966","ext":"","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=D46C608F5B4E3D8D"},{"id":"daycare","cats":["care"],"name":"長照日間照顧（日照中心）","agency":"臺北市政府社會局、衛生局","what":"白天把病人送到日照中心，有人照顧，也有午餐、午休和活動，傍晚回家。","who":"長照需要等級 2 級以上，且是 65 歲以上、有身心障礙證明、失智症、55 歲以上原住民，或 PAC 收案的病人。","how":"撥 1966 或上臺北市長期照顧資訊網申請，評估後由個案管理員媒合日照中心。","note":"","tels":[{"label":"長照服務專線","tel":"1966","ext":"","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=3E3C1D86A51BF473"},{"id":"reable","cats":["care"],"name":"長照專業服務（居家復能）","agency":"衛生福利部；臺北市長期照顧管理中心","what":"治療師、護理師或營養師到家，短期教病人自己做日常動作，也教家屬和看護照顧技巧，例如移位、進食和居家安全。","who":"經長照管理中心評估的長照個案。","how":"向 1966 或個案管理員提出。同一個訓練目標原則上 6 個月內完成。","note":"","tels":[{"label":"長照服務專線","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/cp-6451-70123-207.html"},{"id":"respite","cats":["care","caregiver"],"name":"長照喘息服務","agency":"衛生福利部；臺北市長期照顧管理中心","what":"讓照顧的家人或看護休息。可以請照顧服務員到家，或讓病人短暫住進機構、白天去日照中心。","who":"長照需要等級 2–8 級，且家裡有照顧者。已請外籍看護的家庭也可以使用。","how":"撥 1966 申請評估，再由個案管理員安排。","note":"每年可用的額度以長照管理中心核定為準。","tels":[{"label":"長照服務專線","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/np-6454-207.html"},{"id":"meals","cats":["food"],"name":"失能者營養餐飲服務（送餐到家）","agency":"臺北市政府社會局；臺北市長期照顧管理中心","what":"沒辦法自己買飯、煮飯的失能者，可以有人把餐點送到家。低收入戶和中低收入戶的餐費由政府補助。","who":"65 歲以上失能長者、55 歲以上失能原住民、失智症者、失能的身心障礙者，以及 PAC 照護對象。已有人備餐或白天有人照顧的，可能不會核定。","how":"撥 1966 或上臺北市長期照顧資訊網申請，由長照管理中心評估。","note":"一般家庭每餐需要自付多少，請電話詢問。","tels":[{"label":"長照服務專線","tel":"1966","ext":"","addr":""},{"label":"社會局業務聯絡窗口","tel":"1999","ext":"1669、1665","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=8AC319BAED528FB5"},{"id":"dining","cats":["food"],"name":"社區照顧關懷據點（共餐）","agency":"臺北市政府社會局","what":"社區裡的據點，有共餐和健康課程，讓長輩出門和人一起吃飯。","who":"60 歲以上長者。各據點的時間和收費不同。","how":"在社會局網站找住家附近、有供餐的據點，再直接打電話詢問。","note":"行動不便的人能不能參加，請先問據點。","tels":[{"label":"社會局老人福利科","tel":"1999","ext":"6966～6968","addr":""}],"url":"https://dosw.gov.taipei/News_Content.aspx?n=222C9779823FA161&sms=E2A8B6B533500CB0&s=10DED4DB1CD357DC"},{"id":"nutrition","cats":["food"],"name":"臺北市社區營養推廣中心（營養諮詢）","agency":"臺北市政府衛生局","what":"營養師一對一免費諮詢，可以選擇到現場或視訊。適合吃不下、體重一直掉的長輩。","who":"65 歲以上長者。","how":"打預約專線或加官方 LINE 預約。","note":"吞嚥困難的飲食問題，請先問醫院的語言治療師或營養師。","tels":[{"label":"營養諮詢預約專線","tel":"02-2303-1297","ext":"","addr":""}],"url":"https://health.gov.taipei/cp.aspx?n=DB71E3DF2CB595C4&s=CB031B7D0A1607E9"},{"id":"aidcenter","cats":["clothing"],"name":"臺北市輔具中心","agency":"臺北市政府社會局（委託民間單位辦理）","what":"提供輔具諮詢、評估、維修和二手輔具短期借用，也受理輔具補助申請。","who":"住在臺北市的身心障礙者、有長照資格的人和家屬。","how":"先打電話預約評估或借用，再帶證件到中心。","note":"各中心開放時間不同，出發前請先打電話確認。","tels":[{"label":"西區輔具中心","tel":"02-2523-7902","ext":"","addr":"臺北市中山區長安西路5巷2號"},{"label":"南區輔具中心","tel":"02-2720-7364","ext":"","addr":"臺北市信義區大道路116號3樓之2（廣慈衛福大樓）"},{"label":"合宜輔具中心","tel":"02-7713-7760","ext":"","addr":"臺北市中山區玉門街1號（臺北悠活村）"}],"url":"https://tpap.taipei/app37/cognitionView/index"},{"id":"ltcaids","cats":["clothing","housing"],"name":"長照輔具及居家無障礙環境改善","agency":"衛生福利部；臺北市長期照顧管理中心","what":"長照補助購買或租用輔具，例如輪椅、助行器、氣墊床，也補助裝扶手、斜坡和浴室改善。額度每 3 年給一次。","who":"長照需要等級 2 級以上，且經評估需要輔具的人。已請外籍看護的家庭也可以使用。","how":"撥 1966 申請長照，評估後到輔具中心做輔具評估，再到長照特約廠商購買或租用，只付自付額。","note":"先評估再購買，先買後申請可能不補助。","tels":[{"label":"長照服務專線","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/np-6453-207.html"},{"id":"disaids","cats":["clothing","money"],"name":"身心障礙者輔具費用補助","agency":"衛生福利部社會及家庭署；臺北市政府社會局","what":"有身心障礙證明的人買輔具，可以依品項申請補助。這和長照輔具是不同的制度。","who":"有身心障礙證明，並符合品項規定的人。","how":"向輔具中心或社會局申請。需要評估的品項要先評估、核定後才能買。","note":"和長照輔具能不能同時申請，請問輔具中心。","tels":[{"label":"社會局身心障礙者福利科","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://laws.gov.taipei/law/LawSearch/LawExport/FL002581?type=0"},{"id":"residential","cats":["housing","money"],"name":"住宿式服務機構使用者補助","agency":"衛生福利部；臺北市政府社會局、衛生局","what":"住在長照機構、護理之家或身障住宿機構的人，可以申請住宿費補助。","who":"住在符合資格的機構，且長照需要等級 4 級以上，或有中度以上身心障礙證明的人。","how":"依住的機構種類，向社會局或衛生局申請。可以先打 1966 詢問。","note":"","tels":[{"label":"長照服務專線","tel":"1966","ext":"","addr":""},{"label":"社會局老人福利科（老人福利機構）","tel":"1999","ext":"6966","addr":""},{"label":"社會局身心障礙者福利科（身障住宿機構）","tel":"1999","ext":"6963","addr":""},{"label":"衛生局長期照護科（護理之家、長照機構）","tel":"1999","ext":"1877","addr":""}],"url":"https://1966.gov.tw/LTC/cp-6457-69925-207.html"},{"id":"socialhousing","cats":["housing"],"name":"臺北市社會住宅","agency":"臺北市政府都市發展局；臺北市住宅及都市更新中心","what":"社會住宅招租時，會保留一部分給弱勢家庭，有些社宅也有無障礙住宅。","who":"符合社宅承租資格的家庭。身心障礙者、65 歲以上長者等弱勢家庭，有保留的戶數可以申請。","how":"注意都市發展局或住宅及都市更新中心的招租公告，在受理期間申請，再以公開抽籤決定順序。","note":"每一案保留的戶數和條件不同，以招租公告為準。","tels":[{"label":"臺北市民當家熱線","tel":"1999","ext":"","addr":""}],"url":"https://udd.gov.taipei/"},{"id":"rehabbus","cats":["transport"],"name":"臺北市復康巴士","agency":"臺北市政府交通局公共運輸處","what":"載身心障礙者的無障礙小巴，可以連輪椅一起上車，用來就醫或外出。","who":"有臺北市身心障礙證明、住在臺北市的人。可以有 1 位陪同者。","how":"打預約專線或上網訂車。每天 8:00–17:00 受理，在搭車前 3 到 5 天開放預約。","note":"","tels":[{"label":"預約專線","tel":"0809-080650","ext":"","addr":""},{"label":"語音訂車專線","tel":"0800-065165","ext":"","addr":""}],"url":"https://0809080650.gov.taipei/"},{"id":"ltcride","cats":["transport","care"],"name":"長照交通接送（就醫接送）","agency":"臺北市政府社會局","what":"長照提供的交通車，接送失能者往返家裡和醫院、診所，用於看病或復健。","who":"住在臺北市、長照需要等級 2 級以上的長照對象，包括 PAC 收案的病人。已請外籍看護的家庭也可以申請。","how":"先撥 1966 申請長照。核定後，用網路或 LINE（@taipeicareride）預約，最晚在搭車前一天預約。","note":"","tels":[{"label":"長照服務專線","tel":"1966","ext":"","addr":""}],"url":"https://www.dosw.gov.taipei/cp.aspx?n=1847C5A001C1DC3C"},{"id":"wctaxi","cats":["transport"],"name":"通用計程車（可載輪椅）","agency":"臺北市政府交通局公共運輸處","what":"有斜板或升降設備的計程車，坐輪椅也可以直接上車。","who":"所有人，特別適合坐輪椅的人。","how":"撥叫車專線，接通後按 3，會轉到通用計程車隊。手機請撥 55850。","note":"","tels":[{"label":"免付費叫車專線（市話）","tel":"0800-055850","ext":"","addr":""},{"label":"手機叫車","tel":"55850","ext":"","addr":""}],"url":"https://pto.gov.taipei/cp.aspx?n=00988479A42B11C4"},{"id":"seniortaxi","cats":["transport"],"name":"敬老愛心計程車","agency":"臺北市政府交通局公共運輸處","what":"用臺北市敬老卡或愛心卡搭計程車，每趟可以折抵部分車資。","who":"持有臺北市敬老卡或愛心卡的本人。","how":"撥叫車專線後按 0，說要搭敬老愛心計程車。下車時刷卡付費。手機請撥 55850。","note":"","tels":[{"label":"免付費叫車專線（市話）","tel":"0800-055850","ext":"","addr":""},{"label":"手機叫車","tel":"55850","ext":"","addr":""}],"url":"https://pto.gov.taipei/News.aspx?n=2C4297730779B67A&sms=49DFD0964E3C4294"},{"id":"easycard","cats":["transport"],"name":"敬老卡、愛心卡、愛心陪伴卡","agency":"臺北市政府社會局；各區公所","what":"臺北市發給長者和身心障礙者的乘車優惠卡。身心障礙者的必要陪伴者可以辦陪伴卡。","who":"設籍並住在臺北市的長者或身心障礙者。陪伴卡給第一類、第二類身心障礙者的必要陪伴者 1 人。","how":"帶申請書、照片、身分證或身心障礙證明，到任何一個區公所申請。可以請別人代辦。","note":"","tels":[{"label":"社會局","tel":"1999","ext":"6966～6968","addr":""}],"url":"https://laws.gov.taipei/law/LawSearch/LawExport/FL038239?type=0"},{"id":"parking","cats":["transport"],"name":"身心障礙者專用停車位識別證","agency":"臺北市政府社會局","what":"可以停身障專用停車格的識別證，停車時放在擋風玻璃前。","who":"設籍臺北市、經評估行動不便的身心障礙者。家人也可以代為申請，每人限一張。","how":"到市政府聯合服務中心、上「台北服務通」網站（service.taipei）線上申請，或郵寄申請。","note":"","tels":[{"label":"社會局身心障礙者福利科","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://www.dosw.gov.taipei/cp.aspx?n=411918B6262745BE"},{"id":"disallow","cats":["money"],"name":"身心障礙者生活補助","agency":"臺北市政府社會局；戶籍地區公所","what":"家庭經濟不寬裕的身心障礙者，每月可以領生活補助。","who":"設籍並住在臺北市、有身心障礙證明，且家庭收入和財產在標準以下的人。","how":"帶身分證、申請書和存摺封面影本，到戶籍地區公所社會課申請。","note":"要先有身心障礙證明。收入和財產標準每年調整，請電話確認。","tels":[{"label":"社會局身心障礙者福利科","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://dosw.gov.taipei/News_Content.aspx?n=91F35523B74F69AC&s=8D79133341A528E3"},{"id":"carerallow","cats":["money","caregiver"],"name":"中低收入老人特別照顧津貼","agency":"臺北市政府社會局；各區老人服務中心","what":"家人在家全心照顧重度失能的長輩、因此不能工作，每月可以領照顧津貼。","who":"長輩領中低收入老人生活津貼、重度以上失能，由家人照顧，且沒有請看護、沒有用居家服務或日照。","how":"打電話給住家所在區的老人服務中心，由他們協助申請。","note":"資格和金額可能調整，申請前請先電話確認。","tels":[{"label":"松山老人服務中心","tel":"02-2768-5636","ext":"","addr":""},{"label":"信義老人服務中心","tel":"02-8787-0300","ext":"","addr":""},{"label":"大安老人服務中心","tel":"02-2708-6255","ext":"","addr":""},{"label":"中山老人住宅暨服務中心","tel":"02-2542-0006","ext":"","addr":""},{"label":"內湖老人服務中心","tel":"02-2632-5560","ext":"","addr":""},{"label":"南港老人服務中心","tel":"02-2653-5311","ext":"","addr":""},{"label":"中正老人服務中心","tel":"02-2381-4571","ext":"","addr":""},{"label":"大同老人服務中心","tel":"02-2592-9808","ext":"","addr":""},{"label":"萬華老人服務中心","tel":"02-2361-0666","ext":"","addr":""},{"label":"文山老人服務中心","tel":"02-2234-4893","ext":"","addr":""},{"label":"士林老人服務中心","tel":"02-2838-1571","ext":"","addr":""},{"label":"北投老人服務中心","tel":"02-2892-9702","ext":"","addr":""}],"url":"https://elders.gov.taipei/News_Content.aspx?n=40A74DAD56B74FC0&sms=21884AF41A49B03F&s=451E3C675205415B"},{"id":"hospcarer","cats":["money"],"name":"住院看護補助","agency":"臺北市政府社會局","what":"經濟困難的市民急病住院，可以申請補助請看護的費用。","who":"臺北市低收入戶、符合中低收入老人生活津貼資格的人，或社會局輔導中的個案。","how":"住院時先問醫院社工，或打電話給社會局詢問。","note":"補助金額和天數請電話確認。","tels":[{"label":"社會局社會工作科","tel":"02-2720-8889","ext":"1633","addr":""}],"url":"https://elders.gov.taipei/News_Content.aspx?n=40A74DAD56B74FC0&sms=21884AF41A49B03F&s=46DFDD2811FCC6DD"},{"id":"relief","cats":["money"],"name":"急難救助","agency":"臺北市政府社會局；社會福利服務中心、區公所","what":"家人突然重病或受傷，生活一下子撐不下去時，可以申請一次性的救助金。","who":"設籍臺北市，最近 3 個月內發生家人重病、受傷或主要賺錢的人無法工作等情形。","how":"帶證明文件到社會福利服務中心或戶籍地區公所申請。","note":"","tels":[{"label":"社會局社會救助科","tel":"1999","ext":"1609","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=0BF751F1B9F07AA1"},{"id":"relief2","cats":["money"],"name":"急難紓困（原馬上關懷）","agency":"臺北市政府社會局；區公所","what":"家人重傷病，治療 1 個月以上且無法工作，或為了照顧家人而失業，可以儘快領到紓困金。","who":"最近 3 個月內發生上述困難的家庭。同一件事原則上申請一次。","how":"到區公所申請。","note":"","tels":[{"label":"社會局社會救助科","tel":"1999","ext":"1609","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=7011FE50261D43B5"},{"id":"carersupport","cats":["caregiver"],"name":"家庭照顧者支持服務據點與關懷專線","agency":"臺北市政府社會局；衛生福利部","what":"照顧者累了、不知道怎麼照顧時可以找的地方：照顧技巧課程、紓壓活動、支持團體、心理協談，上課時可以安排臨時照顧。","who":"長照家庭和身心障礙者家庭的照顧者。家裡有請外籍看護的家人也可以使用。","how":"依住的行政區，打電話給對應的據點。想先聊聊照顧壓力，可以打關懷專線。","note":"","tels":[{"label":"家庭照顧者關懷專線（全國）","tel":"0800-507272","ext":"","addr":""},{"label":"中山區、松山區、南港區據點","tel":"02-7703-1972","ext":"","addr":"臺北市中山區建國北路二段129號7樓"},{"label":"信義區據點","tel":"02-2578-0285","ext":"217、218","addr":""},{"label":"大安區據點","tel":"02-2367-6646","ext":"8536、8721","addr":""},{"label":"中正區、內湖區據點","tel":"02-2311-4678","ext":"","addr":""},{"label":"文山區據點","tel":"02-2234-2199","ext":"","addr":""},{"label":"萬華區、大同區據點（長照家庭）","tel":"02-2308-5739","ext":"","addr":""},{"label":"大同區據點（身障家庭）","tel":"02-2550-6658","ext":"","addr":""},{"label":"北投區、士林區據點","tel":"02-2838-1571","ext":"214","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=70898293C7B4ABE5"},{"id":"foreignhire","cats":["caregiver"],"name":"聘請外籍看護與 1955 專線","agency":"勞動部勞動力發展署；臺北市長期照顧管理中心","what":"想請外籍看護，要先確認病人符合資格。雇主和外籍看護有問題，都可以打 1955，24 小時免付費，有多國語言服務。","who":"病人經指定醫院評估需要全日照顧，或符合特定身心障礙等條件。年滿 80 歲可以免醫療評估。","how":"到指定醫院評估後，把資料送到臺北市長期照顧管理中心，再依流程向勞動部申請。","note":"1955 有多國語言服務，包括印尼語、越南語和泰語。","tels":[{"label":"1955 勞工諮詢申訴專線（24 小時）","tel":"1955","ext":"","addr":""},{"label":"直接聘僱聯合服務中心","tel":"02-6613-0811","ext":"","addr":""}],"url":"https://dhsc.wda.gov.tw/Industry?MenuId=fea6ae19-627e-4418-8662-bc2b2e85977d"},{"id":"foreignltc","cats":["caregiver","care"],"name":"有請外籍看護的家庭可以用的長照服務","agency":"衛生福利部；臺北市長期照顧管理中心","what":"有外籍看護的家庭，也可以用專業服務、交通接送、輔具、居家無障礙改善和喘息服務。外籍看護休假時，可以申請喘息服務。","who":"家裡有外籍看護，病人長照需要等級 2 級以上。外籍看護返鄉、離境等空窗期，有證明的可以使用全部長照服務。","how":"撥 1966，請長照管理中心到家評估。","note":"","tels":[{"label":"長照服務專線","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/Ltc/cp-6460-69943-207.html"}]}},"en":{"code":"en","name":"English","htmlLang":"en","speech":"en-US","locale":"en-GB","glyph":"A","rangeWord":" to ","say":[["119","one one nine"],["1966","one nine six six"],["722","seven two two"]],"ui":{"brand":"Stroke PAC Education","trial":"Trial version","tabHome":"Home","tabLearn":"Learn","tabCheck":"Checklist","tabQuiz":"Quiz","homeTitle":"The golden period for rehabilitation after a stroke","homeIntro":"Post-acute care education for patients and families. Each unit takes about 3 minutes. You can read it or listen to it.","todayTitle":"Today's care checklist","todayDone":"Done: {n} / {m} items","unitsHeading":"Education units","aboutTitle":"About this education material","about":["This is a trial version. The medical team must review the content before it goes online.","The content is general information. Every patient is different. Plea e hotline 1966, and notices from the Taipei City Government and related agencies: long-term care and friendly service resources","MedicoNotes \"Stroke localization\" illustrated notes (based on textbooks such as Adams' Principles of Neurology): which blood vessel matches which symptoms","Other care details, such as how often to turn the patient, medicine precautions and back patting, are written following common nursing practice in Taiwan, and must be reviewed by the hospital's medical team before release."],"srcNote":"The guideline gives advice for health professionals. Every patient is different. For actual treatment, follow the instructions of the attending doctor and the care team.","unitSrcLabel":"Guideline sections this unit is based on","unitSrcOther":"Some content in this unit is also based on Taiwan's systems or other guidelines.","srcGo":"See sources","secs":{"2.1":"Organization of Poststroke Rehabilitation Care (Levels of Care)","2.2":"Rehabilitation Interventions in the Inpatient Acute Hospital Setting","3.1":"Prevention of Skin Breakdown and Contractures","3.2":"Venous Thromboembolism (VTE) Prevention","3.3":"Treatment of Bladder and Bowel Dysfunction","3.4":"Assessment, Prevention, and Treatment of Hemiplegic Shoulder Pain","3.5":"Central Post Stroke Pain","3.6":"Prevention of Falls","3.7":"Mental Health Assessment and Treatment of Poststroke Depression and Anxiety, Including Emotional and Behavioral State","3.8":"Poststroke Osteoporosis","3.9":"Sleep and Poststroke Fatigue","4.1":"Assessment of Disability and Rehabilitation Needs","4.2":"Assessment of Motor Impairment, Activity, and Mobility","4.4":"Assessment of Cognition and Perception","4.5":"Assessment of Sensory Impairments, Including Touch, Vision, and Hearing","5.1":"Physical Activity","5.3":"Management of Spasticity","5.4":"Balance and Ataxia","5.5":"Gait and Mobility","5.6":"Upper Extremity Activity, Including ADLs, IADLs, Touch, and Proprioception","5.7":"Adaptive Equipment, Durable Medical Devices, Orthotics, and Wheelchairs","5.8":"Lifestyle Modification and Management","5.9":"Treatment and Interventions for Visual Impairments","5.10":"Dysphagia Screening, Management, and Nutritional Support","6.1":"Nonpharmacological Therapies for Cognitive Impairment, Including Memory","6.2":"Acquired Communication Disorders","6.3":"Motor Speech Disorders: Dysarthria and Apraxia of Speech","6.4":"Spatial Neglect","7.1":"Ensuring Medical and Rehabilitation Continuity Through the Rehabilitation Process and Into the Community","7.2":"Caregiver Engagement and Support","7.3":"Referral to Community Resources","7.4":"Community Rehabilitation and Telerehabilitation","7.6":"Recreational, Leisure, and Social Activity Participation","7.7":"Return to Work","7.8":"Return to Driving"}},"sos":{"title":"Warning signs of another stroke","items":[["Smile","The mouth is crooked, or the two sides of the face do not match"],["Raise both arms","Hold both arms out straight. One arm is weak and drops"],["Say hello","Speech is unclear, or the words do not come out"]],"call":"If any one of these happens, call {n} right away and write down the time it started."},"caps":{"journey":[["Acute treatment",""],["PAC rehab",""],["Going home",""]],"team":[["Physical therapy","Walking and balance"],["Occupational therapy","Daily activities"],["Speech therapy","Speaking and swallowing"]],"arm":[["Do this","Support arm with a pillow"],["Do not do this","Pull the weak arm"]],"eat":[["Do this","Sit up. Small, slow bites"],["Do not do this","Eat lying down"]],"after":[["Sit 30 minutes","Do not lie down right away"],["Clean the mouth","After every meal"],["Check the cheeks","For leftover food"]],"steps":[["Sit up in bed","30 seconds"],["Sit on edge of bed","30 seconds"],["Stand steady","30 seconds, then walk"]],"safe":[["Grab bars","Bathroom, beside toilet"],["Non-slip mat","Bathroom floor"],["Night light","Leave one on at night"],["Clear walkways","Remove clutter and cords"]],"three":[["Medicine on time",""],["Blood pressure daily",""],["Follow-up visits",""]],"bp722":[["7 days","In a row"],["2 times a day","Morning and night"],["2 readings","Each time"]],"life":[["No smoking",""],["Less salt and oil",""],["More vegetables",""],["Keep active",""]],"talk":[["Face to face","Slow, short sentences"],["Pictures, gestures","Help to communicate"]],"rest":[["Regular rest","Caregivers eat, sleep too"],["Call 1966","Ask about respite care"]],"devices":[["Walker",""],["Wheelchair",""],["Quad cane",""]],"angle":{"cap":"During and after tube feeding, raise the head of the bed 30–45 degrees","aria":"During tube feeding, the head of the bed is raised 30 to 45 degrees"},"weeks":{"cap":"PAC care period (weeks)","legend":["As a rule, 3–6 weeks","Can be extended once after assessment, up to 12 weeks","Assessment every 3 weeks"],"aria":"PAC care period: as a rule 3 to 6 weeks, can be extended once up to 12 weeks, with an assessment every 3 weeks"},"exer1":[["Hip lift","Lift bottom, lying down"],["Raise both arms","Shoulder height first"],["Ankle exercise","Foot up, then down"]],"exer2":[["Sit to stand","Hold chair, then stand"],["Weight shifting","Slowly left and right"],["Walking","Always with someone"]],"cane":[["Do this","Cane on strong side"],["Do not do this","Cane on weak side"]],"stairs":[["Going up","Strong leg first"],["Going down","Weak leg first"]],"homeaids":[["Shower chair","Sit to bathe"],["Commode chair","Beside the bed"],["Ankle-foot brace","Check skin daily"]],"handtools":[["Towel wipe","Push out, pull back"],["Clothes peg","Squeeze open, clip on"],["Pick up blocks","Put them in a cup"]],"balancetools":[["Steady chair","Practice sit to stand"],["Hold the counter","Shift weight side to side"]],"mindtools":[["Mirror","Practice making faces"],["Say the name","Cup, spoon"],["Calendar","Check the date daily"]],"safetools":[["Small bell","Call for help"],["Colored tape","On door sill edges"],["Night light","Bed to toilet path"]],"posture":[["On the weak side","Shoulder forward, pillows"],["On the strong side","Weak arm, leg on pillows"],["On the back","Thin pillow under shoulder"],["Sitting in bed","Back firm, hands on table"]],"turning":[["Place the arm","Not under the body"],["Hold shoulder & hip","Do not pull the arm"],["Pillow behind","Fill the gaps"],["Pillow between legs","No pressure on each other"]],"donts":[["No arm pulling","It hurts the shoulder"],["No hard pillow","Under the knees"],["Toes free","Keep the blanket loose"],["Nothing hard","Unless therapist advises"]],"brain":[["Left-brain stroke","Weak right arm and leg"],["Right-brain stroke","Weak left arm and leg"]],"progress":[["Sit steadily",""],["Stand up",""],["Walk",""]],"homecare":[["Blood pressure","Morning and night, same time"],["Drink water","Small sips, many times"],["Ankle exercise","Prevents blood clots"],["Take medicine","Do not stop on your own"]],"standex":[["Lunge","Weak leg behind"],["Heel raise","Up slowly, down slowly"],["Turning","Feet stay still"],["Knee raise","Do not lift too high"]],"evalflow":[["At the start","Assess, make a plan"],["During care","Reassess, adjust"],["Before the end","Check results"]],"balance3":[["Level 1","Sit or stand steadily"],["Level 2","Shift weight, no fall"],["Level 3","Steady when pushed lightly"]],"stretch":[["Stretch slowly","Hold briefly, no pain"],["Do not force","Can cause injury"]],"lobes":[["Frontal lobe","Action, decisions, character"],["Parietal lobe","Feeling, sense of space"],["Temporal lobe","Memory, understanding speech"],["Occipital lobe","Seeing"]],"mindmove":[["Imagine","Picture the movement"],["Try","Try to move it yourself"],["Assisted","Do it together with support"]],"handex":[["Grip","Hold a soft ball"],["Let go","Open the fingers"],["Touch","Reach to touch a cup"],["Lift","Lift the wrist up"]],"armex":[["Reach forward","Take something in front"],["Lift up","Not above shoulder"],["Open to the side","Not above shoulder"]],"legsteps":[["Stand up",""],["Shift weight",""],["Lift the leg",""],["Take a step",""]],"timeline":[["0–3 months","Fastest progress"],["3–6 months","Progress slows"],["6–12 months","Can still improve"],["After 1 year","Practice still helps"]],"stickex":[["Hold a stick","Reach forward, bring back"],["Pegs","Aim, put in slowly"]],"footdrop":[["Foot pulled up","No dragging when walking"],["Toes point down","Easy to trip"]],"swallowex":[["Puff cheeks","Pucker, open mouth"],["Move tongue","Out, side, up"],["Dry swallow","Swallow saliva once"],["Sit upright","Do not lie down"]]},"units":[{"title":"About PAC post-acute care","desc":"What PAC is, who can join, how long care lasts","body":[{"t":"h","x":"What is post-acute care"},{"t":"p","x":"After the acute treatment for a stroke ends and the patient's condition is stable, there is a period when body functions recover faster. The National Health Insurance (NHI) Post-Acute Care program is called PAC for short. During this period, a team of different professionals arranges intensive rehabilitation. This helps the patient regain the ability to take care of themselves in daily life and go home smoothly."},{"t":"fig","id":"journey"},{"t":"h","x":"Who can join"},{"t":"p","x":"The medical team assesses whether a patient is suitable. The main conditions are:"},{"t":"ul","x":["Within 1 month after an acute stroke. In special cases this can be extended to within 40 days.","After the stroke, the patient has moderate to moderately severe loss of function.","The patient's condition has been stable for 72 hours or more.","The patient has potential for rehabilitation: can cooperate and learn, can sit with support for a full 1 hour, and is willing to take an active part in rehabilitation."]},{"t":"h","x":"How long care lasts"},{"t":"p","x":"As a rule, it is 3–6 weeks. If the team's assessment shows there is still a need, it can be extended once, up to 12 weeks at most. During this time, progress is assessed every 3 weeks."},{"t":"fig","id":"weeks"},{"t":"h","x":"Three models of care"},{"t":"modes","x":[{"dt":"Inpatient model","dd":"The patient stays in the hospital for rehabilitation. High intensity: 3–5 therapy sessions a day. Regular intensity: 1–2 sessions a day."},{"dt":"Day care model","dd":"The patient comes to the hospital for rehabilitation in the daytime, from about 9 in the morning to 5 in the afternoon, with 2–4 therapy sessions a day. The patient goes home to rest at night."},{"dt":"Home model","dd":"For patients who cannot use inpatient care, day care or outpatient rehabilitation, a therapist comes to the home to give therapy. Each session is 30–50 minutes, 1–6 times a week."}]},{"t":"p","x":"Each hospital offers different models. Please check with the PAC case manager."},{"t":"h","x":"When it ends"},{"t":"ul","x":["Function has clearly improved, and the patient can go home and do rehabilitation on their own.","No progress in 2 assessments in a row.","The patient's condition changes, and other treatment is needed first.","The 12-week limit has been reached."]},{"t":"key","h":"PAC ends, but rehabilitation does not","p":"Recovery can go on for many months or even years. After PAC ends, the patient can keep practicing at an outpatient clinic, in the community or at home. If function changes, or there is a new goal, ask the doctor to assess again and arrange more rehabilitation."},{"t":"key","h":"What family members can do","ul":["Join the team's briefings and discussions to understand the rehabilitation goals.","Learn care skills from the therapists and nurses.","Talk with the team early about the plans after discharge."]},{"t":"key","h":"How rehab starts","ul":["On the first day after a stroke (within 24 hours), high-intensity out-of-bed activity is not suitable. After that, the care team plans getting out of bed and rehab step by step, based on the patient's condition.","Rehab works better when a team of different professionals, such as doctors, nurses and therapists, works together. Rehab at home after discharge should also be assessed and planned by the care team. Family members help the patient practice by following the team's plan; it is not up to the family alone."]}]},{"title":"How rehabilitation is done","desc":"The team members, how family can help, when to stop","body":[{"t":"h","x":"What the rehabilitation team does"},{"t":"ul","x":["Physical therapy: practice turning over, sitting, standing, walking and balance.","Occupational therapy: practice hand movements and daily activities such as dressing, eating and using the toilet.","Speech therapy: practice speaking, understanding and swallowing."]},{"t":"fig","id":"team"},{"t":"p","x":"The team also includes doctors, nurses, dietitians, pharmacists, psychologists and social workers. You can bring any question to them."},{"t":"h","x":"Every moment in the ward is rehabilitation"},{"t":"p","x":"The movements the therapist teaches should be used in everyday life. Please let the patient do the things he or she can do alone, such as washing the face, dressing and eating. Family members stay close and watch, and help when needed. Do not do everything for the patient."},{"t":"h","x":"Protect the weak side"},{"t":"ul","x":["When you help the patient get up or move, do not pull the arm on the weak side, so that the shoulder is not injured.","When the patient is lying down or sitting, support the weak arm well with a pillow.","When the patient stays in bed for a long time, help the patient turn over about every 2 hours."]},{"t":"fig","id":"arm"},{"t":"weak"},{"t":"key","h":"Speak up about shoulder pain","ul":["Shoulder pain is common after a stroke. If the shoulder hurts, has a gap (partial dislocation) or is very tight, ask the doctor and therapist to assess it.","Positioning supports or a sling can support the shoulder and keep the gap from getting worse. Injections, electrical stimulation and other methods can help reduce shoulder pain. Ask the medical team whether they are suitable.","Before discharge, ask the therapist to teach family members how to position and move the weak shoulder, and show the therapist that you can do it."]},{"t":"warn","h":"If any of these happen, stop first and tell the medical staff","ul":["Dizziness, pale face, cold sweat","Chest tightness, or very short of breath","Sudden severe headache","Arms or legs weaker than usual, or speech suddenly becomes unclear"]},{"t":"key","h":"Progress can be fast or slow","p":"Each person recovers at a different speed. The team assesses the patient every 3 weeks and adjusts the rehabilitation based on the results. Practice works only when there is enough of it and it is hard enough. The therapist plans this based on the patient's condition."}]},{"title":"Swallowing and safe eating","desc":"Warning signs of choking, ways to eat safely","body":[{"t":"h","x":"Why swallowing needs attention"},{"t":"p","x":"Swallowing often becomes worse after a stroke. If food or water goes into the airway, it may cause aspiration pneumonia (a lung infection). Some patients do not cough when they choke, so family members need to help watch."},{"t":"warn","h":"Warning signs of a swallowing problem","ul":["Coughing or choking when eating or drinking water","After eating, the voice sounds wet, as if there is phlegm","Food stays in the mouth and cannot be swallowed, or leaks out from the corner of the mouth","A meal takes a very long time to finish","Fever again and again, or more phlegm"],"p":"If any of these happen, please tell the nurse or speech therapist."},{"t":"key","h":"Swallowing check first","ul":["After a stroke, the patient needs a swallowing check before eating, drinking or taking medicine for the first time.","If a swallowing problem is suspected, the doctor may arrange a swallowing X-ray video or a camera (endoscope) exam to see whether food or drink goes into the airway, and to find the safest types of food.","If the patient cannot swallow pills, do not crush them or try other ways on your own. Ask the nurse, doctor or pharmacist first.","People with swallowing problems often eat too littl
