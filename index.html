n trị liệu đã dạy. Người nhà một tay đỡ khuỷu tay, một tay đỡ cổ tay, từ từ giúp làm, không kéo tay.","Khi chuyên viên trị liệu chưa cho phép, nâng tay lên hoặc dang sang bên đều không đưa cao quá vai. Đau vai hoặc tay bị tê thì dừng lại.","Không tự buộc tay bên khỏe lại để bắt người bệnh dùng tay bên yếu. Cách này chỉ hợp với một số người bệnh, phải do chuyên viên trị liệu sắp xếp."]},{"t":"h","x":"Thứ tự tập chân"},{"t":"fig","id":"legsteps"},{"t":"ul","x":["Phải ngồi vững trước, rồi mới tập đứng. Đứng lên → vịn và chuyển trọng tâm → nhấc chân → bước, tập từng bước một. Bước trước đã vững rồi mới tập bước sau.","Khi nhấc chân là đứng bằng một chân, rất dễ bị ngã. Nhất định phải vịn vào tay vịn cố định hoặc bàn chắc chắn.","Khi tập nhất định phải có người đứng ở bên yếu. Dùng khung tập đi hoặc nẹp theo lời khuyên của chuyên viên trị liệu."]},{"t":"unitlink","x":"Xem “Tập vận động tại nhà”","unit":"u8"}]},{"title":"Quá trình hồi phục và tập tay chân","desc":"Thời gian hồi phục, vì sao tay hồi phục chậm hơn, tập với gậy gỗ và cắm que, bàn chân rủ","body":[{"t":"h","x":"Hồi phục cần một thời gian"},{"t":"fig","id":"timeline"},{"t":"ul","x":["Trong 3 tháng đầu sau đột quỵ, người bệnh thường tiến bộ nhanh nhất. Hãy tận dụng thời gian này để tập.","Từ 3 đến 6 tháng: tiến bộ thường chậm lại, nhưng vẫn có thể tiến bộ.","Từ 6 đến 12 tháng: tiến bộ chậm hơn nữa. Tập đều đặn vẫn có thể cải thiện.","Sau 1 năm: tập đều đặn vẫn có ích, giúp giữ và cải thiện chức năng.","Mỗi người hồi phục nhanh chậm khác nhau. Đừng so sánh với người khác. Hãy tập đều theo kế hoạch của chuyên viên trị liệu.","Sau khi kết thúc đợt phục hồi chức năng chính thức, sự hồi phục vẫn còn tiếp tục. Nên tái khám định kỳ để đánh giá; khi có khó khăn hoặc mục tiêu mới, có thể tham gia thêm một đợt phục hồi chức năng."]},{"t":"key","h":"Mỗi ngày giữ đều 3 việc","p":"Ăn uống đều đặn, nghỉ ngơi đầy đủ, tập mỗi ngày. Người ăn uống bị sặc hoặc bị ho thì trước khi ăn uống phải được chuyên viên ngôn ngữ trị liệu đánh giá. Nói không rõ cũng có thể nhờ chuyên viên ngôn ngữ trị liệu giúp tập. Nếu đột nhiên nói không rõ, hoặc nói khó hơn trước, hãy gọi 119 ngay."},{"t":"unitlink","x":"Xem “Nuốt và ăn uống an toàn”","unit":"u3"},{"t":"h","x":"Vì sao chân đi được trước, còn tay hồi phục chậm hơn?"},{"t":"p","x":"Đi bộ dùng những động tác lớn. Tay và ngón tay phải làm động tác nhỏ và chính xác, nên tay thường hồi phục chậm hơn, ngón tay còn chậm hơn nữa. Đây là chuyện thường gặp, không có nghĩa là tay hết hy vọng."},{"t":"key","h":"Đừng chỉ tập đi","ul":["Nếu không tập tay, dù đi đã vững, các động tác nhỏ của tay cũng khó hồi phục. Mỗi ngày cũng phải tập tay.","Trước tiên thả lỏng: kéo giãn từ từ để cơ đang căng cứng được thả lỏng.","Sau đó cử động: vai, khuỷu tay, cổ tay, ngón tay đều phải được cử động.","Rồi dùng sức: tập tự nâng tay, tự nắm đồ.","Không bẻ mạnh tay. Khi nghỉ, đặt tay lên gối cho chắc, các ngón tay mở ra tự nhiên. Đừng để tay buông thõng hoặc co quắp mãi.","Tay hồi phục khác nhau tùy người. Chuyên viên trị liệu cũng sẽ dạy cách dùng tay bên khỏe hoặc dụng cụ hỗ trợ để làm việc hằng ngày. Cả hai cách đều cần tập."]},{"t":"unitlink","x":"Xem “Đặt tư thế và trở mình”","unit":"u11"},{"t":"h","x":"Tập tay với gậy gỗ và cắm que"},{"t":"fig","id":"stickex"},{"t":"ul","x":["Hai tay cầm gậy: ngồi vững, hai tay cầm gậy gỗ, từ từ đưa ra phía trước rồi từ từ kéo về. Cũng có thể từ từ đưa sang trái, sang phải. Ở nhà có thể dùng cây cán bột hoặc khăn cuộn tròn thay gậy.","Tay bên yếu cũng phải cùng dùng sức, không chỉ để tay bên khỏe kéo đi. Nếu tay bên yếu cầm không chắc, nhờ người nhà giữ giúp.","Không kéo cánh tay bên yếu. Nếu vai yếu, bị đau hoặc vai có chỗ lõm xuống, tạm thời không đưa tay cao quá vai. Đưa cao đến đâu, hãy hỏi chuyên viên trị liệu trước.","Cắm que: lúc đầu chọn que gỗ to, dễ làm được hơn. Mắt nhìn vào lỗ, tay từ từ đưa lại gần, giữ vững cổ tay rồi cắm vào. Ở nhà có thể tập bỏ ống hút to vào cốc.","Lúc đầu có thể tập mỗi hiệp 8 đến 12 lần, mỗi ngày 2 hiệp. Khi làm đã vững, tăng dần theo lời khuyên của chuyên viên trị liệu, đừng quá sức."]},{"t":"warn","h":"Chú ý khi tập tay","ul":["Đau vai, tay bị tê, chóng mặt, tức ngực hoặc thở rất mệt: dừng lại ngay.","Khi tay rất căng, co cứng cơ rõ, hãy tạm dừng, đừng cố tập.","Không bẻ mạnh ngón tay và cổ tay, cũng không nín thở để dùng sức.","Luôn ngồi vững, bên cạnh phải có người trông."]},{"t":"h","x":"Mũi bàn chân rủ xuống (bàn chân rủ)"},{"t":"fig","id":"footdrop"},{"t":"ul","x":["Nguyên nhân: cơ kéo mu bàn chân lên bị yếu, cơ phía sau bắp chân lại thường quá căng.","Nếu mũi bàn chân chúc xuống lâu ngày, gân phía sau gót chân sẽ dần ngắn lại, cổ chân cứng lại, sau này càng khó cải thiện.","Khi đi, mũi bàn chân dễ kéo lê trên sàn, dễ bị vấp ngã."]},{"t":"key","h":"Cách phòng ngừa","ul":["Khi nằm, đừng để chăn đè lên mũi bàn chân. Đặt tư thế theo cách chuyên viên trị liệu đã dạy.","Mỗi ngày cử động cổ chân, kéo mu bàn chân lên. Nếu tự làm không được, nhờ người nhà đỡ gót chân, từ từ giúp làm. Thấy căng thì dừng, không ấn mạnh. Nếu cổ chân rất cứng hoặc cứ run giật liên tục, hãy hỏi chuyên viên trị liệu trước.","Nếu bắp chân đột nhiên sưng, đau, đỏ hoặc sờ thấy nóng: không tập động tác này, và báo cho nhân viên y tế.","Mang nẹp cổ chân và giày kín mũi, chống trơn theo lời khuyên của chuyên viên trị liệu. Sau khi tháo nẹp, xem da. Nếu chỗ đỏ lâu không hết, hãy báo cho chuyên viên trị liệu."]},{"t":"unitlink","x":"Xem “Sử dụng dụng cụ hỗ trợ”","unit":"u9"}]}],"daily":["Hôm nay đã tham gia đủ các buổi tập phục hồi chức năng","Việc tự làm được thì tự làm (rửa mặt, mặc quần áo, ăn cơm)","Khi ăn ngồi thẳng, ăn miếng nhỏ, chậm rãi, ăn xong ngồi 30 phút","Sau bữa ăn vệ sinh miệng, kiểm tra xem còn sót thức ăn không","Khi xuống giường: ngồi 30 giây, đứng 30 giây rồi mới đi, và có người đi cùng","Khi nằm trên giường, cứ khoảng 2 giờ lật người một lần, cánh tay bên yếu có gối đỡ","Hôm nay đã uống đủ thuốc đúng giờ","Đo huyết áp và ghi lại","Hôm nay đã trò chuyện và động viên người bệnh","Bản thân người chăm sóc đã nghỉ ngơi và ăn cơm","Hôm nay đã tập vận động tại nhà theo cách chuyên viên trị liệu hướng dẫn","Hôm nay đã dùng đồ trong nhà để tập cử động tay","Sau khi trở mình đã kiểm tra da ở chỗ xương nhô ra như mông, gót chân","Hôm nay đã uống nước ít một, nhiều lần (người được bác sĩ hạn chế lượng nước thì theo chỉ dẫn của bác sĩ)","Khi nằm hoặc ngồi lâu, đã tập cổ chân","Hôm nay khi tập có nghỉ giữa chừng, không tập đến mức quá mệt","Hôm nay ngoài tập đi, cũng đã tập tay"],"ready":["Biết cách giúp lên xuống giường, lên xuống xe lăn an toàn","Biết đút ăn hoặc cho ăn qua ống thông mũi dạ dày","Biết tác dụng và giờ uống của từng loại thuốc","Biết làm các động tác phục hồi chức năng tại nhà","Đã chuẩn bị dụng cụ hỗ trợ theo lời khuyên của chuyên viên trị liệu","Ở nhà đã lắp tay vịn, trải thảm chống trượt, cất gọn đồ đạc lặt vặt","Đã gọi 1966 hoặc nhờ điều dưỡng giới thiệu để được đánh giá chăm sóc dài hạn","Biết ngày tái khám và chuyên khoa","Biết dấu hiệu cảnh báo đột quỵ tái phát và khi nào cần gọi 119","Ở nhà có máy đo huyết áp và biết cách ghi lại","Biết cầm gậy ở bên nào và cách lên xuống cầu thang","Trong nhà đã có chuông nhỏ để gọi người, ngưỡng cửa đã dán băng keo màu","Biết đặt tư thế đúng và biết giúp trở mình","Biết dấu hiệu cục máu đông ở chân, và biết khi tái khám phải mang sổ ghi huyết áp, đường huyết và túi thuốc","Biết mức sức cơ và mức thăng bằng hiện tại của người bệnh, và lượng tập chuyên viên trị liệu khuyên"],"quiz":[{"q":"Sau khi bệnh đột quỵ ổn định, bắt đầu tập phục hồi chức năng sớm thì có nhiều cơ hội hồi phục chức năng hơn.","why":"Khoảng thời gian sau khi bệnh ổn định là lúc hồi phục khá nhanh. PAC sắp xếp tập phục hồi chức năng tích cực chính trong khoảng thời gian này."},{"q":"Để người bệnh được nghỉ ngơi nhiều hơn, tốt nhất người nhà nên làm thay hết việc mặc quần áo và ăn cơm.","why":"Những việc người bệnh tự làm được, xin hãy để người bệnh tự làm, đây cũng là một phần của phục hồi chức năng. Người nhà chỉ cần ở bên cạnh trông chừng và giúp khi cần thiết."},{"q":"Khi đỡ người bệnh ngồi dậy, không được kéo cánh tay bên yếu của người bệnh.","why":"Kéo cánh tay bên yếu dễ làm vai bị tổn thương."},{"q":"Khi ăn, người bệnh thỉnh thoảng ho một chút thì không sao, không cần báo cho nhân viên y tế.","why":"Ho khi ăn hoặc uống nước là dấu hiệu cảnh báo có vấn đề về nuốt, xin báo cho điều dưỡng hoặc chuyên viên ngôn ngữ trị liệu."},{"q":"Khi đút ăn, phải đưa thức ăn vào miệng từ bên khỏe của người bệnh.","why":"Đưa vào từ bên khỏe thì dễ nhai và nuốt hơn, cũng ít bị sót thức ăn hơn."},{"q":"Nửa đêm muốn đi vệ sinh, để không đánh thức người nhà, người bệnh có thể tự đi chậm chậm một mình.","why":"Xuống giường và đi vệ sinh đều phải có người đi cùng. Nếu đang nằm viện, xin bấm chuông gọi, đừng cố tự làm."},{"q":"Huyết áp ổn định, không thấy khó chịu thì có thể tự ngừng thuốc.","why":"Huyết áp ổn định là nhờ uống thuốc đúng giờ. Có điều chỉnh thuốc hay không, xin để bác sĩ quyết định."},{"q":"Đột nhiên méo miệng, một tay yếu hoặc nói không rõ thì trước tiên cứ nghỉ ngơi, theo dõi nửa ngày rồi tính sau.","why":"Đây là dấu hiệu cảnh báo đột quỵ tái phát. Có bất kỳ dấu hiệu nào, xin gọi 119 ngay và ghi lại giờ bắt đầu có triệu chứng."},{"q":"Trong thời gian chăm sóc PAC, đội ngũ y tế đánh giá mức tiến bộ 3 tuần một lần.","why":"Đội ngũ y tế đánh giá khi nhận vào chương trình, 3 tuần một lần và khi kết thúc chương trình, rồi điều chỉnh nội dung tập phục hồi chức năng theo kết quả."},{"q":"Người chăm sóc cũng cần nghỉ ngơi, có thể gọi 1966 để hỏi về dịch vụ chăm sóc thay thế tạm thời.","why":"Chăm sóc là việc lâu dài. Có thể gọi đường dây chăm sóc dài hạn 1966 để hỏi về các nguồn hỗ trợ như dịch vụ chăm sóc thay thế tạm thời và dịch vụ chăm sóc tại nhà."},{"q":"Phải cầm gậy ở bên yếu thì mới giúp được chân bên yếu.","why":"Phải cầm gậy ở bên khỏe. Khi đi, gậy và chân bên yếu cùng đưa lên trước."},{"q":"Khi đang tập mà đột ngột đau ngực hoặc chóng mặt, phải dừng tập ngay.","why":"Đau ngực, chóng mặt, vã mồ hôi lạnh hoặc thở rất gấp đều phải dừng tập ngay. Nghỉ vài phút mà không đỡ, hoặc tay chân đột ngột yếu hơn, xin gọi 119."},{"q":"Sau khi tập nhặt cúc áo hoặc khối xếp hình, có thể để chúng lại bên cạnh người bệnh để tiện tập bất cứ lúc nào.","why":"Đồ nhỏ tập xong phải cất đi, để tránh người bệnh nuốt nhầm."},{"q":"Khi giúp người bệnh trở mình, có thể kéo cánh tay bên yếu để đưa người qua.","why":"Kéo cánh tay bên yếu sẽ làm tổn thương vai. Phải đỡ vai và mông để trở mình cùng lúc."},{"q":"Người bệnh bị sặc khi ăn, nhưng vẫn còn ho được, nói được, thì nên vỗ mạnh vào lưng.","why":"Khi còn ho được, hãy cho người bệnh cúi người về phía trước và tự ho thật mạnh, không vỗ lưng. Chỉ khi ho không ra tiếng, không nói được hoặc không thở được, mới gọi 119, và vỗ lưng, ấn bụng xen kẽ."},{"q":"Khi thấy huyết áp hơi cao, có thể tự uống thêm một viên thuốc hạ huyết áp.","why":"Không tự ý uống thêm thuốc, giảm thuốc hay ngưng thuốc. Huyết áp cần đạt mức bác sĩ đặt ra, nhưng không phải càng thấp càng tốt. Có thắc mắc, hãy hỏi bác sĩ."},{"q":"Một bên chân của người bệnh đột nhiên sưng và đau, nên xoa bóp mạnh cho bớt sưng.","why":"Đây có thể là dấu hiệu cục máu đông. Không được xoa bóp, hãy đi khám ngay trong ngày. Nếu đột nhiên đau ngực, thở rất mệt: gọi ngay 119."},{"q":"Khi nằm hoặc ngồi lâu, thường xuyên tập cổ chân (kéo mũi bàn chân lên, rồi đạp xuống) giúp phòng cục máu đông ở chân.","why":"Tập cổ chân giúp máu ở chân lưu thông, giúp phòng cục máu đông. Chân bên yếu có thể nhờ người nhà giúp cử động."},{"q":"Khi cơ tay chân người bệnh rất căng cứng, dùng sức bẻ cho thẳng sẽ có hiệu quả hơn.","why":"Bẻ mạnh sẽ làm tổn thương cơ hoặc khớp. Phải kéo giãn từ từ, giữ một lúc rồi thả lỏng. Đau thì dừng lại."},{"q":"Tập phục hồi càng nhiều càng tốt, vì vậy có thể tự tập gấp đôi.","why":"Lượng tập và cường độ tập phải đủ thì mới có hiệu quả, nhưng phải do chuyên viên trị liệu sắp xếp theo tình trạng người bệnh và tăng dần từ từ. Tự ý tăng gấp đôi đột ngột dễ bị quá mệt hoặc chấn thương."},{"q":"Khi bên bị đột quỵ kém cảm giác, dùng chườm nóng hoặc miếng dán giữ nhiệt dễ bị bỏng.","why":"Khi kém cảm giác thì không nhạy với nóng lạnh, bị bỏng cũng có thể không biết. Trước khi dùng, hãy hỏi chuyên viên trị liệu."},{"q":"Người có ngón tay rất căng cứng, nắm lại mà không mở ra được, nên bóp bóng cả ngày để tập.","why":"Khi ngón tay rất căng cứng, chỉ tập nắm mạnh không hẳn là phù hợp, cũng không nên tập một lần quá lâu. Trước tiên từ từ duỗi thẳng ngón tay, tập mở bàn tay nhiều hơn, và hỏi chuyên viên trị liệu cách tập phù hợp."},{"q":"Sau đột quỵ, chân đã đi được, tay hồi phục chậm hơn, nghĩa là tay hết hy vọng, chỉ cần tập đi.","why":"Tay hồi phục chậm hơn là chuyện thường gặp. Nếu không tập tay, các động tác nhỏ khó hồi phục. Mỗi ngày cũng phải tập tay."},{"q":"Người bệnh ăn vài miếng đều không bị sặc, nghĩa là nuốt đã an toàn, không cần đánh giá.","why":"Có người bị thức ăn hoặc nước vào khí quản mà không ho (hít sặc thầm lặng). Nuốt có an toàn hay không phải được chuyên viên ngôn ngữ trị liệu đánh giá."},{"q":"Để phòng ngừa trương lực cơ ở cổ tay và ngón tay tăng cao (co cứng cơ), người nhà có thể tự mua nẹp hoặc băng dán cho người bệnh dùng.","why":"Không khuyến khích dùng nẹp hoặc băng dán để phòng ngừa trương lực cơ ở cổ tay và ngón tay tăng cao. Có dùng nẹp hay không và dùng thế nào, do chuyên viên trị liệu đánh giá và hướng dẫn."}],"res":{"ui":{"tab":"Dịch vụ","title":"Dịch vụ hỗ trợ tại Đài Bắc","intro":"Các nguồn hỗ trợ về ăn uống, quần áo, nhà ở, đi lại, y tế, chăm sóc dài hạn và trợ cấp cho người bệnh đột quỵ và gia đình. Bấm vào từng mục để xem cách đăng ký và số điện thoại.","searchLabel":"Tìm kiếm","searchPh":"Nhập từ khóa, ví dụ: giao cơm, xe lăn, Songshan","catLabel":"Loại","catAll":"Tất cả các loại","count":"Có {n} mục","none":"Không tìm thấy dịch vụ phù hợp. Vui lòng thử từ khóa khác, hoặc chọn “Tất cả các loại”.","clear":"Xóa","who":"Ai được dùng","how":"Cách đăng ký","phone":"Điện thoại","ext":"máy lẻ","web":"Trang web chính thức","note":"Xin lưu ý","zhName":"Tên tiếng Trung","tip1999":"1999 là đường dây nóng dành cho người dân Đài Bắc. Ở Đài Bắc, gọi bằng điện thoại bàn hoặc điện thoại di động đều được. Nếu ở ngoài Đài Bắc, vui lòng gọi 02-2720-8889.","checked":"Ngày kiểm tra thông tin: ngày 14 tháng 10 năm 115 (lịch Dân Quốc, tức năm 2026). Nội dung dịch vụ và số tiền có thể thay đổi. Trước khi đăng ký, vui lòng gọi điện để xác nhận.","homeCard":"Dịch vụ hỗ trợ tại Đài Bắc","homeCardSub":"Giao cơm, dụng cụ hỗ trợ, đưa đón, chăm sóc dài hạn, trợ cấp"},"cats":{"medical":"Y tế","care":"Chăm sóc dài hạn","food":"Ăn uống","clothing":"Quần áo & dụng cụ hỗ trợ","housing":"Nhà ở","transport":"Đi lại","money":"Hỗ trợ tài chính","caregiver":"Hỗ trợ người chăm sóc"},"order":["medical","care","food","clothing","housing","transport","money","caregiver"],"items":[{"id":"er119","cats":["medical"],"name":"Nghi bị đột quỵ: gọi ngay 119","agency":"Sở Phòng cháy Chữa cháy Thành phố Đài Bắc; Bộ Y tế và Phúc lợi Đài Loan","what":"Nếu đột nhiên bị méo miệng, yếu tay chân một bên, nói không rõ, hãy gọi ngay 119. Nhân viên cấp cứu sẽ đưa người bệnh đến bệnh viện có thể điều trị đột quỵ cấp.","who":"Tất cả mọi người.","how":"Gọi 119, nói rõ địa chỉ, triệu chứng và thời điểm bắt đầu có triệu chứng. Đừng tự lái ô tô hoặc xe máy chở người bệnh đi viện. Nếu muốn biết trước ở Đài Bắc có những bệnh viện chịu trách nhiệm cấp cứu nào, có thể xem danh sách do Bộ Y tế và Phúc lợi công bố.","note":"","tels":[{"label":"Cấp cứu khẩn cấp","tel":"119","ext":"","addr":""}],"url":"https://www.mohw.gov.tw/dl-97025-23d029a4-14c2-4ae9-a057-7a32d3885839.html"},{"id":"pac","cats":["medical"],"name":"Chăm sóc tích hợp giai đoạn sau cấp tính cho người bệnh đột quỵ (PAC)","agency":"Cục Bảo hiểm Y tế Quốc gia Đài Loan (thuộc Bộ Y tế và Phúc lợi)","what":"Khi bệnh đột quỵ đã ổn định, người bệnh đến bệnh viện hợp tác để tập phục hồi chức năng tích cực trong một thời gian. Có 3 hình thức: nằm viện, chăm sóc ban ngày và tại nhà.","who":"Người bệnh trong vòng 1 tháng sau khi bị đột quỵ cấp, bị suy giảm chức năng từ mức trung bình đến mức trung bình-nặng, bệnh tình ổn định và có khả năng phục hồi. Đội ngũ y tế sẽ đánh giá.","how":"Khi đang nằm viện, hãy nhờ đội ngũ y tế hoặc nhóm chuẩn bị xuất viện đánh giá và giúp chuyển tuyến. Có thể tra cứu các bệnh viện thực hiện dịch vụ này trên trang web của Cục Bảo hiểm Y tế Quốc gia Đài Loan. Thời gian chăm sóc về nguyên tắc là 3–6 tuần, tối đa 12 tuần.","note":"","tels":[{"label":"Đường dây tư vấn Bảo hiểm Y tế","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-5499-734a5-2898-1.html"},{"id":"catastrophic","cats":["medical","money"],"name":"Diện bệnh nặng, thương tật nặng (bệnh mạch máu não cấp)","agency":"Cục Bảo hiểm Y tế Quốc gia Đài Loan (thuộc Bộ Y tế và Phúc lợi)","what":"Đột quỵ cấp thuộc diện bệnh nặng, thương tật nặng. Trong vòng 1 tháng sau khi bị bệnh, khi đi khám chữa bệnh liên quan đến đột quỵ, được miễn phần đồng chi trả của bảo hiểm y tế.","who":"Người bệnh mắc bệnh mạch máu não cấp. Thời hạn là trong vòng 1 tháng sau khi bị bệnh.","how":"Không cần đăng ký riêng, bác sĩ sẽ xác nhận. Nếu chuyển viện trong vòng 1 tháng, hãy xin bệnh viện cũ cấp giấy chứng nhận chẩn đoán có ghi ngày chẩn đoán xác định, rồi mang đến bệnh viện tiếp theo.","note":"Sau 1 tháng, nếu vẫn còn di chứng, có thể đăng ký riêng giấy chứng nhận khuyết tật hoặc dịch vụ chăm sóc dài hạn.","tels":[{"label":"Đường dây tư vấn Bảo hiểm Y tế","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-13699-f25bd-2957-1.html"},{"id":"homemed","cats":["medical"],"name":"Khám chữa bệnh tại nhà (Chương trình tích hợp chăm sóc y tế tại nhà của Bảo hiểm Y tế)","agency":"Cục Bảo hiểm Y tế Quốc gia Đài Loan (thuộc Bộ Y tế và Phúc lợi)","what":"Bác sĩ, điều dưỡng và nhân viên y tế khác đến nhà để khám bệnh, kê thuốc và chăm sóc. Dịch vụ dành cho người bệnh rất khó ra ngoài đi khám.","who":"Người đang sống ở nhà, vì mất khả năng tự chăm sóc hoặc vì bệnh nên rất khó ra ngoài đi khám, và được bác sĩ đánh giá là có nhu cầu y tế.","how":"Hỏi bệnh viện hoặc phòng khám nơi đang khám xem có dịch vụ khám chữa bệnh tại nhà không. Cũng có thể nhờ Trung tâm Quản lý Chăm sóc Dài hạn giới thiệu, hoặc gọi đường dây tư vấn Bảo hiểm Y tế.","note":"","tels":[{"label":"Đường dây tư vấn Bảo hiểm Y tế","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-5195-2e804-2875-1.html"},{"id":"disacert","cats":["medical","money"],"name":"Giấy chứng nhận khuyết tật (giám định khuyết tật)","agency":"Sở Xã hội và Sở Y tế Thành phố Đài Bắc; Văn phòng Quận nơi có hộ khẩu","what":"Sau đột quỵ, nếu còn suy giảm chức năng lâu dài, có thể đăng ký giám định. Phải có giấy chứng nhận khuyết tật thì mới đăng ký được các phúc lợi như trợ cấp người khuyết tật, xe buýt Phục Khang (xe đưa đón người khuyết tật), thẻ đỗ xe.","who":"Người còn suy giảm chức năng lâu dài sau đột quỵ. Việc giám định do bệnh viện được chỉ định thực hiện.","how":"Mang đơn đăng ký, bản sao thẻ căn cước, 3 ảnh 1 inch chụp trong vòng 3 tháng và con dấu cá nhân đến Văn phòng Quận nơi có hộ khẩu để đăng ký, sau đó đến bệnh viện được chỉ định để giám định. Người nằm liệt giường không ra ngoài được có thể đăng ký giám định tại nhà.","note":"Khi nào nên đăng ký, vui lòng hỏi bác sĩ điều trị chính.","tels":[{"label":"Phòng Phúc lợi Người khuyết tật, Sở Xã hội","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=26BB4C5F2992FAFB"},{"id":"ltc1966","cats":["care"],"name":"Đường dây Chăm sóc Dài hạn 1966 / Trung tâm Quản lý Chăm sóc Dài hạn Thành phố Đài Bắc","agency":"Bộ Y tế và Phúc lợi Đài Loan; Sở Y tế Thành phố Đài Bắc","what":"Đầu mối chung để đăng ký dịch vụ chăm sóc dài hạn. Sau khi đăng ký, chuyên viên quản lý chăm sóc sẽ đến nhà đánh giá, xét duyệt mức độ cần chăm sóc dài hạn và các dịch vụ được sử dụng.","who":"Người sống tại Đài Bắc, cần người khác chăm sóc, và thuộc một trong các trường hợp: từ 65 tuổi trở lên, người thổ dân từ 55 tuổi trở lên, có giấy chứng nhận khuyết tật, bị sa sút trí tuệ, hoặc là người bệnh được nhận vào PAC.","how":"Gọi 1966, hoặc đăng ký trên trang web Thông tin Chăm sóc Dài hạn Thành phố Đài Bắc. Nếu đang nằm viện, có thể tìm trực tiếp nhóm chuẩn bị xuất viện của bệnh viện.","note":"","tels":[{"label":"Đường dây Chăm sóc Dài hạn","tel":"1966","ext":"","addr":""},{"label":"Trung tâm Quản lý Chăm sóc Dài hạn Thành phố Đài Bắc","tel":"02-2537-1099","ext":"","addr":"臺北市中山區錦州街233號1樓"},{"label":"Trung tâm Dịch vụ Sức khỏe quận Songshan (hỏi nơi gần nhà)","tel":"02-2767-1757","ext":"","addr":""}],"url":"https://ltc.health.gov.taipei/tplcPublic/"},{"id":"discharge","cats":["care"],"name":"Chuẩn bị xuất viện và nối tiếp dịch vụ chăm sóc dài hạn","agency":"Sở Y tế Thành phố Đài Bắc; Bộ Y tế và Phúc lợi Đài Loan","what":"Trong thời gian nằm viện, bệnh viện hoàn tất trước việc đánh giá chăm sóc dài hạn và sắp xếp dịch vụ. Khi người bệnh về nhà, có thể nhanh chóng bắt đầu dùng các hỗ trợ như dịch vụ chăm sóc tại nhà, dụng cụ hỗ trợ hoặc đưa đón.","who":"Người bệnh có khả năng sinh hoạt bị giảm sau khi nằm viện, về nhà cần dịch vụ chăm sóc dài hạn.","how":"Khi nằm viện, hãy báo cho người quản lý ca chuẩn bị xuất viện hoặc nhân viên công tác xã hội của bệnh viện.","note":"","tels":[{"label":"Đường dây Chăm sóc Dài hạn","tel":"1966","ext":"","addr":""}],"url":"https://health.gov.taipei/News_Content.aspx?n=BB5A41BA1E6CA260&sms=72544237BBE4C5F6&s=51A8504C99587CA7"},{"id":"homecare","cats":["care"],"name":"Dịch vụ chăm sóc tại nhà (nhân viên chăm sóc đến nhà)","agency":"Sở Y tế và Sở Xã hội Thành phố Đài Bắc; Bộ Y tế và Phúc lợi Đài Loan","what":"Nhân viên chăm sóc đến nhà giúp tắm, mặc quần áo, ăn uống, uống thuốc, trở mình, lên xuống giường và đi cùng người bệnh đến khám bệnh.","who":"Người được Trung tâm Quản lý Chăm sóc Dài hạn đánh giá có mức độ cần chăm sóc dài hạn từ cấp 2 trở lên.","how":"Gọi 1966 để đăng ký. Sau khi đánh giá, người quản lý ca sẽ sắp xếp đơn vị cung cấp dịch vụ.","note":"Chính phủ trợ cấp phần lớn chi phí. Tỷ lệ tự trả tùy theo hoàn cảnh kinh tế của gia đình, theo mức Trung tâm Quản lý Chăm sóc Dài hạn xét duyệt. Gia đình đã thuê người chăm sóc nước ngoài thì về nguyên tắc không được dùng dịch vụ chăm sóc tại nhà. Trong thời gian trống chưa có người chăm sóc nước ngoài, như khi họ về nước hoặc rời Đài Loan, nếu có giấy tờ chứng minh thì được dùng.","tels":[{"label":"Đường dây Chăm sóc Dài hạn","tel":"1966","ext":"","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=D46C608F5B4E3D8D"},{"id":"daycare","cats":["care"],"name":"Chăm sóc ban ngày (trung tâm chăm sóc ban ngày)","agency":"Sở Xã hội và Sở Y tế Thành phố Đài Bắc","what":"Ban ngày đưa người bệnh đến trung tâm chăm sóc ban ngày. Ở đó có người chăm sóc, có bữa trưa, nghỉ trưa và hoạt động. Chiều tối người bệnh về nhà.","who":"Người có mức độ cần chăm sóc dài hạn từ cấp 2 trở lên, và là người từ 65 tuổi trở lên, có giấy chứng nhận khuyết tật, bị sa sút trí tuệ, người thổ dân từ 55 tuổi trở lên, hoặc người bệnh được nhận vào PAC.","how":"Gọi 1966 hoặc đăng ký trên trang web Thông tin Chăm sóc Dài hạn Thành phố Đài Bắc. Sau khi đánh giá, người quản lý ca sẽ tìm trung tâm chăm sóc ban ngày phù hợp.","note":"","tels":[{"label":"Đường dây Chăm sóc Dài hạn","tel":"1966","ext":"","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=3E3C1D86A51BF473"},{"id":"reable","cats":["care"],"name":"Dịch vụ chuyên môn chăm sóc dài hạn (phục hồi khả năng tự lập tại nhà)","agency":"Bộ Y tế và Phúc lợi Đài Loan; Trung tâm Quản lý Chăm sóc Dài hạn Thành phố Đài Bắc","what":"Chuyên viên trị liệu, điều dưỡng hoặc chuyên viên dinh dưỡng đến nhà, trong thời gian ngắn hướng dẫn người bệnh tự làm các động tác hằng ngày. Họ cũng hướng dẫn người nhà và người chăm sóc các kỹ năng chăm sóc, ví dụ di chuyển người bệnh, cho ăn và an toàn trong nhà.","who":"Người thuộc diện chăm sóc dài hạn đã được Trung tâm Quản lý Chăm sóc Dài hạn đánh giá.","how":"Đề nghị qua đường dây 1966 hoặc người quản lý ca. Mỗi mục tiêu tập luyện về nguyên tắc hoàn thành trong vòng 6 tháng.","note":"","tels":[{"label":"Đường dây Chăm sóc Dài hạn","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/cp-6451-70123-207.html"},{"id":"respite","cats":["care","caregiver"],"name":"Dịch vụ chăm sóc thay thế (để người chăm sóc được nghỉ)","agency":"Bộ Y tế và Phúc lợi Đài Loan; Trung tâm Quản lý Chăm sóc Dài hạn Thành phố Đài Bắc","what":"Giúp người nhà hoặc người chăm sóc được nghỉ ngơi. Có thể mời nhân viên chăm sóc đến nhà, hoặc cho người bệnh ở tạm trong cơ sở chăm sóc, hay ban ngày đến trung tâm chăm sóc ban ngày.","who":"Người có mức độ cần chăm sóc dài hạn cấp 2–8, và trong nhà có người chăm sóc. Gia đình đã thuê người chăm sóc nước ngoài cũng được dùng.","how":"Gọi 1966 để đăng ký đánh giá, sau đó người quản lý ca sẽ sắp xếp.","note":"Hạn mức được dùng mỗi năm theo mức Trung tâm Quản lý Chăm sóc Dài hạn xét duyệt.","tels":[{"label":"Đường dây Chăm sóc Dài hạn","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/np-6454-207.html"},{"id":"meals","cats":["food"],"name":"Dịch vụ bữa ăn dinh dưỡng cho người mất khả năng tự chăm sóc (giao cơm tận nhà)","agency":"Sở Xã hội Thành phố Đài Bắc; Trung tâm Quản lý Chăm sóc Dài hạn Thành phố Đài Bắc","what":"Người mất khả năng tự chăm sóc, không tự mua cơm hay nấu ăn được, có thể được giao bữa ăn đến nhà. Hộ nghèo và hộ cận nghèo được chính phủ trợ cấp tiền ăn.","who":"Người cao tuổi từ 65 tuổi trở lên mất khả năng tự chăm sóc, người thổ dân từ 55 tuổi trở lên mất khả năng tự chăm sóc, người bị sa sút trí tuệ, người khuyết tật mất khả năng tự chăm sóc, và người thuộc diện chăm sóc PAC. Nếu đã có người nấu ăn hoặc ban ngày có người chăm sóc, có thể sẽ không được duyệt.","how":"Gọi 1966 hoặc đăng ký trên trang web Thông tin Chăm sóc Dài hạn Thành phố Đài Bắc. Trung tâm Quản lý Chăm sóc Dài hạn sẽ đánh giá.","note":"Gia đình thông thường phải tự trả bao nhiêu cho mỗi bữa, vui lòng gọi điện hỏi.","tels":[{"label":"Đường dây Chăm sóc Dài hạn","tel":"1966","ext":"","addr":""},{"label":"Đầu mối liên hệ của Sở Xã hội","tel":"1999","ext":"1669、1665","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=8AC319BAED528FB5"},{"id":"dining","cats":["food"],"name":"Điểm chăm sóc và quan tâm tại cộng đồng (ăn chung)","agency":"Sở Xã hội Thành phố Đài Bắc","what":"Các điểm trong cộng đồng có bữa ăn chung và lớp học về sức khỏe, giúp người cao tuổi ra khỏi nhà và ăn cùng mọi người.","who":"Người cao tuổi từ 60 tuổi trở lên. Thời gian và chi phí ở mỗi điểm khác nhau.","how":"Tìm trên trang web của Sở Xã hội điểm gần nhà có phục vụ bữa ăn, rồi gọi điện trực tiếp để hỏi.","note":"Người đi lại khó khăn có tham gia được không, vui lòng hỏi điểm đó trước.","tels":[{"label":"Phòng Phúc lợi Người cao tuổi, Sở Xã hội","tel":"1999","ext":"6966～6968","addr":""}],"url":"https://dosw.gov.taipei/News_Content.aspx?n=222C9779823FA161&sms=E2A8B6B533500CB0&s=10DED4DB1CD357DC"},{"id":"nutrition","cats":["food"],"name":"Trung tâm Phổ biến Dinh dưỡng Cộng đồng Thành phố Đài Bắc (tư vấn dinh dưỡng)","agency":"Sở Y tế Thành phố Đài Bắc","what":"Chuyên viên dinh dưỡng tư vấn miễn phí một kèm một, có thể chọn đến trực tiếp hoặc gọi video. Phù hợp với người cao tuổi ăn không được, cân nặng cứ giảm.","who":"Người cao tuổi từ 65 tuổi trở lên.","how":"Gọi đường dây đặt hẹn hoặc kết bạn với tài khoản LINE chính thức để đặt hẹn.","note":"Vấn đề ăn uống do khó nuốt, vui lòng hỏi chuyên viên ngôn ngữ trị liệu hoặc chuyên viên dinh dưỡng của bệnh viện trước.","tels":[{"label":"Đường dây đặt hẹn tư vấn dinh dưỡng","tel":"02-2303-1297","ext":"","addr":""}],"url":"https://health.gov.taipei/cp.aspx?n=DB71E3DF2CB595C4&s=CB031B7D0A1607E9"},{"id":"aidcenter","cats":["clothing"],"name":"Trung tâm Dụng cụ Hỗ trợ Thành phố Đài Bắc","agency":"Sở Xã hội Thành phố Đài Bắc (ủy thác cho đơn vị tư nhân thực hiện)","what":"Tư vấn, đánh giá, sửa chữa dụng cụ hỗ trợ và cho mượn ngắn hạn dụng cụ hỗ trợ đã qua sử dụng. Trung tâm cũng nhận hồ sơ xin trợ cấp dụng cụ hỗ trợ.","who":"Người khuyết tật và người đủ điều kiện chăm sóc dài hạn đang sống tại Đài Bắc, cùng người nhà của họ.","how":"Gọi điện đặt hẹn đánh giá hoặc mượn trước, rồi mang giấy tờ tùy thân đến trung tâm.","note":"Giờ mở cửa của mỗi trung tâm khác nhau, vui lòng gọi điện xác nhận trước khi đi.","tels":[{"label":"Trung tâm Dụng cụ Hỗ trợ khu Tây","tel":"02-2523-7902","ext":"","addr":"臺北市中山區長安西路5巷2號"},{"label":"Trung tâm Dụng cụ Hỗ trợ khu Nam","tel":"02-2720-7364","ext":"","addr":"臺北市信義區大道路116號3樓之2（廣慈衛福大樓）"},{"label":"Trung tâm Dụng cụ Hỗ trợ Hợp Nghi","tel":"02-7713-7760","ext":"","addr":"臺北市中山區玉門街1號（臺北悠活村）"}],"url":"https://tpap.taipei/app37/cognitionView/index"},{"id":"ltcaids","cats":["clothing","housing"],"name":"Dụng cụ hỗ trợ và cải tạo nhà ở không rào cản (chăm sóc dài hạn)","agency":"Bộ Y tế và Phúc lợi Đài Loan; Trung tâm Quản lý Chăm sóc Dài hạn Thành phố Đài Bắc","what":"Chương trình chăm sóc dài hạn trợ cấp mua hoặc thuê dụng cụ hỗ trợ, ví dụ xe lăn, khung tập đi, đệm hơi. Chương trình cũng trợ cấp lắp tay vịn, làm đường dốc và cải tạo nhà tắm. Hạn mức được cấp 3 năm một lần.","who":"Người có mức độ cần chăm sóc dài hạn từ cấp 2 trở lên, và được đánh giá là cần dụng cụ hỗ trợ. Gia đình đã thuê người chăm sóc nước ngoài cũng được dùng.","how":"Gọi 1966 để đăng ký chăm sóc dài hạn. Sau khi đánh giá, đến Trung tâm Dụng cụ Hỗ trợ để đánh giá dụng cụ, rồi mua hoặc thuê ở cửa hàng có hợp đồng với chương trình chăm sóc dài hạn, chỉ trả phần tự trả.","note":"Hãy đánh giá trước rồi mới mua. Nếu mua trước rồi mới đăng ký, có thể sẽ không được trợ cấp.","tels":[{"label":"Đường dây Chăm sóc Dài hạn","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/np-6453-207.html"},{"id":"disaids","cats":["clothing","money"],"name":"Trợ cấp chi phí dụng cụ hỗ trợ cho người khuyết tật","agency":"Cục Xã hội và Gia đình, Bộ Y tế và Phúc lợi Đài Loan; Sở Xã hội Thành phố Đài Bắc","what":"Người có giấy chứng nhận khuyết tật khi mua dụng cụ hỗ trợ có thể xin trợ cấp theo từng loại dụng cụ. Đây là chế độ khác với dụng cụ hỗ trợ của chương trình chăm sóc dài hạn.","who":"Người có giấy chứng nhận khuyết tật và đáp ứng quy định của từng loại dụng cụ.","how":"Đăng ký tại Trung tâm Dụng cụ Hỗ trợ hoặc Sở Xã hội. Loại dụng cụ cần đánh giá thì phải được đánh giá và duyệt trước rồi mới được mua.","note":"Có thể đăng ký cùng lúc với dụng cụ hỗ trợ của chương trình chăm sóc dài hạn hay không, vui lòng hỏi Trung tâm Dụng cụ Hỗ trợ.","tels":[{"label":"Phòng Phúc lợi Người khuyết tật, Sở Xã hội","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://laws.gov.taipei/law/LawSearch/LawExport/FL002581?type=0"},{"id":"residential","cats":["housing","money"],"name":"Trợ cấp cho người ở cơ sở chăm sóc nội trú","agency":"Bộ Y tế và Phúc lợi Đài Loan; Sở Xã hội và Sở Y tế Thành phố Đài Bắc","what":"Người ở trong cơ sở chăm sóc dài hạn, viện điều dưỡng hoặc cơ sở nội trú cho người khuyết tật có thể xin trợ cấp chi phí lưu trú.","who":"Người ở trong cơ sở đủ điều kiện, và có mức độ cần chăm sóc dài hạn từ cấp 4 trở lên, hoặc có giấy chứng nhận khuyết tật từ mức trung bình trở lên.","how":"Tùy loại cơ sở đang ở, đăng ký với Sở Xã hội hoặc Sở Y tế. Có thể gọi 1966 để hỏi trước.","note":"","tels":[{"label":"Đường dây Chăm sóc Dài hạn","tel":"1966","ext":"","addr":""},{"label":"Phòng Phúc lợi Người cao tuổi, Sở Xã hội (cơ sở phúc lợi người cao tuổi)","tel":"1999","ext":"6966","addr":""},{"label":"Phòng Phúc lợi Người khuyết tật, Sở Xã hội (cơ sở nội trú cho người khuyết tật)","tel":"1999","ext":"6963","addr":""},{"label":"Phòng Chăm sóc Dài hạn, Sở Y tế (viện điều dưỡng, cơ sở chăm sóc dài hạn)","tel":"1999","ext":"1877","addr":""}],"url":"https://1966.gov.tw/LTC/cp-6457-69925-207.html"},{"id":"socialhousing","cats":["housing"],"name":"Nhà ở xã hội Thành phố Đài Bắc","agency":"Sở Phát triển Đô thị Thành phố Đài Bắc; Trung tâm Nhà ở và Tái thiết Đô thị Đài Bắc","what":"Khi nhà ở xã hội cho thuê, một phần sẽ được dành cho các gia đình khó khăn. Một số khu nhà ở xã hội còn có căn hộ không rào cản.","who":"Gia đình đủ điều kiện thuê nhà ở xã hội. Các gia đình khó khăn như có người khuyết tật, người cao tuổi từ 65 tuổi trở lên có thể đăng ký vào số căn được dành riêng.","how":"Theo dõi thông báo cho thuê của Sở Phát triển Đô thị hoặc Trung tâm Nhà ở và Tái thiết Đô thị, đăng ký trong thời gian nhận hồ sơ, sau đó bốc thăm công khai để quyết định thứ tự.","note":"Số căn dành riêng và điều kiện của mỗi đợt khác nhau, theo thông báo cho thuê.","tels":[{"label":"Đường dây nóng người dân Đài Bắc","tel":"1999","ext":"","addr":""}],"url":"https://udd.gov.taipei/"},{"id":"rehabbus","cats":["transport"],"name":"Xe buýt Phục Khang Đài Bắc (xe đưa đón người khuyết tật)","agency":"Cục Vận tải Công cộng, Sở Giao thông Thành phố Đài Bắc","what":"Xe buýt nhỏ không rào cản chở người khuyết tật, có thể lên xe cùng xe lăn, dùng để đi khám bệnh hoặc ra ngoài.","who":"Người có giấy chứng nhận khuyết tật của Đài Bắc và đang sống tại Đài Bắc. Có thể có 1 người đi cùng.","how":"Gọi đường dây đặt xe hoặc đặt xe trên mạng. Nhận đặt xe từ 8:00–17:00 mỗi ngày. Mở đặt xe từ 3 đến 5 ngày trước ngày đi.","note":"","tels":[{"label":"Đường dây đặt xe","tel":"0809-080650","ext":"","addr":""},{"label":"Đường dây đặt xe bằng giọng nói","tel":"0800-065165","ext":"","addr":""}],"url":"https://0809080650.gov.taipei/"},{"id":"ltcride","cats":["transport","care"],"name":"Đưa đón của chương trình chăm sóc dài hạn (đưa đón đi khám bệnh)","agency":"Sở Xã hội Thành phố Đài Bắc","what":"Xe đưa đón do chương trình chăm sóc dài hạn cung cấp, chở người mất khả năng tự chăm sóc đi lại giữa nhà và bệnh viện, phòng khám để khám bệnh hoặc tập phục hồi chức năng.","who":"Người thuộc diện chăm sóc dài hạn đang sống tại Đài Bắc, có mức độ cần chăm sóc dài hạn từ cấp 2 trở lên, bao gồm người bệnh được nhận vào PAC. Gia đình đã thuê người chăm sóc nước ngoài cũng được đăng ký.","how":"Trước tiên gọi 1966 để đăng ký chăm sóc dài hạn. Sau khi được duyệt, đặt xe trên mạng hoặc qua LINE (@taipeicareride), muộn nhất là một ngày trước ngày đi.","note":"","tels":[{"label":"Đường dây Chăm sóc Dài hạn","tel":"1966","ext":"","addr":""}],"url":"https://www.dosw.gov.taipei/cp.aspx?n=1847C5A001C1DC3C"},{"id":"wctaxi","cats":["transport"],"name":"Taxi đa dụng (chở được xe lăn)","agency":"Cục Vận tải Công cộng, Sở Giao thông Thành phố Đài Bắc","what":"Taxi có tấm dốc hoặc thiết bị nâng, người ngồi xe lăn cũng có thể lên xe trực tiếp.","who":"Tất cả mọi người, đặc biệt phù hợp với người ngồi xe lăn.","how":"Gọi đường dây gọi xe. Khi được kết nối, bấm phím 3 để chuyển đến đội taxi đa dụng. Nếu dùng điện thoại di động, vui lòng gọi 55850.","note":"","tels":[{"label":"Đường dây gọi xe miễn phí (điện thoại bàn)","tel":"0800-055850","ext":"","addr":""},{"label":"Gọi xe bằng điện thoại di động","tel":"55850","ext":"","addr":""}],"url":"https://pto.gov.taipei/cp.aspx?n=00988479A42B11C4"},{"id":"seniortaxi","cats":["transport"],"name":"Taxi ưu đãi cho người cao tuổi và người khuyết tật","agency":"Cục Vận tải Công cộng, Sở Giao thông Thành phố Đài Bắc","what":"Dùng thẻ người cao tuổi hoặc thẻ ưu đãi người khuyết tật của Đài Bắc khi đi taxi, mỗi chuyến được trừ một phần tiền xe.","who":"Chính người có thẻ người cao tuổi hoặc thẻ ưu đãi người khuyết tật của Đài Bắc.","how":"Gọi đường dây gọi xe rồi bấm phím 0, nói muốn đi taxi ưu đãi cho người cao tuổi và người khuyết tật. Khi xuống xe, quẹt thẻ để trả tiền. Nếu dùng điện thoại di động, vui lòng gọi 55850.","note":"","tels":[{"label":"Đường dây gọi xe miễn phí (điện thoại bàn)","tel":"0800-055850","ext":"","addr":""},{"label":"Gọi xe bằng điện thoại di động","tel":"55850","ext":"","addr":""}],"url":"https://pto.gov.taipei/News.aspx?n=2C4297730779B67A&sms=49DFD0964E3C4294"},{"id":"easycard","cats":["transport"],"name":"Thẻ người cao tuổi, thẻ ưu đãi người khuyết tật, thẻ người đi cùng","agency":"Sở Xã hội Thành phố Đài Bắc; các Văn phòng Quận","what":"Thẻ ưu đãi đi xe mà Đài Bắc cấp cho người cao tuổi và người khuyết tật. Người đi cùng cần thiết của người khuyết tật có thể làm thẻ người đi cùng.","who":"Người cao tuổi hoặc người khuyết tật có hộ khẩu và đang sống tại Đài Bắc. Thẻ người đi cùng cấp cho 1 người đi cùng cần thiết của người khuyết tật loại 1 hoặc loại 2.","how":"Mang đơn đăng ký, ảnh, thẻ căn cước hoặc giấy chứng nhận khuyết tật đến bất kỳ Văn phòng Quận nào để đăng ký. Có thể nhờ người khác làm thay.","note":"","tels":[{"label":"Sở Xã hội","tel":"1999","ext":"6966～6968","addr":""}],"url":"https://laws.gov.taipei/law/LawSearch/LawExport/FL038239?type=0"},{"id":"parking","cats":["transport"],"name":"Thẻ nhận diện chỗ đỗ xe dành cho người khuyết tật","agency":"Sở Xã hội Thành phố Đài Bắc","what":"Thẻ cho phép đỗ ở chỗ đỗ xe dành riêng cho người khuyết tật. Khi đỗ xe, đặt thẻ ở phía trước kính chắn gió.","who":"Người khuyết tật có hộ khẩu tại Đài Bắc, được đánh giá là đi lại khó khăn. Người nhà cũng có thể đăng ký thay. Mỗi người chỉ được một thẻ.","how":"Đến Trung tâm Dịch vụ Liên hợp của Tòa thị chính Đài Bắc, đăng ký trực tuyến trên trang dịch vụ trực tuyến của Thành phố Đài Bắc (service.taipei), hoặc gửi hồ sơ qua bưu điện.","note":"","tels":[{"label":"Phòng Phúc lợi Người khuyết tật, Sở Xã hội","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://www.dosw.gov.taipei/cp.aspx?n=411918B6262745BE"},{"id":"disallow","cats":["money"],"name":"Trợ cấp sinh hoạt cho người khuyết tật","agency":"Sở Xã hội Thành phố Đài Bắc; Văn phòng Quận nơi có hộ khẩu","what":"Người khuyết tật có kinh tế gia đình không dư dả có thể nhận trợ cấp sinh hoạt hằng tháng.","who":"Người có hộ khẩu và đang sống tại Đài Bắc, có giấy chứng nhận khuyết tật, và thu nhập cùng tài sản của gia đình dưới mức quy định.","how":"Mang thẻ căn cước, đơn đăng ký và bản sao trang bìa sổ tiết kiệm đến Ban Xã hội của Văn phòng Quận nơi có hộ khẩu để đăng ký.","note":"Phải có giấy chứng nhận khuyết tật trước. Mức thu nhập và tài sản được điều chỉnh mỗi năm, vui lòng gọi điện xác nhận.","tels":[{"label":"Phòng Phúc lợi Người khuyết tật, Sở Xã hội","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://dosw.gov.taipei/News_Content.aspx?n=91F35523B74F69AC&s=8D79133341A528E3"},{"id":"carerallow","cats":["money","caregiver"],"name":"Trợ cấp chăm sóc đặc biệt cho người cao tuổi thu nhập trung bình thấp","agency":"Sở Xã hội Thành phố Đài Bắc; Trung tâm Dịch vụ Người cao tuổi ở các quận","what":"Người nhà ở nhà toàn tâm chăm sóc người cao tuổi mất khả năng tự chăm sóc mức nặng, vì vậy không thể đi làm, có thể nhận trợ cấp chăm sóc hằng tháng.","who":"Người cao tuổi đang nhận trợ cấp sinh hoạt cho người cao tuổi thu nhập trung bình thấp, mất khả năng tự chăm sóc từ mức nặng trở lên, do người nhà chăm sóc, và không thuê người chăm sóc, không dùng dịch vụ chăm sóc tại nhà hoặc chăm sóc ban ngày.","how":"Gọi điện cho Trung tâm Dịch vụ Người cao tuổi của quận nơi đang sống, họ sẽ giúp đăng ký.","note":"Điều kiện và số tiền có thể được điều chỉnh, vui lòng gọi điện xác nhận trước khi đăng ký.","tels":[{"label":"Trung tâm Dịch vụ Người cao tuổi Songshan","tel":"02-2768-5636","ext":"","addr":""},{"label":"Trung tâm Dịch vụ Người cao tuổi Xinyi","tel":"02-8787-0300","ext":"","addr":""},{"label":"Trung tâm Dịch vụ Người cao tuổi Da'an","tel":"02-2708-6255","ext":"","addr":""},{"label":"Nhà ở và Trung tâm Dịch vụ Người cao tuổi Zhongshan","tel":"02-2542-0006","ext":"","addr":""},{"label":"Trung tâm Dịch vụ Người cao tuổi Neihu","tel":"02-2632-5560","ext":"","addr":""},{"label":"Trung tâm Dịch vụ Người cao tuổi Nangang","tel":"02-2653-5311","ext":"","addr":""},{"label":"Trung tâm Dịch vụ Người cao tuổi Zhongzheng","tel":"02-2381-4571","ext":"","addr":""},{"label":"Trung tâm Dịch vụ Người cao tuổi Datong","tel":"02-2592-9808","ext":"","addr":""},{"label":"Trung tâm Dịch vụ Người cao tuổi Wanhua","tel":"02-2361-0666","ext":"","addr":""},{"label":"Trung tâm Dịch vụ Người cao tuổi Wenshan","tel":"02-2234-4893","ext":"","addr":""},{"label":"Trung tâm Dịch vụ Người cao tuổi Shilin","tel":"02-2838-1571","ext":"","addr":""},{"label":"Trung tâm Dịch vụ Người cao tuổi Beitou","tel":"02-2892-9702","ext":"","addr":""}],"url":"https://elders.gov.taipei/News_Content.aspx?n=40A74DAD56B74FC0&sms=21884AF41A49B03F&s=451E3C675205415B"},{"id":"hospcarer","cats":["money"],"name":"Trợ cấp thuê người chăm sóc khi nằm viện","agency":"Sở Xã hội Thành phố Đài Bắc","what":"Người dân có khó khăn kinh tế phải nằm viện vì bệnh cấp tính có thể xin trợ cấp chi phí thuê người chăm sóc.","who":"Hộ nghèo của Đài Bắc, người đủ điều kiện nhận trợ cấp sinh hoạt cho người cao tuổi thu nhập trung bình thấp, hoặc người đang được Sở Xã hội hỗ trợ theo dõi.","how":"Khi nằm viện, hãy hỏi nhân viên công tác xã hội của bệnh viện trước, hoặc gọi điện hỏi Sở Xã hội.","note":"Số tiền và số ngày được trợ cấp, vui lòng gọi điện xác nhận.","tels":[{"label":"Phòng Công tác Xã hội, Sở Xã hội","tel":"02-2720-8889","ext":"1633","addr":""}],"url":"https://elders.gov.taipei/News_Content.aspx?n=40A74DAD56B74FC0&sms=21884AF41A49B03F&s=46DFDD2811FCC6DD"},{"id":"relief","cats":["money"],"name":"Cứu trợ khẩn cấp","agency":"Sở Xã hội Thành phố Đài Bắc; Trung tâm Dịch vụ Phúc lợi Xã hội, Văn phòng Quận","what":"Khi người nhà đột ngột bị bệnh nặng hoặc bị thương, cuộc sống bỗng nhiên không trụ được, có thể xin tiền cứu trợ một lần.","who":"Người có hộ khẩu tại Đài Bắc, trong vòng 3 tháng gần đây gặp các trường hợp như người nhà bị bệnh nặng, bị thương, hoặc người kiếm tiền chính trong nhà không thể làm việc.","how":"Mang giấy tờ chứng minh đến Trung tâm Dịch vụ Phúc lợi Xã hội hoặc Văn phòng Quận nơi có hộ khẩu để đăng ký.","note":"","tels":[{"label":"Phòng Cứu trợ Xã hội, Sở Xã hội","tel":"1999","ext":"1609","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=0BF751F1B9F07AA1"},{"id":"relief2","cats":["money"],"name":"Hỗ trợ khó khăn khẩn cấp (trước đây gọi là “Quan tâm ngay”)","agency":"Sở Xã hội Thành phố Đài Bắc; Văn phòng Quận","what":"Khi người nhà bị thương hoặc bệnh nặng, phải điều trị từ 1 tháng trở lên và không thể làm việc, hoặc khi mất việc vì phải chăm sóc người nhà, gia đình có thể nhanh chóng nhận tiền hỗ trợ.","who":"Gia đình gặp những khó khăn nêu trên trong vòng 3 tháng gần đây. Cùng một sự việc, về nguyên tắc chỉ đăng ký một lần.","how":"Đăng ký tại Văn phòng Quận.","note":"","tels":[{"label":"Phòng Cứu trợ Xã hội, Sở Xã hội","tel":"1999","ext":"1609","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=7011FE50261D43B5"},{"id":"carersupport","cats":["caregiver"],"name":"Điểm hỗ trợ người chăm sóc trong gia đình và đường dây quan tâm","agency":"Sở Xã hội Thành phố Đài Bắc; Bộ Y tế và Phúc lợi Đài Loan","what":"Nơi người chăm sóc có thể tìm đến khi mệt mỏi hoặc không biết chăm sóc thế nào: lớp kỹ năng chăm sóc, hoạt động giảm căng thẳng, nhóm hỗ trợ, tư vấn tâm lý. Trong lúc đi học, có thể sắp xếp người chăm sóc tạm thời.","who":"Người chăm sóc trong gia đình có người cần chăm sóc dài hạn hoặc có người khuyết tật. Người nhà trong gia đình có thuê người chăm sóc nước ngoài cũng được dùng.","how":"Tùy quận nơi đang sống, gọi điện cho điểm hỗ trợ tương ứng. Nếu muốn tâm sự trước về áp lực chăm sóc, có thể gọi đường dây quan tâm.","note":"","tels":[{"label":"Đường dây quan tâm người chăm sóc trong gia đình (toàn quốc)","tel":"0800-507272","ext":"","addr":""},{"label":"Điểm hỗ trợ quận Zhongshan, Songshan, Nangang","tel":"02-7703-1972","ext":"","addr":"臺北市中山區建國北路二段129號7樓"},{"label":"Điểm hỗ trợ quận Xinyi","tel":"02-2578-0285","ext":"217、218","addr":""},{"label":"Điểm hỗ trợ quận Da'an","tel":"02-2367-6646","ext":"8536、8721","addr":""},{"label":"Điểm hỗ trợ quận Zhongzheng, Neihu","tel":"02-2311-4678","ext":"","addr":""},{"label":"Điểm hỗ trợ quận Wenshan","tel":"02-2234-2199","ext":"","addr":""},{"label":"Điểm hỗ trợ quận Wanhua, Datong (gia đình cần chăm sóc dài hạn)","tel":"02-2308-5739","ext":"","addr":""},{"label":"Điểm hỗ trợ quận Datong (gia đình có người khuyết tật)","tel":"02-2550-6658","ext":"","addr":""},{"label":"Điểm hỗ trợ quận Beitou, Shilin","tel":"02-2838-1571","ext":"214","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=70898293C7B4ABE5"},{"id":"foreignhire","cats":["caregiver"],"name":"Thuê người chăm sóc nước ngoài và đường dây 1955","agency":"Cục Phát triển Lực lượng Lao động, Bộ Lao động Đài Loan; Trung tâm Quản lý Chăm sóc Dài hạn Thành phố Đài Bắc","what":"Nếu muốn thuê người chăm sóc nước ngoài, trước tiên phải xác nhận người bệnh đủ điều kiện. Chủ thuê và người chăm sóc nước ngoài khi có vấn đề đều có thể gọi 1955, miễn phí, 24 giờ, có phục vụ nhiều ngôn ngữ.","who":"Người bệnh được đánh giá tại bệnh viện được chỉ định là cần chăm sóc cả ngày, hoặc đáp ứng các điều kiện như một số dạng khuyết tật nhất định. Người đủ 80 tuổi trở lên được miễn đánh giá y tế.","how":"Sau khi được đánh giá tại bệnh viện được chỉ định, gửi hồ sơ đến Trung tâm Quản lý Chăm sóc Dài hạn Thành phố Đài Bắc, rồi làm theo quy trình để nộp đơn lên Bộ Lao động.","note":"1955 có phục vụ nhiều ngôn ngữ, bao gồm tiếng Indonesia, tiếng Việt và tiếng Thái.","tels":[{"label":"Đường dây tư vấn và khiếu nại lao động 1955 (24 giờ)","tel":"1955","ext":"","addr":""},{"label":"Trung tâm Dịch vụ Liên hợp Tuyển dụng Trực tiếp","tel":"02-6613-0811","ext":"","addr":""}],"url":"https://dhsc.wda.gov.tw/Industry?MenuId=fea6ae19-627e-4418-8662-bc2b2e85977d"},{"id":"foreignltc","cats":["caregiver","care"],"name":"Dịch vụ chăm sóc dài hạn cho gia đình có thuê người chăm sóc nước ngoài","agency":"Bộ Y tế và Phúc lợi Đài Loan; Trung tâm Quản lý Chăm sóc Dài hạn Thành phố Đài Bắc","what":"Gia đình có người chăm sóc nước ngoài cũng có thể dùng dịch vụ chuyên môn, đưa đón, dụng cụ hỗ trợ, cải tạo nhà ở không rào cản và dịch vụ chăm sóc thay thế. Khi người chăm sóc nước ngoài nghỉ phép, có thể đăng ký dịch vụ chăm sóc thay thế.","who":"Trong nhà có người chăm sóc nước ngoài, và người bệnh có mức độ cần chăm sóc dài hạn từ cấp 2 trở lên. Trong thời gian trống chưa có người chăm sóc nước ngoài, như khi ปลี่ยนเอง"},{"t":"key","h":"ผู้ป่วยที่ใช้สายให้อาหารทางจมูก","ul":["ก่อนให้อาหารทางสาย ตรวจตำแหน่งของสายและขีดบอกระยะบนสายก่อน","ระหว่างให้อาหารทางสาย ยกหัวเตียงสูง 30–45 องศา","หลังให้อาหารทางสาย ให้อยู่ท่าเดิมอย่างน้อย 30 นาที ถึง 1 ชั่วโมง"],"figBottom":"angle"},{"t":"h","x":"ฝึกการกลืน"},{"t":"fig","id":"swallowex"},{"t":"p","x":"ก่อนฝึกการกลืน ต้องให้นักแก้ไขการพูดประเมินก่อน แล้วจึงฝึกตามแผน ข้างล่างนี้เป็นท่าฝึกที่ใช้บ่อย จะฝึกท่าไหน ฝึกกี่ครั้ง ให้ถามนักแก้ไขการพูดก่อน"},{"t":"ul","x":["ฝึกในท่านั่งตรงหรือกึ่งนั่ง อย่าฝึกในท่านอน","แก้ม: ป่องแก้ม ทำปากจู๋ และอ้าปาก","ลิ้น: แลบลิ้นออก ขยับลิ้นไปซ้ายขวา และยกลิ้นขึ้น","กลืนเปล่า: ไม่มีอาหารในปาก ให้กลืนน้ำลาย 1 ครั้ง ผู้ที่มีน้ำลายมาก หรือสำลักน้ำลายบ่อย ให้ถามนักแก้ไขการพูดก่อน","ทำเบาๆ ช้าๆ อย่ากลั้นหายใจเบ่งแรง เหนื่อยแล้วให้หยุด","ถ้าสำลักไอ หายใจหอบมาก หรือสีหน้าเปลี่ยนไประหว่างฝึก: หยุดทันที และบอกแพทย์หรือพยาบาล"]},{"t":"key","h":"อาหารเหล่านี้ต้องระวังเป็นพิเศษ","ul":["น้ำเปล่าและน้ำแกงใสๆ ทำให้สำลักได้ง่ายที่สุด","ข้าวสวยที่แห้ง ถั่ว ผักใบ และอาหารที่มีเศษร่วนมาก ก็ทำให้สำลักหรือติดคอได้ง่าย","อาหารที่มีน้ำปนกับเม็ด เช่น ข้าวต้ม หรือข้าวที่แช่ในน้ำแกง และอาหารเหนียวๆ เช่น บัวลอย โมจิ หรือขนมเข่ง ก็ทำให้สำลักหรือติดคอได้ง่ายมาก","อาหารเหล่านี้กินได้หรือไม่ และต้องปรับอย่างไร เช่น เติมสารเพิ่มความข้น หรือปั่นให้ละเอียด ให้ทำตามที่นักแก้ไขการพูดและนักโภชนาการแนะนำ","อย่าบังคับป้อน อย่าเร่ง และอย่าให้ผู้ป่วยดื่มน้ำคำใหญ่ๆ"]},{"t":"warn","h":"การกลืนต้องได้รับการประเมิน","ul":["อย่าดูแค่ว่ากินไปหลายคำแล้วไม่เป็นอะไร แล้วคิดว่ากลืนได้ปลอดภัย","หลังกินหรือดื่ม ถ้าเสียงเปลี่ยนเหมือนมีน้ำในคอ มีเสียงครืดคราด หรือเสียงแหบ หลังกินมักแน่นหน้าอก หายใจเร็วขึ้น หรือมีไข้โดยไม่รู้สาเหตุ ต้องบอกแพทย์หรือพยาบาล"]}]},{"title":"ป้องกันการหกล้ม","desc":"สามขั้นตอนลงจากเตียง จุดสำคัญด้านความปลอดภัยในหอผู้ป่วยและที่บ้าน","body":[{"t":"h","x":"ทำไมหลังเป็นโรคหลอดเลือดสมองจึงหกล้มง่าย"},{"t":"p","x":"แขนขาอ่อนแรงข้างหนึ่ง ทรงตัวได้แย่ลง เวียนหัว รีบไปเข้าห้องน้ำ ล้วนทำให้มีโอกาสหกล้มมากขึ้น การหกล้มอาจทำให้กระดูกหักหรือศีรษะบาดเจ็บ ทำให้การฟื้นฟูต้องหยุดชะงัก"},{"t":"key","h":"สามขั้นตอนลงจากเตียง","figTop":"steps","ul":["ลุกขึ้นนั่งบนเตียงก่อน นั่ง 30 วินาที","ห้อยเท้าลง นั่งที่ขอบเตียงอีก 30 วินาที","ลุกขึ้นยืน ยืนให้มั่นคง 30 วินาที ถ้าไม่เวียนหัวจึงเริ่มเดิน"]},{"t":"h","x":"ระหว่างนอนโรงพยาบาล"},{"t":"ul","x":["ลงจากเตียงและเข้าห้องน้ำ ต้องมีคนอยู่ด้วยทุกครั้ง ถ้าต้องการความช่วยเหลือ โปรดกดกริ่งเรียก อย่าฝืนทำเอง","ยกราวกั้นเตียงขึ้น ปรับเตียงให้ต่ำที่สุด ล็อกล้อเตียง","วางของที่ใช้บ่อยไว้ทางข้างที่มีแรง ในที่ที่เอื้อมมือหยิบถึง","ใส่รองเท้ากันลื่นที่พอดีเท้า ไม่ใส่รองเท้าแตะ กางเกงอย่ายาวเกินไป","ถ้าพื้นเปียก โปรดแจ้งเจ้าหน้าที่"]},{"t":"h","x":"การนั่งรถเข็นนั่งและการเคลื่อนย้ายตัว"},{"t":"ul","x":["ก่อนขึ้นหรือลงรถเข็นนั่ง ล็อกเบรกทั้งสองข้าง และพับที่วางเท้าขึ้นก่อน","วิธีเคลื่อนย้ายตัว โปรดทำตามขั้นตอนที่นักบำบัดสอน"]},{"t":"h","x":"เมื่อกลับบ้านแล้ว"},{"t":"ul","x":["ติดราวจับในห้องน้ำและข้างโถส้วม ปูแผ่นกันลื่นบนพื้น","เก็บของเกะกะ สายไฟ และพรมผืนเล็กออกจากทางเดิน","ตอนกลางคืนเปิดไฟดวงเล็กไว้หนึ่งดวง"]},{"t":"key","h":"แผนป้องกันการหกล้ม","ul":["ให้นักบำบัดประเมินความเสี่ยงหกล้ม แล้ววางแผนป้องกันการหกล้มตามผล","หลังกลับบ้าน ให้ทีมแพทย์ประเมินอีกอย่างน้อยปีละ 1 ครั้ง ถ้าเพิ่งหกล้มหรือเกือบหกล้ม ให้รีบบอกทีม","การฝึกทรงตัวช่วยลดการหกล้ม ถามนักบำบัดได้ว่าเหมาะจะรำไทเก๊ก หรือฝึก “เดินไปด้วย ทำเรื่องง่ายๆ ไปด้วย” หรือไม่ เช่น เดินไปนับเลขไป ให้ฝึกกับนักบำบัดก่อน","หลังเป็นโรคหลอดเลือดสมอง ถ้าขยับตัวน้อย กระดูกจะบางลงง่าย หกล้มแล้วกระดูกหักง่ายขึ้น ถามแพทย์ได้ว่าต้องประเมินความเสี่ยงกระดูกหักหรือไม่","ไม้เท้า อุปกรณ์ช่วยเดิน หรืออุปกรณ์พยุงข้อเท้าที่เหมาะสม ช่วยให้ทรงตัวดีขึ้นและล้มน้อยลง ให้นักบำบัดประเมินและปรับให้พอดีก่อนใช้"]},{"t":"fig","id":"safe"},{"t":"warn","h":"ถ้าเกิดหกล้ม","ul":["อย่ารีบดึงผู้ป่วยขึ้น ดูก่อนว่าผู้ป่วยรู้สึกตัวดีหรือไม่ เจ็บตรงไหน","ถ้าอยู่ในโรงพยาบาล โปรดกดกริ่งเรียกทันที","ถ้าอยู่ที่บ้าน แล้วศีรษะกระแทก เจ็บจนขยับไม่ได้ หรือไม่ค่อยรู้สึกตัว โปรดโทร 119"]}]},{"title":"ป้องกันโรคหลอดเลือดสมองซ้ำ","desc":"กินยาตรงเวลา วัดความดัน รู้จักสัญญาณเตือนโรคหลอดเลือดสมองซ้ำ","body":[{"t":"h","x":"คนที่เคยเป็นโรคหลอดเลือดสมอง ต้องป้องกันไม่ให้เป็นซ้ำ"},{"t":"p","x":"คนที่เคยเป็นโรคหลอดเลือดสมอง มีโอกาสเป็นซ้ำสูงกว่าคนทั่วไป การคุมความดันโลหิต น้ำตาลในเลือด และไขมันในเลือดให้ดี ช่วยลดโอกาสนี้ได้"},{"t":"fig","id":"three"},{"t":"h","x":"กินยาตรงเวลา"},{"t":"ul","x":["ยาป้องกันลิ่มเลือด และยาคุมความดันโลหิต น้ำตาลในเลือด ไขมันในเลือด ต้องกินทุกวันตามที่แพทย์สั่ง","แม้รู้สึกว่าดีขึ้นมากแล้ว ก็อย่าหยุดยาหรือลดยาเอง","ถ้ามีเลือดออกที่หยุดยาก ถ่ายอุจจาระสีดำ หรือถ่ายเป็นเลือด โปรดแจ้งแพทย์โดยเร็ว","แพทย์จะเลือกยาป้องกันลิ่มเลือดตามสาเหตุของโรคหลอดเลือดสมอง บางคนในช่วงแรกหลังเป็นโรคหลอดเลือดสมอง จะกินยาต้านเกล็ดเลือด 2 ชนิดพร้อมกันในช่วงสั้นๆ แล้วส่วนใหญ่จะกลับมากินชนิดเดียว จะเปลี่ยนเมื่อไรให้แพทย์เป็นผู้ตัดสินใจ","ผู้ที่มีภาวะหัวใจห้องบนสั่นพลิ้ว (AF) แพทย์มักจะสั่งยาต้านการแข็งตัวของเลือดเพื่อป้องกันโรคหลอดเลือดสมองซ้ำ ผู้ที่กินยากลุ่มนี้ต้องเจาะเลือดตรวจสม่ำเสมอตามนัดของแพทย์ เพื่อตรวจการทำงานของตับและไต","หลังเป็นโรคหลอดเลือดสมอง ปกติต้องคุมไขมันในเลือดด้วย ผู้ที่มีปัญหาหลอดเลือดแข็ง แพทย์อาจตั้งเป้าคอเลสเตอรอลตัวร้าย (LDL) ให้ต่ำกว่า 70 mg/dL"]},{"t":"key","h":"วัดความดันแบบ “722”","figTop":"bp722","ul":["7: วัดต่อเนื่อง 7 วัน","2: วัดตอนเช้าหลังตื่นนอน และตอนค่ำก่อนเข้านอน อย่างละหนึ่งรอบ","2: แต่ละรอบ วัดสองครั้ง"],"p":"จดตัวเลขไว้ และนำไปให้แพทย์ดูตอนมาตรวจตามนัด หลังเป็นโรคหลอดเลือดสมอง โดยทั่วไปแนะนำให้ความดันโลหิตต่ำกว่า 130/80 mmHg (ตัวเลขบนต่ำกว่า 130 ตัวเลขล่างต่ำกว่า 80) ควรคุมความดันให้ถึงเป้าหมาย แต่ถ้าต่ำเกินไปจนเวียนหัวก็ไม่ดี เป้าหมายของแต่ละคนให้ทำตามที่แพทย์สั่ง อย่าปรับยาเอง เวลาวัดความดัน ให้วัดที่แขนข้างที่ไม่ได้รับผลจากโรคหลอดเลือดสมอง และวัดแขนข้างเดิมทุกครั้ง"},{"t":"h","x":"นิสัยในชีวิตประจำวัน"},{"t":"fig","id":"life"},{"t":"ul","x":["ไม่สูบบุหรี่ ดื่มเหล้าให้น้อย","กินอาหารมันน้อย หวานน้อย เค็มน้อย กินผักและอาหารที่มีใยอาหารสูงให้มาก","ขยับร่างกายอย่างต่อเนื่องตามคำแนะนำของนักบำบัด","ถ้ารู้สึกว่าหัวใจเต้นไม่สม่ำเสมอ ใจสั่น หรือแน่นหน้าอก โปรดแจ้งแพทย์","มาตรวจตามนัด","ถ้าร่างกายไหว ควรออกกำลังกายระดับปานกลางอย่างน้อยสัปดาห์ละ 4 ครั้ง ครั้งละอย่างน้อย 10 นาที เช่น เดินเร็วจนหายใจแรงขึ้นแต่ยังพูดได้ ถ้าทำไม่ได้ ขยับร่างกายบ้างก็ยังดีกว่าไม่ขยับเลย ก่อนเริ่ม ให้ถามแพทย์หรือนักบำบัดว่าควรออกกำลังกายแค่ไหน","ลองกินแบบ \"อาหารเมดิเตอร์เรเนียน\": กินผัก ผลไม้ ธัญพืชไม่ขัดสี ถั่ว ถั่วเปลือกแข็ง และปลาให้มาก ใช้น้ำมันพืช เช่น น้ำมันมะกอก แทนน้ำมันหมูและเนย กินเนื้อแดงและอาหารแปรรูปให้น้อย ถ้ามีปัญหาการกลืน เป็นเบาหวาน หรือโรคไต ให้ถามนักโภชนาการก่อน"]},{"t":"sos"},{"t":"ul","x":["อย่าขับรถหรือขี่มอเตอร์ไซค์ไปโรงพยาบาลเอง","ระหว่างรอรถพยาบาล อย่าให้ผู้ป่วยกินอาหาร ดื่มน้ำ หรือกินยา","อย่ารอให้อาการหายเอง","ยิ่งไปถึงโรงพยาบาลเร็วยิ่งดี การรักษาที่ช่วยเปิดหลอดเลือดให้เลือดไหลได้อีกครั้งมีเวลาจำกัด เช่น ยาละลายลิ่มเลือดโดยทั่วไปต้องให้ภายใน 4.5 ชั่วโมงหลังเริ่มมีอาการ ดังนั้นถ้ามีสัญญาณเตือน ให้โทร 119 ทันที อย่ารอ"]}]},{"title":"อารมณ์และการสื่อสาร","desc":"อารมณ์ที่เปลี่ยนไปหลังเป็นโรคหลอดเลือดสมอง วิธีพูดกับผู้ป่วย การพักของผู้ดูแล","body":[{"t":"h","x":"อารมณ์ที่เปลี่ยนไปหลังเป็นโรคหลอดเลือดสมอง"},{"t":"p","x":"หลังเป็นโรคหลอดเลือดสมอง อารมณ์เศร้า ร้องไห้ง่าย หรือโมโหง่าย เป็นเรื่องที่พบได้บ่อย เกี่ยวข้องทั้งกับสมองที่ได้รับบาดเจ็บ และชีวิตที่เปลี่ยนไปอย่างกะทันหัน ไม่ใช่เพราะผู้ป่วยไม่เข้มแข็งพอ"},{"t":"warn","h":"ปัญหาอารมณ์ต้องรู้ให้เร็ว","ul":["เศร้าทั้งวัน ไม่สนใจอะไรเลย","ตึงเครียด กังวล กระวนกระวายบ่อยๆ","ไม่อยากฝึก ไม่อยากพูด","นอนไม่หลับหรือกินไม่ลง","พูดบ่อยๆ ว่าตัวเองเป็นภาระของครอบครัว"],"p":"หลังเป็นโรคหลอดเลือดสมอง ภาวะซึมเศร้าและวิตกกังวลพบได้บ่อย เกิดได้ทุกเมื่อ ไม่ต้องรอให้เป็นนานก่อนแล้วค่อยบอก ควรตรวจคัดกรองอารมณ์เป็นระยะ เช่น ตอนนอนโรงพยาบาล ประมาณ 3 เดือนและ 6 เดือนหลังเป็นโรค และตอนมาตรวจตามนัดหลังจากนั้น ถ้ายังไม่เคยตรวจ ขอให้ทีมแพทย์ประเมินได้ คนที่พูดลำบากก็มีวิธีประเมินที่เหมาะสม ภาวะซึมเศร้าและวิตกกังวลรักษาได้ แพทย์อาจส่งต่อจิตแพทย์หรือนักจิตวิทยา รักษาด้วยการบำบัดทางจิตใจหรือยา อย่าซื้อยากินเอง ถ้าผู้ป่วยพูดว่าอยากตายหรืออยากทำร้ายตัวเอง ให้บอกแพทย์หรือพยาบาลทันที หรือโทรสายด่วนสุขภาพจิต 1925 ตลอด 24 ชั่วโมง"},{"t":"key","h":"นอนหลับให้ดีก็เป็นการฟื้นฟู","ul":["เข้านอนและตื่นนอนเป็นเวลา กลางวันให้ลุกขึ้นทำกิจกรรมมากๆ ถ้าง่วงงีบได้ แต่อย่างีบนานเกินไป","ก่อนนอนลดการดูโทรศัพท์และโทรทัศน์ ตั้งแต่บ่ายไปแล้วไม่ดื่มกาแฟหรือชาเข้มข้น","ถ้านอนกรนเสียงดังมาก หายใจหยุดเป็นพักๆ หรือกลางวันง่วงตลอด อาจเป็นภาวะหยุดหายใจขณะหลับ โปรดบอกแพทย์","ถ้ากลางคืนนอนไม่หลับเลย วิตกกังวลบ่อย หรือรู้สึกเศร้า ให้บอกแพทย์ อย่ากินยานอนหลับหรือยากล่อมประสาทเองเป็นเวลานาน และอย่าดื่มเหล้าเพื่อช่วยให้หลับ"]},{"t":"key","h":"หลังเป็นโรค เหนื่อยง่าย","p":"หลังเป็นโรคหลอดเลือดสมอง จะเหนื่อยง่ายมาก พักแล้วก็ไม่ค่อยหาย เรียกว่าอาการเหนื่อยล้าหลังโรคหลอดเลือดสมอง พบได้บ่อย ให้บอกทีมแพทย์ มีวิธีช่วยให้เหนื่อยน้อยลงและนอนหลับดีขึ้น อย่าซื้อยาบำรุงกำลังหรือยาแก้เหนื่อยกินเอง"},{"t":"h","x":"การสื่อสารกับผู้ป่วยที่พูดลำบาก"},{"t":"fig","id":"talk"},{"t":"ul","x":["พูดแบบหันหน้าเข้าหากัน พูดให้ช้าลง ใช้ประโยคสั้นลง","พูดครั้งละเรื่องเดียว","ใช้คำถามที่ตอบได้ว่า “ใช่” หรือ “ไม่ใช่” ให้มาก","ใช้ท่าทาง รูปภาพ หรือของจริงประกอบ","ให้เวลาผู้ป่วยตอบ อย่ารีบพูดแทนจนจบ","พูดแบบที่พูดกับผู้ใหญ่ อย่าทำเหมือนผู้ป่วยเป็นเด็ก","ถ้าผู้ป่วยดูเหมือนได้ยินไม่ชัด ให้ขอตรวจการได้ยิน ถ้าผู้ป่วยพูดลำบากมาก นักแก้ไขการพูดสอนครอบครัววิธีสื่อสารได้ และใช้ตัวช่วย เช่น กระดานสื่อสาร บัตรรูปภาพ หรือแท็บเล็ตได้"]},{"t":"key","h":"ฝึกพูดทีละขั้น","ul":["ปัญหาการพูดแต่ละแบบต้องฝึกต่างกัน จะฝึกอะไร ฝึกอย่างไร ให้ทำตามที่นักแก้ไขการพูดแนะนำก่อน","ถ้านักบำบัดแนะนำให้ฝึกแบบนี้: เริ่มจากคำง่ายๆ เช่น “ได้” “น้ำ” แล้วฝึกพูดชื่อของใช้ประจำวัน เช่น แก้ว ช้อน สุดท้ายฝึกประโยคสั้นๆ เช่น “อยากดื่มน้ำ”","อาจเริ่มจากฝึกฟังคำสั่งง่ายๆ ให้เข้าใจก่อน เช่น “ยกมือ” “อ้าปาก” เวลาพูดให้ทำท่าทางให้ดูไปด้วย แล้วค่อยๆ พูดตามนักแก้ไขการพูด","ผู้ที่พูดไม่ชัด นักบำบัดอาจสอนให้พูดช้าลง ดังขึ้น และอ้าปากกว้างขึ้น","ฝึกทุกวันวันละนิด ให้เวลาเขาค่อยๆ พูด อย่าเร่ง และอย่าคอยแก้ตลอด ถ้าพูดไม่ออก ให้ชี้ เขียน หรือใช้บัตรภาพแทน พูดถูกแล้วให้ชมเขา"]},{"t":"h","x":"ผู้ดูแลก็ต้องดูแลตัวเอง"},{"t":"ul","x":["ให้คนในครอบครัวผลัดกันดูแล อย่าให้คนเดียวรับทุกอย่าง","ผู้ดูแลต้องมีเวลาพักและเวลากินข้าวที่แน่นอน","ผู้ดูแลเข้าร่วมการสอนสุขศึกษาและการฝึกทักษะการดูแลได้ตั้งแต่ผู้ป่วยนอนโรงพยาบาล เรียนแล้วให้ทำให้พยาบาลหรือนักบำบัดดู เพื่อให้แน่ใจว่าทำได้จริง","ถ้ารู้สึกไม่ไหว นอนไม่หลับ หรือรู้สึกเศร้า คุยกับพยาบาลหรือนักสังคมสงเคราะห์ได้ หรือขอให้ทีมส่งต่อกลุ่มช่วยเหลือผู้ดูแล","ถ้ารู้สึกเหงาหรือไม่ค่อยได้พบปะผู้คน เข้าร่วมกลุ่มผู้ป่วยหรือกลุ่มช่วยเหลือกันได้ ปัญหาที่อายไม่กล้าพูด เช่น เรื่องเพศสัมพันธ์ที่เปลี่ยนไป หรือปัสสาวะเล็ด พบได้บ่อย ถามแพทย์หรือพยาบาลได้โดยไม่ต้องกังวล"]},{"t":"fig","id":"rest"},{"t":"key","h":"สายด่วนการดูแลระยะยาว 1966","p":"โทร 1966 เพื่อสอบถามเรื่องแหล่งช่วยเหลือด้านการดูแลระยะยาวได้ เช่น บริการดูแลแทนชั่วคราวเพื่อให้ผู้ดูแลได้พัก และบริการดูแลที่บ้าน"}]},{"title":"เตรียมออกจากโรงพยาบาลกลับบ้าน","desc":"สิ่งที่ต้องทำให้เป็นก่อนออกจากโรงพยาบาล สภาพแวดล้อมในบ้าน แหล่งช่วยเหลือด้านการดูแลระยะยาว","body":[{"t":"h","x":"สิ่งที่ต้องทำให้เป็นก่อนออกจากโรงพยาบาล"},{"t":"ul","x":["ช่วยผู้ป่วยพลิกตัว ขึ้นลงเตียง และขึ้นลงรถเข็นนั่งอย่างปลอดภัย","วิธีป้อนอาหาร หรือวิธีให้อาหารทางสายที่ใส่ทางจมูก","ยาแต่ละชนิดใช้ทำอะไร และกินเวลาไหน","ท่าฟื้นฟูที่ต้องทำต่อที่บ้าน","ถ้ามีสายต่างๆ เช่น สายให้อาหารทางจมูก หรือสายสวนปัสสาวะ ต้องเรียนรู้วิธีดูแลให้เป็น"]},{"t":"p","x":"ส่วนที่ยังไม่มั่นใจ ก่อนออกจากโรงพยาบาล โปรดขอให้พยาบาลหรือนักบำบัดสอนอีกครั้ง และลงมือทำจริงให้พยาบาลหรือนักบำบัดดู"},{"t":"h","x":"สภาพแวดล้อมในบ้าน"},{"t":"ul","x":["เตียงต้องสูงพอดีให้ขึ้นลงสะดวก ข้างเตียงเว้นที่ให้รถเข็นนั่งเข้าใกล้ได้","ติดราวจับในห้องน้ำและข้างโถส้วม พื้นต้องกันลื่น","ทางเดินต้องกว้างโล่ง เก็บของเกะกะและสายไฟ"]},{"t":"fig","id":"safe"},{"t":"h","x":"อุปกรณ์ช่วย"},{"t":"fig","id":"devices"},{"t":"p","x":"ต้องใช้อุปกรณ์ช่วยชนิดไหน เช่น โครงช่วยเดิน รถเข็นนั่ง หรือเก้าอี้นั่งถ่าย โปรดถามนักบำบัดก่อน แล้วจึงจัดเตรียม เรื่องเงินอุดหนุนค่าอุปกรณ์ช่วย สอบถามได้ที่ศูนย์จัดการการดูแลระยะยาวของแต่ละเมืองและเทศมณฑล"},{"t":"h","x":"แหล่งช่วยเหลือด้านการดูแลระยะยาว"},{"t":"p","x":"ตั้งแต่ช่วงที่ยังนอนโรงพยาบาล ก็ขอให้พยาบาลของบริการเตรียมออกจากโรงพยาบาล ช่วยส่งต่อเพื่อรับการประเมินการดูแลระยะยาวได้ หรือจะโทร 1966 เองก็ได้ บริการมีทั้งบริการดูแลที่บ้าน การฟื้นฟูความสามารถที่บ้าน บริการรถรับส่ง และบริการดูแลแทนชั่วคราวเพื่อให้ผู้ดูแลได้พัก เป็นต้น"},{"t":"key","h":"หลังออกจากโรงพยาบาล","figTop":"three","ul":["จดวันนัดตรวจและแผนกไว้","กินยาตรงเวลา วัดความดันทุกวัน","ฟื้นฟูอย่างต่อเนื่อง อย่าหยุดกลางคัน"]},{"t":"key","h":"หลังออกจากโรงพยาบาล","ul":["ถ้าหลังออกจากโรงพยาบาลมาโรงพยาบาลบ่อยๆ ไม่ได้ ถามทีมแพทย์ได้ว่าตรวจตามนัดหรือฝึกฟื้นฟูผ่านวิดีโอคอลได้หรือไม่ หรือให้นักบำบัดมาที่บ้าน","หลังเป็นโรคหลอดเลือดสมอง อย่าตัดสินใจขับรถยนต์หรือขี่รถจักรยานยนต์อีกเอง คนที่มีปัญหาการมองเห็น สมาธิ การตัดสินใจ หรือมือเท้า ต้องผ่านการประเมินความสามารถในการขับขี่อย่างเป็นทางการก่อน ถามแพทย์ว่าต้องทำอย่างไร","ถ้าอยากกลับไปทำงาน ให้บอกทีมแพทย์แต่เนิ่นๆ ทีมจะประเมินความสามารถ และส่งต่อไปฟื้นฟูเพื่อกลับไปทำงาน","บอกทีมว่าผู้ป่วยเคยชอบทำอะไร เช่น ร้องเพลง ปลูกต้นไม้ เล่นหมากรุก หรือทำกิจกรรมกลุ่ม สิ่งเหล่านี้ใช้เป็นส่วนหนึ่งของการฟื้นฟูได้","เวลาไปตรวจตามนัด ขอให้แพทย์ใช้ \"แบบตรวจปัญหาหลังโรคหลอดเลือดสมอง (Post-Stroke Checklist)\" ตรวจด้วยกัน: การป้องกันการเป็นซ้ำ การดูแลตัวเอง การเคลื่อนไหว ความตึงของกล้ามเนื้อ ความปวด การขับถ่าย การสื่อสาร อารมณ์ ความจำและการคิด การมีส่วนร่วมในชีวิตประจำวัน และความสัมพันธ์ในครอบครัว ถ้ามีปัญหาจะส่งต่อไปรับบริการที่เหมาะสม"]},{"t":"warn","h":"ถ้ามีอาการเหล่านี้ โปรดไปพบแพทย์ทันที","ul":["สัญญาณเตือนโรคหลอดเลือดสมองซ้ำ: ปากเบี้ยว แขนขาอ่อนแรงข้างเดียว พูดไม่ชัด โปรดโทร 119","มีไข้ ไอ เสมหะมากขึ้น","ไม่ค่อยรู้สึกตัว หรือปลุกแล้วไม่ค่อยตื่น","หกล้มบาดเจ็บ","ชัก"]}]},{"title":"การออกกำลังกายที่บ้าน","desc":"กลับบ้านแล้วออกกำลังกายต่อเนื่องอย่างไร ป้องกันไหล่อย่างไร และเมื่อไรต้องหยุด","body":[{"t":"h","x":"ทำไมกลับบ้านแล้วยังต้องออกกำลังกาย"},{"t":"p","x":"หลังเป็นโรคหลอดเลือดสมอง การฟื้นตัวของร่างกายต้องอาศัยการฝึกอย่างต่อเนื่อง ถ้ากลับบ้านแล้วไม่ขยับเลย กล้ามเนื้อจะอ่อนแรงลง ข้อต่อจะติดแข็ง และหกล้มได้ง่ายขึ้น ต้องออกกำลังกายเป็นประจำทุกวัน จึงจะรักษาผลของการฟื้นฟูไว้ได้"},{"t":"key","h":"ก่อนเริ่มออกกำลังกาย","ul":["ชนิดและจำนวนครั้งของการออกกำลังกาย ให้ทำตามที่นักบำบัดออกแบบไว้ให้ผู้ป่วย","เลือกช่วงที่ผู้ป่วยสดชื่น อย่าออกกำลังกายทันทีหลังกินอิ่ม","ต้องมีคนคอยดูอยู่ข้างๆ และรอบตัวไม่มีของวางเกะกะ","ถ้าวัดความดันเป็นประจำ ให้วัดก่อน 1 ครั้ง ถ้าความดันสูงกว่าปกติมาก หรือรู้สึกไม่สบาย ให้งดออกกำลังกายก่อน และแจ้งแพทย์หรือพยาบาล"]},{"t":"h","x":"ท่าออกกำลังกายที่ทำบนเตียงได้"},{"t":"fig","id":"exer1"},{"t":"ul","x":["ยกก้น: นอนหงาย ชันเข่าทั้งสองข้าง วางเท้าราบบนเตียง ค่อยๆ ยกก้นขึ้น ค้างไว้ไม่กี่วินาทีแล้ววางลง อย่ากลั้นหายใจ ถ้าขาข้างที่อ่อนแรงล้มไปด้านข้าง ให้คนในครอบครัวช่วยจับเข่าไว้","ยกแขนสองข้าง: ประสานนิ้วมือทั้งสองข้าง ใช้มือข้างที่มีแรงพามือข้างที่อ่อนแรงค่อยๆ ยกขึ้น ช่วงแรกยกแค่ระดับไหล่ก็พอ ถ้าอยากยกสูงกว่านี้ ให้ถามนักบำบัดก่อน","ขยับข้อเท้า: กระดกปลายเท้าขึ้น แล้วกดปลายเท้าลง ช่วยให้เลือดไหลเวียนดี"]},{"t":"weak"},{"t":"h","x":"ท่าออกกำลังกายแบบนั่งและยืน"},{"t":"fig","id":"exer2"},{"t":"ul","x":["นั่งเป็นยืน: นั่งบนเก้าอี้ที่มั่นคงและมีที่วางแขน วางเท้าราบทั้งสองข้าง ถอยเท้าไปด้านหลังเล็กน้อย โน้มตัวไปข้างหน้าแล้วลุกขึ้นยืน จากนั้นค่อยๆ นั่งลง คนในครอบครัวยืนคอยระวังอยู่ข้างที่อ่อนแรง","ถ่ายน้ำหนัก: ขณะนั่ง ค่อยๆ เอนตัวไปทางซ้ายและทางขวา เพื่อฝึกการทรงตัว","เดิน: ต้องมีคนอยู่ด้วยทุกครั้ง คนที่อยู่ด้วยยืนอยู่ข้างที่อ่อนแรง ค่อนไปด้านหลังเล็กน้อย ใช้อุปกรณ์ช่วยตามที่นักบำบัดแนะนำ แล้วค่อยๆ เพิ่มเวลาเดิน"]},{"t":"h","x":"ท่าออกกำลังกายแบบยืนจับราว 4 ท่า"},{"t":"fig","id":"standex"},{"t":"key","h":"ถามนักบำบัดก่อน","p":"ท่าเหล่านี้เหมาะกับผู้ที่ยืนจับราวได้มั่นคงแล้ว จะทำหรือไม่ ทำกี่ครั้ง ให้ถามนักบำบัดก่อน จำนวนครั้งด้านล่างเป็นเพียงตัวอย่าง เริ่มจากน้อยๆ ก่อนได้ ระหว่างทำ ถ้าเจ็บหน้าอก เวียนหัว หรือหอบมาก ให้หยุดทันทีแล้วนั่งพัก"},{"t":"ul","x":["ใช้มือข้างที่มีแรงจับโต๊ะหรือราวให้มั่น มือข้างที่อ่อนแรง ถ้าวางบนโต๊ะได้ก็วางไว้ อย่าปล่อยห้อยหรือให้ถูกดึง ยืนบนพื้นเรียบ ใส่รองเท้ากันลื่น วางเก้าอี้ไว้ข้างหลัง เหนื่อยแล้วนั่งได้ทันที","ท่าก้าวย่อ: ขาข้างที่มีแรงก้าวไปข้างหน้าเล็กน้อย ขาข้างที่อ่อนแรงอยู่ข้างหลัง ส้นเท้าวางราบ เข่าเหยียดตรงแต่ไม่ล็อกเข่า งอเข่าขาหน้าเล็กน้อย โน้มตัวไปข้างหน้าช้าๆ ค้าง ารที่อยู่ด้านขวาของจาน หรือเดินชนขอบประตูด้านซ้าย","การกะระยะและการรับรู้ตำแหน่งอาจแย่ลง","อาจทำอะไรรีบร้อนและหุนหันพลันแล่นมากขึ้น","ผู้ป่วยอาจคิดว่าตัวเองทำได้ แต่ความจริงต้องมีคนช่วย จึงหกล้มได้ง่ายกว่า","เวลาลุกจากเตียงและเวลาเดิน ต้องมีคนอยู่ด้วยทุกครั้ง ก่อนลุกยืนให้จับประคองให้มั่นคง ไม่ให้ล้มไปทางซ้าย","วิธีเตือนให้ผู้ป่วยสนใจด้านซ้าย โปรดทำตามที่นักบำบัดสอน"]},{"t":"key","h":"ก้านสมองหรือสมองน้อยเสียหาย","ul":["ก้านสมองควบคุมหน้าที่สำคัญ เช่น การหายใจ การเต้นของหัวใจ และการกลืน หลังก้านสมองเสียหาย มักกลืนลำบาก ดื่มน้ำแล้วสำลักง่าย บางคนสำลักแล้วก็ไม่ไอ วิธีกินอาหารและดื่มน้ำ โปรดทำตามผลประเมินของนักแก้ไขการพูด","มักเวียนหัว ทรงตัวไม่ดี เดินไม่มั่นคง","อาจกลืนลำบาก พูดไม่ชัด หรือมองเห็นภาพซ้อน","ถ้าก้านสมองเสียหาย อาจอ่อนแรงทั้งสองข้าง หรือหน้ากับลำตัวอ่อนแรงคนละข้างกัน","ลุกขึ้นช้าๆ เพื่อป้องกันการหกล้ม ปัญหาการกลืนให้นักแก้ไขการพูดประเมิน"]},{"t":"h","x":"หน้าที่ของสมองแต่ละส่วน"},{"t":"p","x":"โรคหลอดเลือดสมองครั้งเดียวมักกระทบหลายส่วน ข้างล่างนี้เป็นเพียงอาการที่พบบ่อย ไม่จำเป็นต้องเกิดทั้งหมด"},{"t":"fig","id":"lobes"},{"t":"ul","x":["สมองกลีบหน้า: การเคลื่อนไหว การวางแผนและตัดสินใจ บุคลิกภาพ ถ้าเสียหายอาจอ่อนแรง ทำอะไรไม่มีแผน หรือบุคลิกเปลี่ยน หุนหันพลันแล่นมากขึ้น","สมองกลีบข้าง: ความรู้สึกและการกะระยะ ถ้าเสียหายอาจรับความรู้สึกได้น้อยลง กะระยะไม่แม่น หรือไม่สนใจด้านใดด้านหนึ่ง (พบบ่อยเมื่อสมองซีกขวาเสียหาย จะไม่สนใจด้านซ้าย)","สมองกลีบขมับ: ความจำและการฟังคนอื่นพูดให้เข้าใจ ถ้าเสียหายอาจความจำแย่ลง นึกถึงคนหรือเรื่องที่เพิ่งเกิดไม่ออก ถ้าซีกซ้ายเสียหาย อาจฟังคนอื่นพูดไม่เข้าใจ","สมองกลีบท้ายทอย: การมองเห็น ถ้าเสียหายอาจมองไม่เห็นของด้านเดียวกันทั้ง 2 ตา (ไม่ใช่ตาข้างเดียวมองไม่เห็น) หรือมองไม่ชัด เวลาพูดกับผู้ป่วยหรือวางของ ให้เริ่มจากด้านที่ผู้ป่วยมองเห็น","สมองน้อย: การทรงตัวและการประสานงานของร่างกาย ดูหัวข้อ “ก้านสมองหรือสมองน้อยเสียหาย” ในหน้านี้"]},{"t":"key","h":"เมื่อมีปัญหาการมองเห็น","p":"ถ้ามองเห็นไม่ครบด้านใดด้านหนึ่ง เห็นภาพซ้อน หรือมองไม่ชัด ให้ขอตรวจสายตาและลานสายตา นักบำบัดจะดูผลตรวจ แล้วจัดการฝึกหันศีรษะและกวาดสายตามองให้"},{"t":"h","x":"หลอดเลือดที่อุดตันต่างกัน อาการก็ต่างกัน"},{"t":"p","x":"สมองได้รับเลือดจากหลอดเลือดหลักหลายเส้น หลอดเลือดเส้นไหนอุดตัน ก็จะกระทบส่วนของสมองที่หลอดเลือดเส้นนั้นเลี้ยง อาการจึงต่างกัน ข้างล่างนี้เป็นกรณีที่พบบ่อย ผู้ป่วยเป็นที่หลอดเลือดเส้นไหน โปรดถามแพทย์เจ้าของไข้"},{"t":"ul","x":["หลอดเลือดแดงสมองส่วนกลาง (middle cerebral artery): พบบ่อยที่สุด หน้าและแขนด้านตรงข้ามอ่อนแรงมากกว่าขา และอาจรับความรู้สึกได้น้อยลง ถ้าเป็นสมองซีกซ้าย มักมีปัญหาการพูดหรือการเข้าใจ ถ้าเป็นสมองซีกขวา มักไม่สนใจด้านใดด้านหนึ่ง","หลอดเลือดแดงสมองส่วนหน้า (anterior cerebral artery): ขาด้านตรงข้ามอ่อนแรงมากกว่าแขน ผู้ป่วยอาจเฉื่อยลง ไม่อยากทำอะไร ตอบสนองช้าลง หรือกลั้นปัสสาวะไม่ได้","หลอดเลือดแดงสมองส่วนหลัง (posterior cerebral artery): มองไม่เห็นของด้านเดียวกันทั้ง 2 ตา (ด้านตรงข้ามกับหลอดเลือดที่อุดตัน) ถ้าอุดตันด้านซ้าย บางคนมองเห็นตัวหนังสือแต่อ่านไม่ออก","การไหลเวียนเลือดสมองส่วนหลัง (หลอดเลือดของก้านสมองและสมองน้อย): อาจเวียนหัว เดินไม่มั่นคง กลืนลำบาก เสียงแหบ หรือมองเห็นภาพซ้อน บางครั้งหน้าด้านหนึ่งกับลำตัวอีกด้านหนึ่งรับรู้ร้อน เย็น หรือเจ็บได้น้อยลง หรือหนังตาข้างหนึ่งตกลงเล็กน้อย","การรู้ว่าหลอดเลือดเส้นไหนได้รับผลกระทบ ช่วยให้ครอบครัวเข้าใจความลำบากของผู้ป่วย แต่การฝึกยังคงทำตามแผนของนักบำบัด"]},{"t":"h","x":"การฟื้นฟูต้องทำทีละขั้น"},{"t":"fig","id":"progress"},{"t":"ul","x":["ฝึกนั่งให้มั่นคงก่อน แล้วฝึกลุกยืน แล้วจึงฝึกเดิน","คนที่ขาอ่อนแรง ให้ฝึกยืนโดยจับเก้าอี้ที่มั่นคงและไม่เลื่อนก่อน แล้วจึงฝึกเดิน อย่าขึ้นลงบันไดเอง","ฝึกมือโดยเริ่มจากของชิ้นใหญ่ก่อน แล้วจึงฝึกกับของชิ้นเล็ก เช่น หยิบแก้วใบใหญ่ ตัวต่อชิ้นใหญ่ก่อน แล้วจึงฝึกติดกระดุม ถ้านิ้วล้าให้พัก","เวลาฝึก อย่ากลั้นหายใจ อย่าออกแรงดึงข้อต่อ ถ้าเจ็บ ตะคริว แน่นหน้าอก เวียนหัว หรือเหงื่อออกตัวเย็น ให้หยุดทันที","ฝึกทีละขั้นตามแผนของนักบำบัด อย่าข้ามขั้นตอนเอง"]},{"t":"unitlink","x":"ดูหัวข้อ “การออกกำลังกายที่บ้าน”","unit":"u8"}]},{"title":"การดูแลประจำวันหลังกลับบ้าน","desc":"วัดความดันและน้ำตาล ดื่มน้ำ ป้องกันลิ่มเลือดที่ขา ช่วยขับเสมหะ กินยาและมาตรวจตามนัด เมื่อไรต้องไปโรงพยาบาล","body":[{"t":"h","x":"สิ่งที่ต้องดูแลทุกวันหลังกลับบ้าน"},{"t":"p","x":"ออกจากโรงพยาบาลแล้ว การดูแลยังไม่จบ กลับบ้านแล้วให้วัดความดันทุกวัน ดื่มน้ำให้พอ ขยับร่างกายบ่อยๆ กินยาและมาตรวจตามนัด จะช่วยลดโอกาสเป็นโรคหลอดเลือดสมองซ้ำและโรคแทรกซ้อนอื่นๆ"},{"t":"fig","id":"homecare"},{"t":"h","x":"ความดันและน้ำตาลในเลือด: คงที่สำคัญที่สุด"},{"t":"key","h":"วัดเวลาเดิมทุกวัน","ul":["วัดความดันตอนเช้าหลังตื่นนอน (หลังเข้าห้องน้ำ ก่อนกินข้าวเช้าและก่อนกินยา) และตอนค่ำก่อนเข้านอน อย่างละหนึ่งรอบ แล้วจดไว้","วัดที่แขนข้างที่ไม่ได้รับผลจากโรคหลอดเลือดสมอง และวัดแขนข้างเดิมทุกครั้ง","ผู้ที่เป็นเบาหวาน ให้วัดน้ำตาลในเลือดตามเวลาที่แพทย์สั่ง แล้วจดไว้","หลังเป็นโรคหลอดเลือดสมอง โดยทั่วไปแนะนำให้ความดันต่ำกว่า 130/80 mmHg เป้าหมายของแต่ละคนให้แพทย์เป็นผู้กำหนด","ควรคุมความดันให้อยู่ในเป้าหมายที่แพทย์กำหนด แต่ไม่ใช่ยิ่งต่ำยิ่งดี ถ้าวัดได้ต่ำกว่าปกติมาก ร่วมกับเวียนหัวหรือรู้สึกจะเป็นลม ให้บอกแพทย์","อย่าเพิ่มยา ลดยา หรือหยุดยาเอง"]},{"t":"warn","h":"ถ้าวัดความดันแล้วพบแบบนี้","ul":["ความดัน 180/120 mmHg ขึ้นไป (ตัวเลขบน 180 ขึ้นไป หรือตัวเลขล่าง 120 ขึ้นไป) ร่วมกับปวดหัว เจ็บหน้าอก หายใจหอบมาก มองไม่ชัด พูดไม่ชัด สับสน หรือแขนขาอ่อนแรงทันที: โทร 119 ทันที","ความดัน 180/120 mmHg ขึ้นไป แต่ไม่มีอาการผิดปกติ: นั่งพักสักครู่แล้ววัดใหม่ ถ้ายังสูงตั้งแต่ 180/120 ขึ้นไป ให้ติดต่อแพทย์หรือไปพบแพทย์ภายในวันเดียวกัน อย่ากินยาลดความดันเพิ่มเอง","ความดันสูงกว่าเป้าหมายที่แพทย์ให้ แต่ไม่ถึง 180/120: กินยาตามปกติ จดไว้ แล้วบอกแพทย์ตอนมาตรวจตามนัด","เหงื่อออกตัวเย็น ตัวสั่น ใจเต้นเร็ว เวียนหัว หรือไม่ค่อยรู้สึกตัว อาจเป็นน้ำตาลในเลือดต่ำ: ถ้ามีเครื่องวัดน้ำตาล ให้วัดก่อน ถ้าต่ำกว่า 70 mg/dL และผู้ป่วยรู้สึกตัวดี กลืนได้อย่างปลอดภัย: ให้กินอาหารที่มีน้ำตาลตามวิธีที่แพทย์หรือผู้ให้ความรู้ด้านสุขภาพสอน (ผู้ที่กลืนลำบาก ใช้ความข้นตามที่นักแก้ไขการพูดแนะนำ) หลัง 15 นาที วัดใหม่อีกครั้ง","ผู้ป่วยไม่ค่อยรู้สึกตัว ปลุกไม่ตื่น หรือกลืนไม่ได้: ห้ามป้อนอะไรทั้งสิ้น โทร 119 ทันที"]},{"t":"unitlink","x":"ดูหัวข้อ “วัดความดันแบบ 722”","unit":"u5"},{"t":"h","x":"ดื่มน้ำทีละน้อย แต่บ่อยๆ"},{"t":"ul","x":["ถ้าน้ำในร่างกายไม่พอ เลือดจะข้น ต้องดื่มน้ำให้พอ ดื่มครั้งละน้อย แบ่งดื่มหลายครั้งต่อวัน","ผู้ที่เป็นโรคหัวใจ โรคไต หรือแพทย์จำกัดปริมาณน้ำ ให้ดื่มตามปริมาณที่แพทย์สั่ง","ผู้ที่กลืนลำบาก น้ำต้องเติมสารเพิ่มความข้นหรือไม่ และข้นแค่ไหน ให้ทำตามที่นักแก้ไขการพูดแนะนำ","ผู้ที่ดื่มน้ำเติมสารเพิ่มความข้น มักดื่มน้อยเกินไปโดยไม่รู้ตัว ญาติควรช่วยดูว่าดื่มไปเท่าไร","เวลาดื่มน้ำ ให้นั่งตัวตรง ดื่มช้าๆ","ปัสสาวะน้อยลง สีปัสสาวะเข้มมาก ริมฝีปากแห้งมาก อาจดื่มน้ำไม่พอ โปรดบอกแพทย์หรือพยาบาล"]},{"t":"unitlink","x":"ดูหัวข้อ “การกลืนและความปลอดภัยในการกินอาหาร”","unit":"u3"},{"t":"h","x":"ป้องกันลิ่มเลือดที่ขา"},{"t":"p","x":"ถ้านอนหรือนั่งนิ่งๆ นานเกินไป เลือดที่ขาจะไหลช้า เกิดลิ่มเลือด (ก้อนเลือด) ได้ง่าย"},{"t":"ul","x":["เวลานอนหรือนั่งนาน ให้ขยับข้อเท้าบ่อยๆ: กระดกปลายเท้าขึ้น แล้วเหยียดปลายเท้าลง ทำช้าๆ ขาข้างที่อ่อนแรง ญาติช่วยขยับให้ได้","เมื่อลุกจากเตียงได้แล้ว ให้ลุกเดินและขยับร่างกายบ่อยๆ ตามแผนของนักบำบัด","ถุงน่องยางยืดแบบทั่วไปป้องกันลิ่มเลือดที่ขาหลังเป็นโรคหลอดเลือดสมองไม่ได้ อย่าซื้อมาใส่เอง ผู้ป่วยที่นอนโรงพยาบาลและขยับตัวลำบากมาก ทีมแพทย์อาจใช้ปลอกรัดขาที่พองลมเป็นจังหวะเพื่อป้องกันลิ่มเลือด จะใช้หรือไม่ ทีมแพทย์เป็นผู้ตัดสินใจ ถ้าแพทย์ให้ใส่ถุงน่องยางยืดด้วยเหตุผลอื่น ให้ถอดออกตรวจผิวหนังทุกวันว่ามีแผลหรือรอยแดงหรือไม่"]},{"t":"warn","h":"สัญญาณเตือนว่าอาจมีลิ่มเลือด","ul":["ขาข้างหนึ่งบวมขึ้นทันที เจ็บ แดง หรือจับแล้วอุ่น: ห้ามนวดขาข้างนั้น ไปพบแพทย์ภายในวันเดียวกัน ถ้าเป็นตอนกลางคืนหรือวันหยุด ให้ไปห้องฉุกเฉิน","เจ็บหน้าอกทันที หายใจหอบมาก หรือไอเป็นเลือด: โทร 119 ทันที"]},{"t":"key","h":"ปัญหาการขับถ่าย","ul":["หลังเป็นโรคหลอดเลือดสมอง มักมีปัสสาวะเล็ด ปวดปัสสาวะกะทันหันจนรอไม่ได้ ปัสสาวะไม่ออก หรือท้องผูก ให้บอกพยาบาล และเล่าว่าก่อนเป็นโรคขับถ่ายอย่างไร พยาบาลอาจใช้อัลตราซาวด์ดูว่ามีปัสสาวะค้างในกระเพาะปัสสาวะหรือไม่","คนที่ใส่สายสวนปัสสาวะ ให้ถามแพทย์หรือพยาบาลว่าถอดได้เมื่อไร อย่าใส่ไว้นานเกินไป","คนที่ปัสสาวะเล็ด ให้เตือนไปเข้าห้องน้ำตามเวลาที่พยาบาลกำหนด และถามได้ว่าเหมาะจะฝึกบริหารกล้ามเนื้ออุ้งเชิงกรานหรือไม่"]},{"t":"key","h":"อาการปวดหลังเป็นโรคหลอดเลือดสมอง","p":"ถ้าร่างกายข้างที่เป็นโรคมีอ
