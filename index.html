e and lose weight. Ask a dietitian to help assess this."]},{"t":"h","x":"Ways to eat safely"},{"t":"fig","id":"eat"},{"t":"ul","x":["The patient should eat only when fully awake.","Sit upright before eating. Adjust the position the way the speech therapist taught.","Take small bites and eat slowly. Make sure everything is swallowed before the next bite.","When feeding the patient, put the food into the mouth from the strong side.","If the speech therapist taught \"swallow again after swallowing\" (swallow saliva once more with no food in the mouth), do it.","Pay attention during meals. Do not talk while eating.","After eating, sit for at least 30 minutes before lying down.","After meals, clean the mouth and check inside the cheek on the weak side for leftover food."]},{"t":"fig","id":"after"},{"t":"warn","h":"What to do if the patient chokes while eating","ul":["If the patient can still cough or speak: stop feeding right away. Have the patient lean forward and encourage him or her to cough hard. Do NOT pat the back at this time, and do not continue feeding.","If the patient cannot cough (no sound), cannot speak, cannot breathe, or the lips turn purple: call 119 right away. Alternate 5 back blows and 5 abdominal thrusts (the Heimlich maneuver) until the object comes out or the ambulance team arrives.","If the patient cannot be woken up, start CPR and follow the instructions of the 119 staff.","Family members and caregivers should take a CPR and Heimlich maneuver class.","If there is fever, constant coughing or very hard breathing in the days after choking, see a doctor as soon as possible. It may be aspiration pneumonia.","When the patient is stable, ask the speech therapist to check swallowing again."]},{"t":"h","x":"How soft and how thick food should be"},{"t":"p","x":"How finely to cut the food and whether to add thickener to water: please follow the advice of the speech therapist and dietitian. Do not change it yourself."},{"t":"key","h":"Patients with a feeding tube (nasogastric tube)","ul":["Before feeding, first check the position of the tube and its length mark.","During feeding, raise the head of the bed 30–45 degrees.","After feeding, keep the same position for at least 30 minutes to 1 hour."],"figBottom":"angle"},{"t":"h","x":"Swallowing practice"},{"t":"fig","id":"swallowex"},{"t":"p","x":"A speech therapist must check the patient first before swallowing practice. Then follow the plan. Below are common exercises. Ask the speech therapist first which ones to do and how many times."},{"t":"ul","x":["Practice sitting upright or half sitting up. Do not practice lying down.","Cheeks: Puff out the cheeks, pucker the lips, open the mouth.","Tongue: Stick it out, move it left and right, lift it up.","Dry swallow: With no food in the mouth, swallow saliva once. If the patient has a lot of saliva or often chokes on it, ask the speech therapist first.","Move gently and slowly. Do not hold your breath and push hard. Stop when tired.","If the patient chokes or coughs, is very short of breath, or the face changes color during practice: stop right away and tell the medical staff."]},{"t":"key","h":"Be careful with these foods first","ul":["Plain water and thin soup are the easiest to choke on.","Dry rice, nuts, leafy vegetables, and crumbly foods can also cause choking or get stuck.","Foods that mix liquid and pieces, like rice porridge or rice in soup, and sticky foods like glutinous rice balls, mochi, and rice cake, also easily cause choking.","Whether these can be eaten, and how to change them, such as adding thickener or blending into a puree, follows the speech therapist's and dietitian's advice.","Do not force-feed, do not rush the patient, and do not let the patient drink big gulps of water."]},{"t":"warn","h":"Swallowing must be checked","ul":["Do not think swallowing is safe just because a few bites went fine.","After eating or drinking, if the voice sounds wet, gurgly, or hoarse, the chest often feels tight, breathing gets fast, or there is a fever with no clear cause, tell the medical staff."]}]},{"title":"Preventing falls","desc":"Three steps for getting out of bed, key safety points in the ward and at home","body":[{"t":"h","x":"Why falls are more likely after a stroke"},{"t":"p","x":"Weakness in the arm and leg on one side, poorer balance, dizziness and rushing to the toilet all increase the chance of falling. A fall may cause a broken bone or a head injury, and interrupt rehabilitation."},{"t":"key","h":"Three steps for getting out of bed","figTop":"steps","ul":["First sit up in bed and sit for 30 seconds.","Put your feet down and sit on the edge of the bed for another 30 seconds.","Stand up and stand steady for 30 seconds. Start walking only if there is no dizziness."]},{"t":"h","x":"During the hospital stay"},{"t":"ul","x":["Someone must be with the patient when getting out of bed and going to the toilet. Press the call bell if you need help. Do not try to do it alone.","Keep the bed rails up, set the bed to its lowest height and lock the bed wheels.","Put often-used items on the strong side, within easy reach.","Wear non-slip shoes that fit well. Do not wear slippers. Pants should not be too long.","If the floor is wet, please tell the staff."]},{"t":"h","x":"Using a wheelchair and transferring"},{"t":"ul","x":["Before getting in or out of the wheelchair, first lock the brakes on both sides and fold up the footrests.","When transferring the patient, follow the steps the therapist taught."]},{"t":"h","x":"After going home"},{"t":"ul","x":["Install grab bars in the bathroom and beside the toilet, and put non-slip mats on the floor.","Put away clutter, electric cords and small rugs from the walkways.","Leave a small light on at night."]},{"t":"key","h":"A plan to prevent falls","ul":["Ask the therapist to assess the risk of falling and make a fall prevention plan based on the results.","After going home, ask the medical team to assess again at least once a year. If the patient has recently fallen or almost fallen, tell the team sooner.","Balance exercise can reduce falls. Ask the therapist whether tai chi, or practice that does a simple task while walking (for example counting numbers while walking), is suitable. Practice first with the therapist's guidance.","Moving less after a stroke can make bones weak, so a fall is more likely to cause a broken bone. Ask the doctor whether the risk of broken bones should be assessed.","The right cane, walker or ankle-foot brace can help with balance and lower the risk of falls. Ask the therapist to check and adjust it before use."]},{"t":"fig","id":"safe"},{"t":"warn","h":"If a fall happens","ul":["Do not rush to pull the patient up. First check whether the patient is awake and where it hurts.","In the hospital, press the call bell right away.","At home, if the patient hit the head, is in too much pain to move, or is not fully conscious, call 119."]}]},{"title":"Preventing another stroke","desc":"Taking medicine on time, measuring blood pressure, knowing the warning signs of another stroke","body":[{"t":"h","x":"People who have had a stroke need to prevent another one"},{"t":"p","x":"People who have had a stroke have a higher chance of another stroke than other people. Keeping blood pressure, blood sugar and blood lipids (fats) under good control can lower this chance."},{"t":"fig","id":"three"},{"t":"h","x":"Take medicine on time"},{"t":"ul","x":["Medicines that prevent blood clots, and medicines that control blood pressure, blood sugar and blood lipids (fats), must all be taken every day as the doctor instructed.","Do not stop or reduce the medicine yourself just because you feel much better.","If there is bleeding that is hard to stop, or black or bloody stools, tell the doctor as soon as possible.","The doctor chooses the medicine that prevents blood clots based on the cause of the stroke. Some people take two antiplatelet medicines together for a short time at the start after a stroke, then usually go back to one. The doctor decides when to change.","For people with atrial fibrillation (an irregular heartbeat), the doctor usually prescribes a blood thinner (anticoagulant) to prevent another stroke. People taking this kind of medicine should have regular blood tests, as the doctor arranges, to check how the liver and kidneys are working.","After a stroke, blood lipids (fats) usually also need to be controlled. For people with hardening of the arteries, the doctor may set the target for bad cholesterol (LDL) below 70 mg/dL."]},{"t":"key","h":"Measuring blood pressure: \"722\"","figTop":"bp722","ul":["7: measure for 7 days in a row.","2: measure once after getting up in the morning and once before going to bed at night.","2: take 2 readings each time."],"p":"Write the numbers down and bring them to show the doctor at the follow-up visit. After a stroke, blood pressure is usually advised to be below 130/80 mmHg (top number below 130, bottom number below 80). Blood pressure should reach the target, but too low with dizziness is not good either. Each person's target depends on the doctor's instructions. Do not change the medicine yourself. Measure on the arm not affected by the stroke, and use the same arm every time."},{"t":"h","x":"Daily habits"},{"t":"fig","id":"life"},{"t":"ul","x":["Do not smoke. Drink less alcohol.","Eat less oil, sugar and salt. Eat more vegetables and high-fiber foods.","Keep active as the therapist advises.","If you feel an irregular heartbeat, a pounding heart (palpitations) or chest tightness, please tell the doctor.","Go to follow-up visits on time.","If the body allows, do moderate exercise at least 4 times a week, for at least 10 minutes each time, such as walking fast until you are a little out of breath but can still talk. If this is too much, some activity is still better than none. Before starting, ask the doctor or therapist how much exercise is right.","You can follow the \"Mediterranean diet\": eat more vegetables, fruit, whole grains, beans, nuts and fish, use plant oils such as olive oil instead of lard or butter, and eat less red meat and processed food. People with swallowing problems, diabetes or kidney disease should ask a dietitian first."]},{"t":"sos"},{"t":"ul","x":["Do not drive a car or ride a scooter to the hospital yourself.","While waiting for the ambulance, do not give the patient food, water or medicine.","Do not wait for the symptoms to go away on their own.","The sooner the patient gets to the hospital, the better. Treatments that reopen the blood vessel have a time limit. For example, clot-dissolving medicine is generally used within 4.5 hours after the symptoms start. So if you see a warning sign, call 119 right away. Do not wait."]}]},{"title":"Emotions and communication","desc":"Mood changes after a stroke, how to talk with the patient, rest for the caregiver","body":[{"t":"h","x":"Mood changes after a stroke"},{"t":"p","x":"After a stroke, it is common to feel low, cry easily or get angry easily. This is related to both the injury to the brain and the sudden change in life. It does not mean the patient is not strong enough."},{"t":"warn","h":"Find mood problems early","ul":["Feeling down all day, with no interest in anything","Often nervous, worried or restless","Does not want to do rehabilitation or talk","Cannot sleep well or cannot eat","Often says he or she is a burden to the family"],"p":"Depression and anxiety are common after a stroke and can appear at any time. You do not need to wait until they have lasted a long time to speak up. Regular mood checks are advised, for example during the hospital stay, about 3 months and 6 months after the stroke, and at later follow-up visits. If the patient has not had one yet, you can ask the medical team for an assessment. There are also suitable assessment methods for people who have difficulty speaking. Depression and anxiety can be treated. The doctor may refer the patient to a psychiatrist or psychologist for talk therapy or medicine. Do not buy medicine on your own. If the patient talks about wanting to die or wanting to hurt himself or herself, tell the medical staff right away, or call the 1925 Mental Health Support Line (24 hours)."},{"t":"key","h":"Good sleep is also rehabilitation","ul":["Go to bed and get up at the same times every day. Be up and active more during the day. A short nap is fine if sleepy, but do not sleep too long.","Use the phone and TV less before bed. Do not drink coffee or strong tea after noon.","Very loud snoring, breathing that stops for a moment during sleep, or feeling sleepy all day may be signs of sleep apnea. Please tell the doctor.","If the patient keeps lying awake at night, often feels anxious or feels low, tell the doctor. Do not take sleeping pills or calming medicine on your own for a long time, and do not drink alcohol to help sleep."]},{"t":"key","h":"Tiredness after a stroke","p":"After a stroke, it is easy to get tired, and rest does not help much. This is called poststroke fatigue, and it is common. Tell the medical team. There are ways to improve tiredness and sleep. Do not buy medicine for energy or tiredness on your own."},{"t":"h","x":"Communicating with a patient who has difficulty speaking"},{"t":"fig","id":"talk"},{"t":"ul","x":["Speak face to face, slow down, and use shorter sentences.","Say only one thing at a time.","Use more questions that can be answered with \"yes\" or \"no\".","Use gestures, pictures or real objects together with your words.","Give the patient time to answer. Do not rush to finish the sentence for the patient.","Speak the way you speak to an adult. Do not treat the patient like a child.","If the patient does not seem to hear well, arrange a hearing test. If speaking is very hard, a speech therapist can teach the family ways to communicate, and can suggest aids such as a communication board, picture cards or a tablet."]},{"t":"key","h":"Practice speaking step by step","ul":["Speech practice depends on the type of problem. Follow the speech therapist's advice on what to practice and how.","If the therapist advises this way: first practice simple words, such as \"yes\" or \"water\". Next, practice saying the names of common things, such as cup or spoon. Last, practice short sentences, such as \"I want water\".","You can also first practice understanding simple commands, such as \"Raise your hand\" or \"Open your mouth\". Show the action with a gesture while you say it. Then the patient can slowly practice speaking along with the therapist.","For people whose speech is unclear, the therapist may teach them to speak slower, louder, and open the mouth wider.","Practice a little every day. Give the patient time to speak slowly. Do not rush them, and do not keep correcting them. If they cannot say it, they can point, write, or use picture cards. Praise them when they get it right."]},{"t":"h","x":"Caregivers need to take care of themselves too"},{"t":"ul","x":["Family members should take turns giving care. One person should not carry it all alone.","Caregivers need regular times to rest and to eat.","Caregivers can join health education and care skills training from the start of the hospital stay. After learning, show the nurse or therapist to make sure you have learned it.","If you feel you cannot cope, cannot sleep well or feel low, talk with a nurse or social worker. You can also ask the team to refer you to a caregiver support group.","If the patient feels lonely or rarely sees other people, they can join a stroke patient group or support group. Changes in sex life, leaking urine and other problems that feel hard to talk about are also common. It is fine to ask the doctor or nurse."]},{"t":"fig","id":"rest"},{"t":"key","h":"Long-term care hotline 1966","p":"Call 1966 to ask about long-term care resources such as respite care (someone else gives care for a short time so the caregiver can rest) and home care services."}]},{"title":"Getting ready for discharge and going home","desc":"What to learn before discharge, the home environment, long-term care resources","body":[{"t":"h","x":"What to learn before discharge"},{"t":"ul","x":["How to safely help the patient turn over, get in and out of bed, and get in and out of the wheelchair.","How to feed the patient, or how to feed through a feeding tube (nasogastric tube).","What each medicine does and when to take it.","The rehabilitation exercises to continue at home.","If the patient has a tube, such as a feeding tube (nasogastric tube) or a urinary catheter, learn how to care for it."]},{"t":"p","x":"For anything you are not sure about, ask the nurse or therapist to teach you again before discharge, and do it yourself while they watch."},{"t":"h","x":"The home environment"},{"t":"ul","x":["The bed height should make it easy to get in and out. Leave space beside the bed so a wheelchair can come close.","Install grab bars in the bathroom and beside the toilet, and make the floor non-slip.","Keep the walkways wide. Put away clutter and electric cords."]},{"t":"fig","id":"safe"},{"t":"h","x":"Assistive devices"},{"t":"fig","id":"devices"},{"t":"p","x":"Ask the therapist first which assistive device is needed, such as a walker, a wheelchair or a commode chair, and then get it. For subsidies for assistive devices, ask the long-term care management center of your city or county."},{"t":"h","x":"Long-term care resources"},{"t":"p","x":"While the patient is still in the hospital, you can ask the discharge planning nurse to help with a referral for a long-term care assessment. You can also call 1966 yourself. Services include home care, home-based reablement (training to do daily activities again), transport and respite care."},{"t":"key","h":"After discharge","figTop":"three","ul":["Write down the dates and departments of the follow-up visits.","Take medicine on time and measure blood pressure every day.","Keep doing rehabilitation. Do not stop."]},{"t":"key","h":"After discharge","ul":["If it is hard to come to the hospital often after discharge, ask the medical team about video follow-up visits or video rehabilitation, or about a therapist visiting your home.","After a stroke, do not decide on your own to drive a car or ride a scooter again. People with problems with vision, attention, judgment, or the arms or legs must first have a formal driving evaluation. Ask the doctor how to arrange it.","If the patient wants to go back to work, tell the medical team early. The team can assess the patient's abilities and refer him or her to vocational rehabilitation.","Tell the team about activities the patient used to enjoy, such as singing, gardening, playing chess or club activities. These can also become part of rehabilitation.","At follow-up visits, you can ask the doctor to go through the \"Post-Stroke Checklist\" together: preventing another stroke, self-care, moving around, muscle tightness, pain, bladder and bowel, communication, mood, memory and thinking, taking part in life, and family relationships. If there is a problem, the doctor can refer you to the right service."]},{"t":"warn","h":"If any of these happen, get medical care right away","ul":["Warning signs of another stroke: crooked mouth, weakness in the arm or leg on one side, unclear speech. Call 119","Fever, cough, more phlegm","Not fully conscious, or hard to wake up","Injury from a fall","Convulsions (seizures)"]}]},{"title":"Home exercise","desc":"How to keep exercising at home, how to protect the shoulder, and when to stop","body":[{"t":"h","x":"Why keep exercising at home"},{"t":"p","x":"After a stroke, getting function back takes ongoing practice. If the patient does not move at home, the muscles get weaker, the joints get stiff, and falls are more likely. Exercising every day at set times is needed to keep the gains from rehabilitation."},{"t":"key","h":"Before you start exercising","ul":["Do the exercises the way the therapist planned them for the patient: the same types and the same number of times.","Choose a time when the patient feels alert. Do not exercise right after a full meal.","Someone needs to stay nearby and watch. Keep the area around clear of clutter.","If you measure blood pressure at home, measure it once first. If the blood pressure is much higher than usual, or the patient feels unwell, do not exercise for now, and tell the medical staff."]},{"t":"h","x":"Exercises you can do lying in bed"},{"t":"fig","id":"exer1"},{"t":"ul","x":["Hip lift: Lie on the back with both knees bent and both feet flat on the bed. Slowly lift the bottom up, hold for a few seconds, then lower it. Do not hold your breath. If the weak leg falls to the side, ask a family member to hold the knee.","Raising both arms: Hold the hands together with the fingers locked. Let the strong hand lead the weak hand and slowly lift both up. At first, lift only to shoulder height. To lift higher, ask the therapist first.","Ankle exercise: Pull the foot up, then push it down. This helps blood flow."]},{"t":"weak"},{"t":"h","x":"Exercises sitting and standing"},{"t":"fig","id":"exer2"},{"t":"ul","x":["Sit to stand: Sit in a steady chair with armrests. Put both feet flat on the floor and move them back a little. Lean forward, then stand up. Then sit down slowly. A family member stands on the weak side to protect the patient.","Weight shifting: While sitting, slowly move the body to the left and to the right to work on balance.","Walking: Someone must always go with the patient. That person stands on the weak side, a little behind the patient. Use an assistive device as the therapist advises, and slowly increase the walking time."]},{"t":"h","x":"4 exercises standing with support"},{"t":"fig","id":"standex"},{"t":"key","h":"Ask the therapist first","p":"These 4 exercises are for people who can already stand steadily while holding on. Ask the therapist first whether to do them and how many times. The numbers below are only a guide. You can start with fewer. If there is chest pain, dizziness or very hard breathing, stop right away and sit down to rest."},{"t":"ul","x":["Hold a table or handrail firmly with the strong hand. If the weak hand can rest on the table, place it there. Do not let it hang down or get pulled. Stand on a flat, steady floor, wear non-slip shoes, and put a chair behind the patient so they can sit down when tired.","Lunge: take a small step forward with the strong leg. Keep the weak leg behind, with the heel flat and the knee straight but not locked. Bend the front knee a little and slowly move the body forward. Hold for about 5 seconds, then slowly come back and bring the feet together to stand steady. Do 8–10 times. If the back knee gives way, do not do this exercise yet.","Heel raise: slowly lift both heels together, then slowly lower them. Do not lean the body forward. Do 2 sets of 8.","Turning: keep both feet still. Slowly turn the upper body to the left, then slowly to the right. Only turn as far as is comfortable. Let the head turn slowly with the body. Stop if you feel dizzy. Do 10 times each side, 2 sets.","Knee raise: slowly lift the knee of the weak leg, then slowly lower it. Keep the body upright. Do not lean to the side. Do 2 sets of 8–12. Do not lift too high. If standing is not steady, do it sitting on a chair instead.","Do not hold your breath at any time. A family member stands on the weak side to protect the patient."]},{"t":"key","h":"Protect the shoulder on the weak side","ul":["When helping the patient get up, turn over, move, or get dressed, do not pull the weak arm.","When sitting, rest the weak arm on an armrest, table or pillow so that it is well supported.","Do not use a rope or pulley hung up high to pull the arm for exercise.","If raising the arm causes pain, stop for now, and tell the therapist."]},{"t":"warn","h":"Stop exercising right away if any of these happen","ul":["Chest pain, chest tightness, or very short of breath: stop and rest first. If it does not get better after a few minutes, call 119","Dizziness, cold sweat, or a pale face","Severe pain in a joint or muscle","A sudden, severe headache, not being able to see clearly, or a fall with a hit to the head: call 119","An arm or leg suddenly gets weaker, the mouth is crooked, or speech is unclear: this may be another stroke. Call 119 right away"]},{"t":"key","h":"Practice every day, and practice enough","p":"Exercise at a set time every day. Practice works only when there is enough of it and it is hard enough. The therapist plans this based on the patient's condition and increases it slowly. You can split practice into several parts in one day, with rest in between. You can tick whether you exercised today in the \"Checklist\"."},{"t":"key","h":"Exercise all-round","ul":["Home exercise should include aerobic exercise that makes the heart beat faster, such as walking or riding an exercise bike, and also strength exercise. Train both legs, not only the strong one.","After PAC ends, ask the therapist whether a community exercise class is suitable."]}]},{"title":"Using assistive devices","desc":"Canes, walkers, stairs, wheelchairs and aids for the home","body":[{"t":"h","x":"Get an assessment first, then choose a device"},{"t":"p","x":"Assistive devices should be chosen to match what the patient can do. Please have a therapist or an Assistive Device Center assess the patient first, then buy or rent the device. Taipei City's Assistive Device Centers can do assessments and lend used devices. Long-term care and disability programs also give subsidies for assistive devices."},{"t":"golink","x":"See Taipei Assistive Device Centers and subsidies","tab":"res","rescat":"clothing"},{"t":"h","x":"Canes and walkers"},{"t":"fig","id":"cane"},{"t":"weak"},{"t":"ul","x":["Hold the cane in the hand on the strong side.","When walking, move the cane and the weak leg forward together, then step forward with the strong leg.","When using a walker, first put the walker forward and make sure it is steady. Step into it with the weak leg first, then step with the strong leg. Do not push it along as you walk. For a walker with wheels, use it the way the therapist taught.","Check the rubber tips on the bottom of the cane and walker regularly. Replace them when they are worn."]},{"t":"h","x":"Going up and down stairs"},{"t":"fig","id":"stairs"},{"t":"ul","x":["Going up: the strong leg goes up first, then the weak leg follows.","Going down: the weak leg goes down first, then the strong leg follows.","Hold the handrail with the strong hand. A family member can help carry the cane.","The family member stands on the weak side. Going up, stand behind the patient, one step lower. Going down, stand in front of the patient, one step lower.","If the stairs have no handrail, have the therapist teach you first before using them."]},{"t":"h","x":"Wheelchairs"},{"t":"ul","x":["Before getting in or out of the wheelchair, lock the brakes on both sides and fold up the footrests.","Sit all the way back in the seat, with the back resting against the backrest. Put the weak arm on the armrest or the lap tray.","People who sit in a wheelchair for a long time can use a pressure-relief cushion. Change position regularly as the therapist taught, to prevent pressure sores."]},{"t":"h","x":"Aids for the home"},{"t":"fig","id":"homeaids"},{"t":"ul","x":["Shower chair: Sitting down to bathe is safer. The chair legs should have non-slip pads. Test the water temperature first with the hand on the strong side, to avoid burns.","Commode chair: At night it can go beside the bed, so the patient does not have to walk as far to the toilet.","Ankle-foot brace: Wear it as the therapist instructs. Check the skin every day for redness or broken skin.","Air mattress: Patients who stay in bed for a long time can use one, but still need to be turned over about every 2 hours.","If the toes drop and the foot drags when walking, an ankle-foot brace or electrical stimulation used by the therapist can help walking and balance. Ask the therapist whether it is suitable."]},{"t":"key","h":"Straps for walking training","ul":["Some therapy uses straps to help keep the body or ankle steady. The therapist decides whether to use them and teaches how to put them on.","A strap is not a safety belt to prevent falls. Someone must still stay nearby to protect the patient during practice.","It should be loose enough to fit 1 to 2 fingers under it, so it does not squeeze the skin and blood vessels.","Take it off after practice. Remove it right away if there is pain, numb hands or feet, red skin, or muscles become very tight.","Patients with poor feeling may not say it hurts. Family members should check the skin for red pressure marks. Never use a strap to tie the patient to a bed or chair. Do not use it during sleep or when no one is watching."]},{"t":"warn","h":"When using assistive devices, contact the therapist or Assistive Device Center if any of these happen","ul":["The device is loose, broken, or the wrong height: stop using it first. Use it again only after it is repaired or adjusted.","Red or broken skin after use: stop wearing it first, and ask the therapist.","Still often nearly falling, even with the device: do not stop using the device on your own. When walking, someone must stay beside the patient and hold on to them. Ask the therapist for a new assessment."]}]},{"title":"Everyday items as rehab tools","desc":"Practice at home with a towel, cup, clothes pegs and a chair, and use home items to stay safe","body":[{"t":"h","x":"Things at home can help with rehabilitation"},{"t":"p","x":"You do not have to buy equipment. Things you already have at home, like towels, cups, clothes pegs and a steady chair, can all be used for practice. Using them and practicing a little every day in daily life works better than a long practice once in a while."},{"t":"key","h":"Before you start","ul":["First tell the therapist what you want to practice. Ask the therapist to check if it is suitable and how many times to do it.","For hand and speech practice, the patient must sit steadily, in a chair with a backrest and armrests.","Someone must stay with the patient. Do not rush the patient during practice.","If it hurts, stop. Do not force it."]},{"t":"h","x":"Hands and arms"},{"t":"fig","id":"handtools"},{"t":"weak"},{"t":"ul","x":["Wiping the table with a towel: Sit at a table. Press both hands on a towel. Slowly push it forward, then pull it back. You can also move it in circles. The strong hand can help move the weak hand.","Clothes pegs: Use the thumb and index finger of the weak hand to squeeze a clothes peg open. Clip it onto the edge of a cup or a paper box, then take it off.","Picking things up into a cup: Use the fingers to pick up large building blocks or buttons and put them into a cup. Someone must always watch during this practice. For people with swallowing problems, or with poor memory or judgment, do not use food items like beans. Use large building blocks instead.","Turning over playing cards or book pages: This practices small finger movements.","Wringing a towel: Over a washbasin, use both hands together to wring out a wet towel. The water should not be too hot. Wipe up any water on the floor. If the fingers are very tight and cannot open, ask the therapist first."]},{"t":"h","x":"Sitting, standing and balance"},{"t":"fig","id":"balancetools"},{"t":"ul","x":["Sit to stand: Practice with a steady chair that does not slide and has armrests. You can put the chair against a wall. Do not use a chair with wheels or one that turns. The family member stands on the weak side and holds the patient's waist. Do not pull on the weak arm.","Standing while holding the kitchen counter or a steady table: First turn off the stove and put knives away. Hold on firmly with both hands. If the weak hand cannot hold on, ask a family member to help place it. Practice standing for a while, then slowly move the body weight onto the left leg, then onto the right leg. The family member stands on the weak side to protect the patient.","Do not hold on to things that can slide or are not steady, such as carts, clothes drying racks or the back of a chair."]},{"t":"h","x":"Speech, face and thinking"},{"t":"fig","id":"mindtools"},{"t":"ul","x":["Making faces in a mirror: In front of a mirror, practice smiling, pursing the lips and puffing out the cheeks. Check if both sides look the same.","Naming things: Pick up a cup, a spoon or a towel. Ask the patient to say its name and what it is used for.","Reading the calendar and the newspaper: Look at the date together every day. Read news headlines or the large words in advertisements. For people who often miss things on one side, draw a colored line on that side to remind them to start reading from there.","Doing housework: Folding towels and matching socks are all good practice.","If memory, attention or judgment gets worse, or the patient often ignores one side, ask the occupational therapist or speech therapist to arrange special training. Practice at home helps, but it cannot replace training with the therapist."]},{"t":"p","x":"For patients with swallowing problems, ask the speech therapist first before drinking with a straw or practicing blowing."},{"t":"h","x":"Using things at home to stay safe"},{"t":"fig","id":"safetools"},{"t":"ul","x":["A small bell or whistle: Put it on the strong side, where the patient can see it, so the patient can call someone when help is needed.","Mobile phone: Set up emergency contacts. Write often-used phone numbers in large print and stick them next to the phone.","Colored tape: Stick it on door sills, the edges of steps and light switches so they are easier to see.","Night light: Put it along the way from the bed to the toilet.","Test the water temperature before bathing: Use the hand on the strong side, or use a thermometer, to avoid burns.","Put things the patient often uses where the patient can see them and reach them. Do not put them too high or too low. If the therapist asks you to put some things on the weak side for practice, please follow the therapist's plan."]},{"t":"warn","h":"Be careful during practice","ul":["After practice, put away small things like buttons, building blocks and coins. Do not leave them near the patient, so the patient does not swallow them by mistake.","Practice with steady things. Do not use things that slide, roll or fall over easily.","Do not use a plastic bottle filled with water as a dumbbell to lift the arm, because it can strain the shoulder on the weak side, unless the therapist says it is OK.","If there is chest pain, very hard breathing or a cold sweat, or if suddenly the mouth droops, an arm cannot be lifted or speech is unclear: stop right away, call 119, and write down the time it started.","If there is only dizziness: First sit or lie down to rest. If it does not get better, contact the medical staff."]}]},{"title":"Positioning and turning","desc":"Correct lying and sitting positions, 4 steps for turning, common mistakes","body":[{"t":"h","x":"Positioning is part of treatment"},{"t":"p","x":"After a stroke, the way the patient lies or sits affects the shoulder, joints and skin. Correct positioning protects the weak shoulder. It helps prevent stiff joints, foot drop and pressure sores. Positioning is not only for comfort. It is also part of treatment."},{"t":"fig","id":"posture"},{"t":"weak"},{"t":"key","h":"Lying on the weak side","ul":["Support the shoulder blade from behind and gently bring the weak shoulder forward. Do not pull the arm. Do not let the shoulder be trapped under the body.","Put the weak arm out in front, elbow straight, palm up, on the bed or a pillow.","The weak leg is underneath, slightly bent.","Put a pillow behind the back so the body does not roll backward.","Bend the strong leg forward and rest it on a pillow.","This position gives the weak side more feeling (sensory input). If the shoulder hurts, change the position and tell the therapist."]},{"t":"key","h":"Lying on the strong side","ul":["Put the weak arm out in front, on a pillow in front of the chest.","Bend the weak leg forward and rest it on a pillow. Do not let it hang in the air.","You can put a pillow behind the back so the body does not roll backward."]},{"t":"key","h":"Lying on the back","ul":["Put a thin pillow under the weak shoulder. Keep the arm a little away from the body, elbow straight, resting on a pillow.","You can put a small pillow under the buttock on the weak side, so the leg does not fall outward.","Do not keep the knees raised on a pillow for a long time. You can put a pillow under the lower legs so the heels are lifted and do not touch the bed.","Do not let the blanket press down on the toes.","Do not lie on the back for too long. Change between lying on the back and lying on the side."]},{"t":"key","h":"Sitting up in bed","ul":["Sit up in bed only for a short time. Do not half-lie, half-sit: the patient slides down easily and the buttocks can get pressure sores. When the patient can get out of bed, sit in a chair with armrests instead.","Support the back firmly with pillows. Sit straight. Do not lean to one side.","Put an over-bed table in front, with both hands on the table.","Increase sitting time slowly, as the therapist advises.","If the patient feels dizzy, lay the patient flat and tell the nurse or doctor."]},{"t":"key","h":"Prevent stiff joints","ul":["When lying down, the therapist may suggest wearing a resting ankle-foot brace to keep the ankle from getting stiff.","Within a pain-free range, place the weak arm slightly out to the side and turned outward (palm up), with the elbow straight.","Whether to use these and how to position, follow the therapist's guidance."]},{"t":"h","x":"4 steps for turning"},{"t":"fig","id":"turning"},{"t":"ul","x":["Before turning, place the weak arm well so it is not trapped under the body. After turning, check the arm position again.","Support the shoulder and buttock and turn them together. Lift the body to move it. Do not drag it. Do not pull the weak arm.","After turning onto the side, let the body lean back a little. Fill the gaps behind the back and waist with pillows. Do not leave the body unsupported or twisted.","Put a pillow between the legs, so the heels, ankles and inner knees do not press on each other."]},{"t":"p","x":"Turn the patient about every 2 hours. The nurse will decide the exact time. After turning, check the skin over bony areas, such as the buttocks, heels and ankles, for redness. Do not massage red areas. Keep the skin clean and dry. If it is too dry, use lotion. Wash and change the diaper right away when it is wet or after a bowel movement. Eating enough food with enough protein also helps prevent pressure injuries. People with kidney disease or a special diet should ask the dietitian how much to eat."},{"t":"h","x":"Do not make these mistakes"},{"t":"fig","id":"donts"},{"t":"warn","h":"Common mistakes by family and caregivers","ul":["Do not pull the weak arm.","Do not keep a hard or very high pillow under the knees for a long time.","Do not let the blanket press down on the toes.","Do not put hard things in the hand, unless the therapist advises it.","Do not let the patient lie on the back all day.","Do not ignore the skin: if a red area does not fade when you press it, tell the nurse."]}]},{"title":"Stroke location and practice order","desc":"Common problems after a left-brain or right-brain stroke, and step-by-step practice","body":[{"t":"h","x":"Different stroke locations cause different problems"},{"t":"p","x":"The brain has a left side and a right side. When one side is injured, the arm and leg on the other side usually become weak. Whether it is a blocked blood vessel or bleeding in the brain, each stroke location has its own common problems, but not every problem will happen. For the patient's own situation, please ask the attending doctor or therapist. A stroke on either side can make the patient cry easily, get angry easily or feel low. This is caused by the stroke. Please tell the doctor or nurse."},{"t":"fig","id":"brain"},{"t":"key","h":"Left-brain stroke: weak right arm and leg","ul":["Problems with speaking or understanding are common. For example, the patient wants to speak but cannot, or cannot understand what others say.","Doing arithmetic, reading and writing may also become harder.","Speak to the patient slowly, in short sentences, and use gestures and pictures.","As the therapist advises, encourage the patient to use the right hand in daily activities."]},{"t":"unitlink","x":"See \"Emotions and communication\"","unit":"u6"},{"t":"key","h":"Right-brain stroke: weak left arm and leg","ul":["The patient may ignore the left side. For example, the patient eats only the food on the right side of the plate, or bumps into door frames on the left.","The sense of distance and space may become worse.","The patient may act in a hurry or more impulsively.","The patient may think he or she can do things alone but actually needs help, so falls happen more easily.","Someone must always be with the patient when getting out of bed and walking. Before standing up, hold on to something steady so the patient does not fall to the left.","To remind the patient to pay attention to the left side, follow the therapist's instructions."]},{"t":"key","h":"Brainstem or cerebellum stroke","ul":["The brainstem controls important functions such as breathing, heartbeat and swallowing. After a brainstem stroke, swallowing problems are common and the patient may choke easily when drinking. Some people do not cough even when they choke. For how to eat and drink, follow the speech therapist's assessment.","Dizziness, poor balance and unsteady walking are common.","There may be swallowing problems, unclear speech, or double vision.","A brainstem stroke may cause weakness on both sides, or weakness of the face on a different side from the body.","Move slowly when getting up, to prevent falls. Ask the speech therapist to check swallowing problems."]},{"t":"h","x":"What each part of the brain does"},{"t":"p","x":"One stroke often affects several areas. Below are only common problems. Not all of them will happen."},{"t":"fig","id":"lobes"},{"t":"ul","x":["Frontal lobe: movement, planning and making decisions, personality. When injured, the patient may be weak, do things without a plan, or have personality changes and act more impulsively.","Parietal lobe: feeling and judging space. When injured, the patient may have less feeling, misjudge distance, or ignore one side (more common when the right side of the brain is injured, so the left side is ignored).","Temporal lobe: memory and understanding speech. When injured, memory may get worse and the patient may not remember recent people and events. When the left side of the brain is injured, the patient may not understand what others say.","Occipital lobe: seeing. When injured, both eyes may be unable to see things on the same side (the problem is not in just one eye), or vision may be unclear. When talking to the patient or placing things, start from the side the patient can see.","Cerebellum: balance and coordination. See \"Brainstem or cerebellum stroke\" on this page."]},{"t":"key","h":"If there are vision problems","p":"If one side of what the patient sees is missing, they see double, or they cannot see clearly, arrange a vision and visual field test. Based on the results, the therapist can plan training to practice turning the head and scanning with the eyes."},{"t":"h","x":"Different blocked blood vessels cause different problems"},{"t":"p","x":"Several main blood vessels bring blood to the brain. When one of them is blocked, the area it supplies is affected, so the problems are different. Below are common patterns. To know which blood vessel is affected in the patient, please ask the attending doctor."},{"t":"ul","x":["Middle cerebral artery: the most common. The face and arm on the other side are weaker than the leg, and feeling may also become worse. A left-brain stroke often causes problems with speaking or understanding. A right-brain stroke often causes the patient to ignore one side.","Anterior cerebral artery: the leg on the other side is weaker than the arm. The patient may also become more passive, lack drive to do things, respond more slowly, or be unable to control urine.","Posterior cerebral artery: both eyes cannot see things on the same side (the side opposite the blockage). When the left side is blocked, some people can see words but cannot read them.","Back of the brain (blood vessels of the brainstem and cerebellum): there may be dizziness, unsteady walking, swallowing problems, a hoarse voice, or double vision. Sometimes one side of the face and the other side of the body feel less heat, cold or pain, or one eyelid droops slightly.","Knowing which blood vessel is affected helps the family understand the patient's difficulties. Still follow the therapist's plan for what to practice."]},{"t":"h","x":"Rehabilitation goes step by step"},{"t":"fig","id":"progress"},{"t":"ul","x":["First sit steadily, then practice standing up, then practice walking.","If the leg is weak, first practice standing while holding a steady chair that does not slide, then practice walking. Do not go up or down stairs alone.","Hand practice starts with big objects, then small ones. For example, first hold a big cup or big blocks, then practice buttoning. Rest when the fingers are tired.","Do not hold your breath during practice. Do not pull hard on the joints. Stop if there is pain, cramps, chest tightness, dizziness or cold sweat.","Practice step by step according to the therapist's plan. Do not skip steps on your own."]},{"t":"unitlink","x":"See \"Home exercise\"","unit":"u8"}]},{"title":"Daily care at home","desc":"Blood pressure and blood sugar, drinking water, preventing blood clots in the legs, clearing phlegm, medicine and follow-up visits, when to get medical help","body":[{"t":"h","x":"Things to watch every day at home"},{"t":"p","x":"Going home does not mean care is over. At home, measure blood pressure every day, drink enough water, keep active, take medicine on time and go to follow-up visits. This can lower the chance of another stroke and other problems."},{"t":"fig","id":"homecare"},{"t":"h","x":"Blood pressure and blood sugar: keep them steady"},{"t":"key","h":"Measure at the same times every day","ul":["Measure blood pressure once in the morning after getting up (after using the toilet, before breakfast and before medicine) and once at night before bed. Write the numbers down.","Measure on the arm not affected by the stroke. Use the same arm every time.","People with diabetes: measure blood sugar at the times the doctor tells you, and write it down.","After a stroke, blood pressure is usually advised to be below 130/80 mmHg. The doctor decides each person's target.","Keep blood pressure within the doctor's target. But lower is not always better: if it is much lower than usual and the patient feels dizzy or faint, tell the doctor.","Do not add, reduce or stop medicine yourself."]},{"t":"warn","h":"If you see these when measuring blood pressure","ul":["Blood pressure 180/120 mmHg or higher (top number 180 or higher, or bottom number 120 or higher), with headache, chest pain, very hard breathing, blurred vision, unclear speech, confusion, or sudden weakness in an arm or leg: call 119 right away.","Blood pressure 180/120 mmHg or higher, but no symptoms: sit and rest for a few minutes, then measure again. If it is still this high, contact the doctor or see a doctor the same day. Do not take extra blood pressure medicine yourself.","Blood pressure above the doctor's target, but not as high as 180/120: take medicine as usual, write it down, and tell the doctor at the follow-up visit.","Cold sweat, shaking, a fast heartbeat, dizziness or confusion may mean blood sugar is too low. If you have a blood sugar meter, measure first. If it is below 70 mg/dL, and the patient is awake and can swallow safely: give sugary food the way the doctor or diabetes educator taught (for swallowing problems, use the thickness the speech therapist advised). Measure again after 15 minutes.","If the patient is confused, cannot be woken up, or cannot swallow well: do not feed anything. Call 119 right away."]},{"t":"unitlink","x":"See \"Measuring blood pressure: 722\"","unit":"u5"},{"t":"h","x":"Drink small amounts, many times a day"},{"t":"ul","x":["When the body does not have enough water, the blood gets thicker. Drink enough water. Drink a little at a time, many times a day.","People with heart disease or kidney disease, or whose doctor limits how much they drink: drink the amount the doctor tells you.","People with swallowing problems: follow the speech therapist's advice on whether to add thickener to water and how thick it should be.","People who drink water with thickener often drink too little without noticing. Family members should help keep track of how much they drink.","Sit up straight and drink slowly.","Less urine, very dark urine or very dry lips may mean not enough water. Please tell the nurse or doctor."]},{"t":"unitlink","x":"See \"Swallowing and safe eating\"","unit":"u3"},{"t":"h","x":"Preventing blood clots in the legs"},{"t":"p","x":"When a person lies or sits still for too long, blood in the legs moves slowly. A blood clot can form more easily."},{"t":"ul","x":["When lying down or sitting for a long time, do ankle exercises often: pull the toes up, then push them down, slowly. A family member can help move the weak leg.","Once the patient can get out of bed, get up and move more, following the therapist's plan.","Ordinary elastic stockings do not prevent blood clots in the legs after a stroke. Do not buy them to wear on your own. For people in the hospital who have great difficulty moving, the medical team may use leg sleeves that fill with air at set times to prevent blood clots. The medical team decides whether to use them. If the doctor asks the patient to wear elastic stockings for another reason, take them off every day and check the skin for breaks or redness."]},{"t":"warn","h":"Warning signs of a possible blood clot","ul":["One leg suddenly becomes swollen, painful, red or warm to the touch: do not massage this leg. See a doctor the same day. At night or on holidays, go to the emergency room.","Sudden chest pain, very hard breathing, or coughing up blood: call 119 right away."]},{"t":"key","h":"Bladder and bowel problems","ul":["After a stroke, leaking urine, sudden urges to urinate, being unable to pass urine, or constipation are common. Tell the nurse, and describe the patient's bladder and bowel habits before the stroke. The nurse may use ultrasound to see whether urine is left in the bladder.","If the patient has a urinary catheter, ask the medical staff when it can be removed. It should not stay in too long.","If the patient leaks urine, remind him or her to use the toilet at the set times planned by the nurse. Ask whether pelvic floor muscle exercises are suitable."]},{"t":"key","h":"Pain after a stroke","p":"If the side affected by the stroke has burning, stabbing or icy cold pain, or hurts a lot from a light touch, it may be nerve pain after a stroke. Tell the doctor. Medicine and other methods can reduce this pain. Do not just put up with it, and do not buy pain medicine on your own."},{"t":"h","x":"Helping to cough up phlegm"},{"t":"ul","x":["Turn the patient often. When the patient can sit up, sit up more. This makes it easier to cough up phlegm.","Encourage the patient to take a deep breath, then cough hard.","Before patting the back, have a nurse or therapist teach you first and check that it is suitable for the patient. If the patient takes medicine that prevents blood clots, or has osteoporosis (weak bones), a broken bone, or has had chest surgery, ask the doctor first.","Do not pat within 1 hour after eating or tube feeding. Cup your hand and pat over the ribs on the back. Avoid the spine and the lower back.","More phlegm, yellow or green phlegm, fever, or often choking when eating: see a doctor. Very hard breathing or purple lips: call 119 right away."]},{"t":"unitlink","x":"See \"Positioning and turning\"","unit":"u11"},{"t":"h","x":"Take medicine on time, go to follow-up visits on time"},{"t":"ul","x":["Medicine that prevents blood clots, and medicine that controls blood pressure, blood lipids (fats) and blood sugar: do not stop, reduce or change it yourself, even if you feel better.","When taking medicine that prevents blood clots: if there are black stools, blood in the urine, bleeding gums or a nosebleed that will not stop, or many bruises on the body, tell the doctor. If the patient vomits blood or passes a lot of blood in the stool, call 119 right away.","Before dental care, surgery or medical tests, tell the doctor that the patient takes medicine that prevents blood clots.","At follow-up visits, the doctor may order blood tests (for example blood sugar, blood lipids, blood clotting), or tests of the brain and blood vessels.","Bring the blood pressure and blood sugar records and the medicine bags to follow-up visits.","Do not smoke, and stay away from secondhand smoke. Do not drink alcohol, or drink only a little as the doctor advises."]},{"t":"h","x":"Eat light, balanced meals"},{"t":"ul","x":["Less salt: use less soy sauce and dipping sauce. Eat less pickled food and processed food. Do not drink the soup of instant noodles.","Less fat: eat less fried food and fatty meat.","Have protein at every meal, such as fish, eggs, tofu or lean meat.","Eat more vegetables. Part of the rice or other staple food can be whole grains, such as brown rice.","Do not switch to low-sodium salt on your own. It may not be suitable for people with kidney disease or people taking some blood pressure medicines. Ask the doctor or dietitian first.","People taking warfarin (a blood thinner): eat about the same amount of dark green vegetables every day. Do not suddenly eat much more or much less.","People with diabetes or kidney disease: eat as the dietitian advises. For how soft or hard food should be, follow the speech therapist's advice."]},{"t":"h","x":"Mood and safety matter too"},{"t":"p","x":"Keeping a calm mood and preventing falls are also very important after going home."},{"t":"unitlink","x":"See \"Preventing falls\"","unit":"u4"},{"t":"unitlink","x":"See \"Emotions and communication\"","unit":"u6"},{"t":"h","x":"When to call 119 right away"},{"t":"sos"},{"t":"warn","h":"If any of these happen, also call 119 right away","ul":["A sudden, very bad headache.","Suddenly cannot see clearly, or sees double.","Sudden dizziness, cannot stand steadily or walk steadily.","The face, an arm or a leg suddenly becomes weak or numb. This includes the weak side suddenly becoming weaker.","Suddenly confused, cannot be woken up, or has a seizure (shaking of the whole body).","Write down the last time the patient was known to be normal. Even if the symptoms go away quickly, still call 119.","While waiting for the ambulance, do not give the patient food, water or medicine. Do not drive to the hospital yourself."]}]},{"title":"Basic ideas of rehabilitation","desc":"Assessment first, muscle strength grades, balance, tight muscles, joint movement, walking, machine treatments, how much to practice","body":[{"t":"h","x":"Rehabilitation starts with an assessment"},{"t":"p","x":"During PAC, the care team checks the patient's abilities at the start, during care (about once every 3 weeks) and before the end. They make the plan and adjust the practice based on the results. Assess first, then practice. Do not add extra practice or change exercises just because of how you feel."},{"t":"fig","id":"evalflow"},{"t":"h","x":"Muscle strength has grades 0 to 5"},{"t":"p","x":"Therapists often use grades 0 to 5 to describe muscle strength. If you know the patient's grade, it is easier to understand why the therapist plans the practice this way."},{"t":"key","h":"Muscle strength grades","ul":["Grade 0: You cannot see or feel the muscle working at all.","Grade 1: You can see or feel the muscle work a little, but the joint does not move.","Grade 2: The arm or leg can slide along the bed, but cannot lift up (it cannot work against gravity).","Grade 3: The patient can lift it up alone through the full range of movement, but cannot hold when someone presses down lightly.","Grade 4: After lifting it up, the patient can hold against some pressing force, but is weaker than normal.","Grade 5: Normal strength."]},{"t":"p","x":"Practice should match the current grade. When strength is very low, the therapist or family mostly helps move the arm or leg. When the patient can move it alone, practice moving it alone. Whether to add resistance or weights is the therapist's decision. Do not add them yourself. The therapist checks the grade. Family members should not press on the patient's arm or leg themselves to test it. The therapist may also use other ways to check movement after a stroke."},{"t":"h","x":"Balance has three levels"},{"t":"fig","id":"balance3"},{"t":"ul","x":["Level 1: The patient can sit or stand steadily alone, without holding on.","Level 2: The patient does not fall when reaching for things or leaning forward, back or to the sides.","Level 3: The patient can stay steady even when pushed lightly.","Sitting and standing both have these three levels. Usually sitting is practiced first, then standing.","First be steady, then move, and only at the end practice against outside force. Only the therapist does the light-push practice. Family members should not push the patient themselves.","Preventing falls always comes first."]},{"t":"unitlink","x":"See \"Preventing falls\"","unit":"u4"},{"t":"h","x":"When muscles are tight, stretch slowly"},{"t":"p","x":"After a stroke, the weak arm or leg sometimes becomes very tight and stiff. It cannot bend or cannot straighten. This is muscle tone that is too high. Doctors and nurses often call it \"spasticity\". It is not the same as a muscle cramp or a seizure."},{"t":"fig","id":"stretch"},{"t":"ul","x":["Stretch slowly. Stop for a moment where it feels a little tight, then slowly relax. How long to hold depends on the therapist's advice.","Stop if it hurts. Do not force it, or you may injure the muscle or joint.","Muscles may get tighter in cold weather, or with stress, pain, constipation or a urinary tract infection.","If the muscles suddenly become much tighter than usual, tell the doctor or nurse.","If tight muscles make dressing, cleaning, positioning or walking hard, ask the doctor whether treatments such as injections to relax the muscles are suitable.","Splints or tape are not recommended to prevent muscle tightness (spasticity) in the wrist and fingers. Do not buy them and use them on your own. If the wrist is already tight and hard to bend, the therapist may check whether a splint is needed; if one is used, follow the therapist's instructions."]},{"t":"h","x":"Joint movement: slow, gentle, steady"},{"t":"ul","x":["Move the joints in the order the therapist taught. A common way is to start with the joints closest to the body: shoulder, elbow, wrist, then fingers.","Move slowly, gently and steadily, only in the range without pain. Do not pull hard. If the patient cannot tell you, watch the face and body: if the patient frowns, pulls the hand back, cries out or tenses up, stop.","When helping move the weak arm, support the elbow with one hand and the wrist with the other. Do not pull the hand.","Raise the arm only as high as the therapist taught. If there are no special instructions, do not raise the arm above shoulder height for now. Do not use a rope or pulley to pull the arm up."]},{"t":"h","x":"Before walking, practice shifting weight"},{"t":"ul","x":["First stand steadily, then practice stepping.","Hold a steady table or handrail, with someone protecting the patient, and practice slowly moving body weight onto the weak leg. If the knee is unsteady or locks backward, ask the therapist how to practice.","When stepping, put the heel down first.","If the weak leg swings out in a circle when walking, ask the therapist to teach the right way to walk. If needed, use a walking aid or ankle brace as the therapist advises.","Someone must always be with the patient during walking practice, standing a little behind on the weak side.","For people who can walk, practice walking, stepping and balance on real ground. Walking practice on a treadmill or machine is not better, so there is no need to buy a treadmill or machine for rehab."]},{"t":"unitlink","x":"See \"Using assistive devices\"","unit":"u9"},{"t":"h","x":"Machine treatments must fit the need"},{"t":"p","x":"The therapist chooses treatments such as electrical stimulation, heat packs, cold packs and ultrasound based on the patient's condition and stage of recovery. Not everyone needs them."},{"t":"ul","x":["Without the therapist's advice, do not buy electrical stimulation devices to use at home. People with a pacemaker must never use them on their own.","The side affected by the stroke often has less feeling and does not sense heat or cold well. The patient may not be able to tell you about a burn or frostbite. Heat packs, electric blankets and hand warmers can easily cause burns, and ice packs can cause frostbite. Ask the therapist before using them."]},{"t":"h","x":"Practice within the patient's limits"},{"t":"ul","x":["Practice works only when there is enough of it and it is hard enough. The therapist plans this based on the patient's condition and increases it slowly. You can split practice into several parts in one day, with rest in between. Do not practice until out of breath.","If the patient is still very tired or sore the next day, or feels weaker, the practice was too much. Do less, and tell the therapist.","Do not add extra practice to get better faster. Increase slowly, following the therapist's plan.","If the patient feels dizzy, has chest tightness, is very short of breath or has a cold sweat during practice, stop at once, rest, and tell the doctor or nurse."]},{"t":"key","h":"Rehabilitation also trains the brain","p":"A stroke is an injury to the brain. With repeated practice, the brain can learn again how to control movement. So focus during practice, repeat the correct movements, and when it is safe, encourage the patient to use the weak side more. Forcing the arm or leg does not help the brain learn."},{"t":"h","x":"3 steps for movement practice: Imagine, Try, Assisted"},{"t":"fig","id":"mindmove"},{"t":"ul","x":["Imagine: First picture in your mind that the weak arm or leg is doing the movement, for example the hand reaching forward. After imagining, really practice it. Do not stop at only imagining.","Try: Try to move with your own effort. Look for any part that can move a little, such as the fingers or wrist.","Assisted: For the parts the patient cannot move alone, the therapist or a family member supports them and helps finish the whole movement, while the patient also tries at the same time. Only support it. Do not pull the weak arm.","How much to do in each step, and how to help, follows what the therapist teaches."]},{"t":"h","x":"Hand and arm practice"},{"t":"fig","id":"handex"},{"t":"ul","x":["Grip: Hold a soft ball or a rolled-up towel.","Let go: Open the fingers and put down the thing in the hand.","Touch: Reach out to touch a cup or another target on the table. If the arm is weak, the hand can slide across the table, or someone can support it.","Lift: Rest the forearm on the table, lift the wrist up, then slowly lower it.","If the fingers are very tight and the fist cannot open, do not keep practicing gripping. First slowly straighten the fingers and wrist, practice opening the hand more, and ask the therapist which exercises are right."]},{"t":"fig","id":"armex"},{"t":"ul","x":["Reach forward: Sit steadily and reach the hand forward, as if taking something in front.","Lift up and open to the side: Do these only after the therapist has taught you. The family member supports the elbow with one hand and the wrist with the other, and slowly helps move the arm. Do not pull the hand.","Unless the therapist says it is OK, do not raise the arm above shoulder height, either up or to the side. Stop if the shoulder hurts or the hand feels numb.","Do not tie up the strong hand yourself to force the patient to use the weak hand. This method only suits some patients and must be arranged by the therapist."]},{"t":"h","x":"Order of leg practice"},{"t":"fig","id":"legsteps"},{"t":"ul","x":["First sit steadily, then practice standing. Stand up → shift weight while holding on → lift the leg → take a step. Go one step at a time. Move to the next step only when the one before is steady.","When lifting a leg, the patient stands on one leg. This is when falls happen most easily. Always hold a fixed handrail or a steady table.","During practice, someone must always stay on the weak side. Use a walker or brace as the therapist advises."]},{"t":"unitlink","x":"See \"Home exercise\"","unit":"u8"}]},{"title":"Recovery and arm and leg practice","desc":"How long recovery takes, why the hand is slower, stick and peg practice, foot drop","body":[{"t":"h","x":"Recovery takes time"},{"t":"fig","id":"timeline"},{"t":"ul","x":["The first 3 months after a stroke are usually when progress is fastest. Use this time to practice.","3 to 6 months: Progress usually slows down, but it is still possible.","6 to 12 months: Progress is slower. Keep practicing and things may still get better.","After 1 year: Practice still helps. It can keep and improve what the patient can do.","Each person recovers at a different speed. Do not compare with others. Keep practicing as the therapist plans.","Recovery continues after formal rehab ends. Regular follow-up check-ups are recommended. If there are new difficulties or goals, the patient can have another period of rehab."]},{"t":"key","h":"3 things to keep steady every day","p":"Eat regular meals, rest well, and practice every day. If the patient chokes or coughs when eating or drinking, a speech therapist must check the patient before eating or drinking. If speech is unclear, a speech therapist can also help with practice. If speech suddenly becomes unclear, or gets worse than before, call 119 right away."},{"t":"unitlink","x":"See \"Swallowing and safe eating\"","unit":"u3"},{"t":"h","x":"Why can the leg walk first while the hand is slower?"},{"t":"p","x":"Walking uses bigger movements. The hand and fingers need small, exact movements. So the hand usually recovers more slowly, and the fingers even more slowly. This is common. It does not mean there is no hope for the hand."},{"t":"key","h":"Do not practice only walking","ul":["If the hand is not practiced, its small movements are hard to get back, even when walking is steady. Practice the hand every day too.","First relax: Stretch slowly to loosen very tight muscles.","Then move: Move the shoulder, elbow, wrist, and fingers.","Then use strength: Practice lifting the arm and gripping by yourself.","Do not force the hand open. When resting, support the hand on a pillow with the fingers naturally open. Do not let the hand hang down or stay curled up.","Hand recovery is different for each person. The therapist will also teach how to do daily tasks with the other hand or with aids. Practice both."]},{"t":"unitlink","x":"See \"Positioning and turning\"","unit":"u11"},{"t":"h","x":"Hand practice with a stick and pegs"},{"t":"fig","id":"stickex"},{"t":"ul","x":["Two hands on a stick: Sit steadily and hold a stick with both hands. Slowly reach forward, then slowly bring it back. You can also slowly move it left and right. At home, use a rolling pin or a rolled-up towel instead.","The weak hand must also use strength. Do not let the strong hand do all the work. If the weak hand cannot hold on, a family member can help hold it.","Do not pull the weak arm. If the shoulder is weak, hurts, or has a gap (dip) in it, do not raise the hand above the shoulder for now. Ask the therapist how high to lift.","Pegs: Start with thick pegs. They are easier. Look at the hole, move the hand slowly toward it, keep the wrist steady, then put the peg in. At home, practice putting thick straws into a cup.","Start with 8 to 12 times per set, 2 sets a day. When steady, slowly do more as the therapist advises. Do only what the patient can manage."]},{"t":"warn","h":"Be careful when practicing the hand","ul":["Shoulder pain, numb hand, dizziness, chest tightness, or very short of breath: stop right away.","If the hand is very tight or spasticity is strong, pause first. Do not force the practice.","Do not force the fingers or wrist open. Do not hold your breath and push hard.","Sit steadily the whole time, with someone watching nearby."]},{"t":"h","x":"Toes point down (foot drop)"},{"t":"fig","id":"footdrop"},{"t":"ul","x":["Cause: The muscles that pull the top of the foot up are weak, and the calf muscles are often too tight.","If the toes point down for a long time, the tendon behind the heel slowly gets shorter. The ankle gets stiff and is harder to improve later.","When walking, the toes drag on the floor easily, so the patient trips easily."]},{"t":"key","h":"How to prevent it","ul":["When lying down, do not let the blanket press on the toes. Position the patient as the therapist teaches.","Move the ankle every day by pulling the top of the foot up. If the patient cannot do it alone, a family member holds the heel and helps slowly. Stop when it feels tight. Do not press hard. If the ankle is very stiff or keeps shaking, ask the therapist first.","If the calf suddenly becomes swollen, painful, red, or warm to the touch: do not do this exercise, and tell the medical staff.","Wear the ankle brace and closed, non-slip shoes as the therapist advises. After taking off the brace, check the skin. If redness stays for a long time, tell the therapist."]},{"t":"unitlink","x":"See \"Using assistive devices\"","unit":"u9"}]}],"daily":["Joined all of today's rehabilitation sessions","The patient did the things he or she can do alone (washing the face, dressing, eating)","Sat upright at meals, took small bites slowly, and sat for 30 minutes after eating","Cleaned the mouth after meals and checked for leftover food","Before getting out of bed, sat for 30 seconds and stood for 30 seconds, with someone there","In bed, turned over about every 2 hours, with the weak arm supported by a pillow","Took all of today's medicine on time","Measured blood pressure and wrote it down","Talked with the patient and encouraged the patient today","The caregiver rested and ate","Did the home exercises today the way the therapist taught","Practiced hand movements with things at home today","After turning, checked the skin over bony areas such as the buttocks and heels","Drank small amounts of water many times today (if the doctor limits water, followed the doctor's instructions)","Did ankle exercises while lying down or sitting for a long time","Rested during today's practice and did not get too tired","Besides walking, practiced the hand today"],"ready":["Can safely help the patient get in and out of bed and the wheelchair","Can feed the patient, or feed through a feeding tube (nasogastric tube)","Know what each medicine does and when to take it","Can do the home rehabilitation exercises","Have prepared assistive devices as the therapist advised","Grab bars and non-slip mats are installed at home, and clutter is put away","Have called 1966 or asked the nurse for a referral for a long-term care assessment","Know the dates and departments of the follow-up visits","Know the warning signs of another stroke and when to call 119","Have a blood pressure monitor at home and know how to record the readings","Know which side to hold the cane on, and how to go up and down stairs","A small bell for calling for help is ready at home, and colored tape is on the door sills","Can position the patient correctly and help with turning","Know the warning signs of a blood clot in the leg, and to bring blood pressure and blood sugar records and medicine bags to follow-up visits","Know the patient's current muscle strength and balance level, and how much practice the therapist advises"],"quiz":[{"q":"After a stroke, once the condition is stable, starting rehabilitation early gives a better chance of recovering function.","why":"Recovery is faster in the period after the condition becomes stable. PAC arranges intensive rehabilitation during this period."},{"q":"To let the patient rest more, it is best for family members to do the dressing and feeding for the patient.","why":"Please let the patient do the things he or she can do alone. This is also part of rehabilitation. Family members only need to stay close and watch, and help when needed."},{"q":"When helping the patient get up, you must not pull the arm on the weak side.","why":"Pulling the arm on the weak side can easily injure the shoulder."},{"q":"It is fine if the patient coughs once in a while during meals. There is no need to tell the medical staff.","why":"Coughing when eating or drinking water is a warning sign of a swallowing problem. Please tell the nurse or speech therapist."},{"q":"When feeding the patient, the food should be put into the mouth from the strong side.","why":"Food put in from the strong side is easier to chew and swallow, and less food is left in the mouth."},{"q":"If the patient needs the toilet in the middle of the night, the patient can walk there slowly alone so that the family is not woken up.","why":"Someone must be with the patient when getting out of bed and going to the toilet. In the hospital, press the call bell. Do not try to do it alone."},{"q":"If blood pressure is stable and the patient feels fine, the patient can stop taking the medicine on his or her own.","why":"Blood pressure is stable because the medicine is taken on time. Whether to change the medicine is for the doctor to decide."},{"q":"If the mouth suddenly becomes crooked, one arm becomes weak or speech becomes unclear, the patient should first rest and wait half a day to see if it gets better.","why":"These are warning signs of another stroke. If any one of them happens, call 119 right away and write down the time it started."},{"q":"During PAC care, the team assesses the patient's progress every 3 weeks.","why":"The team assesses the patient at the start of the program, every 3 weeks and at the end of the program, and adjusts the rehabilitation based on the results."},{"q":"Caregivers also need rest. They can call 1966 to ask about respite care.","why":"Caregiving is long-term work. You can call the 1966 long-term care hotline to ask about resources such as respite care and home care services."},{"q":"The cane should be held on the weak side, so that it can help the weak leg.","why":"The cane should be held on the strong side. When walking, the cane and the weak leg move forward together."},{"q":"If chest pain or dizziness starts suddenly during exercise, stop exercising right away.","why":"Chest pain, dizziness, cold sweat, or being very short of breath: stop exercising right away. If it does not get better after a few minutes of rest, or an arm or leg suddenly gets weaker, call 119."},{"q":"After practicing with buttons or building blocks, you can leave them near the patient so the patient can practice any time.","why":"Put small things away after practice, so the patient does not swallow them by mistake."},{"q":"When turning the patient, you can pull the weak arm to move the body over.","why":"Pulling the weak arm can injure the shoulder. Support the shoulder and buttock and turn them together."},{"q":"If the patient chokes while eating but can still cough and speak, you should pat the back hard.","why":"If the patient can still cough, have the patient lean forward and cough hard. Do not pat the back. Only when the patient cannot cough (no sound), cannot speak or cannot breathe: call 119, and alternate back blows and abdominal thrusts."},{"q":"If blood pressure feels a little high, you can take an extra blood pressure pill on your own.","why":"Do not add, reduce or stop medicine yourself. Blood pressure should reach the doctor's target, but lower is not always better. If you have questions, ask the doctor."},{"q":"If one of the patient's legs suddenly becomes swollen and painful, you should massage it hard to bring the swelling down.","why":"This may be a warning sign of a blood clot. Do not massage it. See a doctor the same day. If there is sudden chest pain or very hard breathing, call 119 right away."},{"q":"When lying down or sitting for a long time, doing ankle exercises often (pulling the toes up and pushing them down) can help prevent blood clots in the legs.","why":"Ankle exercises keep the blood in the legs moving and help prevent blood clots. A family member can help move the weak leg."},{"q":"When the patient's arm or leg muscles are very tight, forcing them straight works better.","why":"Forcing can injure the muscles or joints. Stretch slowly, hold for a moment, then relax. Stop if it hurts."},{"q":"The more rehab practice, the better, so you can double the practice on your own.","why":"Practice works only when there is enough of it and it is hard enough, but the therapist should plan it based on the patient's condition and increase it slowly. Suddenly doubling practice on your own can make the patient too tired or cause injury."},{"q":"When the side affected by the stroke has less feeling, heat packs or hand warmers can easily cause burns.","why":"With less feeling, the patient does not sense heat or cold well and may not notice a burn. Ask the therapist before using them."},{"q":"If the fingers are very tight and the fist cannot open, the patient should squeeze a ball hard all day.","why":"When the fingers are very tight, only practicing hard gripping may not be right, and do not practice too long at one time. First slowly straighten the fingers, practice opening the hand more, and ask the therapist which exercises are right."},{"q":"After a stroke, if the leg can already walk but the hand recovers more slowly, it means there is no hope for the hand, so practice only walking.","why":"It is common for the hand to recover more slowly. If the hand is not practiced, its small movements are hard to get back. Practice the hand every day too."},{"q":"If the patient did not choke after a few bites, swallowing is already safe and no check is needed.","why":"Some people do not cough even when food or water goes into the windpipe (silent aspiration). A speech therapist must check whether swallowing is safe."},{"q":"To prevent muscle tightness (spasticity) in the wrist and fingers, family members can buy splints or tape on their own for the patient to use.","why":"Splints or tape are not recommended to prevent muscle tightness in the wrist and fingers. Whether to use a splint and how to use it should be checked and guided by the therapist."}],"res":{"ui":{"tab":"Services","title":"Taipei support services","intro":"Help for stroke patients and families: food, clothing, housing, transport, medical care, long-term care and financial help. Tap each item to see how to apply and who to call.","searchLabel":"Search","searchPh":"Type a word, e.g. meals, wheelchair, Songshan","catLabel":"Category","catAll":"All categories","count":"{n} items","none":"No matching services. Try another word, or choose \"All categories\".","clear":"Clear","who":"Who can use it","how":"How to apply","phone":"Phone","ext":"ext.","web":"Official website","note":"Please note","zhName":"Chinese name","tip1999":"1999 is the Taipei City hotline. In Taipei, you can call it from a landline or a mobile phone. Outside Taipei, call 02-2720-8889 instead.","checked":"Information checked on 2026-10-14 (ROC year 115). Services and amounts may change. Pl
