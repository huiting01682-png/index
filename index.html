 Taiwan atau sertifikat disabilitas, lalu daftar di Kantor Distrik mana saja. Boleh diwakilkan kepada orang lain.","note":"","tels":[{"label":"Dinas Sosial","tel":"1999","ext":"6966～6968","addr":""}],"url":"https://laws.gov.taipei/law/LawSearch/LawExport/FL038239?type=0"},{"id":"parking","cats":["transport"],"name":"Kartu tanda parkir khusus penyandang disabilitas","agency":"Dinas Sosial Pemerintah Kota Taipei","what":"Kartu tanda untuk parkir di tempat parkir khusus penyandang disabilitas. Saat parkir, letakkan di dalam mobil, di balik kaca depan, supaya terlihat.","who":"Penyandang disabilitas yang terdaftar sebagai penduduk Kota Taipei dan menurut penilaian sulit bergerak. Keluarga juga bisa mendaftar atas nama pasien. Setiap orang hanya boleh satu kartu.","how":"Daftar di Pusat Layanan Terpadu Balai Kota, daftar online lewat situs layanan online Kota Taipei (service.taipei), atau daftar lewat pos.","note":"","tels":[{"label":"Dinas Sosial, Bagian Kesejahteraan Penyandang Disabilitas","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://www.dosw.gov.taipei/cp.aspx?n=411918B6262745BE"},{"id":"disallow","cats":["money"],"name":"Bantuan biaya hidup untuk penyandang disabilitas","agency":"Dinas Sosial Pemerintah Kota Taipei; Kantor Distrik sesuai alamat domisili terdaftar","what":"Penyandang disabilitas dari keluarga yang ekonominya kurang mampu bisa menerima bantuan biaya hidup setiap bulan.","who":"Orang yang terdaftar sebagai penduduk dan tinggal di Kota Taipei, punya sertifikat disabilitas, dan penghasilan serta harta keluarganya di bawah batas standar.","how":"Bawa KTP Taiwan, formulir pendaftaran, dan fotokopi halaman depan buku tabungan. Daftar di bagian sosial Kantor Distrik sesuai alamat domisili terdaftar.","note":"Harus punya sertifikat disabilitas lebih dulu. Batas penghasilan dan harta berubah setiap tahun. Silakan telepon untuk memastikan.","tels":[{"label":"Dinas Sosial, Bagian Kesejahteraan Penyandang Disabilitas","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://dosw.gov.taipei/News_Content.aspx?n=91F35523B74F69AC&s=8D79133341A528E3"},{"id":"carerallow","cats":["money","caregiver"],"name":"Tunjangan perawatan khusus untuk lansia berpenghasilan menengah ke bawah","agency":"Dinas Sosial Pemerintah Kota Taipei; Pusat Layanan Lansia di setiap distrik","what":"Jika anggota keluarga merawat lansia yang sangat tidak mampu mengurus diri sendiri di rumah sepenuhnya sehingga tidak bisa bekerja, keluarga bisa menerima tunjangan perawatan setiap bulan.","who":"Lansia yang menerima tunjangan hidup lansia berpenghasilan menengah ke bawah, sangat tidak mampu mengurus diri sendiri (tingkat berat atau lebih), dirawat oleh keluarga, dan tidak mempekerjakan perawat bayaran (termasuk perawat asing), tidak memakai layanan di rumah, dan tidak memakai perawatan siang hari.","how":"Telepon Pusat Layanan Lansia di distrik tempat tinggal. Mereka akan membantu pendaftaran.","note":"Syarat dan jumlah uang bisa berubah. Sebelum mendaftar, silakan telepon dulu untuk memastikan.","tels":[{"label":"Pusat Layanan Lansia Songshan","tel":"02-2768-5636","ext":"","addr":""},{"label":"Pusat Layanan Lansia Xinyi","tel":"02-8787-0300","ext":"","addr":""},{"label":"Pusat Layanan Lansia Da'an","tel":"02-2708-6255","ext":"","addr":""},{"label":"Pusat Perumahan dan Layanan Lansia Zhongshan","tel":"02-2542-0006","ext":"","addr":""},{"label":"Pusat Layanan Lansia Neihu","tel":"02-2632-5560","ext":"","addr":""},{"label":"Pusat Layanan Lansia Nangang","tel":"02-2653-5311","ext":"","addr":""},{"label":"Pusat Layanan Lansia Zhongzheng","tel":"02-2381-4571","ext":"","addr":""},{"label":"Pusat Layanan Lansia Datong","tel":"02-2592-9808","ext":"","addr":""},{"label":"Pusat Layanan Lansia Wanhua","tel":"02-2361-0666","ext":"","addr":""},{"label":"Pusat Layanan Lansia Wenshan","tel":"02-2234-4893","ext":"","addr":""},{"label":"Pusat Layanan Lansia Shilin","tel":"02-2838-1571","ext":"","addr":""},{"label":"Pusat Layanan Lansia Beitou","tel":"02-2892-9702","ext":"","addr":""}],"url":"https://elders.gov.taipei/News_Content.aspx?n=40A74DAD56B74FC0&sms=21884AF41A49B03F&s=451E3C675205415B"},{"id":"hospcarer","cats":["money"],"name":"Bantuan biaya perawat bayaran saat rawat inap","agency":"Dinas Sosial Pemerintah Kota Taipei","what":"Warga kota yang kesulitan ekonomi dan dirawat inap karena sakit mendadak bisa mendaftar bantuan biaya untuk menyewa perawat bayaran (penjaga pasien).","who":"Keluarga berpenghasilan rendah Kota Taipei, orang yang memenuhi syarat tunjangan hidup lansia berpenghasilan menengah ke bawah, atau kasus yang sedang didampingi Dinas Sosial.","how":"Saat dirawat inap, tanya dulu pekerja sosial rumah sakit, atau telepon Dinas Sosial untuk bertanya.","note":"Jumlah bantuan dan jumlah hari, silakan tanyakan lewat telepon.","tels":[{"label":"Dinas Sosial, Bagian Pekerjaan Sosial","tel":"02-2720-8889","ext":"1633","addr":""}],"url":"https://elders.gov.taipei/News_Content.aspx?n=40A74DAD56B74FC0&sms=21884AF41A49B03F&s=46DFDD2811FCC6DD"},{"id":"relief","cats":["money"],"name":"Bantuan darurat","agency":"Dinas Sosial Pemerintah Kota Taipei; Pusat Layanan Kesejahteraan Sosial dan Kantor Distrik","what":"Jika anggota keluarga tiba-tiba sakit berat atau cedera dan kehidupan keluarga tiba-tiba sulit bertahan, bisa mendaftar uang bantuan satu kali.","who":"Terdaftar sebagai penduduk Kota Taipei, dan dalam 3 bulan terakhir terjadi keadaan seperti anggota keluarga sakit berat, cedera, atau pencari nafkah utama tidak bisa bekerja.","how":"Bawa dokumen bukti, lalu daftar di Pusat Layanan Kesejahteraan Sosial atau Kantor Distrik sesuai alamat domisili terdaftar.","note":"","tels":[{"label":"Dinas Sosial, Bagian Bantuan Sosial","tel":"1999","ext":"1609","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=0BF751F1B9F07AA1"},{"id":"relief2","cats":["money"],"name":"Bantuan darurat cepat (dulu bernama \"Kepedulian Segera\")","agency":"Dinas Sosial Pemerintah Kota Taipei; Kantor Distrik","what":"Jika anggota keluarga sakit atau cedera berat, dirawat 1 bulan atau lebih dan tidak bisa bekerja, atau kehilangan pekerjaan karena merawat keluarga, bisa cepat menerima uang bantuan.","who":"Keluarga yang mengalami kesulitan di atas dalam 3 bulan terakhir. Untuk kejadian yang sama, pada prinsipnya hanya bisa mendaftar satu kali.","how":"Daftar di Kantor Distrik.","note":"","tels":[{"label":"Dinas Sosial, Bagian Bantuan Sosial","tel":"1999","ext":"1609","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=7011FE50261D43B5"},{"id":"carersupport","cats":["caregiver"],"name":"Pos layanan dukungan untuk pendamping keluarga dan saluran telepon kepedulian","agency":"Dinas Sosial Pemerintah Kota Taipei; Kementerian Kesehatan dan Kesejahteraan Taiwan","what":"Tempat yang bisa dihubungi saat pendamping lelah atau tidak tahu cara merawat: kelas keterampilan merawat, kegiatan untuk melepas stres, kelompok dukungan, dan konseling psikologis. Selama ikut kelas, bisa diatur perawatan sementara untuk pasien.","who":"Pendamping dari keluarga yang memakai perawatan jangka panjang dan keluarga penyandang disabilitas. Anggota keluarga yang mempekerjakan perawat asing juga bisa memakai layanan ini.","how":"Sesuai distrik tempat tinggal, telepon pos yang sesuai. Jika ingin bercerita dulu tentang beban merawat, bisa menelepon saluran kepedulian.","note":"","tels":[{"label":"Saluran kepedulian untuk pendamping keluarga (seluruh Taiwan)","tel":"0800-507272","ext":"","addr":""},{"label":"Pos Distrik Zhongshan, Songshan, dan Nangang","tel":"02-7703-1972","ext":"","addr":"臺北市中山區建國北路二段129號7樓"},{"label":"Pos Distrik Xinyi","tel":"02-2578-0285","ext":"217、218","addr":""},{"label":"Pos Distrik Da'an","tel":"02-2367-6646","ext":"8536、8721","addr":""},{"label":"Pos Distrik Zhongzheng dan Neihu","tel":"02-2311-4678","ext":"","addr":""},{"label":"Pos Distrik Wenshan","tel":"02-2234-2199","ext":"","addr":""},{"label":"Pos Distrik Wanhua dan Datong (keluarga perawatan jangka panjang)","tel":"02-2308-5739","ext":"","addr":""},{"label":"Pos Distrik Datong (keluarga penyandang disabilitas)","tel":"02-2550-6658","ext":"","addr":""},{"label":"Pos Distrik Beitou dan Shilin","tel":"02-2838-1571","ext":"214","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=70898293C7B4ABE5"},{"id":"foreignhire","cats":["caregiver"],"name":"Mempekerjakan perawat asing dan saluran 1955","agency":"Badan Pengembangan Tenaga Kerja, Kementerian Tenaga Kerja Taiwan; Pusat Manajemen Perawatan Jangka Panjang Kota Taipei","what":"Jika ingin mempekerjakan perawat asing, pastikan dulu pasien memenuhi syarat. Jika majikan atau perawat asing punya masalah, keduanya bisa menelepon 1955, 24 jam dan gratis, dengan layanan berbagai bahasa.","who":"Pasien yang menurut penilaian rumah sakit yang ditunjuk perlu dirawat sepanjang hari, atau memenuhi syarat tertentu seperti jenis disabilitas tertentu. Usia 80 tahun ke atas bisa bebas dari penilaian medis.","how":"Setelah penilaian di rumah sakit yang ditunjuk, kirim dokumen ke Pusat Manajemen Perawatan Jangka Panjang Kota Taipei, lalu ikuti prosedur untuk mendaftar ke Kementerian Tenaga Kerja.","note":"1955 punya layanan berbagai bahasa, termasuk bahasa Indonesia, bahasa Vietnam, dan bahasa Thai.","tels":[{"label":"Saluran konsultasi dan pengaduan pekerja 1955 (24 jam)","tel":"1955","ext":"","addr":""},{"label":"Pusat Layanan Terpadu Perekrutan Langsung","tel":"02-6613-0811","ext":"","addr":""}],"url":"https://dhsc.wda.gov.tw/Industry?MenuId=fea6ae19-627e-4418-8662-bc2b2e85977d"},{"id":"foreignltc","cats":["caregiver","care"],"name":"Layanan perawatan jangka panjang untuk keluarga yang mempekerjakan perawat asing","agency":"Kementerian Kesehatan dan Kesejahteraan Taiwan; Pusat Manajemen Perawatan Jangka Panjang Kota Taipei","what":"Keluarga yang punya perawat asing juga bisa memakai layanan profesional, antar-jemput, alat bantu, perbaikan rumah agar bebas hambatan, dan layanan pengganti sementara bagi pendamping (respite). Saat perawat asing libur, bisa mendaftar layanan pengganti sementara (respite).","who":"Di rumah ada perawat asing, dan tingkat kebutuhan perawatan jangka panjang pasien level 2 atau lebih. Saat ada masa kosong, misalnya perawat asing pulang kampung atau sudah keluar dari Taiwan, semua layanan perawatan jangka panjang bisa dipakai jika ada bukti.","how":"Telepon 1966 dan minta Pusat Manajemen Perawatan Jangka Panjang datang ke rumah untuk menilai.","note":"","tels":[{"label":"Saluran telepon perawatan jangka panjang","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/Ltc/cp-6460-69943-207.html"}]}},"vi":{"code":"vi","name":"Tiếng Việt","htmlLang":"vi","speech":"vi-VN","locale":"vi-VN","glyph":"A","rangeWord":" đến ","say":[["119","một một chín"],["1966","một chín sáu sáu"],["722","bảy hai hai"]],"ui":{"brand":"Hướng dẫn đột quỵ PAC","trial":"Bản dùng thử","tabHome":"Trang chủ","tabLearn":"Bài học","tabCheck":"Danh sách","tabQuiz":"Câu hỏi","homeTitle":"Giai đoạn vàng để phục hồi sau đột quỵ","homeIntro":"Hướng dẫn chăm sóc sau giai đoạn cấp dành cho người bệnh và gia đình. Mỗi bài khoảng 3 phút, có thể đọc hoặc nghe.","todayTitle":"Danh sách chăm sóc hôm nay","todayDone":"Đã xong {n} / {m} việc","unitsHeading":"Các bài học","aboutTitle":"Về tài liệu hướng dẫn này","about":["Đây là bản dùng thử. Nội dung phải được đội ngũ y tế xem xét trước khi đưa vào sử dụng.","Nội dung chỉ là hướng dẫn chung. Tình trạng của mỗi người bệnh khác nhau, xin làm theo chỉ dẫn của bác sĩ điều trị và đội ngũ chăm sóc.","Các dấu đánh chọn chỉ được lưu trên thiết bị này, không được tải lên, cũng không ghi lại họ tên hay hồ sơ bệnh án.","Bản dịch này là bản nháp, chưa được nhân viên y tế nói tiếng Việt bản ngữ xem xét."],"sourcesLabel":"Nguồn tham khảo:","src1":"Chương trình Chăm sóc Tích hợp Sau giai đoạn cấp (PAC) của Cục Bảo hiểm Y tế Quốc gia Đài Loan","src2":"Tài liệu hướng dẫn về đột quỵ của Cục Sức khỏe Quốc dân Đài Loan (HPA)","learnTitle":"Các bài học","learnIntro":"Có {n} bài. Muốn xem bài nào thì bấm vào bài đó.","back" đội ngũ y tế của bệnh viện xem xét."],"srcNote":"Hướng dẫn là khuyến nghị dành cho nhân viên y tế. Tình trạng của mỗi người bệnh khác nhau; việc điều trị thực tế xin làm theo chỉ dẫn của bác sĩ điều trị và đội ngũ chăm sóc.","unitSrcLabel":"Bài này dựa trên các chương của hướng dẫn","unitSrcOther":"Một phần nội dung bài này còn tham khảo chế độ của Đài Loan hoặc các hướng dẫn khác.","srcGo":"Xem nguồn","secs":{"2.1":"Tổ chức chăm sóc phục hồi chức năng sau đột quỵ và các tuyến chăm sóc","2.2":"Phục hồi chức năng trong thời gian nằm viện giai đoạn cấp","3.1":"Phòng ngừa tổn thương da và co rút khớp","3.2":"Phòng ngừa huyết khối tĩnh mạch","3.3":"Điều trị rối loạn chức năng đại tiện, tiểu tiện","3.4":"Đánh giá, phòng ngừa và điều trị đau vai bên liệt","3.5":"Đau trung ương sau đột quỵ","3.6":"Phòng ngừa té ngã","3.7":"Đánh giá sức khỏe tâm thần và xử trí trầm cảm, lo âu sau đột quỵ (gồm cảm xúc và hành vi)","3.8":"Loãng xương sau đột quỵ","3.9":"Giấc ngủ và mệt mỏi sau đột quỵ","4.1":"Đánh giá khuyết tật và nhu cầu phục hồi chức năng","4.2":"Đánh giá rối loạn vận động, hoạt động và khả năng di chuyển","4.4":"Đánh giá nhận thức và tri giác","4.5":"Đánh giá cảm giác (xúc giác, thị lực, thính lực)","5.1":"Hoạt động thể chất","5.3":"Xử trí co cứng cơ","5.4":"Thăng bằng và mất điều hòa vận động","5.5":"Dáng đi và khả năng di chuyển","5.6":"Hoạt động chi trên (gồm sinh hoạt hằng ngày, xúc giác và cảm giác bản thể)","5.7":"Dụng cụ hỗ trợ, thiết bị y tế, nẹp chỉnh hình và xe lăn","5.8":"Điều chỉnh và quản lý lối sống","5.9":"Điều trị rối loạn thị giác","5.10":"Sàng lọc nuốt, xử trí và dinh dưỡng","6.1":"Điều trị không dùng thuốc cho suy giảm nhận thức (gồm trí nhớ)","6.2":"Rối loạn giao tiếp mắc phải (ví dụ mất ngôn ngữ)","6.3":"Rối loạn vận động lời nói: loạn vận ngôn và mất dụng ngôn","6.4":"Lãng quên không gian (lãng quên một bên)","7.1":"Tính liên tục của chăm sóc y tế và phục hồi chức năng từ bệnh viện về cộng đồng","7.2":"Sự tham gia và hỗ trợ của người chăm sóc","7.3": c điều trị cấp tính cho đột quỵ kết thúc và bệnh đã ổn định, có một khoảng thời gian chức năng cơ thể hồi phục khá nhanh. Chương trình Chăm sóc Tích hợp Sau giai đoạn cấp của Bảo hiểm Y tế Toàn dân Đài Loan (NHI) được gọi tắt là PAC. Trong chương trình này, một đội ngũ gồm nhiều chuyên ngành sắp xếp cho người bệnh tập phục hồi chức năng tích cực ngay trong khoảng thời gian đó, giúp người bệnh lấy lại khả năng tự lo sinh hoạt và về nhà thuận lợi."},{"t":"fig","id":"journey"},{"t":"h","x":"Ai được tham gia"},{"t":"p","x":"Người bệnh có phù hợp để tham gia hay không là do đội ngũ y tế đánh giá. Các điều kiện chính như sau:"},{"t":"ul","x":["Trong vòng 1 tháng sau khi bị đột quỵ não cấp. Trường hợp đặc biệt có thể nới rộng đến trong vòng 40 ngày.","Sau đột quỵ có suy giảm chức năng ở mức trung bình đến trung bình nặng.","Bệnh đã ổn định từ 72 giờ trở lên.","Có khả năng phục hồi: có thể phối hợp và học theo hướng dẫn, ngồi được đủ 1 giờ khi được đỡ, sẵn lòng chủ động tham gia tập phục hồi chức năng."]},{"t":"h","x":"Chăm sóc trong bao lâu"},{"t":"p","x":"Về nguyên tắc là 3–6 tuần. Sau khi đội ngũ y tế đánh giá, nếu vẫn còn cần thì có thể kéo dài một lần, tối đa đến 12 tuần. Trong thời gian này, cứ 3 tuần đánh giá mức tiến bộ một lần."},{"t":"fig","id":"weeks"},{"t":"h","x":"Ba hình thức chăm sóc"},{"t":"modes","x":[{"dt":"Hình thức nội trú","dd":"Ở lại bệnh viện để tập phục hồi chức năng. Cường độ cao: mỗi ngày trị liệu 3–5 lần. Cường độ thông thường: mỗi ngày 1–2 lần."},{"dt":"Hình thức chăm sóc ban ngày","dd":"Ban ngày đến bệnh viện tập phục hồi chức năng, thời gian khoảng từ 9 giờ sáng đến 5 giờ chiều, mỗi ngày trị liệu 2–4 lần, buổi tối về nhà nghỉ ngơi."},{"dt":"Hình thức tại nhà","dd":"Với người bệnh không thể nằm viện, không thể tham gia chăm sóc ban ngày hoặc không thể đến phòng khám ngoại trú để tập phục hồi chức năng, chuyên viên trị liệu sẽ đến nhà để trị liệu. Mỗi lần 30–50 phút, mỗi tuần 1–6 lần."}]},{"t":"p","x":"Mỗi bệnh viện cung cấp các hình thức khác nhau, xin hỏi lại người quản lý ca bệnh PAC cho chắc."},{"t":"h","x":"Khi nào kết thúc"},{"t":"ul","x":["Chức năng tiến bộ rõ rệt, có thể về nhà tự tập phục hồi chức năng.","2 lần đánh giá liên tiếp không có tiến bộ.","Bệnh thay đổi, cần điều trị khác trước.","Đã đến giới hạn tối đa 12 tuần."]},{"t":"key","h":"PAC kết thúc, nhưng phục hồi chức năng vẫn chưa kết thúc","p":"Sự hồi phục có thể kéo dài nhiều tháng đến nhiều năm. Sau khi PAC kết thúc, người bệnh có thể tiếp tục tập ở phòng khám ngoại trú, ở cộng đồng hoặc ở nhà. Khi chức năng có thay đổi, hoặc có mục tiêu mới, có thể nhờ bác sĩ đánh giá lại và sắp xếp phục hồi chức năng tiếp."},{"t":"key","h":"Những việc gia đình có thể làm","ul":["Tham gia các buổi giải thích và thảo luận của đội ngũ y tế để hiểu mục tiêu phục hồi chức năng.","Học kỹ năng chăm sóc từ chuyên viên trị liệu và điều dưỡng.","Sớm thảo luận với đội ngũ y tế về việc sắp xếp sau khi xuất viện."]},{"t":"key","h":"Bắt đầu phục hồi chức năng như thế nào","ul":["Ngày đầu tiên sau đột quỵ (trong vòng 24 giờ), không nên cho người bệnh ra khỏi giường để vận động mạnh. Sau đó, đội ngũ y tế sẽ dựa vào bệnh tình để sắp xếp từng bước việc ra khỏi giường và tập phục hồi chức năng.","Tập phục hồi chức năng do một đội ngũ nhiều chuyên ngành cùng phối hợp, gồm bác sĩ, điều dưỡng, chuyên viên trị liệu…, sẽ có hiệu quả tốt hơn. Sau khi xuất viện, việc tập ở nhà cũng cần đội ngũ chuyên môn đánh giá và sắp xếp; người nhà tập cùng người bệnh theo kế hoạch của đội ngũ, không chỉ dựa vào người nhà tự hướng dẫn."]}]},{"title":"Tập phục hồi chức năng như thế nào","desc":"Các thành viên trong đội ngũ, gia đình giúp như thế nào, khi nào cần dừng lại","body":[{"t":"h","x":"Đội ngũ phục hồi chức năng làm gì"},{"t":"ul","x":["Vật lý trị liệu: tập lật người, ngồi, đứng, đi lại và giữ thăng bằng.","Hoạt động trị liệu: tập các động tác của tay và các sinh hoạt hằng ngày như mặc quần áo, ăn cơm, đi vệ sinh.","Ngôn ngữ trị liệu: tập nói, tập hiểu lời nói và tập nuốt."]},{"t":"fig","id":"team"},{"t":"p","x":"Trong đội ngũ còn có bác sĩ, điều dưỡng, chuyên viên dinh dưỡng, dược sĩ, chuyên viên tâm lý và nhân viên công tác xã hội. Có thắc mắc gì cũng có thể hỏi."},{"t":"h","x":"Mỗi giây phút trong phòng bệnh đều là tập phục hồi chức năng"},{"t":"p","x":"Những động tác chuyên viên trị liệu dạy cần được dùng trong sinh hoạt hằng ngày. Những việc người bệnh tự làm được, ví dụ rửa mặt, mặc quần áo, ăn cơm, xin hãy để người bệnh tự làm. Người nhà ở bên cạnh trông chừng, giúp khi cần thiết, đừng làm thay tất cả."},{"t":"h","x":"Bảo vệ bên yếu"},{"t":"ul","x":["Khi đỡ người bệnh ngồi dậy hoặc di chuyển, không kéo cánh tay bên yếu, để tránh làm tổn thương vai.","Khi nằm hoặc ngồi, dùng gối đỡ chắc cánh tay bên yếu.","Khi nằm trên giường lâu, cứ khoảng 2 giờ giúp người bệnh lật người một lần."]},{"t":"fig","id":"arm"},{"t":"weak"},{"t":"key","h":"Đau vai thì phải nói ra","ul":["Đau vai sau đột quỵ rất thường gặp. Khi vai đau, vai bị lõm xuống (bán trật khớp) hoặc rất cứng, xin nhờ bác sĩ và chuyên viên trị liệu đánh giá.","Dụng cụ đặt tư thế hoặc đai đeo có thể đỡ vai, tránh để chỗ lõm nặng thêm. Tiêm thuốc, kích thích điện và các cách khác có thể giúp giảm đau vai. Có phù hợp hay không, xin hỏi đội ngũ y tế.","Trước khi xuất viện, nhờ chuyên viên trị liệu dạy người nhà cách đặt và cử động vai bên yếu, rồi tự làm lại cho chuyên viên trị liệu xem."]},{"t":"warn","h":"Nếu có những biểu hiện sau, xin dừng lại trước và báo cho nhân viên y tế","ul":["Chóng mặt, mặt tái nhợt, vã mồ hôi lạnh","Tức ngực, thở rất gấp","Đột ngột đau đầu dữ dội","Tay chân yếu hơn bình thường, hoặc đột nhiên nói không rõ"]},{"t":"key","h":"Tiến bộ có nhanh có chậm","p":"Tốc độ hồi phục của mỗi người khác nhau. Đội ngũ đánh giá 3 tuần một lần và điều chỉnh nội dung tập theo kết quả. Số lần tập và cường độ tập phải đủ thì mới có hiệu quả; chuyên viên trị liệu sẽ sắp xếp theo tình trạng của người bệnh."}]},{"title":"Nuốt và ăn uống an toàn","desc":"Dấu hiệu cảnh báo bị sặc, cách ăn an toàn","body":[{"t":"h","x":"Vì sao cần chú ý việc nuốt"},{"t":"p","x":"Sau đột quỵ, khả năng nuốt thường kém đi. Nếu thức ăn hoặc nước bị sặc vào khí quản, có thể gây viêm phổi do hít sặc. Có người bệnh bị sặc mà không ho, vì vậy cần người nhà cùng quan sát."},{"t":"warn","h":"Dấu hiệu cảnh báo có vấn đề về nuốt","ul":["Ho, sặc khi ăn hoặc uống nước","Sau khi ăn, giọng nói nghe ướt, có tiếng đờm","Ngậm thức ăn trong miệng không nuốt xuống được, hoặc thức ăn chảy ra ở khóe miệng","Ăn một bữa mất rất nhiều thời gian","Sốt nhiều lần, đờm nhiều hơn"],"p":"Nếu có những biểu hiện này, xin báo cho điều dưỡng hoặc chuyên viên ngôn ngữ trị liệu."},{"t":"key","h":"Đánh giá nuốt trước","ul":["Sau đột quỵ, trước lần đầu ăn, uống nước hoặc uống thuốc, phải đánh giá khả năng nuốt trước.","Khi nghi ngờ có vấn đề về nuốt, bác sĩ có thể cho chụp X-quang khi nuốt hoặc nội soi để xem thức ăn có bị sặc vào khí quản không, và tìm loại thức ăn an toàn nhất.","Khi không nuốt được viên thuốc, đừng tự nghiền thuốc hay tự tìm cách khác; hãy hỏi nhân viên y tế hoặc dược sĩ trước.","Người nuốt kém dễ ăn quá ít và sụt cân; xin nhờ chuyên viên dinh dưỡng cùng đánh giá."]},{"t":"h","x":"Cách ăn an toàn"},{"t":"fig","id":"eat"},{"t":"ul","x":["Chỉ ăn khi người bệnh hoàn toàn tỉnh táo.","Ngồi thẳng rồi mới ăn, điều chỉnh tư thế theo cách chuyên viên ngôn ngữ trị liệu đã dạy.","Ăn từng miếng nhỏ, chậm rãi, chắc chắn đã nuốt hết rồi mới ăn miếng tiếp theo.","Khi đút ăn, đưa thức ăn vào miệng từ bên khỏe.","Nếu chuyên viên ngôn ngữ trị liệu đã dạy “nuốt xong thì nuốt khan thêm một lần” (trong miệng không còn thức ăn, nuốt nước bọt thêm một lần), thì làm theo.","Tập trung khi ăn, không vừa ăn vừa nói chuyện.","Ăn xong ngồi ít nhất 30 phút rồi mới nằm xuống.","Sau bữa ăn, vệ sinh miệng và kiểm tra xem bên trong má bên yếu có còn sót thức ăn không."]},{"t":"fig","id":"after"},{"t":"warn","h":"Phải làm gì khi bị sặc lúc ăn","ul":["Khi người bệnh vẫn còn ho được, nói được: ngừng đút ăn ngay, cho người bệnh cúi người về phía trước, khuyến khích người bệnh tự ho thật mạnh. Lúc này không được vỗ lưng, cũng không được tiếp tục đút ăn.","Khi người bệnh ho không ra tiếng, không nói được, không thở được, hoặc môi tím tái: gọi 119 ngay, và vỗ lưng 5 cái rồi ấn bụng 5 cái, làm xen kẽ liên tục (thủ thuật Heimlich), cho đến khi dị vật được tống ra ngoài hoặc nhân viên cấp cứu đến nơi.","Khi gọi người bệnh không tỉnh: bắt đầu làm CPR, và làm theo hướng dẫn của nhân viên 119.","Người nhà và người chăm sóc nên đi học lớp CPR và thủ thuật Heimlich.","Trong vài ngày sau khi bị sặc, nếu bị sốt, ho mãi không dứt hoặc thở rất mệt, xin đi khám càng sớm càng tốt, vì có thể là viêm phổi do hít sặc.","Sau khi tình trạng ổn định, xin để chuyên viên ngôn ngữ trị liệu đánh giá lại."]},{"t":"h","x":"Độ mềm cứng và độ đặc của thức ăn"},{"t":"p","x":"Thức ăn cần cắt nhỏ đến mức nào, nước có cần thêm chất làm đặc hay không, xin làm theo lời khuyên của chuyên viên ngôn ngữ trị liệu và chuyên viên dinh dưỡng, đừng tự ý thay đổi."},{"t":"key","h":"Người bệnh dùng ống thông mũi dạ dày (ống cho ăn)","ul":["Trước khi cho ăn qua ống, kiểm tra vị trí và vạch đánh dấu của ống.","Khi cho ăn qua ống, nâng đầu giường cao 30–45 độ.","Sau khi cho ăn qua ống, giữ nguyên tư thế đó ít nhất 30 phút đến 1 giờ."],"figBottom":"angle"},{"t":"h","x":"Tập nuốt"},{"t":"fig","id":"swallowex"},{"t":"p","x":"Trước khi tập nuốt, phải được chuyên viên ngôn ngữ trị liệu đánh giá, rồi tập theo kế hoạch. Dưới đây là các bài tập thường gặp. Tập bài nào, tập mấy lần, hãy hỏi chuyên viên ngôn ngữ trị liệu trước."},{"t":"ul","x":["Ngồi thẳng hoặc nửa ngồi khi tập, không nằm tập.","Má: phồng má, chu môi, há miệng.","Lưỡi: thè ra, đưa sang trái phải, nâng lên.","Nuốt khan: trong miệng không có thức ăn, nuốt nước bọt một lần. Người có nhiều nước bọt, hay bị sặc nước bọt, hãy hỏi chuyên viên ngôn ngữ trị liệu trước.","Làm nhẹ nhàng, chậm rãi, không nín thở để dùng sức. Mệt thì dừng.","Nếu khi tập bị sặc ho, thở rất mệt hoặc sắc mặt thay đổi: dừng lại ngay, và báo cho nhân viên y tế."]},{"t":"key","h":"Cẩn thận với các loại thức ăn này","ul":["Nước lọc và canh loãng dễ bị sặc nhất.","Hạt cơm khô, các loại hạt, lá rau, thức ăn có nhiều vụn cũng dễ bị sặc hoặc bị mắc nghẹn.","Thức ăn có nước lẫn với hạt như cháo loãng, cơm chan canh; và thức ăn dẻo dính như chè trôi nước (bánh trôi), bánh mochi, bánh nếp (bánh tổ) cũng rất dễ bị sặc hoặc bị nghẹn.","Những thức ăn này có ăn được không, cần thay đổi thế nào, ví dụ thêm chất làm đặc hoặc xay nhuyễn, hãy làm theo lời khuyên của chuyên viên ngôn ngữ trị liệu và chuyên viên dinh dưỡng.","Không ép ăn, không giục, cũng không để người bệnh uống từng ngụm nước lớn."]},{"t":"warn","h":"Nuốt phải được đánh giá","ul":["Không thể chỉ thấy ăn vài miếng không sao mà cho rằng nuốt đã an toàn.","Sau khi ăn uống, giọng nói nghe ướt, có tiếng ọc ọc hoặc bị khàn; ăn xong hay tức ngực, thở nhanh; hoặc bị sốt không rõ lý do: đều phải báo cho nhân viên y tế."]}]},{"title":"Phòng ngừa té ngã","desc":"Ba bước xuống giường, các điểm an toàn chính ở phòng bệnh và ở nhà","body":[{"t":"h","x":"Vì sao sau đột quỵ dễ té ngã"},{"t":"p","x":"Tay chân một bên yếu, thăng bằng kém đi, chóng mặt, vội đi vệ sinh đều làm tăng khả năng té ngã. Té ngã có thể gây gãy xương hoặc chấn thương đầu, làm việc tập phục hồi chức năng bị gián đoạn."},{"t":"key","h":"Ba bước xuống giường","figTop":"steps","ul":["Trước tiên ngồi dậy trên giường, ngồi 30 giây.","Thả chân xuống, ngồi ở mép giường thêm 30 giây.","Đứng dậy, đứng vững 30 giây, không chóng mặt rồi mới bắt đầu đi."]},{"t":"h","x":"Trong thời gian nằm viện"},{"t":"ul","x":["Xuống giường và đi vệ sinh đều phải có người đi cùng. Cần giúp thì xin bấm chuông gọi, đừng cố tự làm.","Kéo thanh chắn giường lên, hạ giường xuống mức thấp nhất, khóa bánh xe giường.","Đồ thường dùng để ở bên khỏe, nơi với tay lấy được.","Mang giày chống trượt vừa chân, không mang dép lê. Quần không nên quá dài.","Sàn nhà bị ướt thì xin báo cho nhân viên."]},{"t":"h","x":"Ngồi xe lăn và chuyển chỗ"},{"t":"ul","x":["Trước khi lên xuống xe lăn, khóa phanh hai bên trước và gập chỗ để chân lên.","Cách chuyển chỗ xin làm theo các bước chuyên viên trị liệu đã dạy."]},{"t":"h","x":"Sau khi về nhà"},{"t":"ul","x":["Lắp thêm tay vịn trong phòng tắm và bên cạnh bồn cầu, trải thảm chống trượt trên sàn.","Cất đồ đạc lặt vặt, dây điện, thảm nhỏ trên lối đi.","Buổi tối để một ngọn đèn nhỏ."]},{"t":"key","h":"Kế hoạch phòng té ngã","ul":["Nhờ chuyên viên trị liệu đánh giá nguy cơ té ngã và lập kế hoạch phòng té ngã theo kết quả.","Sau khi về nhà, mỗi năm nhờ đội ngũ y tế đánh giá lại ít nhất một lần. Gần đây có té ngã hoặc suýt té ngã thì phải báo sớm cho đội ngũ.","Bài tập thăng bằng có thể giúp giảm té ngã. Có thể hỏi chuyên viên trị liệu xem có hợp tập Thái Cực Quyền, hoặc bài tập “vừa đi vừa làm một việc đơn giản”, ví dụ vừa đi vừa đếm số. Lúc đầu hãy tập dưới sự hướng dẫn của chuyên viên trị liệu.","Sau đột quỵ ít vận động, xương dễ bị loãng, khi té ngã càng dễ gãy xương. Có thể hỏi bác sĩ xem có cần đánh giá nguy cơ gãy xương không.","Gậy, khung tập đi hoặc nẹp cổ chân phù hợp có thể giúp giữ thăng bằng và giảm té ngã. Hãy nhờ chuyên viên trị liệu đánh giá và điều chỉnh xong rồi mới dùng."]},{"t":"fig","id":"safe"},{"t":"warn","h":"Nếu lỡ bị té ngã","ul":["Đừng vội kéo người bệnh dậy, trước tiên xem người bệnh có tỉnh táo không, đau ở đâu.","Nếu đang nằm viện, xin bấm chuông gọi ngay.","Ở nhà, nếu bị đập đầu, đau đến mức không cử động được, hoặc không tỉnh táo, xin gọi 119."]}]},{"title":"Phòng ngừa đột quỵ tái phát","desc":"Uống thuốc đúng giờ, đo huyết áp, nhận biết dấu hiệu cảnh báo đột quỵ tái phát","body":[{"t":"h","x":"Người đã từng đột quỵ cần phòng ngừa bị lại"},{"t":"p","x":"Người đã từng đột quỵ có khả năng bị đột quỵ lần nữa cao hơn người bình thường. Kiểm soát tốt huyết áp, đường huyết và mỡ máu có thể làm giảm khả năng này."},{"t":"fig","id":"three"},{"t":"h","x":"Uống thuốc đúng giờ"},{"t":"ul","x":["Thuốc phòng cục máu đông và các thuốc kiểm soát huyết áp, đường huyết, mỡ máu đều phải uống mỗi ngày theo chỉ dẫn của bác sĩ.","Đừng vì thấy khỏe hơn nhiều mà tự ý ngừng thuốc hoặc giảm thuốc.","Nếu bị chảy máu khó cầm, đi ngoài phân đen hoặc phân có máu, xin báo cho bác sĩ càng sớm càng tốt.","Bác sĩ sẽ chọn thuốc phòng cục máu đông tùy theo nguyên nhân gây đột quỵ. Một số người, lúc đầu sau đột quỵ, sẽ uống cùng lúc hai loại thuốc chống kết tập tiểu cầu trong thời gian ngắn, sau đó thường đổi lại chỉ uống một loại. Khi nào đổi là do bác sĩ quyết định.","Người bị rung nhĩ (tim đập không đều) thường được bác sĩ kê thuốc chống đông máu để phòng đột quỵ lần nữa. Người uống loại thuốc này cần thử máu định kỳ theo lịch bác sĩ hẹn, để kiểm tra chức năng gan và thận.","Sau đột quỵ, thường cũng phải kiểm soát mỡ máu. Người có vấn đề xơ cứng mạch máu, bác sĩ có thể đặt mục tiêu cholesterol xấu (LDL) dưới 70 mg/dL."]},{"t":"key","h":"Đo huyết áp “722”","figTop":"bp722","ul":["7: đo liên tục 7 ngày.","2: buổi sáng sau khi thức dậy và buổi tối trước khi đi ngủ, mỗi buổi đo một lần.","2: mỗi lần đo hai lượt."],"p":"Ghi lại các con số, khi tái khám mang cho bác sĩ xem. Sau đột quỵ, thường khuyên giữ huyết áp dưới 130/80 mmHg (số trên dưới 130, số dưới dưới 80). Huyết áp cần đạt mức mục tiêu, nhưng quá thấp lại chóng mặt cũng không tốt. Mức cần đạt của mỗi người xin theo chỉ dẫn của bác sĩ, không tự ý điều chỉnh thuốc. Khi đo, đo ở tay không bị ảnh hưởng do đột quỵ, lần nào cũng đo cùng một tay."},{"t":"h","x":"Thói quen sinh hoạt"},{"t":"fig","id":"life"},{"t":"ul","x":["Không hút thuốc, hạn chế uống rượu bia.","Ăn ít dầu mỡ, ít đường, ít muối, ăn nhiều rau và thực phẩm giàu chất xơ.","Duy trì vận động theo lời khuyên của chuyên viên trị liệu.","Nếu thấy tim đập không đều, hồi hộp đánh trống ngực hoặc tức ngực, xin báo cho bác sĩ.","Tái khám đúng hẹn.","Nếu sức khỏe cho phép, mỗi tuần tập ít nhất 4 lần, mỗi lần ít nhất 10 phút ở mức vừa phải, ví dụ đi bộ nhanh đến mức hơi thở gấp nhưng vẫn nói chuyện được. Người không làm được như vậy thì vận động một chút vẫn tốt hơn là hoàn toàn không vận động. Trước khi bắt đầu, hãy hỏi bác sĩ hoặc chuyên viên trị liệu về mức tập phù hợp.","Có thể tham khảo \"chế độ ăn Địa Trung Hải\": ăn nhiều rau, trái cây, ngũ cốc nguyên hạt, các loại đậu, hạt và cá; dùng dầu thực vật như dầu ô liu thay cho mỡ heo, bơ; ăn ít thịt đỏ và thực phẩm chế biến sẵn. Người có vấn đề nuốt, bệnh tiểu đường hoặc bệnh thận, hãy hỏi chuyên viên dinh dưỡng trước."]},{"t":"sos"},{"t":"ul","x":["Đừng tự lái ô tô hoặc đi xe máy đến bệnh viện.","Trong lúc chờ xe cấp cứu, đừng cho người bệnh ăn, uống nước hay uống thuốc.","Đừng chờ triệu chứng tự hết.","Đến bệnh viện càng sớm càng tốt. Các cách điều trị làm thông lại mạch máu đều có giới hạn thời gian, ví dụ thuốc làm tan cục máu đông thường phải dùng trong vòng 4.5 giờ sau khi bắt đầu có triệu chứng. Vì vậy, khi thấy dấu hiệu cảnh báo, hãy gọi 119 ngay, đừng chờ."]}]},{"title":"Cảm xúc và giao tiếp","desc":"Thay đổi cảm xúc sau đột quỵ, cách nói chuyện với người bệnh, việc nghỉ ngơi của người chăm sóc","body":[{"t":"h","x":"Thay đổi cảm xúc sau đột quỵ"},{"t":"p","x":"Sau đột quỵ, tâm trạng buồn chán, dễ khóc hoặc dễ nổi nóng là điều thường gặp. Điều này liên quan đến tổn thương não và cả việc cuộc sống thay đổi đột ngột, không phải do người bệnh không đủ mạnh mẽ."},{"t":"warn","h":"Phát hiện sớm vấn đề cảm xúc","ul":["Buồn rầu cả ngày, không còn hứng thú với việc gì","Thường căng thẳng, lo lắng, bồn chồn không yên","Không muốn tập phục hồi chức năng, không muốn nói chuyện","Ngủ không ngon hoặc không ăn nổi","Thường nói mình là gánh nặng cho gia đình"],"p":"Trầm cảm và lo âu sau đột quỵ rất thường gặp, có thể xuất hiện bất cứ lúc nào; không cần đợi kéo dài lâu mới nói. Nên sàng lọc cảm xúc định kỳ, ví dụ khi nằm viện, khoảng 3 tháng và 6 tháng sau đột quỵ, và những lần tái khám sau đó. Nếu chưa được sàng lọc, có thể chủ động nhờ đội ngũ y tế đánh giá. Người khó nói chuyện cũng có cách đánh giá phù hợp. Trầm cảm và lo âu có thể điều trị được; bác sĩ có thể chuyển đến bác sĩ tâm thần hoặc chuyên viên tâm lý để điều trị bằng tâm lý trị liệu hoặc thuốc. Không tự mua thuốc uống. Khi người bệnh nói muốn chết hoặc muốn tự làm hại bản thân, hãy báo ngay cho nhân viên y tế, hoặc gọi đường dây hỗ trợ sức khỏe tâm thần 1925 (24 giờ)."},{"t":"key","h":"Ngủ ngon cũng là tập phục hồi","ul":["Đi ngủ và thức dậy vào giờ cố định. Ban ngày dậy hoạt động nhiều hơn. Buồn ngủ thì có thể chợp mắt một chút, nhưng không ngủ quá lâu.","Trước khi ngủ, ít xem điện thoại và ti vi. Từ buổi chiều trở đi, không uống cà phê, trà đặc.","Khi ngủ ngáy rất to, có lúc ngưng thở, hoặc ban ngày lúc nào cũng buồn ngủ, có thể là ngưng thở khi ngủ. Xin báo cho bác sĩ.","Nếu ban đêm cứ mất ngủ, thường lo âu hoặc tâm trạng buồn bã, xin báo cho bác sĩ. Không tự uống thuốc ngủ hay thuốc an thần lâu dài, cũng không uống rượu để dễ ngủ."]},{"t":"key","h":"Sau đột quỵ dễ mệt","p":"Sau đột quỵ rất dễ mệt, nghỉ ngơi rồi cũng không đỡ nhiều. Đây gọi là mệt mỏi sau đột quỵ, rất thường gặp. Xin báo cho đội ngũ y tế; có cách giúp cải thiện tình trạng mệt và giấc ngủ. Không tự mua thuốc tăng tỉnh táo hay thuốc chống mệt mỏi."},{"t":"h","x":"Giao tiếp với người bệnh gặp khó khăn khi nói"},{"t":"fig","id":"talk"},{"t":"ul","x":["Nói chuyện mặt đối mặt, nói chậm lại, câu ngắn hơn.","Mỗi lần chỉ nói một việc.","Dùng nhiều câu hỏi có thể trả lời “có” hoặc “không”.","Kết hợp cử chỉ, hình ảnh hoặc đồ vật thật.","Cho người bệnh thời gian trả lời, đừng vội nói thay cho hết câu.","Nói chuyện theo cách nói với người lớn, đừng coi người bệnh như trẻ con.","Khi người bệnh có vẻ nghe không rõ, hãy cho đi kiểm tra thính lực. Với người nói chuyện rất khó khăn, chuyên viên ngôn ngữ trị liệu có thể dạy người nhà cách giao tiếp, cũng có thể dùng bảng giao tiếp, thẻ hình hoặc máy tính bảng để hỗ trợ."]},{"t":"key","h":"Tập nói từng bước một","ul":["Tập nói tùy theo vấn đề của mỗi người. Tập gì, tập thế nào, trước hết hãy theo lời khuyên của chuyên viên ngôn ngữ trị liệu.","Nếu chuyên viên trị liệu khuyên tập như sau: trước tiên tập từ đơn giản, ví dụ “Vâng”, “Nước”; sau đó tập nói tên đồ vật hay dùng, ví dụ cái cốc, cái thìa; cuối cùng tập câu ngắn, ví dụ “Tôi muốn uống nước”.","Cũng có thể tập hiểu những lệnh đơn giản trước, ví dụ “Giơ tay lên”, “Há miệng ra”. Khi nói, làm động tác mẫu bằng tay cùng lúc, rồi từ từ nói theo chuyên viên trị liệu.","Người nói không rõ: chuyên viên trị liệu có thể dạy họ nói chậm hơn, to hơn, mở miệng rộng hơn.","Mỗi ngày tập một chút. Cho họ thời gian nói từ từ, không giục, cũng không sửa liên tục. Khi không nói ra được, có thể chỉ tay, viết ra hoặc dùng thẻ hình. Nói đúng thì khen ngợi họ."]},{"t":"h","x":"Người chăm sóc cũng cần chăm sóc bản thân"},{"t":"ul","x":["Người nhà thay phiên nhau chăm sóc, đừng để một người gánh hết.","Người chăm sóc cần có giờ nghỉ ngơi và giờ ăn uống cố định.","Ngay từ khi nằm viện, người chăm sóc đã có thể tham gia hướng dẫn sức khỏe và tập huấn kỹ năng chăm sóc. Học xong, hãy làm lại cho điều dưỡng hoặc chuyên viên trị liệu xem để chắc chắn đã học được.","Khi cảm thấy không chịu nổi, ngủ không ngon hoặc tâm trạng buồn bã, có thể nói chuyện với điều dưỡng hoặc nhân viên công tác xã hội, cũng có thể nhờ đội ngũ giới thiệu nhóm hỗ trợ người chăm sóc.","Khi cảm thấy cô đơn, ít giao tiếp với người khác, có thể tham gia hội người bệnh hoặc nhóm hỗ trợ. Những thay đổi trong đời sống tình dục, rò rỉ nước tiểu và những vấn đề khó nói khác cũng rất thường gặp, cứ yên tâm hỏi bác sĩ hoặc điều dưỡng."]},{"t":"fig","id":"rest"},{"t":"key","h":"Đường dây chăm sóc dài hạn 1966","p":"Gọi 1966 để hỏi về các nguồn hỗ trợ chăm sóc dài hạn như dịch vụ chăm sóc thay thế tạm thời, dịch vụ chăm sóc tại nhà."}]},{"title":"Chuẩn bị xuất viện về nhà","desc":"Những việc cần học trước khi xuất viện, môi trường trong nhà, nguồn hỗ trợ chăm sóc dài hạn","body":[{"t":"h","x":"Những việc cần học được trước khi xuất viện"},{"t":"ul","x":["Giúp người bệnh lật người, lên xuống giường và lên xuống xe lăn một cách an toàn.","Cách đút ăn hoặc cho ăn qua ống thông mũi dạ dày.","Tác dụng và giờ uống của từng loại thuốc.","Các động tác phục hồi chức năng cần tiếp tục tập ở nhà.","Nếu có ống thông, ví dụ ống thông mũi dạ dày hoặc ống thông tiểu, cần học cách chăm sóc."]},{"t":"p","x":"Những chỗ chưa chắc chắn, trước khi xuất viện xin nhờ điều dưỡng hoặc chuyên viên trị liệu dạy lại một lần nữa, và tự tay làm cho họ xem."},{"t":"h","x":"Môi trường trong nhà"},{"t":"ul","x":["Chiều cao của giường phải thuận tiện cho việc lên xuống, bên cạnh giường chừa chỗ để xe lăn có thể vào sát.","Lắp thêm tay vịn trong phòng tắm và bên cạnh bồn cầu, sàn chống trượt.","Giữ lối đi rộng rãi, cất đồ đạc lặt vặt và dây điện."]},{"t":"fig","id":"safe"},{"t":"h","x":"Dụng cụ hỗ trợ"},{"t":"fig","id":"devices"},{"t":"p","x":"Cần loại dụng cụ hỗ trợ nào, ví dụ khung tập đi, xe lăn hoặc ghế bô, xin hỏi chuyên viên trị liệu trước rồi mới chuẩn bị. Về trợ cấp dụng cụ hỗ trợ, có thể hỏi Trung tâm Quản lý Chăm sóc Dài hạn của các huyện, thành phố."},{"t":"h","x":"Nguồn hỗ trợ chăm sóc dài hạn"},{"t":"p","x":"Ngay trong thời gian nằm viện đã có thể nhờ điều dưỡng của dịch vụ chuẩn bị xuất viện giúp giới thiệu để được đánh giá chăm sóc dài hạn, cũng có thể tự gọi 1966. Các dịch vụ gồm có dịch vụ chăm sóc tại nhà, phục hồi khả năng sinh hoạt tại nhà, đưa đón đi lại và dịch vụ chăm sóc thay thế tạm thời, v.v."},{"t":"key","h":"Sau khi xuất viện","figTop":"three","ul":["Ghi lại ngày tái khám và chuyên khoa.","Uống thuốc đúng giờ, đo huyết áp mỗi ngày.","Tiếp tục tập phục hồi chức năng, không gián đoạn."]},{"t":"key","h":"Sau khi xuất viện","ul":["Sau khi xuất viện, nếu khó đến bệnh viện thường xuyên, có thể hỏi đội ngũ y tế xem có thể tái khám hoặc tập phục hồi chức năng qua video không, hoặc sắp xếp chuyên viên trị liệu đến nhà.","Sau đột quỵ, không tự quyết định lái ô tô hay chạy xe máy lại. Người có vấn đề về thị lực, sự chú ý, khả năng phán đoán hoặc tay chân phải được đánh giá khả năng lái xe chính thức trước; xin hỏi bác sĩ cách sắp xếp.","Người muốn đi làm lại, xin báo sớm cho đội ngũ y tế. Đội ngũ có thể đánh giá khả năng và giới thiệu đến dịch vụ phục hồi nghề nghiệp.","Hãy kể cho đội ngũ biết những hoạt động người bệnh từng thích, ví dụ ca hát, làm vườn, chơi cờ hoặc sinh hoạt câu lạc bộ. Những việc này cũng có thể trở thành một phần của phục hồi chức năng.","Khi tái khám, có thể nhờ bác sĩ dùng \"Bảng kiểm tra sau đột quỵ (Post-Stroke Checklist)\" để cùng kiểm tra: phòng ngừa đột quỵ tái phát, tự chăm sóc bản thân, vận động, trương lực cơ, đau, đại tiểu tiện, giao tiếp, cảm xúc, trí nhớ và suy nghĩ, tham gia đời sống, quan hệ gia đình…; nếu có vấn đề sẽ được chuyển đến dịch vụ phù hợp."]},{"t":"warn","h":"Nếu có những biểu hiện sau, xin đi khám ngay","ul":["Dấu hiệu cảnh báo đột quỵ tái phát: méo miệng, yếu tay chân một bên, nói không rõ, xin gọi 119","Sốt, ho, đờm nhiều hơn","Không tỉnh táo, hoặc gọi khó tỉnh","Té ngã bị thương","Co giật"]}]},{"title":"Tập vận động tại nhà","desc":"Cách tiếp tục tập sau khi về nhà, cách bảo vệ vai, khi nào cần dừng lại","body":[{"t":"h","x":"Vì sao về nhà vẫn cần tập vận động"},{"t":"p","x":"Sau đột quỵ, muốn phục hồi chức năng thì cần tập luyện liên tục. Về nhà mà không vận động, cơ sẽ yếu đi, khớp sẽ cứng lại, cũng dễ té ngã hơn. Tập đều đặn mỗi ngày mới giữ được kết quả phục hồi chức năng."},{"t":"key","h":"Trước khi bắt đầu tập","ul":["Loại bài tập và số lần tập, xin làm theo cách chuyên viên trị liệu đã thiết kế cho người bệnh.","Chọn lúc người bệnh tỉnh táo, khỏe khoắn. Không tập ngay sau khi vừa ăn no.","Phải có người ở bên cạnh trông chừng, xung quanh không để đồ đạc vướng víu.","Nếu có đo huyết áp, xin đo một lần trước. Khi huyết áp cao hơn bình thường nhiều, hoặc cơ thể thấy khó chịu, tạm thời chưa tập và báo cho nhân viên y tế."]},{"t":"h","x":"Bài tập khi nằm trên giường"},{"t":"fig","id":"exer1"},{"t":"ul","x":["Nâng mông: nằm ngửa, co hai chân, bàn chân đặt phẳng trên giường, từ từ nâng mông lên, giữ vài giây rồi hạ xuống. Không nín thở. Nếu chân bên yếu bị đổ sang một bên, xin người nhà giữ đầu gối.","Giơ hai tay lên: đan các ngón tay của hai bàn tay vào nhau, dùng tay bên khỏe kéo tay bên yếu từ từ giơ lên, lúc đầu chỉ giơ đến ngang vai. Muốn giơ cao hơn, xin hỏi chuyên viên trị liệu trước.","Tập cổ chân: kéo bàn chân hướng lên trên, rồi đạp xuống dưới, giúp máu lưu thông."]},{"t":"weak"},{"t":"h","x":"Bài tập khi ngồi và đứng"},{"t":"fig","id":"exer2"},{"t":"ul","x":["Từ ngồi sang đứng: ngồi trên ghế chắc chắn, có tay vịn, hai bàn chân đặt phẳng và hơi thu về phía sau, người nghiêng về phía trước rồi đứng lên, sau đó từ từ ngồi xuống. Người nhà đứng ở bên yếu để bảo vệ.","Chuyển trọng tâm: khi ngồi, từ từ dịch người sang trái, sang phải để tập thăng bằng.","Đi bộ: nhất định phải có người đi cùng, người đi cùng đứng hơi lùi phía sau ở bên yếu. Dùng dụng cụ hỗ trợ theo lời khuyên của chuyên viên trị liệu, rồi từ từ tăng thời gian đi bộ."]},{"t":"h","x":"Bốn bài tập khi đứng có vịn"},{"t":"fig","id":"standex"},{"t":"key","h":"Hỏi chuyên viên trị liệu trước","p":"Bốn bài tập này dành cho người đã đứng vững được khi có vịn. Có nên tập không, tập mấy lần, hãy hỏi chuyên viên trị liệu trước. Số lần dưới đây chỉ để tham khảo, có thể bắt đầu với ít lần hơn. Khi tập, nếu đau ngực, chóng mặt, thở rất mệt: dừng ngay, ngồi xuống nghỉ."},{"t":"ul","x":["Dùng tay bên khỏe vịn chắc vào bàn hoặc tay vịn. Nếu tay bên yếu đặt lên bàn được thì đặt cho ngay ngắn, không để tay buông thõng hay bị kéo giật. Chỗ đứng phải bằng phẳng, chắc chắn, mang giày chống trượt, đặt một cái ghế phía sau, mệt thì ngồi xuống ngay.","Bước chùng chân: chân bên khỏe bước lên trước một bước nhỏ, chân bên yếu để ở phía sau, gót chân đặt phẳng, đầu gối duỗi thẳng nhưng không khóa cứng. Đầu gối chân trước hơi gập, người từ từ ngả về trước, giữ khoảng 5 giây, rồi từ từ trở lại, thu chân về, đứng vững bằng hai chân. Có thể làm 8–10 lần. Nếu đầu gối chân sau bị khuỵu, tạm thời chưa tập bài này.","Nhón gót: hai chân cùng từ từ nhón gót lên, rồi từ từ hạ xuống. Người không ngả về phía trước. 8 lần là một hiệp, làm 2 hiệp.","Xoay người: hai chân đứng yên, phần thân trên từ từ xoay sang trái, rồi từ từ xoay sang phải, chỉ xoay đến chỗ thấy thoải mái. Đầu xoay chậm theo người, thấy chóng mặt thì dừng. Mỗi bên 10 lần, làm 2 hiệp.","Nâng đầu gối: chân bên yếu từ từ nâng đầu gối lên, rồi từ từ hạ xuống. Người giữ thẳng, không nghiêng sang bên. 8–12 lần là một hiệp, làm 2 hiệp. Không nâng quá cao. Khi đứng không vững, đổi sang ngồi trên ghế để nâng.","Suốt lúc tập không nín thở. Người nhà đứng ở bên yếu để bảo vệ."]},{"t":"key","h":"Bảo vệ vai bên yếu","ul":["Khi đỡ người bệnh ngồi dậy, trở mình, chuyển chỗ hoặc mặc quần áo, không kéo cánh tay bên yếu.","Khi ngồi, đặt tay bên yếu lên tay vịn, mặt bàn hoặc gối để đỡ chắc.","Không dùng dây kéo hoặc ròng rọc treo trên cao để kéo tay tập luyện.","Khi giơ tay lên cao mà bị đau, xin dừng lại trước và báo cho chuyên viên trị liệu."]},{"t":"warn","h":"Khi có những biểu hiện sau, xin dừng tập ngay","ul":["Đau ngực, tức ngực, thở rất gấp: dừng lại nghỉ trước, sau vài phút không đỡ, xin gọi 119","Chóng mặt, vã mồ hôi lạnh, mặt tái nhợt","Đau dữ dội ở khớp hoặc cơ","Đột ngột đau đầu dữ dội, nhìn không rõ, hoặc té ngã bị đập đầu: xin gọi 119","Tay chân đột ngột yếu hơn, méo miệng hoặc nói không rõ: có thể là đột quỵ tái phát, xin gọi 119 ngay"]},{"t":"key","h":"Tập mỗi ngày, và tập cho đủ","p":"Tập vận động vào giờ cố định mỗi ngày. Số lần tập và cường độ tập phải đủ thì mới có hiệu quả; chuyên viên trị liệu sẽ sắp xếp theo tình trạng người bệnh và tăng dần từ từ. Có thể chia ra tập nhiều lần trong ngày, giữa các lần thì nghỉ. Có thể đánh dấu trong mục “Danh sách” xem hôm nay đã tập chưa."},{"t":"key","h":"Tập luyện cần toàn diện","ul":["Tập ở nhà nên có bài tập aerobic làm tim đập nhanh hơn, ví dụ đi bộ, đạp xe đạp tại chỗ, và bài tập tăng sức cơ. Phải tập cả hai chân, không chỉ tập chân khỏe.","Sau khi kết thúc PAC, có thể hỏi chuyên viên trị liệu xem có phù hợp tham gia lớp tập thể dục ở cộng đồng không."]}]},{"title":"Sử dụng dụng cụ hỗ trợ","desc":"Gậy, khung tập đi, lên xuống cầu thang, xe lăn và dụng cụ hỗ trợ trong nhà","body":[{"t":"h","x":"Đánh giá trước, rồi mới chọn dụng cụ hỗ trợ"},{"t":"p","x":"Dụng cụ hỗ trợ phải chọn theo khả năng của người bệnh. Xin để chuyên viên trị liệu hoặc Trung tâm Dụng cụ Hỗ trợ đánh giá trước, rồi mới mua hoặc thuê. Trung tâm Dụng cụ Hỗ trợ của Đài Bắc có thể đánh giá và cho mượn dụng cụ hỗ trợ đã qua sử dụng. Chăm sóc dài hạn và chương trình cho người khuyết tật cũng có trợ cấp dụng cụ hỗ trợ."},{"t":"golink","x":"Xem Trung tâm Dụng cụ Hỗ trợ Đài Bắc và trợ cấp","tab":"res","rescat":"clothing"},{"t":"h","x":"Gậy và khung tập đi"},{"t":"fig","id":"cane"},{"t":"weak"},{"t":"ul","x":["Cầm gậy ở tay bên khỏe.","Khi đi, gậy và chân bên yếu cùng đưa lên trước, sau đó mới bước chân bên khỏe.","Khi dùng khung tập đi, trước tiên đặt khung tập đi lên phía trước cho vững, chân bên yếu bước vào trước, sau đó bước chân bên khỏe. Không đẩy khung mà đi. Khung tập đi có bánh xe, xin dùng theo cách chuyên viên trị liệu đã hướng dẫn.","Kiểm tra định kỳ miếng cao su ở đáy gậy và khung tập đi, bị mòn thì phải thay."]},{"t":"h","x":"Lên xuống cầu thang"},{"t":"fig","id":"stairs"},{"t":"ul","x":["Lên cầu thang: chân bên khỏe bước lên trước, chân bên yếu theo sau.","Xuống cầu thang: chân bên yếu bước xuống trước, chân bên khỏe theo sau.","Dùng tay bên khỏe vịn tay vịn, có thể nhờ người nhà cầm giúp gậy.","Người nhà đứng ở bên yếu: khi lên cầu thang, đứng phía sau người bệnh, thấp hơn một bậc; khi xuống cầu thang, đứng phía trước người bệnh, thấp hơn một bậc.","Cầu thang không có tay vịn, xin để chuyên viên trị liệu hướng dẫn trước rồi mới đi."]},{"t":"h","x":"Xe lăn"},{"t":"ul","x":["Trước khi lên xuống xe lăn, phải khóa phanh cả hai bên và gập chỗ để chân lên.","Khi ngồi, mông phải ngồi sát vào trong, lưng tựa chắc, tay bên yếu đặt trên tay vịn hoặc bàn gắn trên xe.","Người ngồi xe lăn lâu có thể dùng đệm ngồi giảm áp lực, và thay đổi tư thế đúng giờ theo cách chuyên viên trị liệu đã hướng dẫn, để phòng ngừa tổn thương do tì đè."]},{"t":"h","x":"Dụng cụ hỗ trợ trong nhà"},{"t":"fig","id":"homeaids"},{"t":"ul","x":["Ghế tắm: ngồi tắm an toàn hơn, chân ghế phải có miếng chống trượt. Thử nhiệt độ nước bằng tay bên khỏe trước, để tránh bị bỏng.","Ghế bô: buổi tối có thể đặt cạnh giường, để bớt quãng đường đi đến nhà vệ sinh.","Nẹp cổ chân: đeo theo đúng chỉ dẫn của chuyên viên trị liệu, mỗi ngày kiểm tra da có bị đỏ hoặc trầy xước không.","Đệm hơi: người bệnh nằm giường lâu ngày có thể dùng, nhưng vẫn phải trở mình khoảng mỗi 2 giờ một lần.","Người bị rủ bàn chân, khi đi dễ kéo lê mũi chân trên sàn: nẹp cổ chân hoặc kích thích điện do chuyên viên trị liệu thực hiện có thể giúp đi lại và giữ thăng bằng; có phù hợp hay không, hãy để chuyên viên trị liệu đánh giá."]},{"t":"key","h":"Đai buộc dùng khi tập đi","ul":["Một số buổi trị liệu dùng đai buộc để giúp giữ vững thân người hoặc cổ chân. Có dùng hay không do chuyên viên trị liệu quyết định, và phải được dạy cách mang trước.","Đai buộc không phải là đai an toàn chống té ngã. Khi tập vẫn phải có người ở bên cạnh bảo vệ.","Độ chặt vừa đủ để luồn được 1 đến 2 ngón tay vào, tránh siết vào da và mạch máu.","Tập xong thì tháo ra. Nếu bị đau, tay chân bị tê, da bị đỏ hoặc cơ trở nên rất căng, hãy tháo ra ngay.","Người bị giảm cảm giác có thể không kêu đau, người nhà phải xem da có bị đỏ do đè ép không. Không được dùng đai buộc để buộc người bệnh vào giường hoặc ghế. Khi ngủ và khi không có người trông, không mang đai."]},{"t":"warn","h":"Khi dùng dụng cụ hỗ trợ, có những tình huống sau xin liên hệ chuyên viên trị liệu hoặc Trung tâm Dụng cụ Hỗ trợ","ul":["Dụng cụ hỗ trợ bị lỏng, hư hỏng hoặc chiều cao không phù hợp: tạm ngừng sử dụng, sửa xong hoặc chỉnh lại rồi mới dùng.","Sau khi dùng, da bị đỏ hoặc trầy xước: tạm ngừng mang, và hỏi ý kiến chuyên viên trị liệu.","Đã dùng dụng cụ hỗ trợ mà vẫn thường suýt té ngã: không tự ý ngừng dùng dụng cụ hỗ trợ. Khi đi phải có người đứng bên cạnh đỡ, và xin chuyên viên trị liệu đánh giá lại."]}]},{"title":"Đồ dùng hằng ngày thành dụng cụ tập phục hồi","desc":"Tập ở nhà với khăn, cốc, kẹp phơi đồ, ghế, và dùng đồ trong nhà để giữ an toàn","body":[{"t":"h","x":"Đồ trong nhà cũng giúp tập phục hồi chức năng"},{"t":"p","x":"Không nhất thiết phải mua dụng cụ. Khăn, cốc, kẹp phơi đồ, ghế chắc chắn, những đồ có sẵn trong nhà đều có thể dùng để tập. Mỗi ngày dùng nhiều, tập nhiều trong sinh hoạt sẽ hiệu quả hơn thỉnh thoảng mới tập thật lâu."},{"t":"key","h":"Trước khi bắt đầu","ul":["Trước hết, hãy nói với chuyên viên trị liệu những bài muốn tập. Xin chuyên viên trị liệu xác nhận có phù hợp không và nên tập bao nhiêu lần.","Khi tập tay và tập nói, người bệnh phải ngồi vững trên ghế có tựa lưng và có tay vịn.","Phải có người ở bên cạnh. Khi tập, đừng hối thúc người bệnh.","Thấy đau thì dừng lại, đừng cố gắng quá sức."]},{"t":"h","x":"Bàn tay và cánh tay"},{"t":"fig","id":"handtools"},{"t":"weak"},{"t":"ul","x":["Lau bàn bằng khăn: ngồi trước bàn, đặt hai tay lên khăn, từ từ đẩy ra trước rồi kéo về, cũng có thể vẽ vòng tròn. Tay bên khỏe có thể dẫn tay bên yếu cùng cử động.","Kẹp phơi đồ: dùng ngón cái và ngón trỏ của tay bên yếu bóp mở kẹp, kẹp vào miệng cốc hoặc cạnh hộp giấy, rồi gỡ ra.","Nhặt đồ bỏ vào cốc: dùng ngón tay nhặt khối xếp hình hoặc cúc áo loại to, bỏ vào cốc. Khi tập nhất định phải có người ở bên cạnh trông chừng. Người có vấn đề về nuốt, hay quên, hoặc khả năng phán đoán kém đi thì không dùng đồ ăn được như hạt đậu, hãy đổi sang khối xếp hình loại to.","Lật bài tây hoặc lật trang sách: tập các cử động nhỏ của ngón tay.","Vắt khăn: giữ khăn phía trên chậu rửa mặt, dùng cả hai tay vắt khô khăn ướt. Nước không được quá nóng, nước rơi trên sàn phải lau khô. Người có ngón tay rất cứng, không mở ra được thì hỏi chuyên viên trị liệu trước."]},{"t":"h","x":"Ngồi, đứng và thăng bằng"},{"t":"fig","id":"balancetools"},{"t":"ul","x":["Ngồi sang đứng: tập với ghế chắc chắn, không trượt, có tay vịn. Có thể đặt ghế sát tường. Không dùng ghế có bánh xe hoặc ghế xoay. Người nhà đứng ở bên yếu, đỡ ở eo, không kéo cánh tay bên yếu.","Vịn bệ bếp hoặc bàn chắc chắn để đứng: trước hết tắt bếp, cất dao đi. Hai tay vịn chắc. Khi tay bên yếu không vịn được, xin người nhà giúp đặt tay vào đúng chỗ. Tập đứng một lúc, rồi từ từ dồn sức nặng cơ thể sang chân trái, rồi sang chân phải. Người nhà đứng ở bên yếu để bảo vệ.","Không vịn vào đồ dễ trượt hoặc không vững, ví dụ xe đẩy, giá phơi đồ hoặc lưng ghế."]},{"t":"h","x":"Nói, khuôn mặt và trí não"},{"t":"fig","id":"mindtools"},{"t":"ul","x":["Soi gương làm nét mặt: nhìn vào gương tập cười, chu môi, phồng má, xem hai bên mặt có giống nhau không.","Nói tên đồ vật: cầm cốc, thìa, khăn lên, mời người bệnh nói tên và công dụng.","Xem lịch, đọc báo: mỗi ngày cùng xem ngày tháng, đọc tiêu đề tin tức hoặc chữ to trên tờ quảng cáo. Người hay bỏ sót một bên khi nhìn, có thể kẻ một đường có màu ở bên đó, nhắc bắt đầu đọc từ chỗ đó.","Làm việc nhà: gấp khăn, xếp tất thành từng đôi, đều là những bài tập rất tốt.","Người bị giảm trí nhớ, sự chú ý hoặc khả năng phán đoán, hoặc thường bỏ quên một bên, có thể nhờ chuyên viên hoạt động trị liệu hoặc chuyên viên ngôn ngữ trị liệu sắp xếp bài tập chuyên biệt. Bài tập ở nhà chỉ để hỗ trợ, không thể thay thế buổi tập với chuyên viên trị liệu."]},{"t":"p","x":"Người bệnh có vấn đề về nuốt, trước khi uống nước bằng ống hút hoặc tập thổi hơi, xin hỏi chuyên viên ngôn ngữ trị liệu trước."},{"t":"h","x":"Dùng đồ trong nhà để giữ an toàn"},{"t":"fig","id":"safetools"},{"t":"ul","x":["Chuông nhỏ hoặc còi: đặt ở bên khỏe, chỗ người bệnh nhìn thấy, để gọi người khi cần giúp.","Điện thoại: cài đặt số liên lạc khẩn cấp, viết các số điện thoại hay dùng bằng chữ to và dán bên cạnh.","Băng keo màu: dán ở ngưỡng cửa, mép bậc thềm và công tắc đèn, để dễ nhìn thấy hơn.","Đèn ngủ nhỏ: đặt trên lối đi từ giường đến nhà vệ sinh.","Thử nhiệt độ nước trước khi tắm: thử bằng tay bên khỏe, hoặc dùng nhiệt kế, để tránh bị bỏng.","Đồ hay dùng đặt ở chỗ người bệnh nhìn thấy và với tay lấy được, không để quá cao hoặc quá thấp. Nếu chuyên viên trị liệu yêu cầu đặt một số đồ ở bên yếu để tập, xin làm theo sắp xếp của chuyên viên trị liệu."]},{"t":"warn","h":"Những điều cần chú ý khi tập","ul":["Đồ nhỏ như cúc áo, khối xếp hình, đồng xu, tập xong phải cất đi, không để lại bên cạnh người bệnh, để tránh nuốt nhầm.","Dùng đồ chắc chắn để tập, không dùng đồ dễ trượt, dễ lăn hoặc dễ đổ.","Không dùng chai nhựa đựng nước làm tạ để nâng cánh tay, vì có thể làm căng cơ, tổn thương vai bên yếu, trừ khi chuyên viên trị liệu đồng ý.","Nếu bị đau ngực, rất khó thở, vã mồ hôi lạnh, hoặc đột ngột bị méo miệng, không giơ tay lên được, nói không rõ: dừng ngay, gọi 119, và ghi lại thời gian xảy ra.","Nếu chỉ bị chóng mặt: ngồi xuống hoặc nằm xuống nghỉ trước. Nếu không đỡ thì liên lạc với nhân viên y tế."]}]},{"title":"Đặt tư thế và trở mình","desc":"Tư thế nằm và ngồi đúng, 4 bước trở mình, những lỗi thường gặp","body":[{"t":"h","x":"Đặt tư thế cũng là một phần của điều trị"},{"t":"p","x":"Sau đột quỵ, tư thế nằm hoặc ngồi sẽ ảnh hưởng đến vai, khớp và da. Đặt tư thế đúng giúp bảo vệ vai bên yếu, phòng ngừa khớp bị cứng, bàn chân bị rủ xuống và bị loét do tì đè. Đặt tư thế không chỉ để thoải mái, mà còn là một phần của điều trị."},{"t":"fig","id":"posture"},{"t":"weak"},{"t":"key","h":"Nằm nghiêng về bên yếu","ul":["Đỡ xương bả vai từ phía sau, nhẹ nhàng đưa vai bên yếu ra phía trước. Không kéo cánh tay, cũng không để vai bị đè dưới người.","Tay bên yếu duỗi ra phía trước, khuỷu tay thẳng, lòng bàn tay ngửa lên, đặt trên giường hoặc trên gối.","Chân bên yếu ở phía dưới, hơi co lại.","Dùng gối chèn sau lưng để người không bị ngã ra sau.","Chân bên khỏe co ra phía trước, đặt trên gối.","Tư thế này giúp bên yếu nhận được kích thích cảm giác. Nếu vai bị đau, xin điều chỉnh tư thế và báo cho chuyên viên trị liệu."]},{"t":"key","h":"Nằm nghiêng về bên khỏe","ul":["Tay bên yếu duỗi ra phía trước, đặt trên gối ở trước ngực.","Chân bên yếu co lại ra phía trước, đặt trên gối, không để chân bị treo lơ lửng.","Có thể chèn gối sau lưng để người không bị ngã ra sau."]},{"t":"key","h":"Nằm ngửa","ul":["Đặt một chiếc gối mỏng dưới vai bên yếu. Cánh tay hơi tách khỏi thân người, khuỷu tay thẳng, đặt trên gối.","Có thể đặt một chiếc gối nhỏ dưới mông bên yếu để chân không bị đổ ra ngoài.","Không kê cao dưới đầu gối trong thời gian dài. Có thể đặt gối dưới bắp chân để gót chân không chạm vào giường.","Chăn không được đè lên mũi bàn chân.","Không nằm ngửa quá lâu, phải thay đổi xen kẽ với nằm nghiêng."]},{"t":"key","h":"Ngồi trên giường","ul":["Ngồi trên giường chỉ nên trong thời gian ngắn. Không ngồi nửa nằm nửa ngồi, vì dễ bị trượt xuống và bị loét ở mông. Khi đã xuống giường được, hãy chuyển sang ngồi ghế có tay vịn.","Dùng gối chèn chắc sau lưng, người ngồi thẳng, không nghiêng sang một bên.","Đặt bàn ăn trên giường ở phía trước, để cả hai tay lên mặt bàn.","Thời gian ngồi tăng dần từ từ theo lời khuyên của chuyên viên trị liệu.","Nếu bị chóng mặt, hãy cho người bệnh nằm xuống và báo cho nhân viên y tế."]},{"t":"key","h":"Phòng ngừa cứng khớp","ul":["Khi nằm, chuyên viên trị liệu có thể khuyên mang nẹp cổ chân loại dùng khi nghỉ để phòng ngừa cổ chân bị cứng.","Cánh tay yếu có thể đặt hơi dang ra ngoài, xoay ra ngoài (lòng bàn tay ngửa lên), khuỷu tay duỗi thẳng, trong phạm vi không đau.","Có dùng hay không và đặt thế nào, hãy làm theo hướng dẫn của chuyên viên trị liệu."]},{"t":"h","x":"4 bước trở mình"},{"t":"fig","id":"turning"},{"t":"ul","x":["Trước khi trở mình, đặt cánh tay bên yếu cho đúng chỗ, không để bị đè dưới người. Trở mình xong, kiểm tra lại vị trí của tay.","Đỡ vai và mông để trở mình cùng lúc. Nâng người lên rồi mới di chuyển, không kéo lê, cũng không kéo cánh tay bên yếu.","Sau khi nằm nghiêng, cho người hơi tựa ra sau. Chèn gối kín các khoảng trống ở lưng và eo, không để người bị hẫng hoặc nằm vặn mình.","Kẹp một chiếc gối giữa hai chân, để gót chân, mắt cá chân và mặt trong đầu gối không đè lên nhau."]},{"t":"p","x":"Khoảng mỗi 2 giờ trở mình một lần, khoảng thời gian thực tế theo đánh giá của điều dưỡng. Sau khi trở mình, kiểm tra những chỗ xương nhô ra như mông, gót chân và mắt cá chân, xem da có bị đỏ không. Chỗ da bị đỏ thì không được xoa bóp. Giữ da sạch sẽ, khô ráo. Da quá khô có thể thoa kem dưỡng. Tã bị ướt hoặc sau khi đi tiêu phải rửa sạch và thay ngay. Ăn đủ, có đủ chất đạm cũng giúp phòng loét do tì đè. Người bị bệnh thận hoặc phải kiêng ăn: ăn bao nhiêu, xin hỏi chuyên viên dinh dưỡng."},{"t":"h","x":"Không được làm những điều sai sau đây"},{"t":"fig","id":"donts"},{"t":"warn","h":"Những lỗi người nhà và người chăm sóc thường gặp","ul":["Không kéo cánh tay bên yếu.","Không kê gối cứng hoặc gối rất cao dưới đầu gối trong thời gian dài.","Chăn không được đè lên mũi bàn chân.","Không nhét đồ vật cứng vào tay, trừ khi chuyên viên trị liệu khuyên làm.","Không để người bệnh chỉ nằm ngửa cả ngày.","Không được bỏ qua làn da: chỗ da bị đỏ mà ấn vào không mất màu đỏ, xin báo cho điều dưỡng."]}]},{"title":"Vị trí đột quỵ và thứ tự tập luyện","desc":"Những khó khăn thường gặp khi đột quỵ não trái, não phải, và cách tập từng bước","body":[{"t":"h","x":"Vị trí đột quỵ khác nhau, khó khăn cũng khác nhau"},{"t":"p","x":"Não chia thành bên trái và bên phải. Một bên bị tổn thương thì thường tay chân ở bên kia bị yếu. Dù là nhồi máu não hay xuất huyết não, vị trí tổn thương khác nhau thì khó khăn thường gặp cũng khác nhau, nhưng không phải điều nào cũng xảy ra. Tình trạng thực tế của người bệnh, xin hỏi bác sĩ điều trị chính hoặc chuyên viên trị liệu. Dù đột quỵ ở bên nào, người bệnh cũng có thể dễ khóc, dễ nổi giận hoặc buồn chán. Đây là do đột quỵ gây ra, xin báo cho nhân viên y tế."},{"t":"fig","id":"brain"},{"t":"key","h":"Đột quỵ não trái: tay chân bên phải yếu","ul":["Thường gặp khó khăn khi nói hoặc hiểu lời nói, ví dụ muốn nói mà nói không ra, hoặc nghe không hiểu người khác nói gì.","Khả năng tính toán, đọc và viết cũng có thể kém đi.","Khi nói chuyện với người bệnh, hãy nói chậm, câu ngắn, kết hợp cử chỉ và hình ảnh.","Theo lời khuyên của chuyên viên trị liệu, khuyến khích người bệnh dùng tay phải để làm các việc hằng ngày."]},{"t":"unitlink","x":"Xem “Cảm xúc và giao tiếp”","unit":"u6"},{"t":"key","h":"Đột quỵ não phải: tay chân bên trái yếu","ul":["Có thể bỏ qua bên trái, ví dụ chỉ ăn thức ăn ở bên phải của đĩa, hoặc va vào khung cửa bên trái.","Cảm nhận về khoảng cách và không gian có thể kém đi.","Làm việc có thể vội vàng hơn, bốc đồng hơn.","Người bệnh có thể nghĩ mình tự làm được, nhưng thực ra cần người giúp, vì vậy dễ bị té ngã hơn.","Khi xuống giường và khi đi lại, nhất định phải có người đi cùng. Trước khi đứng lên, hãy vịn chắc trước, để không bị ngã sang bên trái.","Cách nhắc người bệnh chú ý bên trái, xin làm theo hướng dẫn của chuyên viên trị liệu."]},{"t":"key","h":"Đột quỵ thân não hoặc tiểu não","ul":["Thân não phụ trách các chức năng quan trọng như thở, nhịp tim và nuốt. Sau đột quỵ thân não thường bị khó nuốt, uống nước dễ bị sặc. Có người bị sặc mà cũng không ho. Cách ăn và uống, xin làm theo đánh giá của chuyên viên ngôn ngữ trị liệu.","Thường bị chóng mặt, thăng bằng kém đi, đi lại không vững.","Có thể bị khó nuốt, nói không rõ, hoặc nhìn một vật thành hai.","Đột quỵ thân não có thể làm yếu cả hai bên, hoặc mặt bị yếu ở một bên và cơ thể bị yếu ở bên kia.","Khi đứng dậy phải làm chậm để phòng té ngã. Vấn đề về nuốt, xin để chuyên viên ngôn ngữ trị liệu đánh giá."]},{"t":"h","x":"Mỗi vùng của não phụ trách việc gì"},{"t":"p","x":"Một lần đột quỵ thường ảnh hưởng đến nhiều vùng. Dưới đây chỉ là những tình trạng thường gặp, không nhất định đều xảy ra."},{"t":"fig","id":"lobes"},{"t":"ul","x":["Thùy trán: cử động, lập kế hoạch và ra quyết định, tính cách. Khi bị tổn thương có thể bị yếu, làm việc không có kế hoạch, hoặc thay đổi tính cách, bốc đồng hơn.","Thùy đỉnh: cảm giác và phán đoán không gian. Khi bị tổn thương có thể kém cảm giác, ước lượng khoảng cách không đúng, hoặc bỏ qua một bên (thường gặp hơn khi não bên phải bị tổn thương, sẽ bỏ qua bên trái).","Thùy thái dương: trí nhớ và hiểu lời người khác nói. Khi bị tổn thương có thể trí nhớ kém đi, không nhớ ra người và việc gần đây. Khi não bên trái bị tổn thương, có thể nghe không hiểu người khác nói gì.","Thùy chẩm: nhìn. Khi bị tổn thương có thể cả hai mắt đều không thấy đồ vật ở cùng một bên (không phải một mắt không thấy), hoặc nhìn không rõ. Khi nói chuyện với người bệnh hoặc đặt đồ vật, hãy bắt đầu từ bên người bệnh nhìn thấy được.","Tiểu não: thăng bằng và phối hợp, xin xem mục “Đột quỵ thân não hoặc tiểu não” ở trang này."]},{"t":"key","h":"Khi có vấn đề về nhìn","p":"Khi nhìn bị mất một bên, nhìn thấy hai hình hoặc nhìn không rõ, hãy cho đi kiểm tra thị lực và thị trường (vùng nhìn thấy xung quanh). Dựa vào kết quả, chuyên viên trị liệu có thể sắp xếp bài tập quay đầu và đưa mắt quét nhìn."},{"t":"h","x":"Mạch máu bị tắc khác nhau thì triệu chứng cũng khác nhau"},{"t":"p","x":"Não được cung cấp máu bởi một vài mạch máu chính. Mạch máu nào bị tắc sẽ ảnh hưởng đến vùng não mà nó nuôi, nên triệu chứng cũng khác nhau. Dưới đây là những trường hợp thường gặp. Người bệnh bị tắc mạch máu nào, xin hỏi bác sĩ điều trị chính."},{"t":"ul","x":["Động mạch não giữa (middle cerebral artery): thường gặp nhất. Mặt và tay ở bên đối diện yếu hơn chân, cảm giác cũng có thể kém đi. Não bên trái bị ảnh hưởng thường khó nói hoặc khó hiểu lời người khác; não bên phải bị ảnh hưởng thường bỏ qua một bên.","Động mạch não trước (anterior cerebral artery): chân ở bên đối diện yếu hơn tay. Người bệnh cũng có thể trở nên thụ động hơn, không thiết làm gì, phản ứng chậm hơn, hoặc không kiểm soát được việc đi tiểu.","Động mạch não sau (posterior cerebral artery): cả hai mắt đều không thấy đồ vật ở cùng một bên (bên đối diện với chỗ bị tắc). Khi bên trái bị tắc, có người nhìn thấy chữ nhưng không đọc được.","Tuần hoàn não phía sau (mạch máu của thân não và tiểu não): có thể bị chóng mặt, đi không vững, khó nuốt, khàn tiếng, hoặc nhìn một vật thành hai. Đôi khi một bên mặt và bên kia cơ thể kém cảm nhận nóng, lạnh hoặc đau, hoặc một bên mí mắt hơi sụp xuống.","Biết mạch máu nào bị ảnh hưởng giúp gia đình hiểu được khó khăn của người bệnh. Nội dung tập luyện vẫn làm theo kế hoạch của chuyên viên trị liệu."]},{"t":"h","x":"Tập phục hồi chức năng phải đi từng bước"},{"t":"fig","id":"progress"},{"t":"ul","x":["Tập ngồi vững trước, rồi mới tập đứng lên, sau đó mới tập đi.","Người bị yếu chân: trước tiên tập đứng có vịn vào ghế chắc chắn, không bị trượt, rồi mới tập đi. Không tự lên xuống cầu thang.","Tập tay thì bắt đầu với đồ vật lớn, rồi mới tập với đồ vật nhỏ. Ví dụ cầm cốc lớn, khối xếp hình lớn trước, rồi mới tập cài cúc áo. Ngón tay mỏi thì nghỉ.","Khi tập không nín thở, không dùng sức kéo giật khớp. Nếu bị đau, chuột rút, tức ngực, chóng mặt hoặc vã mồ hôi lạnh thì dừng lại.","Tập từng bước theo kế hoạch của chuyên viên trị liệu, không tự bỏ qua bước nào."]},{"t":"unitlink","x":"Xem “Tập vận động tại nhà”","unit":"u8"}]},{"title":"Việc chăm sóc mỗi ngày sau khi về nhà","desc":"Đo huyết áp, đường huyết, uống nước, phòng cục máu đông ở chân, giúp khạc đờm, uống thuốc, tái khám, khi nào cần đi khám","body":[{"t":"h","x":"Về nhà rồi, mỗi ngày cần chú ý những việc này"},{"t":"p","x":"Xuất viện không có nghĩa là hết chăm sóc. Về nhà, mỗi ngày đo huyết áp, uống đủ nước, vận động nhiều, uống thuốc và tái khám đúng hẹn. Như vậy giúp giảm nguy cơ bị đột quỵ lại và các biến chứng khác."},{"t":"fig","id":"homecare"},{"t":"h","x":"Huyết áp và đường huyết: ổn định là quan trọng nhất"},{"t":"key","h":"Đo vào giờ cố định mỗi ngày","ul":["Đo huyết áp 2 lần mỗi ngày: buổi sáng sau khi thức dậy (sau khi đi vệ sinh, trước khi ăn sáng và uống thuốc) và buổi tối trước khi đi ngủ. Ghi lại kết quả.","Đo ở tay không bị ảnh hưởng do đột quỵ. Lần nào cũng đo cùng một tay.","Người bị tiểu đường: đo đường huyết vào giờ bác sĩ dặn, và ghi lại.","Sau đột quỵ, thường khuyên giữ huyết áp dưới 130/80 mmHg. Mức cần đạt của mỗi người do bác sĩ quyết định.","Huyết áp cần giữ trong mức bác sĩ đặt ra, nhưng không phải càng thấp càng tốt. Nếu đo thấy thấp hơn bình thường nhiều, lại chóng mặt, như sắp ngất, hãy báo bác sĩ.","Không tự ý uống thêm thuốc, giảm thuốc hay ngưng thuốc."]},{"t":"warn","h":"Khi đo huyết áp gặp các trường hợp sau","ul":["Huyết áp từ 180/120 mmHg trở lên (số trên từ 180 trở lên, hoặc số dưới từ 120 trở lên), kèm đau đầu, đau ngực, thở rất mệt, nhìn không rõ, nói không rõ, lú lẫn, hoặc tay chân đột nhiên yếu: gọi ngay 119.","Huyết áp từ 180/120 mmHg trở lên nhưng không thấy khó chịu: ngồi nghỉ vài phút rồi đo lại. Nếu vẫn cao như vậy, xin liên lạc bác sĩ hoặc đi khám ngay trong ngày. Không tự ý uống thêm thuốc hạ huyết áp.","Huyết áp cao hơn mức bác sĩ đặt ra nhưng chưa đến 180/120: vẫn uống thuốc như thường, ghi lại, khi tái khám báo cho bác sĩ.","Đổ mồ hôi lạnh, run, tim đập nhanh, chóng mặt hoặc không tỉnh táo có thể là do đường huyết quá thấp. Nếu có máy đo đường huyết, hãy đo trước. Nếu dưới 70 mg/dL, và người bệnh tỉnh táo, nuốt được an toàn: cho ăn đồ có đường theo cách bác sĩ hoặc nhân viên giáo dục sức khỏe đã hướng dẫn (người khó nuốt thì theo độ đặc mà chuyên viên ngôn ngữ trị liệu khuyên). Sau 15 phút đo lại.","Người bệnh không tỉnh táo, gọi không tỉnh, hoặc nuốt không được: không cho ăn uống bất cứ thứ gì, gọi ngay 119."]},{"t":"unitlink","x":"Xem “Đo huyết áp 722”","unit":"u5"},{"t":"h","x":"Uống nước ít một, nhiều lần"},{"t":"ul","x":["Khi thiếu nước, máu sẽ đặc hơn, nên cần uống đủ nước. Mỗi lần uống một ít, chia ra uống nhiều lần trong ngày.","Người bị bệnh tim, bệnh thận, hoặc được bác sĩ hạn chế lượng nước: uống theo lượng bác sĩ dặn.","Người khó nuốt: nước có cần thêm chất làm đặc không, đặc đến mức nào, xin làm theo lời khuyên của chuyên viên ngôn ngữ trị liệu.","Người uống nước có thêm chất làm đặc thường uống quá ít mà không biết. Người nhà cần giúp để ý lượng nước đã uống.","Khi uống nước, ngồi thẳng, uống từ từ.","Nếu đi tiểu ít đi, nước tiểu màu rất đậm, môi rất khô, có thể là uống chưa đủ nước. Hãy báo cho nhân viên y tế."]},{"t":"unitlink","x":"Xem “Nuốt và ăn uống an toàn”","unit":"u3"},{"t":"h","x":"Phòng cục máu đông ở chân"},{"t":"p","x":"Nằm hoặc ngồi yên quá lâu, máu ở chân chảy chậm, dễ tạo thành cục máu đông."},{"t":"ul","x":["Khi nằm hoặc ngồi lâu, hãy thường xuyên tập cổ chân: kéo mũi bàn chân lên trên, rồi đạp xuống dưới, làm chậm rãi. Chân bên yếu có thể nhờ người nhà giúp cử động.","Khi đã xuống giường được, hãy xuống giường vận động nhiều hơn theo kế hoạch của chuyên viên trị liệu.","Vớ đàn hồi thông thường KHÔNG ngăn ngừa được cục máu đông ở chân sau đột quỵ; không tự mua về mang. Với người nằm viện đi lại rất khó khăn, đội ngũ y tế có thể dùng bao ép chân tự bơm hơi theo giờ để phòng cục máu đông; có dùng hay không do đội ngũ y tế quyết định. Nếu bác sĩ yêu cầu người bệnh mang vớ đàn hồi vì lý do khác, mỗi ngày cởi ra kiểm tra da có bị trầy hay đỏ không."]},{"t":"warn","h":"Dấu hiệu có thể là cục máu đông","ul":["Một bên chân đột nhiên sưng, đau, đỏ hoặc sờ thấy nóng: không được xoa bóp chân này. Đi khám ngay trong ngày; nếu là buổi tối hoặc ngày nghỉ, hãy đi cấp cứu.","Đột nhiên đau ngực, thở rất mệt hoặc ho ra máu: gọi ngay 119."]},{"t":"key","h":"Vấn đề đại tiện, tiểu tiện","ul":["Sau đột quỵ thường bị són tiểu, mắc tiểu gấp, tiểu không ra hoặc táo bón. Xin báo cho điều dưỡng và kể thói quen đi tiểu, đi cầu trước khi bị đột quỵ. Điều dưỡng có thể dùng siêu âm xem trong bàng quang còn nước tiểu sót lại không.","Người có đặt ống thông tiểu, xin hỏi nhân viên y tế khi nào có thể rút ra; không nên để quá lâu.","Người bị són tiểu có thể được nhắc đi vệ sinh theo giờ mà điều dưỡng đặt ra; có thể hỏi xem có hợp tập bài tập cơ sàn chậu không."]},{"t":"key","h":"Đau sau đột quỵ","p":"Nếu ở bên bị đột quỵ xuất hiện cảm giác đau rát bỏng, đau nhói, đau lạnh buốt như băng, hoặc chạm nhẹ cũng rất đau, có thể là đau thần kinh sau đột quỵ. Xin báo cho bác sĩ; loại đau này có thuốc và các cách khác để giảm. Đừng cố chịu đựng, cũng đừng tự mua thuốc giảm đau uống."},{"t":"h","x":"Giúp người bệnh ho ra đờm"},{"t":"ul","x":["Thường xuyên trở mình. Khi ngồi dậy được thì cho ngồi dậy nhiều hơn, đờm sẽ dễ ho ra hơn.","Khuyến khích người bệnh hít thở sâu, rồi ho mạnh.","Vỗ lưng: phải được điều dưỡng hoặc chuyên viên trị liệu hướng dẫn trước, và xác nhận người bệnh phù hợp thì mới làm. Người đang uống thuốc phòng cục máu đông, bị loãng xương, gãy xương hoặc từng mổ vùng ngực: hỏi bác sĩ trước.","Không vỗ trong vòng 1 giờ sau khi ăn hoặc cho ăn qua ống. Khum bàn tay thành hình cái chén, vỗ vào vùng xương sườn ở lưng, tránh cột sống và vùng thắt lưng.","Đờm nhiều hơn, đờm vàng hoặc xanh, sốt, hoặc ăn uống hay bị sặc: hãy đi khám. Thở rất mệt, môi tím tái: gọi ngay 119."]},{"t":"unitlink","x":"Xem “Đặt tư thế và trở mình”","unit":"u11"},{"t":"h","x":"Uống thuốc đúng giờ, tái khám đúng hẹn"},{"t":"ul","x":["Thuốc phòng cục máu đông và các thuốc kiểm soát huyết áp, mỡ máu, đường huyết: dù thấy đã khỏe, cũng không tự ý ngưng thuốc, giảm thuốc hay đổi thuốc.","Khi uống thuốc phòng cục máu đông, nếu đi ngoài phân đen, nước tiểu có máu, chảy máu chân răng hoặc chảy máu cam không cầm được, trên người có nhiều vết bầm: hãy báo bác sĩ. Nôn ra máu hoặc đi ngoài ra nhiều máu: gọi ngay 119.","Trước khi chữa răng, phẫu thuật hoặc làm xét nghiệm, hãy báo trước cho bác sĩ là đang uống thuốc phòng cục máu đông.","Khi tái khám, bác sĩ có thể cho thử máu (ví dụ đường huyết, mỡ máu, chức năng đông máu), hoặc kiểm tra não và mạch máu.","Khi tái khám, mang theo sổ ghi huyết áp, đường huyết và túi thuốc.","Không hút thuốc, tránh xa khói thuốc của người khác. Không uống rượu, hoặc chỉ uống ít theo lời khuyên của bác sĩ."]},{"t":"h","x":"Ăn nhạt, cân bằng"},{"t":"ul","x":["Ít muối: dùng ít nước tương và nước chấm, ăn ít đồ muối chua, thực phẩm chế biến sẵn. Không uống nước súp mì gói.","Ít dầu mỡ: ăn ít đồ chiên rán và thịt mỡ.","Bữa nào cũng có chất đạm, ví dụ cá, trứng, đậu phụ, thịt nạc.","Ăn nhiều rau. Có thể thay một phần cơm trắng bằng ngũ cốc nguyên hạt, ví dụ gạo lứt.","Không tự ý đổi sang muối ít natri: người bị bệnh thận hoặc uống một số thuốc hạ huyết áp có thể không dùng được. Hãy hỏi bác sĩ hoặc chuyên viên dinh dưỡng trước.","Người uống warfarin (thuốc chống đông máu): lượng rau xanh đậm ăn mỗi ngày nên giữ gần như nhau, không đột nhiên ăn nhiều hơn hay ít hơn.","Người bị tiểu đường hoặc bệnh thận: ăn theo lời khuyên của chuyên viên dinh dưỡng. Độ mềm cứng của thức ăn: theo lời khuyên của chuyên viên ngôn ngữ trị liệu."]},{"t":"h","x":"Cũng cần quan tâm tâm trạng và sự an toàn"},{"t":"p","x":"Giữ tâm trạng ổn định và phòng té ngã cũng là việc rất quan trọng sau khi về nhà."},{"t":"unitlink","x":"Xem “Phòng ngừa té ngã”","unit":"u4"},{"t":"unitlink","x":"Xem “Cảm xúc và giao tiếp”","unit":"u6"},{"t":"h","x":"Khi nào phải gọi ngay 119"},{"t":"sos"},{"t":"warn","h":"Có những dấu hiệu này cũng phải gọi ngay 119","ul":["Đột nhiên đau đầu dữ dội.","Đột nhiên nhìn không rõ, hoặc nhìn một thành hai.","Đột nhiên chóng mặt, đứng không vững hoặc đi không vững.","Mặt, tay hoặc chân đột nhiên yếu hoặc tê, kể cả bên vốn đã yếu đột nhiên yếu hơn.","Đột nhiên không tỉnh táo, gọi không tỉnh, hoặc co giật toàn thân.","Ghi lại lần cuối cùng thấy người bệnh còn bình thường là lúc mấy giờ. Dù triệu chứng mất đi nhanh, vẫn phải gọi 119.","Trong lúc chờ xe cứu thương, không cho người bệnh ăn, uống nước hay uống thuốc. Không tự lái xe đến bệnh viện."]}]},{"title":"Những điều cơ bản về tập phục hồi chức năng","desc":"Đánh giá trước, mức sức cơ, thăng bằng, cơ bị co cứng, cử động khớp, tập đi, điều trị bằng máy, lượng tập","body":[{"t":"h","x":"Tập phục hồi chức năng bắt đầu từ đánh giá"},{"t":"p","x":"Trong thời gian PAC, nhóm điều trị sẽ đánh giá khả năng của người bệnh lúc mới bắt đầu, trong quá trình tập (khoảng mỗi 3 tuần một lần) và trước khi kết thúc. Dựa vào kết quả, họ lập kế hoạch và điều chỉnh bài tập. Đánh giá trước, rồi mới tập. Không tự ý tập thêm hoặc đổi động tác chỉ dựa vào cảm giác."},{"t":"fig","id":"evalflow"},{"t":"h","x":"Sức cơ chia thành mức 0 đến 5"},{"t":"p","x":"Chuyên viên trị liệu thường dùng mức 0 đến 5 để mô tả sức mạnh của cơ. Biết người bệnh đang ở mức nào, sẽ dễ hiểu vì sao chuyên viên trị liệu sắp xếp bài tập như vậy."},{"t":"key","h":"Các mức sức cơ","ul":["Mức 0: không thấy, cũng không sờ thấy cơ co lại.","Mức 1: thấy hoặc sờ thấy cơ co nhẹ, nhưng khớp không cử động được.","Mức 2: khi tay chân đặt trên mặt giường, có thể di chuyển ngang trên mặt giường, nhưng không nâng lên được (không thắng được trọng lực).","Mức 3: tự nâng lên được, cử động hết tầm, nhưng người khác ấn nhẹ là không giữ được.","Mức 4: sau khi nâng lên, người khác ấn với một chút lực vẫn giữ được, nhưng yếu hơn bình thường.","Mức 5: sức cơ bình thường."]},{"t":"p","x":"Bài tập phải phù hợp với mức hiện tại. Khi sức cơ còn rất yếu, phần lớn do chuyên viên trị liệu hoặc người nhà giúp cử động. Khi đã tự cử động được, mới tập tự cử động. Có thêm lực cản hoặc vật nặng hay không là theo sắp xếp của chuyên viên trị liệu, không tự ý thêm. Mức sức cơ do chuyên viên trị liệu đánh giá. Người nhà không tự dùng sức ấn tay chân người bệnh để thử. Chuyên viên trị liệu cũng có thể dùng cách khác để đánh giá cử động sau đột quỵ."},{"t":"h","x":"Thăng bằng chia thành 3 mức"},{"t":"fig","id":"balance3"},{"t":"ul","x":["Mức 1: không cần vịn, tự ngồi vững hoặc đứng vững được.","Mức 2: khi tự với tay lấy đồ, hoặc nghiêng người ra trước, ra sau, sang trái, sang phải, cũng không bị ngã.","Mức 3: bị đẩy nhẹ một cái vẫn giữ vững được.","Ngồi và đứng đều chia thành 3 mức này. Thường tập ngồi trước, rồi mới tập đứng.","Vững trước, rồi mới cử động, cuối cùng mới tập chống lại lực từ bên ngoài. Bài tập đẩy nhẹ chỉ do chuyên viên trị liệu làm. Người nhà không tự đẩy người bệnh.","Phòng té ngã luôn là điều quan trọng nhất."]},{"t":"unitlink","x":"Xem “Phòng ngừa té ngã”","unit":"u4"},{"t":"h","x":"Khi cơ bị co cứng, phải kéo giãn từ từ"},{"t":"p","x":"Sau đột quỵ, tay chân bên yếu đôi khi trở nên rất căng, rất cứng, gập không được hoặc duỗi không thẳng. Đó là do trương lực cơ quá cao, nhân viên y tế thường gọi là “co cứng cơ” (tăng trương lực cơ). Điều này khác với chuột rút, và khác với co giật do động kinh."},{"t":"fig","id":"stretch"},{"t":"ul","x":["Kéo giãn phải chậm. Kéo đến chỗ hơi căng thì giữ lại một lúc, rồi từ từ thả lỏng. Giữ bao lâu thì theo lời khuyên của chuyên viên trị liệu.","Đau thì dừng lại. Không dùng sức bẻ, để tránh làm tổn thương cơ hoặc khớp.","Khi trời lạnh, căng thẳng, bị đau, táo bón hoặc viêm đường tiểu, cơ có thể căng cứng hơn.","Nếu cơ đột nhiên căng cứng hơn bình thường nhiều, xin báo cho nhân viên y tế.","Khi cơ rất căng cứng, gây khó khăn khi mặc quần áo, vệ sinh, đặt tư thế hoặc đi lại, có thể hỏi bác sĩ xem có hợp với các cách điều trị như tiêm thuốc làm giãn cơ không.","Không khuyến khích dùng nẹp hoặc băng dán để phòng ngừa trương lực cơ ở cổ tay và ngón tay tăng cao (co cứng cơ); đừng tự mua về dùng. Khi cổ tay đã bị cứng, không gập được, chuyên viên trị liệu có thể đánh giá riêng xem có cần dùng nẹp không; nếu dùng, hãy làm theo hướng dẫn của chuyên viên trị liệu."]},{"t":"h","x":"Cử động khớp: chậm, nhẹ, vững"},{"t":"ul","x":["Cử động theo thứ tự chuyên viên trị liệu đã dạy. Cách thường dùng là bắt đầu từ khớp gần thân người: vai, khuỷu tay, cổ tay, ngón tay.","Động tác chậm, nhẹ, vững, chỉ cử động trong phạm vi không đau, không kéo mạnh. Khi người bệnh không nói ra được, hãy nhìn nét mặt: nhăn mặt, rụt tay lại, kêu lên hoặc người căng cứng lên thì phải dừng lại.","Khi giúp tay bên yếu cử động, một tay đỡ khuỷu tay, một tay đỡ cổ tay. Không kéo tay người bệnh.","Nâng tay lên cao bao nhiêu thì theo cách chuyên viên trị liệu đã dạy. Nếu không được dặn riêng, tạm thời không nâng cao quá vai. Không dùng dây hoặc ròng rọc để kéo tay lên cao."]},{"t":"h","x":"Tập đi: tập chuyển trọng tâm trước"},{"t":"ul","x":["Đứng vững được rồi mới tập bước.","Vịn vào bàn hoặc tay vịn chắc chắn, có người bảo vệ bên cạnh, tập từ từ dồn sức nặng cơ thể sang chân bên yếu. Nếu đầu gối đứng không vững hoặc bị ưỡn thẳng ra sau, xin chuyên viên trị liệu hướng dẫn cách làm.","Khi bước, đặt gót chân xuống đất trước.","Nếu chân bên yếu đưa vòng ra ngoài khi đi, xin chuyên viên trị liệu dạy cách đi đúng. Khi cần, dùng dụng cụ hỗ trợ hoặc nẹp cổ chân theo lời khuyên của chuyên viên trị liệu.","Tập đi nhất định phải có người đi cùng, đứng ở bên yếu, hơi lùi về phía sau.","Người đi được nên tập đi, bước chân và giữ thăng bằng thực tế trên mặt đất; tập đi bằng máy chạy bộ hoặc máy móc không tốt hơn, không cần mua riêng máy chạy bộ hoặc máy móc để tập phục hồi chức năng."]},{"t":"unitlink","x":"Xem “Sử dụng dụng cụ hỗ trợ”","unit":"u9"},{"t":"h","x":"Điều trị bằng máy phải đúng bệnh"},{"t":"p","x":"Điện trị liệu, chườm nóng, chườm lạnh, siêu âm và các máy khác: chuyên viên trị liệu sẽ chọn tùy theo tình trạng và giai đoạn của người bệnh. Không phải ai cũng cần."},{"t":"ul","x":["Không có lời khuyên của chuyên viên trị liệu thì không tự mua máy điện trị liệu về dùng ở nhà. Người có đặt máy tạo nhịp tim càng không được tự dùng.","Bên bị đột quỵ thường kém cảm giác, không nhạy với nóng lạnh. Bị bỏng hoặc bị tổn thương do lạnh, người bệnh cũng có thể không nói ra được. Chườm nóng, chăn điện, miếng dán giữ nhiệt dễ gây bỏng. Chườm đá cũng có thể gây tổn thương do lạnh. Trước khi dùng, hãy hỏi chuyên viên trị liệu."]},{"t":"h","x":"Tập vừa sức"},{"t":"ul","x":["Số lần tập và cường độ tập phải đủ thì mới có hiệu quả; chuyên viên trị liệu sẽ sắp xếp theo tình trạng người bệnh và tăng dần từ từ. Có thể chia ra tập nhiều lần trong ngày, giữa các lần thì nghỉ; đừng tập đến mức mệt thở không ra hơi.","Nếu ngày hôm sau vẫn rất mệt, rất đau mỏi, hoặc yếu sức hơn, nghĩa là đã tập quá nhiều. Cần giảm lượng tập và báo cho chuyên viên trị liệu.","Không vì muốn mau khỏi mà tự ý tập thêm. Tăng dần từ từ theo kế hoạch của chuyên viên trị liệu.","Khi tập mà bị chóng mặt, tức ngực, thở rất mệt, đổ mồ hôi lạnh: dừng lại nghỉ ngay, và báo cho nhân viên y tế."]},{"t":"key","h":"Tập phục hồi cũng là tập cho não","p":"Đột quỵ là não bị tổn thương. Não có thể nhờ tập đi tập lại mà học lại cách điều khiển cử động. Vì vậy khi tập phải tập trung, lặp lại động tác đúng nhiều lần, và trong điều kiện an toàn, khuyến khích người bệnh dùng bên yếu nhiều hơn. Bẻ mạnh tay chân không giúp não học được."},{"t":"h","x":"Tập động tác theo 3 bước: tưởng tượng, tự thử, có người giúp"},{"t":"fig","id":"mindmove"},{"t":"ul","x":["Tưởng tượng: trước tiên, người bệnh nghĩ trong đầu rằng tay chân bên yếu đang làm động tác, ví dụ nghĩ tay đang đưa ra phía trước. Nghĩ xong thì tập thật ngay, không chỉ dừng ở việc nghĩ.","Tự thử: người bệnh tự cố gắng dùng sức, tìm xem chỗ nào cử động được một chút, ví dụ ngón tay hoặc cổ tay.","Có người giúp: phần người bệnh chưa tự cử động được thì chuyên viên trị liệu hoặc người nhà đỡ, giúp làm hết động tác, người bệnh cùng lúc cũng cố dùng sức. Chỉ được đỡ, không được kéo tay bên yếu.","Mỗi bước tập bao nhiêu, giúp như thế nào, làm theo cách chuyên viên trị liệu đã dạy."]},{"t":"h","x":"Tập bàn tay và cánh tay"},{"t":"fig","id":"handex"},{"t":"ul","x":["Nắm: nắm quả bóng mềm hoặc khăn cuộn tròn.","Thả: mở các ngón tay ra, thả đồ trong tay xuống.","Chạm: đưa tay ra chạm vào cái cốc hoặc vật khác trên bàn. Khi cánh tay còn yếu, có thể để tay trượt trên mặt bàn, hoặc có người đỡ.","Nâng: đặt cẳng tay trên bàn, nâng cổ tay lên, rồi từ từ hạ xuống.","Người có ngón tay rất căng cứng, nắm lại mà không mở ra được thì đừng cứ tập nắm mãi. Trước tiên từ từ duỗi thẳng ngón tay và cổ tay, tập mở bàn tay nhiều hơn, và hỏi chuyên viên trị liệu cách tập phù hợp."]},{"t":"fig","id":"armex"},{"t":"ul","x":["Đưa ra trước: ngồi vững, đưa tay ra phía trước như muốn lấy đồ ở phía trước.","Nâng lên, dang sang bên: chỉ làm sau khi chuyên viê
