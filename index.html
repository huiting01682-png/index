n tidak perlu berjalan jauh ke toilet.","Penyangga kaki dan pergelangan kaki: pakai sesuai petunjuk terapis. Setiap hari periksa apakah kulit menjadi merah atau lecet.","Kasur angin: bisa dipakai pasien yang lama berbaring di tempat tidur, tetapi badan pasien tetap harus dibalik kira-kira setiap 2 jam.","Untuk pasien yang ujung kakinya turun dan kakinya mudah terseret saat berjalan, penyangga pergelangan kaki atau stimulasi listrik yang dipakai terapis bisa membantu berjalan dan keseimbangan. Cocok atau tidak, minta terapis menilainya."]},{"t":"key","h":"Tali pengikat untuk latihan berjalan","ul":["Beberapa terapi memakai tali pengikat untuk membantu menahan tubuh atau pergelangan kaki supaya stabil. Terapis yang memutuskan apakah dipakai, dan harus sudah mengajarkan cara memakainya.","Tali pengikat bukan sabuk pengaman untuk mencegah jatuh. Saat latihan tetap harus ada orang di samping untuk menjaga.","Kekencangan harus masih bisa dimasuki 1 sampai 2 jari, supaya tidak menjepit kulit dan pembuluh darah.","Lepaskan setelah latihan selesai. Jika nyeri, tangan atau kaki kesemutan, kulit merah, atau otot menjadi sangat kaku, segera lepaskan.","Pasien yang kurang bisa merasakan mungkin tidak mengeluh sakit. Keluarga harus memeriksa apakah kulit merah karena tertekan. Tali pengikat tidak boleh dipakai untuk mengikat pasien ke tempat tidur atau kursi. Jangan dipakai saat tidur atau saat tidak ada yang mengawasi."]},{"t":"warn","h":"Saat memakai alat bantu, jika ada keadaan ini, hubungi terapis atau Pusat Alat Bantu","ul":["Alat bantu longgar, rusak, atau tingginya tidak pas: berhenti memakai dulu. Pakai lagi setelah diperbaiki atau disetel.","Setelah dipakai, kulit menjadi merah atau lecet: berhenti memakai dulu, dan tanyakan kepada terapis.","Sudah memakai alat bantu tetapi masih sering hampir jatuh: jangan berhenti memakai alat bantu atas keputusan sendiri. Saat berjalan harus ada orang di samping yang memegangi, dan mintalah terapis menilai ulang."]}]},{"title":"Barang sehari-hari untuk rehabilitasi","desc":"Latihan di rumah dengan handuk, gelas, jepit jemuran, dan kursi, serta menjaga keamanan dengan barang di rumah","body":[{"t":"h","x":"Barang di rumah juga bisa membantu rehabilitasi"},{"t":"p","x":"Tidak harus membeli alat. Handuk, gelas, jepit jemuran, dan kursi yang kokoh sudah ada di rumah. Semua barang ini bisa dipakai untuk latihan. Lebih sering dipakai dan dilatih setiap hari dalam kegiatan sehari-hari lebih bermanfaat daripada sesekali berlatih lama."},{"t":"key","h":"Sebelum mulai","ul":["Beri tahu terapis latihan yang ingin dilakukan. Minta terapis memastikan apakah latihan itu cocok dan berapa kali harus dilakukan.","Saat latihan tangan dan latihan bicara, pasien harus duduk dengan mantap di kursi yang ada sandaran punggung dan sandaran tangan.","Harus ada orang yang menemani di samping. Saat latihan, jangan membuat pasien terburu-buru.","Jika terasa sakit, berhenti. Jangan memaksakan diri."]},{"t":"h","x":"Tangan dan lengan"},{"t":"fig","id":"handtools"},{"t":"weak"},{"t":"ul","x":["Mengelap meja dengan handuk: duduk di depan meja, kedua tangan menekan handuk, lalu dorong pelan ke depan dan tarik kembali. Bisa juga membuat gerakan melingkar. Tangan yang kuat boleh membantu menggerakkan tangan yang lemah.","Jepit jemuran: pakai ibu jari dan jari telunjuk tangan yang lemah untuk membuka jepit jemuran. Jepitkan di pinggir gelas atau kotak kertas, lalu lepaskan lagi.","Memungut barang ke dalam gelas: pungut balok mainan besar atau kancing dengan jari, lalu masukkan ke dalam gelas. Saat latihan, harus selalu ada orang yang mengawasi di samping. Pasien yang punya masalah menelan, atau daya ingat dan daya pikirnya menurun, jangan memakai makanan seperti kacang. Pakai balok mainan besar saja.","Membalik kartu remi atau membalik halaman buku: untuk melatih gerakan jari yang halus.","Memeras handuk: di atas baskom, peras handuk basah dengan kedua tangan bersama-sama. Air jangan terlalu panas. Air di lantai harus dilap sampai kering. Jika jari sangat kaku dan tidak bisa dibuka, tanya terapis dulu."]},{"t":"h","x":"Duduk ke berdiri dan keseimbangan"},{"t":"fig","id":"balancetools"},{"t":"ul","x":["Duduk ke berdiri: latihan dengan kursi yang kokoh, tidak bergeser, dan ada sandaran tangan. Kursi boleh diletakkan menempel ke dinding. Jangan pakai kursi beroda atau kursi yang bisa berputar. Keluarga berdiri di sisi yang lemah dan memegang pinggang pasien. Jangan menarik lengan yang lemah.","Berdiri sambil berpegangan pada meja dapur atau meja yang kokoh: matikan kompor dulu dan simpan pisau. Kedua tangan berpegangan dengan mantap. Jika tangan yang lemah tidak bisa berpegangan, minta keluarga membantu meletakkannya. Latihan berdiri sebentar, lalu pindahkan berat badan pelan-pelan ke kaki kiri, lalu ke kaki kanan. Keluarga berdiri di sisi yang lemah untuk menjaga.","Jangan berpegangan pada barang yang bisa bergeser atau tidak stabil, misalnya troli, rak jemuran, atau sandaran kursi."]},{"t":"h","x":"Bicara, wajah, dan otak"},{"t":"fig","id":"mindtools"},{"t":"ul","x":["Membuat ekspresi di depan cermin: latihan tersenyum, memonyongkan bibir, dan menggembungkan pipi di depan cermin. Lihat apakah kedua sisi sama.","Menyebut nama barang: ambil gelas, sendok, atau handuk. Minta pasien menyebut nama dan kegunaannya.","Melihat kalender dan membaca koran: setiap hari lihat tanggal bersama, baca judul berita atau huruf besar di iklan. Pasien yang sering tidak melihat satu sisi bisa diberi garis berwarna di sisi itu, sebagai tanda untuk mulai membaca dari sana.","Mengerjakan pekerjaan rumah: melipat handuk dan memasangkan kaus kaki adalah latihan yang baik.","Jika daya ingat, perhatian, atau kemampuan menilai menurun, atau pasien sering mengabaikan satu sisi, minta terapis okupasi atau terapis wicara mengatur latihan khusus. Latihan di rumah hanya membantu, tidak bisa menggantikan latihan dari terapis."]},{"t":"p","x":"Pasien yang punya masalah menelan, tanya terapis wicara dulu sebelum minum dengan sedotan atau latihan meniup."},{"t":"h","x":"Menjaga keamanan dengan barang di rumah"},{"t":"fig","id":"safetools"},{"t":"ul","x":["Lonceng kecil atau peluit: letakkan di sisi yang kuat, di tempat yang bisa dilihat pasien. Pasien bisa memanggil orang saat perlu bantuan.","Ponsel: atur kontak darurat. Tulis nomor telepon yang sering dipakai dengan huruf besar dan tempel di dekatnya.","Selotip berwarna: tempel di ambang pintu, pinggir anak tangga, dan sakelar lampu supaya lebih jelas terlihat.","Lampu malam: letakkan di jalan dari tempat tidur ke toilet.","Cek suhu air sebelum mandi: cek dengan tangan di sisi yang kuat, atau pakai termometer, supaya kulit tidak melepuh karena air panas.","Barang yang sering dipakai diletakkan di tempat yang bisa dilihat dan dijangkau pasien. Jangan terlalu tinggi atau terlalu rendah. Jika terapis meminta barang tertentu diletakkan di sisi yang lemah untuk latihan, ikuti pengaturan terapis."]},{"t":"warn","h":"Perhatikan saat latihan","ul":["Barang kecil seperti kancing, balok mainan, dan koin harus disimpan setelah latihan. Jangan ditinggal di dekat pasien, supaya tidak tertelan.","Pakai barang yang kokoh untuk latihan. Jangan pakai barang yang licin, mudah menggelinding, atau mudah jatuh.","Jangan pakai botol plastik berisi air sebagai barbel untuk mengangkat lengan, supaya bahu di sisi yang lemah tidak cedera, kecuali terapis mengizinkan.","Jika ada nyeri dada, napas sangat terengah-engah, keluar keringat dingin, atau tiba-tiba mulut miring, tangan tidak bisa diangkat, bicara tidak jelas: segera berhenti, telepon 119, dan catat waktu kejadiannya.","Jika hanya pusing: duduk atau berbaring dulu untuk istirahat. Jika tidak membaik, hubungi dokter atau perawat."]}]},{"title":"Posisi tubuh dan memiringkan badan","desc":"Posisi berbaring dan duduk yang benar, 4 langkah memiringkan badan, kesalahan yang sering terjadi","body":[{"t":"h","x":"Posisi tubuh juga bagian dari pengobatan"},{"t":"p","x":"Setelah stroke, posisi saat berbaring atau duduk memengaruhi bahu, sendi, dan kulit. Posisi yang benar bisa melindungi bahu yang lemah, dan mencegah sendi menjadi kaku, telapak kaki terkulai, dan luka tekan. Posisi tubuh bukan hanya supaya nyaman, tetapi juga bagian dari pengobatan."},{"t":"fig","id":"posture"},{"t":"weak"},{"t":"key","h":"Berbaring miring ke sisi yang lemah","ul":["Topang tulang belikat dari belakang, lalu bawa bahu yang lemah pelan-pelan ke depan. Jangan menarik lengan, dan jangan biarkan bahu tertindih badan.","Tangan yang lemah diluruskan ke depan, siku lurus, telapak tangan menghadap ke atas, diletakkan di kasur atau bantal.","Kaki yang lemah berada di bawah, sedikit ditekuk.","Topang punggung dengan bantal supaya badan tidak jatuh ke belakang.","Kaki yang kuat ditekuk ke depan dan diletakkan di atas bantal.","Posisi ini memberi rangsangan rasa pada sisi yang lemah. Jika bahu terasa sakit, ubah posisinya dan beri tahu terapis."]},{"t":"key","h":"Berbaring miring ke sisi yang kuat","ul":["Tangan yang lemah diluruskan ke depan, diletakkan di atas bantal di depan dada.","Kaki yang lemah ditekuk ke depan dan diletakkan di atas bantal, jangan dibiarkan menggantung.","Punggung boleh diganjal bantal supaya badan tidak jatuh ke belakang."]},{"t":"key","h":"Berbaring telentang","ul":["Taruh bantal tipis di bawah bahu yang lemah. Lengan sedikit dijauhkan dari badan, siku lurus, diletakkan di atas bantal.","Di bawah bokong pada sisi yang lemah boleh diganjal bantal kecil supaya kaki tidak jatuh ke arah luar.","Jangan mengganjal bagian bawah lutut terlalu lama. Boleh taruh bantal di bawah betis supaya tumit menggantung dan tidak menyentuh kasur.","Selimut jangan menekan ujung jari kaki.","Jangan berbaring telentang terlalu lama. Gantian dengan berbaring miring."]},{"t":"key","h":"Duduk di tempat tidur","ul":["Duduk di tempat tidur hanya untuk waktu singkat. Jangan setengah berbaring setengah duduk, karena badan mudah melorot dan bokong bisa luka tekan. Jika sudah bisa turun dari tempat tidur, duduklah di kursi yang ada sandaran tangannya.","Topang punggung dengan bantal sampai stabil. Badan duduk tegak, jangan miring ke satu sisi.","Pasang meja makan tempat tidur di depan, kedua tangan diletakkan di atas meja.","Lama duduk ditambah pelan-pelan sesuai saran terapis.","Jika pasien pusing, baringkan pasien telentang dan beri tahu dokter atau perawat."]},{"t":"key","h":"Mencegah sendi menjadi kaku","ul":["Saat berbaring, terapis mungkin menyarankan memakai penyangga pergelangan kaki untuk istirahat, supaya pergelangan kaki tidak menjadi kaku.","Lengan yang lemah bisa diletakkan sedikit terbuka ke samping dan diputar ke luar (telapak tangan menghadap ke atas), dengan siku lurus, selama tidak terasa sakit.","Perlu dipakai atau tidak, dan cara meletakkannya, ikuti petunjuk terapis."]},{"t":"h","x":"4 langkah memiringkan badan"},{"t":"fig","id":"turning"},{"t":"ul","x":["Sebelum memiringkan badan, letakkan dulu lengan yang lemah dengan baik, jangan sampai tertindih badan. Setelah selesai, periksa lagi posisi tangan.","Topang bahu dan bokong, lalu miringkan bersamaan. Angkat badan saat memindahkan, jangan diseret, dan jangan menarik lengan yang lemah.","Setelah berbaring miring, badan sedikit bersandar ke belakang. Isi celah di punggung dan pinggang dengan bantal, jangan biarkan badan menggantung atau tidur dalam posisi terpelintir.","Jepit satu bantal di antara kedua kaki. Tumit, mata kaki, dan bagian dalam lutut jangan saling menekan."]},{"t":"p","x":"Miringkan badan kira-kira setiap 2 jam sekali. Jarak waktu yang sebenarnya mengikuti penilaian perawat. Setelah memiringkan badan, periksa bagian tulang yang menonjol, misalnya bokong, tumit, dan mata kaki, apakah kulitnya merah. Jangan memijat bagian yang merah. Jaga kulit tetap bersih dan kering. Jika kulit terlalu kering, boleh dioles losion. Jika popok basah atau setelah buang air besar, segera bersihkan dan ganti. Makan cukup dan cukup protein juga membantu mencegah luka tekan. Orang dengan penyakit ginjal atau pantangan makanan, tanyakan ahli gizi berapa banyak boleh makan."},{"t":"h","x":"Jangan lakukan kesalahan ini"},{"t":"fig","id":"donts"},{"t":"warn","h":"Kesalahan yang sering dilakukan keluarga dan pendamping","ul":["Jangan menarik lengan yang lemah.","Jangan mengganjal bagian bawah lutut dengan bantal yang keras atau sangat tinggi dalam waktu lama.","Selimut jangan menekan ujung jari kaki.","Jangan menaruh benda keras di genggaman tangan, kecuali disarankan terapis.","Jangan biarkan pasien hanya berbaring telentang sepanjang hari.","Jangan abaikan kulit: jika bagian yang merah tidak memudar setelah ditekan, beri tahu perawat."]}]},{"title":"Letak stroke dan urutan latihan","desc":"Kesulitan yang sering muncul pada stroke otak kiri dan otak kanan, serta latihan langkah demi langkah","body":[{"t":"h","x":"Letak stroke berbeda, kesulitannya juga berbeda"},{"t":"p","x":"Otak terbagi menjadi sisi kiri dan sisi kanan. Jika satu sisi otak rusak, biasanya tangan dan kaki di sisi yang berlawanan menjadi lemah. Baik penyumbatan pembuluh darah otak maupun perdarahan otak, letak cedera yang berbeda membuat kesulitan yang sering muncul juga berbeda, tetapi tidak semua kesulitan pasti muncul. Untuk kondisi pasien yang sebenarnya, tanyakan kepada dokter penanggung jawab atau terapis. Stroke di sisi mana pun bisa membuat pasien mudah menangis, mudah marah, atau sedih. Ini akibat stroke. Beri tahu tenaga kesehatan."},{"t":"fig","id":"brain"},{"t":"key","h":"Stroke otak kiri: tangan dan kaki kanan lemah","ul":["Sering ada kesulitan berbicara atau memahami, misalnya ingin bicara tetapi kata-katanya tidak keluar, atau tidak mengerti ucapan orang lain.","Kemampuan berhitung, membaca, dan menulis juga bisa menurun.","Bicaralah kepada pasien dengan pelan dan kalimat pendek, dibantu gerakan tangan dan gambar.","Sesuai saran terapis, dorong pasien memakai tangan kanan untuk kegiatan sehari-hari."]},{"t":"unitlink","x":"Lihat \"Emosi dan komunikasi\"","unit":"u6"},{"t":"key","h":"Stroke otak kanan: tangan dan kaki kiri lemah","ul":["Pasien mungkin mengabaikan sisi kiri, misalnya hanya makan makanan di sisi kanan piring, atau menabrak kusen pintu di sebelah kiri.","Kemampuan memperkirakan jarak dan ruang bisa menurun.","Pasien mungkin lebih terburu-buru dan lebih impulsif (bertindak tanpa berpikir) saat melakukan sesuatu.","Pasien mungkin merasa bisa melakukannya sendiri, padahal sebenarnya perlu bantuan, sehingga lebih mudah jatuh.","Saat turun dari tempat tidur dan berjalan, harus selalu ada orang yang menemani. Sebelum berdiri, pegang pasien dengan kuat supaya tidak jatuh ke arah kiri.","Cara mengingatkan pasien untuk memperhatikan sisi kiri, ikuti petunjuk terapis."]},{"t":"key","h":"Stroke batang otak atau otak kecil","ul":["Batang otak mengatur fungsi penting seperti bernapas, detak jantung, dan menelan. Setelah stroke batang otak, sering ada kesulitan menelan dan mudah tersedak saat minum. Ada orang yang tersedak tetapi tidak batuk. Cara makan dan minum ikuti penilaian terapis wicara.","Sering ada pusing, keseimbangan menurun, dan jalan tidak stabil.","Mungkin ada kesulitan menelan, bicara tidak jelas, atau penglihatan ganda (melihat satu benda menjadi dua).","Stroke batang otak bisa membuat kedua sisi lemah, atau sisi wajah yang lemah berbeda dengan sisi badan yang lemah.","Bangun dan bergerak harus pelan-pelan untuk mencegah jatuh. Masalah menelan perlu dinilai oleh terapis wicara."]},{"t":"h","x":"Tugas setiap bagian otak"},{"t":"p","x":"Satu kali stroke sering mengenai beberapa bagian otak. Di bawah ini hanya keadaan yang sering terjadi, tidak semuanya pasti muncul."},{"t":"fig","id":"lobes"},{"t":"ul","x":["Lobus depan (frontal): gerakan, membuat rencana dan keputusan, kepribadian. Jika cedera, pasien bisa lemah, melakukan sesuatu tanpa rencana, atau kepribadiannya berubah dan lebih impulsif.","Lobus atas (parietal): rasa dan perkiraan ruang. Jika cedera, rasa di kulit bisa berkurang, sulit memperkirakan jarak, atau mengabaikan satu sisi (lebih sering jika sisi kanan otak cedera, pasien mengabaikan sisi kiri).","Lobus samping (temporal): ingatan dan memahami ucapan orang lain. Jika cedera, daya ingat bisa menurun, sulit mengingat orang dan kejadian yang baru saja terjadi. Jika otak sisi kiri cedera, pasien mungkin tidak mengerti ucapan orang lain.","Lobus belakang (oksipital): melihat. Jika cedera, kedua mata mungkin tidak bisa melihat benda di sisi yang sama (bukan hanya satu mata yang tidak bisa melihat), atau penglihatan kabur. Saat berbicara dengan pasien atau menaruh barang, mulailah dari sisi yang bisa dia lihat.","Otak kecil: keseimbangan dan koordinasi. Lihat bagian \"Stroke batang otak atau otak kecil\" di halaman ini."]},{"t":"key","h":"Jika ada masalah penglihatan","p":"Jika pasien melihat benda seperti hilang sebagian, melihat dobel, atau tidak bisa melihat jelas, minta pemeriksaan penglihatan dan lapang pandang. Sesuai hasilnya, terapis bisa mengatur latihan menoleh dan menggerakkan mata untuk memindai sekeliling."},{"t":"h","x":"Pembuluh darah yang tersumbat berbeda, gejalanya juga berbeda"},{"t":"p","x":"Otak mendapat darah dari beberapa pembuluh darah utama. Pembuluh darah mana yang tersumbat akan mengganggu bagian otak yang dialirinya, sehingga gejalanya pun berbeda. Berikut keadaan yang sering terjadi. Pembuluh darah mana yang terkena pada pasien, tanyakan kepada dokter penanggung jawab."},{"t":"ul","x":["Arteri otak tengah (middle cerebral artery): paling sering. Wajah dan tangan di sisi yang berlawanan lebih lemah daripada kaki, dan rasa di kulit juga bisa berkurang. Jika otak kiri yang terkena, sering ada kesulitan bicara atau memahami ucapan. Jika otak kanan yang terkena, pasien sering mengabaikan satu sisi.","Arteri otak depan (anterior cerebral artery): kaki di sisi yang berlawanan lebih lemah daripada tangan. Pasien juga bisa menjadi lebih pasif, tidak bersemangat melakukan sesuatu, lebih lambat merespons, atau tidak bisa menahan buang air kecil.","Arteri otak belakang (posterior cerebral artery): kedua mata tidak bisa melihat benda di sisi yang sama (sisi yang berlawanan dengan sumbatan). Jika yang tersumbat sisi kiri, ada orang yang bisa melihat tulisan tetapi tidak bisa membacanya.","Peredaran darah otak bagian belakang (pembuluh darah batang otak dan otak kecil): bisa ada pusing, jalan tidak stabil, kesulitan menelan, suara serak, atau penglihatan ganda (melihat satu benda menjadi dua). Kadang satu sisi wajah dan sisi badan yang lain kurang bisa merasakan panas, dingin, atau sakit, atau satu kelopak mata sedikit turun.","Mengetahui pembuluh darah mana yang terkena membantu keluarga memahami kesulitan pasien. Latihan tetap ikuti rencana dari terapis."]},{"t":"h","x":"Rehabilitasi harus langkah demi langkah"},{"t":"fig","id":"progress"},{"t":"ul","x":["Pertama latihan duduk stabil, lalu latihan berdiri, lalu latihan berjalan.","Jika kaki lemah, latihan berdiri dulu sambil berpegangan pada kursi yang kokoh dan tidak bergeser, baru latihan berjalan. Jangan naik-turun tangga sendiri.","Latihan tangan dimulai dari benda besar, lalu benda kecil, misalnya memegang gelas besar dan balok mainan besar dulu, baru latihan mengancingkan baju. Jika jari lelah, istirahat.","Saat latihan jangan menahan napas, dan jangan menarik sendi dengan kuat. Berhenti jika terasa nyeri, kram, dada sesak, pusing, atau keluar keringat dingin.","Latihan langkah demi langkah sesuai rencana terapis. Jangan melewatkan langkah sendiri."]},{"t":"unitlink","x":"Lihat \"Olahraga di rumah\"","unit":"u8"}]},{"title":"Perawatan harian di rumah","desc":"Ukur tekanan darah dan gula darah, minum air, cegah gumpalan darah di kaki, keluarkan dahak, minum obat dan kontrol, kapan harus ke dokter","body":[{"t":"h","x":"Hal yang harus diperhatikan setiap hari di rumah"},{"t":"p","x":"Pulang dari rumah sakit bukan berarti perawatan selesai. Di rumah, ukur tekanan darah setiap hari, minum cukup air, banyak bergerak, minum obat tepat waktu, dan kontrol sesuai jadwal. Ini bisa mengurangi risiko stroke berulang dan komplikasi lain."},{"t":"fig","id":"homecare"},{"t":"h","x":"Tekanan darah dan gula darah: yang penting stabil"},{"t":"key","h":"Ukur pada jam yang sama setiap hari","ul":["Ukur tekanan darah 2 kali sehari: pagi setelah bangun (sesudah buang air kecil, sebelum sarapan dan minum obat) dan malam sebelum tidur. Catat hasilnya.","Ukur di lengan yang tidak terkena stroke. Selalu ukur di lengan yang sama.","Pasien diabetes: ukur gula darah pada jam yang ditentukan dokter, lalu catat hasilnya.","Setelah stroke, biasanya tekanan darah dianjurkan di bawah 130/80 mmHg. Target setiap orang ditentukan oleh dokter.","Tekanan darah harus sesuai target dokter, tetapi makin rendah belum tentu makin baik. Jika jauh lebih rendah dari biasanya, dan pasien pusing atau hampir pingsan, beri tahu dokter.","Jangan menambah, mengurangi, atau menghentikan obat sendiri."]},{"t":"warn","h":"Jika saat mengukur tekanan darah terjadi hal ini","ul":["Tekanan darah 180/120 mmHg atau lebih (angka atas 180 atau lebih, atau angka bawah 120 atau lebih), dan ada sakit kepala, nyeri dada, sangat sesak napas, penglihatan kabur, bicara tidak jelas, bingung, atau tangan/kaki tiba-tiba lemah: segera telepon 119.","Tekanan darah 180/120 mmHg atau lebih, tetapi tidak ada keluhan: duduk istirahat beberapa menit, lalu ukur lagi. Jika masih setinggi itu, hubungi dokter atau pergi ke dokter pada hari yang sama. Jangan menambah obat tekanan darah sendiri.","Tekanan darah lebih tinggi dari target dokter, tetapi belum sampai 180/120: minum obat seperti biasa, catat hasilnya, dan beri tahu dokter saat kontrol.","Keringat dingin, gemetar, jantung berdebar cepat, pusing, atau bingung/kesadaran menurun: mungkin gula darah terlalu rendah. Jika ada alat cek gula darah, ukur dulu. Jika di bawah 70 mg/dL, dan pasien sadar serta bisa menelan dengan aman: beri makanan atau minuman manis sesuai cara yang diajarkan dokter atau edukator (pasien yang sulit menelan ikuti kekentalan dari terapis wicara). Ukur lagi setelah 15 menit.","Pasien bingung atau kesadarannya menurun, tidak bisa dibangunkan, atau tidak bisa menelan dengan baik: jangan beri makan atau minum apa pun, segera telepon 119."]},{"t":"unitlink","x":"Lihat \"Mengukur tekanan darah 722\"","unit":"u5"},{"t":"h","x":"Minum air sedikit-sedikit tapi sering"},{"t":"ul","x":["Jika kurang minum, darah menjadi kental. Minum air yang cukup. Minum sedikit setiap kali, tetapi sering sepanjang hari.","Pasien penyakit jantung, penyakit ginjal, atau yang dibatasi minumnya oleh dokter: minum sesuai jumlah dari dokter.","Pasien yang sulit menelan: apakah air perlu diberi pengental dan seberapa kental, ikuti saran terapis wicara.","Pasien yang minum air dengan pengental sering minum terlalu sedikit tanpa sadar. Keluarga perlu ikut memperhatikan berapa banyak yang diminum.","Saat minum, duduk tegak dan minum pelan-pelan.","Jika air kencing berkurang, warnanya sangat gelap, atau bibir sangat kering, mungkin kurang minum. Beri tahu dokter atau perawat."]},{"t":"unitlink","x":"Lihat \"Menelan dan keamanan makan\"","unit":"u3"},{"t":"h","x":"Mencegah gumpalan darah di kaki"},{"t":"p","x":"Jika terlalu lama berbaring atau duduk tanpa bergerak, darah di kaki mengalir lambat dan mudah membentuk gumpalan darah."},{"t":"ul","x":["Saat berbaring atau lama duduk, sering lakukan latihan pergelangan kaki: tarik ujung jari kaki ke atas, lalu tekan ke bawah, pelan-pelan. Kaki yang lemah boleh dibantu digerakkan oleh keluarga.","Setelah bisa turun dari tempat tidur, lebih sering turun dan bergerak sesuai rencana terapis.","Stoking elastis biasa TIDAK bisa mencegah bekuan darah di kaki setelah stroke. Jangan membeli dan memakai sendiri. Untuk pasien rawat inap yang sangat sulit bergerak, tim medis mungkin memakai sarung tekan kaki yang mengembang secara berkala untuk mencegah bekuan darah. Perlu dipakai atau tidak, tim medis yang memutuskan. Jika dokter menyuruh pasien memakai stoking elastis karena alasan lain, lepaskan setiap hari dan periksa apakah kulit lecet atau merah."]},{"t":"warn","h":"Tanda bahaya gumpalan darah","ul":["Satu kaki tiba-tiba bengkak, sakit, merah, atau terasa hangat: jangan pijat kaki itu. Pergi ke dokter pada hari yang sama. Jika malam hari atau hari libur, pergi ke IGD.","Tiba-tiba nyeri dada, sangat sesak napas, atau batuk darah: segera telepon 119."]},{"t":"key","h":"Masalah buang air kecil dan besar","ul":["Setelah stroke sering terjadi mengompol, tidak bisa menahan kencing, sulit kencing, atau sembelit. Beri tahu perawat, dan jelaskan kebiasaan buang air sebelum stroke. Perawat mungkin memakai USG untuk melihat apakah masih ada sisa air kencing di kandung kemih.","Jika memakai selang kencing (kateter), tanyakan kepada dokter atau perawat kapan bisa dilepas. Jangan dipasang terlalu lama.","Jika sering mengompol, ingatkan pasien ke toilet secara teratur sesuai jadwal dari perawat. Tanyakan apakah cocok melakukan latihan otot dasar panggul."]},{"t":"key","h":"Nyeri setelah stroke","p":"Jika di sisi tubuh yang terkena stroke muncul nyeri seperti terbakar, tertusuk, dingin seperti es, atau sangat sakit walau hanya disentuh pelan, mungkin ini nyeri saraf setelah stroke. Beri tahu dokter. Nyeri ini bisa dikurangi dengan obat dan cara lain. Jangan ditahan, dan jangan membeli obat pereda nyeri sendiri."},{"t":"h","x":"Membantu mengeluarkan dahak"},{"t":"ul","x":["Sering ubah posisi tidur. Jika bisa duduk, lebih sering duduk supaya dahak lebih mudah keluar.","Ajak pasien menarik napas dalam, lalu batuk dengan kuat.","Menepuk punggung: minta diajari dulu oleh perawat atau terapis, dan pastikan pasien boleh ditepuk. Pasien yang minum obat pencegah gumpalan darah, ada pengeroposan tulang, patah tulang, atau pernah operasi dada: tanya dokter dulu.","Jangan menepuk dalam 1 jam setelah makan atau makan lewat selang. Bentuk telapak tangan seperti mangkuk, tepuk di bagian tulang rusuk punggung. Hindari tulang belakang dan pinggang.","Dahak bertambah banyak, berwarna kuning atau hijau, demam, atau sering tersedak saat makan: pergi ke dokter. Sangat sesak napas atau bibir membiru: segera telepon 119."]},{"t":"unitlink","x":"Lihat \"Posisi tubuh dan memiringkan badan\"","unit":"u11"},{"t":"h","x":"Minum obat tepat waktu, kontrol sesuai jadwal"},{"t":"ul","x":["Obat pencegah gumpalan darah, serta obat tekanan darah, lemak darah, dan gula darah: walaupun merasa sudah sehat, jangan menghentikan, mengurangi, atau mengganti obat sendiri.","Saat minum obat pencegah gumpalan darah, jika BAB berwarna hitam, air kencing berdarah, gusi berdarah atau mimisan tidak berhenti, atau banyak memar di badan: beri tahu dokter. Jika muntah darah atau BAB berdarah banyak: segera telepon 119.","Sebelum ke dokter gigi, operasi, atau pemeriksaan, beri tahu dokter bahwa pasien sedang minum obat pencegah gumpalan darah.","Saat kontrol, dokter mungkin meminta tes darah (misalnya gula darah, lemak darah, pembekuan darah), atau pemeriksaan otak dan pembuluh darah.","Saat kontrol, bawa catatan tekanan darah, catatan gula darah, dan kantong obat.","Jangan merokok dan jauhi asap rokok orang lain. Jangan minum alkohol, atau minum sedikit saja sesuai saran dokter."]},{"t":"h","x":"Makan tidak asin, tidak berminyak, dan seimbang"},{"t":"ul","x":["Kurangi garam: kurangi kecap dan saus cocolan, kurangi makanan asinan dan makanan olahan. Jangan minum kuah mi instan.","Kurangi minyak: kurangi gorengan dan daging berlemak.","Setiap kali makan harus ada protein, misalnya ikan, telur, tahu, atau daging tanpa lemak.","Banyak makan sayur. Sebagian nasi putih bisa diganti biji-bijian utuh, misalnya beras merah.","Jangan mengganti sendiri ke garam rendah natrium: mungkin tidak cocok untuk pasien penyakit ginjal atau yang minum obat tekanan darah tertentu. Tanya dokter atau ahli gizi dulu.","Pasien yang minum warfarin (obat pengencer darah): makan sayur hijau tua dalam jumlah yang kira-kira sama setiap hari. Jangan tiba-tiba makan jauh lebih banyak atau lebih sedikit.","Pasien diabetes atau penyakit ginjal: makan sesuai saran ahli gizi. Kelembutan makanan ikuti saran terapis wicara."]},{"t":"h","x":"Jaga juga perasaan dan keselamatan"},{"t":"p","x":"Perasaan yang tenang dan mencegah jatuh juga sangat penting setelah pulang ke rumah."},{"t":"unitlink","x":"Lihat \"Mencegah jatuh\"","unit":"u4"},{"t":"unitlink","x":"Lihat \"Emosi dan komunikasi\"","unit":"u6"},{"t":"h","x":"Kapan harus segera telepon 119"},{"t":"sos"},{"t":"warn","h":"Jika ada keadaan ini, juga segera telepon 119","ul":["Tiba-tiba sakit kepala yang sangat hebat.","Tiba-tiba penglihatan kabur, atau melihat benda menjadi dua.","Tiba-tiba pusing, tidak bisa berdiri dengan stabil, atau jalan tidak stabil.","Wajah, tangan, atau kaki tiba-tiba lemah atau kesemutan, termasuk sisi yang lemah tiba-tiba menjadi lebih lemah.","Tiba-tiba bingung atau kesadarannya menurun, tidak bisa dibangunkan, atau kejang di seluruh badan.","Catat jam terakhir pasien terlihat masih normal. Walaupun gejala cepat hilang, tetap telepon 119.","Sambil menunggu ambulans, jangan beri pasien makan, minum, atau obat. Jangan mengantar sendiri ke rumah sakit dengan mobil."]}]},{"title":"Dasar-dasar rehabilitasi","desc":"Penilaian dulu, tingkat kekuatan otot, keseimbangan, otot kaku, gerak sendi, berjalan, terapi dengan alat, jumlah latihan","body":[{"t":"h","x":"Rehabilitasi dimulai dari penilaian"},{"t":"p","x":"Selama PAC, tim terapi menilai kemampuan pasien di awal, selama terapi (kira-kira setiap 3 minggu sekali), dan sebelum selesai. Rencana dan latihan dibuat dan diubah sesuai hasil penilaian. Nilai dulu, baru berlatih. Jangan menambah latihan atau mengganti gerakan sendiri hanya berdasarkan perasaan."},{"t":"fig","id":"evalflow"},{"t":"h","x":"Kekuatan otot dibagi tingkat 0 sampai 5"},{"t":"p","x":"Terapis sering memakai tingkat 0 sampai 5 untuk menjelaskan kekuatan otot. Jika tahu pasien ada di tingkat berapa, Anda lebih mudah mengerti mengapa terapis mengatur latihan seperti itu."},{"t":"key","h":"Tingkat kekuatan otot","ul":["Tingkat 0: otot tidak terlihat dan tidak teraba bergerak sama sekali.","Tingkat 1: otot terlihat atau teraba sedikit bergerak, tetapi sendi tidak bisa bergerak.","Tingkat 2: tangan atau kaki bisa digeser mendatar di atas kasur, tetapi tidak bisa diangkat (tidak bisa melawan gaya berat).","Tingkat 3: bisa diangkat sendiri sampai gerakan penuh, tetapi jika ditekan pelan oleh orang lain, tidak bisa menahan.","Tingkat 4: setelah diangkat, masih bisa menahan saat orang lain menekan dengan agak kuat, tetapi lebih lemah dari normal.","Tingkat 5: kekuatan normal."]},{"t":"p","x":"Latihan harus sesuai tingkat saat ini. Jika kekuatannya sangat kecil, gerakan lebih banyak dibantu oleh terapis atau keluarga. Setelah pasien bisa bergerak sendiri, baru latih bergerak sendiri. Perlu tambah beban atau tahanan atau tidak, ikuti rencana terapis, jangan tambah sendiri. Tingkat kekuatan dinilai oleh terapis. Keluarga jangan menekan tangan atau kaki pasien sendiri untuk menguji kekuatannya. Terapis juga mungkin memakai cara lain untuk menilai gerakan setelah stroke."},{"t":"h","x":"Keseimbangan dibagi 3 tingkat"},{"t":"fig","id":"balance3"},{"t":"ul","x":["Tingkat 1: tanpa berpegangan, bisa duduk atau berdiri dengan stabil sendiri.","Tingkat 2: saat mengulurkan tangan mengambil barang sendiri, atau badan condong ke depan, belakang, kiri, atau kanan, tetap tidak jatuh.","Tingkat 3: jika didorong pelan, tetap bisa bertahan stabil.","Duduk dan berdiri sama-sama dibagi 3 tingkat ini. Biasanya latih duduk dulu, baru latih berdiri.","Stabil dulu, lalu bergerak, terakhir baru latih menahan dorongan. Latihan didorong pelan hanya dilakukan oleh terapis. Keluarga jangan mendorong pasien sendiri.","Mencegah jatuh selalu yang paling utama."]},{"t":"unitlink","x":"Lihat \"Mencegah jatuh\"","unit":"u4"},{"t":"h","x":"Jika otot sangat kaku, regangkan pelan-pelan"},{"t":"p","x":"Setelah stroke, tangan atau kaki yang lemah kadang menjadi sangat kaku dan keras, sulit ditekuk atau tidak bisa diluruskan. Ini karena tegangan otot terlalu tinggi. Tenaga kesehatan sering menyebutnya \"spastisitas\" (otot terlalu kaku/tegang). Ini berbeda dengan kram otot, dan juga berbeda dengan kejang atau serangan epilepsi."},{"t":"fig","id":"stretch"},{"t":"ul","x":["Regangkan pelan-pelan. Saat terasa agak tegang, tahan sebentar, lalu lepaskan pelan-pelan. Berapa lama ditahan, ikuti saran terapis.","Jika terasa nyeri, berhenti. Jangan menarik atau menekuk dengan paksa, supaya otot atau sendi tidak cedera.","Saat cuaca dingin, tegang, nyeri, sembelit, atau ada infeksi saluran kencing, otot bisa menjadi lebih kaku.","Jika otot tiba-tiba jauh lebih kaku dari biasanya, beri tahu tenaga kesehatan.","Jika otot sangat kaku sehingga mengganggu berpakaian, membersihkan badan, mengatur posisi, atau berjalan, tanyakan kepada dokter apakah cocok mendapat suntikan untuk melemaskan otot atau pengobatan lain.","Bidai (splint) atau plester (taping) tidak disarankan untuk mencegah otot pergelangan tangan dan jari menjadi kaku (spastisitas). Jangan membeli dan memakainya sendiri. Jika pergelangan tangan sudah kaku dan tidak bisa ditekuk, terapis mungkin menilai apakah perlu memakai bidai. Jika dipakai, ikuti petunjuk terapis."]},{"t":"h","x":"Gerak sendi: pelan, lembut, stabil"},{"t":"ul","x":["Gerakkan sesuai urutan yang diajarkan terapis. Cara yang sering dipakai adalah mulai dari sendi yang dekat badan: bahu, siku, pergelangan tangan, jari.","Gerakan pelan, lembut, dan stabil, hanya dalam batas yang tidak nyeri. Jangan menarik dengan paksa. Jika pasien tidak bisa bicara, lihat wajahnya: jika mengerutkan dahi, menarik tangan, berteriak, atau badannya menjadi kaku, segera berhenti.","Saat membantu menggerakkan lengan yang lemah, satu tangan menopang siku, satu tangan menopang pergelangan tangan. Jangan menarik tangannya.","Seberapa tinggi bahu diangkat, ikuti ajaran terapis. Jika tidak ada petunjuk khusus, jangan angkat lebih tinggi dari bahu dulu. Jangan menarik lengan ke atas dengan tali atau katrol."]},{"t":"h","x":"Sebelum berjalan, latih memindahkan berat badan"},{"t":"ul","x":["Bisa berdiri stabil dulu, baru latih melangkah.","Berpegangan pada meja atau pegangan yang kokoh, dengan orang yang menjaga, latih memindahkan berat badan pelan-pelan ke kaki yang lemah. Jika lutut tidak stabil atau terdorong ke belakang sampai terkunci lurus, minta terapis mengajari caranya.","Saat melangkah, tumit menyentuh lantai lebih dulu.","Jika kaki yang lemah berayun melingkar ke luar saat berjalan, minta terapis mengajari cara berjalan yang benar. Jika perlu, pakai alat bantu atau penyangga pergelangan kaki sesuai saran terapis.","Latihan berjalan harus selalu ditemani. Pendamping berdiri di sisi yang lemah, sedikit di belakang pasien.","Untuk pasien yang bisa berjalan, disarankan berlatih langsung di lantai: berjalan, melangkah, dan keseimbangan. Latihan jalan dengan treadmill atau mesin tidak lebih baik, jadi tidak perlu membeli treadmill atau mesin khusus untuk rehabilitasi."]},{"t":"unitlink","x":"Lihat \"Memakai alat bantu\"","unit":"u9"},{"t":"h","x":"Terapi dengan alat harus sesuai kebutuhan"},{"t":"p","x":"Alat seperti terapi listrik, kompres hangat, kompres dingin, dan ultrasound dipilih oleh terapis sesuai kondisi dan tahap pemulihan pasien. Tidak semua orang memerlukannya."},{"t":"ul","x":["Tanpa saran terapis, jangan membeli alat terapi listrik sendiri untuk dipakai di rumah. Orang yang memakai alat pacu jantung sama sekali tidak boleh memakainya sendiri.","Sisi yang terkena stroke sering kurang bisa merasa, tidak peka terhadap panas dan dingin. Jika terbakar atau kedinginan sampai luka, pasien mungkin tidak bisa mengatakannya. Kompres hangat, selimut listrik, dan penghangat tempel mudah menyebabkan luka bakar. Kompres es juga bisa menyebabkan luka karena dingin. Tanyakan terapis dulu sebelum memakainya."]},{"t":"h","x":"Latihan sesuai kemampuan"},{"t":"ul","x":["Jumlah dan intensitas latihan harus cukup supaya ada hasil. Terapis yang mengaturnya sesuai keadaan pasien, lalu ditambah pelan-pelan. Latihan dalam sehari boleh dibagi beberapa kali, dengan istirahat di antaranya. Jangan sampai terlalu lelah dan napas terengah-engah.","Jika keesokan harinya masih sangat lelah, sangat pegal, atau lebih lemah, berarti latihan terlalu banyak. Kurangi latihan dan beri tahu terapis.","Jangan menambah latihan sendiri supaya cepat sembuh. Tambah pelan-pelan sesuai rencana terapis.","Jika saat latihan pusing, dada sesak, sangat sesak napas, atau keluar keringat dingin, segera berhenti dan istirahat, lalu beri tahu tenaga kesehatan."]},{"t":"key","h":"Rehabilitasi juga melatih otak","p":"Stroke adalah cedera pada otak. Dengan latihan berulang-ulang, otak bisa belajar lagi mengendalikan gerakan. Jadi saat latihan harus fokus, ulangi gerakan yang benar, dan dalam keadaan aman dorong pasien lebih sering memakai sisi yang lemah. Menarik tangan atau kaki dengan paksa tidak membuat otak belajar."},{"t":"h","x":"3 langkah latihan gerak: bayangkan, coba sendiri, dibantu"},{"t":"fig","id":"mindmove"},{"t":"ul","x":["Bayangkan: dalam hati, bayangkan tangan atau kaki yang lemah sedang bergerak, misalnya bayangkan tangan menjangkau ke depan. Setelah itu, benar-benar berlatih. Jangan hanya membayangkan saja.","Coba sendiri: pasien mencoba mengeluarkan tenaga sendiri, cari bagian mana yang bisa bergerak sedikit, misalnya jari atau pergelangan tangan.","Dibantu: bagian yang belum bisa bergerak sendiri ditopang oleh terapis atau keluarga, dan gerakan dibantu sampai selesai, sambil pasien ikut mengeluarkan tenaga. Hanya menopang, jangan menarik tangan yang lemah.","Berapa banyak setiap langkah dan cara membantunya, ikuti cara yang diajarkan terapis."]},{"t":"h","x":"Latihan tangan dan lengan"},{"t":"fig","id":"handex"},{"t":"ul","x":["Genggam: genggam bola lembut atau handuk yang digulung.","Lepas: buka jari-jari, lepaskan barang di tangan.","Sentuh: ulurkan tangan untuk menyentuh gelas atau benda lain di meja. Jika lengan belum kuat, tangan boleh digeser di atas meja, atau ada orang yang menopang.","Angkat: letakkan lengan bawah di meja, angkat pergelangan tangan ke atas, lalu turunkan pelan-pelan.","Jika jari sangat kaku dan kepalan tangan tidak bisa dibuka, jangan terus berlatih menggenggam. Luruskan jari dan pergelangan tangan pelan-pelan dulu, lebih banyak latih membuka tangan, dan tanyakan latihan yang cocok kepada terapis."]},{"t":"fig","id":"armex"},{"t":"ul","x":["Menjangkau ke depan: duduk stabil, ulurkan tangan ke depan seperti mau mengambil barang di depan.","Mengangkat ke atas dan membuka ke samping: lakukan hanya setelah diajari terapis. Keluarga menopang siku dengan satu tangan dan pergelangan tangan dengan tangan lain, bantu bergerak pelan-pelan, jangan menarik tangan.","Jika terapis belum mengizinkan, jangan angkat lengan ke atas atau ke samping lebih tinggi dari bahu. Berhenti jika bahu nyeri atau tangan kesemutan atau mati rasa.","Jangan mengikat tangan yang kuat sendiri untuk memaksa pasien memakai tangan yang lemah. Cara ini hanya cocok untuk sebagian pasien dan harus diatur oleh terapis."]},{"t":"h","x":"Urutan latihan kaki"},{"t":"fig","id":"legsteps"},{"t":"ul","x":["Duduk stabil dulu, baru latih berdiri. Berdiri → berpegangan sambil memindahkan berat badan → angkat kaki → melangkah. Satu per satu, setelah langkah sebelumnya stabil baru latih langkah berikutnya.","Saat mengangkat kaki, pasien berdiri dengan satu kaki dan paling mudah jatuh. Harus berpegangan pada pegangan yang terpasang tetap atau meja yang kokoh.","Saat berlatih, harus selalu ada orang yang menjaga di sisi yang lemah. Pakai alat bantu jalan atau penyangga sesuai saran terapis."]},{"t":"unitlink","x":"Lihat \"Olahraga di rumah\"","unit":"u8"}]},{"title":"Proses pemulihan dan latihan tangan-kaki","desc":"Lama pemulihan, kenapa tangan lebih lambat, latihan tongkat kayu dan pasak, telapak kaki terkulai","body":[{"t":"h","x":"Pemulihan butuh waktu"},{"t":"fig","id":"timeline"},{"t":"ul","x":["Dalam 3 bulan pertama setelah stroke, kemajuan biasanya paling cepat. Manfaatkan waktu ini untuk berlatih.","3 sampai 6 bulan: kemajuan biasanya lebih lambat, tetapi masih mungkin membaik.","6 sampai 12 bulan: kemajuan lebih lambat lagi. Jika terus berlatih, masih bisa membaik.","Setelah 1 tahun: terus berlatih tetap bermanfaat untuk menjaga dan memperbaiki fungsi.","Kecepatan pulih setiap orang berbeda. Jangan membandingkan dengan orang lain. Terus berlatih sesuai rencana terapis.","Setelah rehabilitasi resmi selesai, pemulihan masih terus berlanjut. Sebaiknya kontrol dan dinilai secara rutin. Jika ada kesulitan atau tujuan baru, pasien bisa menjalani rehabilitasi lagi untuk beberapa waktu."]},{"t":"key","h":"Jaga 3 hal setiap hari","p":"Makan teratur, cukup istirahat, berlatih setiap hari. Jika pasien tersedak atau batuk saat makan atau minum, minta terapis wicara menilai dulu sebelum makan atau minum. Jika bicara tidak jelas, terapis wicara juga bisa membantu latihan bicara. Jika tiba-tiba bicara tidak jelas atau menjadi lebih parah dari sebelumnya, segera telepon 119."},{"t":"unitlink","x":"Lihat \"Menelan dan keamanan makan\"","unit":"u3"},{"t":"h","x":"Kenapa kaki sudah bisa berjalan, tetapi tangan lebih lambat?"},{"t":"p","x":"Berjalan memakai gerakan yang besar. Tangan dan jari harus melakukan gerakan kecil dan tepat. Karena itu tangan biasanya pulih lebih lambat, dan jari lebih lambat lagi. Ini hal yang umum. Bukan berarti tangan tidak ada harapan."},{"t":"key","h":"Jangan hanya berlatih berjalan","ul":["Jika tangan tidak dilatih, walaupun sudah bisa berjalan stabil, gerakan kecil tangan sulit pulih. Latih tangan juga setiap hari.","Lemaskan dulu: regangkan pelan-pelan supaya otot yang kaku menjadi lemas.","Lalu gerakkan: bahu, siku, pergelangan tangan, dan jari semua harus digerakkan.","Lalu keluarkan tenaga: latih mengangkat tangan dan menggenggam sendiri.","Jangan memaksa menarik tangan. Saat istirahat, letakkan tangan di atas bantal, jari terbuka dengan alami. Jangan biarkan tangan terus tergantung atau menggulung.","Pemulihan tangan berbeda pada setiap orang. Terapis juga akan mengajarkan cara memakai tangan yang kuat atau alat bantu untuk kegiatan sehari-hari. Keduanya perlu dilatih."]},{"t":"unitlink","x":"Lihat \"Posisi tubuh dan memiringkan badan\"","unit":"u11"},{"t":"h","x":"Latihan tangan dengan tongkat kayu dan pasak"},{"t":"fig","id":"stickex"},{"t":"ul","x":["Dua tangan memegang tongkat: duduk stabil, pegang tongkat kayu dengan dua tangan, dorong ke depan pelan-pelan, lalu tarik kembali pelan-pelan. Bisa juga digerakkan ke kiri dan kanan pelan-pelan. Di rumah bisa memakai penggiling adonan atau handuk yang digulung.","Tangan yang lemah juga harus ikut mengeluarkan tenaga. Jangan hanya digerakkan oleh tangan yang kuat. Jika tangan yang lemah tidak bisa menggenggam, minta keluarga membantu memegangnya.","Jangan menarik lengan yang lemah. Jika bahu tidak bertenaga, nyeri, atau ada cekungan di bahu, jangan angkat tangan lebih tinggi dari bahu dulu. Tanyakan kepada terapis boleh diangkat setinggi apa.","Pasak: pilih kayu yang besar dulu, lebih mudah berhasil. Mata melihat lubang, tangan mendekat pelan-pelan, tahan pergelangan tangan supaya stabil, lalu masukkan. Di rumah bisa latihan memasukkan sedotan besar ke dalam gelas.","Mulai dari 8 sampai 12 kali per set, 2 set sehari. Setelah stabil, tambah pelan-pelan sesuai saran terapis. Sesuaikan dengan kemampuan."]},{"t":"warn","h":"Perhatikan saat latihan tangan","ul":["Bahu nyeri, tangan kesemutan, pusing, dada sesak, atau sangat terengah-engah: segera berhenti.","Jika tangan sangat kaku atau spastisitas (otot terlalu kaku) jelas, berhenti dulu. Jangan memaksa berlatih.","Jangan memaksa menarik jari dan pergelangan tangan. Jangan menahan napas saat mengeluarkan tenaga.","Selalu duduk stabil, dan harus ada orang yang mengawasi di samping."]},{"t":"h","x":"Ujung kaki terkulai ke bawah (telapak kaki terkulai)"},{"t":"fig","id":"footdrop"},{"t":"ul","x":["Penyebab: otot yang mengangkat punggung kaki ke atas tidak bertenaga, dan otot betis bagian belakang sering terlalu kaku.","Jika ujung kaki lama menghadap ke bawah, urat di belakang tumit lama-lama memendek, pergelangan kaki menjadi kaku, dan nanti lebih sulit diperbaiki.","Saat berjalan, ujung kaki mudah terseret di lantai dan mudah tersandung."]},{"t":"key","h":"Cara mencegah","ul":["Saat berbaring, selimut jangan menekan ujung kaki. Atur posisi sesuai cara yang diajarkan terapis.","Gerakkan pergelangan kaki setiap hari, tarik punggung kaki ke atas. Jika tidak bisa sendiri, keluarga menopang tumit dan membantu pelan-pelan. Jika terasa kaku, berhenti di situ, jangan menekan dengan kuat. Jika pergelangan kaki sangat kaku atau terus gemetar, tanya terapis dulu.","Jika betis tiba-tiba bengkak, nyeri, merah, atau terasa hangat saat disentuh: jangan lakukan latihan ini, dan beri tahu perawat atau staf medis.","Pakai penyangga pergelangan kaki dan sepatu tertutup yang tidak licin sesuai saran terapis. Setelah penyangga dilepas, periksa kulit. Jika kulit merah lama tidak hilang, beri tahu terapis."]},{"t":"unitlink","x":"Lihat \"Memakai alat bantu\"","unit":"u9"}]}],"daily":["Hari ini ikut semua sesi rehabilitasi","Hal yang bisa dilakukan sendiri, dilakukan sendiri (mencuci muka, berpakaian, makan)","Saat makan duduk tegak, suapan kecil dan pelan-pelan; setelah makan duduk 30 menit","Setelah makan, mulut dibersihkan dan diperiksa apakah ada sisa makanan","Sebelum turun dari tempat tidur, duduk 30 detik, berdiri 30 detik, dan ada yang menemani","Saat berbaring di tempat tidur, badan dibalik kira-kira setiap 2 jam, dan lengan yang lemah ditopang bantal","Semua obat hari ini sudah diminum tepat waktu","Tekanan darah diukur dan dicatat","Hari ini sudah mengobrol dengan pasien dan menyemangatinya","Pendamping pasien sendiri sudah istirahat dan makan","Hari ini sudah melakukan olahraga di rumah sesuai cara yang diajarkan terapis","Hari ini sudah latihan gerakan tangan dengan barang di rumah","Setelah memiringkan badan, sudah memeriksa kulit di tulang yang menonjol seperti bokong dan tumit","Hari ini minum air sedikit-sedikit tapi sering (jika dokter membatasi minum, ikuti petunjuk dokter)","Saat berbaring atau lama duduk, sudah melakukan latihan pergelangan kaki","Hari ini saat latihan ada waktu istirahat, dan tidak berlatih sampai terlalu lelah","Hari ini selain berjalan, juga berlatih tangan"],"ready":["Bisa membantu pasien naik-turun tempat tidur dan kursi roda dengan aman","Bisa menyuapi atau memberi makan lewat selang makan (selang NGT)","Tahu kegunaan setiap obat dan waktu minumnya","Bisa melakukan gerakan rehabilitasi di rumah","Alat bantu sudah disiapkan sesuai saran terapis","Di rumah sudah dipasang pegangan dan alas antiselip, dan barang-barang sudah dirapikan","Sudah menelepon 1966 atau meminta perawat merujuk ke penilaian perawatan jangka panjang","Tahu tanggal kontrol dan poli (bagian) yang dituju","Tahu tanda peringatan stroke berulang dan kapan harus menelepon 119","Di rumah ada alat pengukur tekanan darah (tensimeter), dan bisa mencatat hasilnya","Tahu tongkat dipegang di sisi mana, dan cara naik-turun tangga","Di rumah sudah ada lonceng kecil untuk memanggil orang, dan ambang pintu sudah ditempel selotip berwarna","Bisa mengatur posisi tubuh dengan benar dan membantu memiringkan badan","Tahu tanda bahaya gumpalan darah di kaki, dan saat kontrol membawa catatan tekanan darah, gula darah, serta kantong obat","Tahu tingkat kekuatan otot dan keseimbangan pasien saat ini, serta jumlah latihan yang disarankan terapis"],"quiz":[{"q":"Setelah kondisi stroke stabil, memulai rehabilitasi sejak dini memberi peluang lebih besar untuk memulihkan fungsi.","why":"Pada masa setelah kondisi stabil, pemulihan berlangsung lebih cepat. PAC mengatur rehabilitasi intensif pada masa ini."},{"q":"Agar pasien lebih banyak beristirahat, berpakaian dan makan sebaiknya semuanya dikerjakan oleh keluarga.","why":"Hal yang bisa dilakukan pasien sendiri, biarkan pasien melakukannya sendiri. Ini juga bagian dari rehabilitasi. Keluarga cukup mengawasi di dekatnya dan membantu bila perlu."},{"q":"Saat membantu pasien bangun, lengan di sisi yang lemah tidak boleh ditarik.","why":"Menarik lengan di sisi yang lemah mudah membuat bahu cedera."},{"q":"Jika pasien sesekali batuk saat makan, itu tidak apa-apa dan tidak perlu diberitahukan kepada tenaga medis.","why":"Batuk saat makan atau minum air adalah tanda peringatan gangguan menelan. Beri tahu perawat atau terapis wicara."},{"q":"Saat menyuapi, makanan harus dimasukkan ke mulut pasien dari sisi yang kuat.","why":"Jika dimasukkan dari sisi yang kuat, makanan lebih mudah dikunyah dan ditelan, dan lebih jarang tersisa di mulut."},{"q":"Jika ingin ke toilet tengah malam, pasien boleh berjalan pelan-pelan sendiri supaya tidak membangunkan keluarga.","why":"Turun dari tempat tidur dan ke toilet harus selalu ditemani. Selama dirawat di rumah sakit, tekan bel panggil. Jangan memaksakan diri melakukannya sendiri."},{"q":"Jika tekanan darah stabil dan tidak ada keluhan, obat boleh dihentikan sendiri.","why":"Tekanan darah stabil karena obat diminum tepat waktu. Perlu atau tidaknya obat diubah, biarkan dokter yang memutuskan."},{"q":"Jika tiba-tiba mulut miring, satu tangan lemah, atau bicara tidak jelas, sebaiknya istirahat dan amati dahulu selama setengah hari.","why":"Ini tanda peringatan stroke berulang. Jika ada salah satu tanda, segera telepon 119 dan catat waktu mulai gejalanya."},{"q":"Selama perawatan PAC, tim menilai kemajuan pasien setiap 3 minggu.","why":"Tim melakukan penilaian saat pasien masuk program, setiap 3 minggu, dan saat program selesai, lalu menyesuaikan isi rehabilitasi menurut hasilnya."},{"q":"Pendamping pasien juga perlu beristirahat dan bisa menelepon 1966 untuk bertanya tentang layanan pengganti sementara bagi pendamping (respite).","why":"Merawat adalah pekerjaan jangka panjang. Saluran telepon perawatan jangka panjang 1966 bisa dihubungi untuk bertanya tentang sumber daya seperti layanan pengganti sementara bagi pendamping (respite) dan layanan di rumah."},{"q":"Tongkat harus dipegang di sisi yang lemah, supaya bisa membantu kaki yang lemah.","why":"Tongkat harus dipegang di sisi yang kuat. Saat berjalan, tongkat dan kaki yang lemah maju bersama-sama."},{"q":"Jika saat berolahraga tiba-tiba nyeri dada atau pusing, olahraga harus segera dihentikan.","why":"Jika ada nyeri dada, pusing, keluar keringat dingin, atau napas sangat terengah-engah, segera hentikan olahraga. Jika setelah istirahat beberapa menit tidak membaik, atau tangan dan kaki tiba-tiba lebih lemah, telepon 119."},{"q":"Setelah latihan memungut kancing atau balok mainan, barang itu boleh ditinggal di dekat pasien supaya bisa dipakai latihan kapan saja.","why":"Barang kecil harus disimpan setelah latihan, supaya tidak tertelan pasien."},{"q":"Saat memiringkan badan pasien, boleh menarik lengan yang lemah untuk membawa badannya.","why":"Menarik lengan yang lemah bisa melukai bahu. Topang bahu dan bokong dulu, lalu miringkan bersamaan."},{"q":"Jika pasien tersedak saat makan tetapi masih bisa batuk dan bicara, punggungnya harus ditepuk dengan kuat.","why":"Jika masih bisa batuk, condongkan badan pasien ke depan dan biarkan pasien batuk sekuat tenaga sendiri. Jangan menepuk punggung. Baru jika batuk tidak bersuara, tidak bisa bicara, atau tidak bisa bernapas, telepon 119, lalu bergantian tepuk punggung dan tekan perut."},{"q":"Jika tekanan darah terasa agak tinggi, boleh minum 1 tablet obat tekanan darah tambahan sendiri.","why":"Jangan menambah, mengurangi, atau menghentikan obat sendiri. Tekanan darah harus sesuai target dokter, tetapi makin rendah belum tentu makin baik. Jika ada masalah, tanya dokter."},{"q":"Jika satu kaki pasien tiba-tiba bengkak dan sakit, kaki itu harus dipijat dengan kuat supaya bengkaknya hilang.","why":"Ini mungkin tanda bahaya gumpalan darah. Jangan dipijat. Pergi ke dokter pada hari yang sama. Jika tiba-tiba nyeri dada atau sangat sesak napas, segera telepon 119."},{"q":"Saat berbaring atau lama duduk, sering melakukan latihan pergelangan kaki (ujung kaki ditarik ke atas, lalu ditekan ke bawah) bisa membantu mencegah gumpalan darah di kaki.","why":"Latihan pergelangan kaki membuat darah di kaki mengalir, jadi membantu mencegah gumpalan darah. Kaki yang lemah boleh dibantu digerakkan oleh keluarga."},{"q":"Jika otot tangan atau kaki pasien sangat kaku, lebih baik diluruskan dengan paksa.","why":"Meluruskan dengan paksa bisa mencederai otot atau sendi. Regangkan pelan-pelan, tahan sebentar, lalu lepaskan. Jika nyeri, berhenti."},{"q":"Makin banyak latihan rehabilitasi makin baik, jadi boleh menggandakan latihan sendiri.","why":"Jumlah dan intensitas latihan harus cukup supaya ada hasil, tetapi terapis yang mengaturnya sesuai keadaan pasien dan menambahnya pelan-pelan. Jika tiba-tiba menggandakan latihan sendiri, pasien mudah terlalu lelah atau cedera."},{"q":"Jika sisi yang terkena stroke kurang bisa merasa, kompres hangat atau penghangat tempel mudah menyebabkan luka bakar.","why":"Jika rasa berkurang, pasien tidak peka terhadap panas dan dingin, dan mungkin tidak sadar sudah terbakar. Tanyakan terapis dulu sebelum memakainya."},{"q":"Orang yang jarinya sangat kaku dan kepalan tangannya tidak bisa dibuka harus berlatih meremas bola dengan kuat sepanjang hari.","why":"Jika jari sangat kaku, hanya berlatih menggenggam dengan kuat belum tentu cocok, dan jangan berlatih terlalu lama sekaligus. Luruskan jari pelan-pelan dulu, lebih banyak latih membuka tangan, dan tanyakan latihan yang cocok kepada terapis."},{"q":"Setelah stroke, kaki sudah bisa berjalan tetapi tangan pulih lebih lambat. Artinya tangan tidak ada harapan, jadi cukup berlatih berjalan saja.","why":"Tangan pulih lebih lambat adalah hal yang umum. Jika tangan tidak dilatih, gerakan kecil sulit pulih. Latih tangan juga setiap hari."},{"q":"Pasien makan beberapa suap tanpa tersedak, artinya menelan sudah aman dan tidak perlu dinilai.","why":"Ada orang yang tidak batuk walaupun makanan atau air masuk ke saluran napas (aspirasi diam). Aman atau tidaknya menelan harus dinilai oleh terapis wicara."},{"q":"Untuk mencegah otot pergelangan tangan dan jari menjadi kaku (spastisitas), keluarga boleh membeli sendiri bidai (splint) atau plester (taping) untuk dipakai pasien.","why":"Bidai atau plester tidak disarankan untuk mencegah otot pergelangan tangan dan jari menjadi kaku. Perlu memakai bidai atau tidak, dan cara memakainya, dinilai dan diajarkan oleh terapis."}],"res":{"ui":{"tab":"Layanan","title":"Layanan bantuan di Kota Taipei","intro":"Bantuan untuk pasien stroke dan keluarga: makanan, pakaian, tempat tinggal, transportasi, medis, perawatan jangka panjang, dan bantuan uang. Buka setiap layanan untuk melihat cara mendaftar dan nomor telepon.","searchLabel":"Cari","searchPh":"Ketik kata kunci, misalnya: antar makanan, kursi roda, Songshan","catLabel":"Kategori","catAll":"Semua kategori","count":"Ada {n} layanan","none":"Layanan tidak ditemukan. Coba kata kunci lain, atau pilih \"Semua kategori\".","clear":"Hapus","who":"Siapa yang bisa memakai","how":"Cara mendaftar","phone":"Telepon","ext":"ekst.","web":"Situs resmi","note":"Perhatian","zhName":"Nama dalam bahasa Mandarin","tip1999":"1999 adalah hotline warga Kota Taipei. Di Kota Taipei, nomor ini bisa ditelepon dari telepon rumah atau HP. Dari luar Kota Taipei, teleponlah 02-2720-8889.","checked":"Data diperiksa pada tanggal 14-10-115 kalender Taiwan (14 Oktober 2026). Isi layanan dan jumlah uang bisa berubah. Sebelum mendaftar, silakan telepon dulu untuk memastikan.","homeCard":"Layanan bantuan di Kota Taipei","homeCardSub":"Antar makanan, alat bantu, antar-jemput, perawatan jangka panjang, bantuan uang"},"cats":{"medical":"Medis","care":"Perawatan jangka panjang","food":"Makanan","clothing":"Pakaian & alat bantu","housing":"Tempat tinggal","transport":"Transportasi","money":"Bantuan keuangan","caregiver":"Dukungan pendamping"},"order":["medical","care","food","clothing","housing","transport","money","caregiver"],"items":[{"id":"er119","cats":["medical"],"name":"Curiga stroke: segera telepon 119","agency":"Dinas Pemadam Kebakaran Pemerintah Kota Taipei; Kementerian Kesehatan dan Kesejahteraan Taiwan","what":"Jika tiba-tiba mulut miring, tangan dan kaki di satu sisi lemah, atau bicara tidak jelas, segera telepon 119. Petugas ambulans akan membawa pasien ke rumah sakit yang bisa menangani stroke akut.","who":"Semua orang.","how":"Telepon 119. Sebutkan dengan jelas alamat, gejala, dan jam gejala mulai muncul. Jangan membawa pasien ke rumah sakit sendiri dengan mobil atau motor. Jika ingin tahu dulu rumah sakit gawat darurat yang bertanggung jawab di Kota Taipei, lihat daftar yang diumumkan Kementerian Kesehatan dan Kesejahteraan.","note":"","tels":[{"label":"Ambulans gawat darurat","tel":"119","ext":"","addr":""}],"url":"https://www.mohw.gov.tw/dl-97025-23d029a4-14c2-4ae9-a057-7a32d3885839.html"},{"id":"pac","cats":["medical"],"name":"Perawatan terpadu pasca-akut untuk stroke (PAC)","agency":"Badan Asuransi Kesehatan Nasional, Kementerian Kesehatan dan Kesejahteraan Taiwan","what":"Setelah kondisi stroke stabil, pasien menjalani rehabilitasi intensif selama waktu tertentu di rumah sakit yang bekerja sama. Ada tiga model: rawat inap, perawatan siang hari, dan di rumah.","who":"Pasien dalam 1 bulan setelah serangan stroke akut, dengan gangguan fungsi tingkat sedang sampai sedang-berat, kondisi stabil, dan punya potensi untuk rehabilitasi. Penilaian dilakukan oleh tim medis.","how":"Saat masih dirawat inap, mintalah tim medis atau tim persiapan pulang untuk menilai dan membantu merujuk. Rumah sakit yang melayani program ini bisa dicari di situs Badan Asuransi Kesehatan Nasional. Lama perawatan pada prinsipnya 3–6 minggu, paling lama 12 minggu.","note":"","tels":[{"label":"Saluran konsultasi Asuransi Kesehatan Nasional","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-5499-734a5-2898-1.html"},{"id":"catastrophic","cats":["medical","money"],"name":"Penyakit berat dan cedera serius (penyakit pembuluh darah otak akut)","agency":"Badan Asuransi Kesehatan Nasional, Kementerian Kesehatan dan Kesejahteraan Taiwan","what":"Stroke akut termasuk \"penyakit berat dan cedera serius\". Dalam 1 bulan setelah serangan, pengobatan yang berhubungan dengan stroke bebas dari biaya bagian sendiri (co-payment) asuransi kesehatan.","who":"Pasien penyakit pembuluh darah otak akut. Berlaku dalam 1 bulan setelah serangan.","how":"Tidak perlu mendaftar sendiri. Dokter yang menetapkan. Jika pindah rumah sakit dalam 1 bulan, mintalah surat keterangan diagnosis yang mencantumkan tanggal diagnosis dari rumah sakit pertama, lalu bawa ke rumah sakit berikutnya.","note":"Jika setelah 1 bulan masih ada gejala sisa, Anda bisa mendaftar terpisah untuk sertifikat disabilitas atau layanan perawatan jangka panjang.","tels":[{"label":"Saluran konsultasi Asuransi Kesehatan Nasional","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-13699-f25bd-2957-1.html"},{"id":"homemed","cats":["medical"],"name":"Layanan medis di rumah (Program Terpadu Perawatan Medis di Rumah, Asuransi Kesehatan Nasional)","agency":"Badan Asuransi Kesehatan Nasional, Kementerian Kesehatan dan Kesejahteraan Taiwan","what":"Dokter, perawat, dan tenaga lain datang ke rumah untuk memeriksa, memberi obat, dan merawat. Untuk pasien yang sangat sulit keluar rumah untuk berobat.","who":"Orang yang tinggal di rumah, sangat sulit keluar untuk berobat karena tidak mampu mengurus diri sendiri atau karena penyakit, dan menurut penilaian dokter memang perlu layanan medis.","how":"Tanyakan ke rumah sakit atau klinik tempat pasien biasa berobat apakah ada layanan medis di rumah. Bisa juga minta rujukan dari Pusat Manajemen Perawatan Jangka Panjang, atau menelepon saluran konsultasi Asuransi Kesehatan Nasional.","note":"","tels":[{"label":"Saluran konsultasi Asuransi Kesehatan Nasional","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-5195-2e804-2875-1.html"},{"id":"disacert","cats":["medical","money"],"name":"Sertifikat disabilitas (penilaian disabilitas)","agency":"Dinas Sosial dan Dinas Kesehatan Pemerintah Kota Taipei; Kantor Distrik sesuai alamat domisili terdaftar","what":"Jika setelah stroke ada gangguan fungsi jangka panjang, Anda bisa mendaftar untuk penilaian. Setelah mendapat sertifikat disabilitas, barulah bisa mendaftar bantuan untuk penyandang disabilitas, bus Fukang (bus khusus penyandang disabilitas), kartu parkir, dan layanan lain.","who":"Orang yang mengalami gangguan fungsi jangka panjang setelah stroke. Penilaian dilakukan di rumah sakit yang ditunjuk.","how":"Bawa formulir pendaftaran, fotokopi KTP Taiwan, 3 lembar foto ukuran 1 inci yang dibuat dalam 3 bulan terakhir, dan stempel nama. Daftar di Kantor Distrik sesuai alamat domisili terdaftar, lalu jalani penilaian di rumah sakit yang ditunjuk. Pasien yang terbaring di tempat tidur dan tidak bisa keluar rumah bisa minta penilaian di rumah.","note":"Kapan waktu yang tepat untuk mendaftar, silakan tanya dokter yang merawat.","tels":[{"label":"Dinas Sosial, Bagian Kesejahteraan Penyandang Disabilitas","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=26BB4C5F2992FAFB"},{"id":"ltc1966","cats":["care"],"name":"Saluran telepon perawatan jangka panjang 1966 / Pusat Manajemen Perawatan Jangka Panjang Kota Taipei","agency":"Kementerian Kesehatan dan Kesejahteraan Taiwan; Dinas Kesehatan Kota Taipei","what":"Tempat utama untuk mendaftar layanan perawatan jangka panjang. Setelah mendaftar, petugas manajemen perawatan akan datang ke rumah untuk menilai, lalu menetapkan tingkat perawatan jangka panjang dan layanan yang bisa dipakai.","who":"Orang yang tinggal di Kota Taipei, perlu dirawat orang lain, dan memenuhi salah satu syarat ini: usia 65 tahun ke atas, orang asli (pribumi) Taiwan usia 55 tahun ke atas, punya sertifikat disabilitas, menderita demensia, atau pasien yang diterima dalam program PAC.","how":"Telepon 1966, atau daftar di situs informasi perawatan jangka panjang Kota Taipei. Jika pasien masih dirawat inap, bisa langsung menghubungi tim persiapan pulang di rumah sakit.","note":"","tels":[{"label":"Saluran telepon perawatan jangka panjang","tel":"1966","ext":"","addr":""},{"label":"Pusat Manajemen Perawatan Jangka Panjang Kota Taipei","tel":"02-2537-1099","ext":"","addr":"臺北市中山區錦州街233號1樓"},{"label":"Pusat Layanan Kesehatan Distrik Songshan (untuk bertanya di dekat rumah)","tel":"02-2767-1757","ext":"","addr":""}],"url":"https://ltc.health.gov.taipei/tplcPublic/"},{"id":"discharge","cats":["care"],"name":"Persiapan pulang dan sambungan ke layanan perawatan jangka panjang","agency":"Dinas Kesehatan Kota Taipei; Kementerian Kesehatan dan Kesejahteraan Taiwan","what":"Selama pasien dirawat inap, rumah sakit lebih dulu menyelesaikan penilaian perawatan jangka panjang dan mengatur layanannya. Setelah pasien pulang, bantuan seperti layanan di rumah, alat bantu, atau antar-jemput bisa segera dimulai.","who":"Pasien yang kemampuan hidup sehari-harinya menurun setelah dirawat inap dan perlu layanan perawatan jangka panjang setelah pulang.","how":"Saat dirawat inap, beri tahu manajer kasus persiapan pulang atau pekerja sosial di rumah sakit.","note":"","tels":[{"label":"Saluran telepon perawatan jangka panjang","tel":"1966","ext":"","addr":""}],"url":"https://health.gov.taipei/News_Content.aspx?n=BB5A41BA1E6CA260&sms=72544237BBE4C5F6&s=51A8504C99587CA7"},{"id":"homecare","cats":["care"],"name":"Layanan perawatan jangka panjang di rumah (petugas perawatan datang ke rumah)","agency":"Dinas Kesehatan dan Dinas Sosial Pemerintah Kota Taipei; Kementerian Kesehatan dan Kesejahteraan Taiwan","what":"Petugas perawatan datang ke rumah untuk membantu mandi, berpakaian, makan, minum obat, membalikkan badan, naik-turun tempat tidur, dan menemani berobat.","who":"Orang yang menurut penilaian Pusat Manajemen Perawatan Jangka Panjang berada di tingkat kebutuhan perawatan jangka panjang level 2 atau lebih.","how":"Telepon 1966 untuk mendaftar. Setelah penilaian, manajer kasus akan mengatur lembaga pemberi layanan.","note":"Pemerintah membayar sebagian besar biaya. Bagian yang dibayar sendiri tergantung keadaan ekonomi keluarga, sesuai keputusan Pusat Manajemen Perawatan Jangka Panjang. Keluarga yang sudah mempekerjakan perawat asing pada prinsipnya tidak bisa memakai layanan di rumah. Saat ada masa kosong, misalnya perawat asing pulang kampung atau sudah keluar dari Taiwan, layanan ini bisa dipakai jika ada bukti.","tels":[{"label":"Saluran telepon perawatan jangka panjang","tel":"1966","ext":"","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=D46C608F5B4E3D8D"},{"id":"daycare","cats":["care"],"name":"Perawatan siang hari jangka panjang (pusat perawatan siang)","agency":"Dinas Sosial dan Dinas Kesehatan Pemerintah Kota Taipei","what":"Pada siang hari pasien diantar ke pusat perawatan siang. Di sana ada yang merawat, ada makan siang, tidur siang, dan kegiatan. Sore hari pasien pulang.","who":"Pasien dengan tingkat kebutuhan perawatan jangka panjang level 2 atau lebih, dan juga: usia 65 tahun ke atas, punya sertifikat disabilitas, menderita demensia, orang asli (pribumi) Taiwan usia 55 tahun ke atas, atau diterima dalam program PAC.","how":"Telepon 1966 atau daftar di situs informasi perawatan jangka panjang Kota Taipei. Setelah penilaian, manajer kasus akan mencarikan pusat perawatan siang yang cocok.","note":"","tels":[{"label":"Saluran telepon perawatan jangka panjang","tel":"1966","ext":"","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=3E3C1D86A51BF473"},{"id":"reable","cats":["care"],"name":"Layanan profesional perawatan jangka panjang (pemulihan kemampuan di rumah)","agency":"Kementerian Kesehatan dan Kesejahteraan Taiwan; Pusat Manajemen Perawatan Jangka Panjang Kota Taipei","what":"Terapis, perawat, atau ahli gizi datang ke rumah. Dalam waktu singkat mereka mengajari pasien melakukan kegiatan sehari-hari sendiri, dan juga mengajari keluarga dan perawat asing cara merawat, misalnya cara memindahkan pasien, cara makan, dan keamanan di rumah.","who":"Pasien perawatan jangka panjang yang sudah dinilai oleh Pusat Manajemen Perawatan Jangka Panjang.","how":"Ajukan ke 1966 atau ke manajer kasus. Satu tujuan latihan yang sama pada prinsipnya diselesaikan dalam 6 bulan.","note":"","tels":[{"label":"Saluran telepon perawatan jangka panjang","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/cp-6451-70123-207.html"},{"id":"respite","cats":["care","caregiver"],"name":"Layanan pengganti sementara bagi pendamping (respite) perawatan jangka panjang","agency":"Kementerian Kesehatan dan Kesejahteraan Taiwan; Pusat Manajemen Perawatan Jangka Panjang Kota Taipei","what":"Agar keluarga atau perawat asing yang merawat pasien bisa beristirahat. Bisa minta petugas perawatan datang ke rumah, atau pasien tinggal sebentar di lembaga perawatan, atau pergi ke pusat perawatan siang pada siang hari.","who":"Tingkat kebutuhan perawatan jangka panjang level 2–8, dan di rumah ada pendamping. Keluarga yang sudah mempekerjakan perawat asing juga bisa memakai layanan ini.","how":"Telepon 1966 untuk mendaftar penilaian. Setelah itu manajer kasus akan mengatur layanannya.","note":"Jatah layanan yang bisa dipakai setiap tahun sesuai keputusan Pusat Manajemen Perawatan Jangka Panjang.","tels":[{"label":"Saluran telepon perawatan jangka panjang","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/np-6454-207.html"},{"id":"meals","cats":["food"],"name":"Layanan makanan bergizi untuk orang yang tidak mampu mengurus diri sendiri (antar makanan ke rumah)","agency":"Dinas Sosial Pemerintah Kota Taipei; Pusat Manajemen Perawatan Jangka Panjang Kota Taipei","what":"Orang yang tidak mampu mengurus diri sendiri dan tidak bisa membeli atau memasak makanan sendiri bisa mendapat makanan yang diantar ke rumah. Untuk keluarga berpenghasilan rendah dan keluarga berpenghasilan menengah ke bawah, pemerintah membantu biaya makanan.","who":"Lansia usia 65 tahun ke atas yang tidak mampu mengurus diri sendiri, orang asli (pribumi) Taiwan usia 55 tahun ke atas yang tidak mampu mengurus diri sendiri, penderita demensia, penyandang disabilitas yang tidak mampu mengurus diri, dan pasien program PAC. Jika sudah ada orang yang menyiapkan makanan atau ada yang merawat pada siang hari, mungkin tidak disetujui.","how":"Telepon 1966 atau daftar di situs informasi perawatan jangka panjang Kota Taipei. Pusat Manajemen Perawatan Jangka Panjang akan menilai.","note":"Untuk keluarga biasa, berapa yang harus dibayar sendiri untuk setiap kali makan, silakan tanya lewat telepon.","tels":[{"label":"Saluran telepon perawatan jangka panjang","tel":"1966","ext":"","addr":""},{"label":"Kontak layanan Dinas Sosial","tel":"1999","ext":"1669、1665","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=8AC319BAED528FB5"},{"id":"dining","cats":["food"],"name":"Pos layanan kepedulian komunitas (makan bersama)","agency":"Dinas Sosial Pemerintah Kota Taipei","what":"Pos di lingkungan sekitar rumah yang punya kegiatan makan bersama dan kelas kesehatan, supaya lansia keluar rumah dan makan bersama orang lain.","who":"Lansia usia 60 tahun ke atas. Jam dan biaya setiap pos berbeda.","how":"Cari pos dekat rumah yang menyediakan makanan di situs Dinas Sosial, lalu telepon langsung pos tersebut untuk bertanya.","note":"Apakah orang yang sulit bergerak bisa ikut, silakan tanya pos tersebut lebih dulu.","tels":[{"label":"Dinas Sosial, Bagian Kesejahteraan Lansia","tel":"1999","ext":"6966～6968","addr":""}],"url":"https://dosw.gov.taipei/News_Content.aspx?n=222C9779823FA161&sms=E2A8B6B533500CB0&s=10DED4DB1CD357DC"},{"id":"nutrition","cats":["food"],"name":"Pusat Promosi Gizi Komunitas Kota Taipei (konsultasi gizi)","agency":"Dinas Kesehatan Kota Taipei","what":"Konsultasi gratis satu lawan satu dengan ahli gizi, bisa datang langsung atau lewat video. Cocok untuk lansia yang sulit makan atau berat badannya terus turun.","who":"Lansia usia 65 tahun ke atas.","how":"Buat janji lewat telepon saluran janji temu, atau tambahkan akun LINE resmi lalu buat janji.","note":"Untuk masalah makanan karena sulit menelan, silakan tanya dulu terapis wicara atau ahli gizi di rumah sakit.","tels":[{"label":"Saluran janji temu konsultasi gizi","tel":"02-2303-1297","ext":"","addr":""}],"url":"https://health.gov.taipei/cp.aspx?n=DB71E3DF2CB595C4&s=CB031B7D0A1607E9"},{"id":"aidcenter","cats":["clothing"],"name":"Pusat Alat Bantu Kota Taipei","agency":"Dinas Sosial Pemerintah Kota Taipei (dijalankan oleh lembaga swasta atas tugas dari pemerintah)","what":"Menyediakan konsultasi alat bantu, penilaian, perbaikan, dan pinjaman alat bantu bekas untuk waktu singkat. Juga menerima pendaftaran bantuan biaya alat bantu.","who":"Penyandang disabilitas yang tinggal di Kota Taipei, orang yang memenuhi syarat perawatan jangka panjang, dan keluarganya.","how":"Telepon dulu untuk membuat janji penilaian atau peminjaman, lalu datang ke pusat dengan membawa kartu identitas.","note":"Jam buka setiap pusat berbeda. Sebelum berangkat, silakan telepon dulu untuk memastikan.","tels":[{"label":"Pusat Alat Bantu Wilayah Barat","tel":"02-2523-7902","ext":"","addr":"臺北市中山區長安西路5巷2號"},{"label":"Pusat Alat Bantu Wilayah Selatan","tel":"02-2720-7364","ext":"","addr":"臺北市信義區大道路116號3樓之2（廣慈衛福大樓）"},{"label":"Pusat Alat Bantu Heyi","tel":"02-7713-7760","ext":"","addr":"臺北市中山區玉門街1號（臺北悠活村）"}],"url":"https://tpap.taipei/app37/cognitionView/index"},{"id":"ltcaids","cats":["clothing","housing"],"name":"Alat bantu perawatan jangka panjang dan perbaikan rumah agar bebas hambatan","agency":"Kementerian Kesehatan dan Kesejahteraan Taiwan; Pusat Manajemen Perawatan Jangka Panjang Kota Taipei","what":"Program perawatan jangka panjang membantu biaya membeli atau menyewa alat bantu, misalnya kursi roda, alat bantu jalan, dan kasur angin. Juga membantu biaya memasang pegangan, jalan landai, dan perbaikan kamar mandi. Jatah bantuan diberikan sekali setiap 3 tahun.","who":"Orang dengan tingkat kebutuhan perawatan jangka panjang level 2 atau lebih, dan menurut penilaian memerlukan alat bantu. Keluarga yang sudah mempekerjakan perawat asing juga bisa memakai layanan ini.","how":"Telepon 1966 untuk mendaftar perawatan jangka panjang. Setelah penilaian, lakukan penilaian alat bantu di Pusat Alat Bantu, lalu beli atau sewa di toko rekanan perawatan jangka panjang. Anda hanya membayar bagian yang harus dibayar sendiri.","note":"Lakukan penilaian dulu, baru membeli. Jika membeli dulu baru mendaftar, mungkin tidak mendapat bantuan.","tels":[{"label":"Saluran telepon perawatan jangka panjang","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/np-6453-207.html"},{"id":"disaids","cats":["clothing","money"],"name":"Bantuan biaya alat bantu untuk penyandang disabilitas","agency":"Badan Urusan Sosial dan Keluarga, Kementerian Kesehatan dan Kesejahteraan Taiwan; Dinas Sosial Pemerintah Kota Taipei","what":"Orang yang punya sertifikat disabilitas dan membeli alat bantu bisa mendaftar bantuan biaya sesuai jenis barangnya. Ini program yang berbeda dari alat bantu perawatan jangka panjang.","who":"Orang yang punya sertifikat disabilitas dan memenuhi aturan untuk jenis barang tersebut.","how":"Daftar ke Pusat Alat Bantu atau Dinas Sosial. Untuk barang yang perlu penilaian, harus dinilai dan disetujui dulu, baru boleh dibeli.","note":"Apakah bisa mendaftar bersamaan dengan alat bantu perawatan jangka panjang, silakan tanya Pusat Alat Bantu.","tels":[{"label":"Dinas Sosial, Bagian Kesejahteraan Penyandang Disabilitas","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://laws.gov.taipei/law/LawSearch/LawExport/FL002581?type=0"},{"id":"residential","cats":["housing","money"],"name":"Bantuan biaya untuk penghuni lembaga perawatan berasrama","agency":"Kementerian Kesehatan dan Kesejahteraan Taiwan; Dinas Sosial dan Dinas Kesehatan Pemerintah Kota Taipei","what":"Orang yang tinggal di lembaga perawatan jangka panjang, panti perawatan (nursing home), atau lembaga berasrama untuk penyandang disabilitas bisa mendaftar bantuan biaya tinggal.","who":"Orang yang tinggal di lembaga yang memenuhi syarat, dan tingkat kebutuhan perawatan jangka panjangnya level 4 atau lebih, atau punya sertifikat disabilitas tingkat sedang atau lebih berat.","how":"Sesuai jenis lembaga tempat tinggalnya, daftar ke Dinas Sosial atau Dinas Kesehatan. Bisa telepon 1966 dulu untuk bertanya.","note":"","tels":[{"label":"Saluran telepon perawatan jangka panjang","tel":"1966","ext":"","addr":""},{"label":"Dinas Sosial, Bagian Kesejahteraan Lansia (lembaga kesejahteraan lansia)","tel":"1999","ext":"6966","addr":""},{"label":"Dinas Sosial, Bagian Kesejahteraan Penyandang Disabilitas (lembaga berasrama untuk penyandang disabilitas)","tel":"1999","ext":"6963","addr":""},{"label":"Dinas Kesehatan, Bagian Perawatan Jangka Panjang (panti perawatan, lembaga perawatan jangka panjang)","tel":"1999","ext":"1877","addr":""}],"url":"https://1966.gov.tw/LTC/cp-6457-69925-207.html"},{"id":"socialhousing","cats":["housing"],"name":"Rumah sosial Kota Taipei","agency":"Dinas Pembangunan Kota Pemerintah Kota Taipei; Pusat Perumahan dan Pembaruan Kota Taipei","what":"Saat rumah sosial dibuka untuk disewa, sebagian unit disediakan khusus untuk keluarga rentan. Sebagian rumah sosial juga punya unit bebas hambatan.","who":"Keluarga yang memenuhi syarat menyewa rumah sosial. Keluarga rentan, seperti penyandang disabilitas dan lansia usia 65 tahun ke atas, bisa mendaftar untuk unit yang disediakan khusus.","how":"Perhatikan pengumuman penyewaan dari Dinas Pembangunan Kota atau Pusat Perumahan dan Pembaruan Kota. Daftar dalam masa pendaftaran, lalu urutan ditentukan dengan undian terbuka.","note":"Jumlah unit khusus dan syaratnya berbeda untuk setiap proyek. Ikuti pengumuman penyewaan.","tels":[{"label":"Hotline warga Kota Taipei","tel":"1999","ext":"","addr":""}],"url":"https://udd.gov.taipei/"},{"id":"rehabbus","cats":["transport"],"name":"Bus Fukang Kota Taipei (bus khusus disabilitas)","agency":"Kantor Transportasi Umum, Dinas Perhubungan Pemerintah Kota Taipei","what":"Bus kecil bebas hambatan untuk penyandang disabilitas. Bisa naik bersama kursi roda. Dipakai untuk berobat atau bepergian.","who":"Orang yang punya sertifikat disabilitas Kota Taipei dan tinggal di Kota Taipei. Boleh membawa 1 orang pendamping.","how":"Pesan lewat saluran pemesanan atau lewat internet. Pesanan diterima setiap hari pukul 8:00–17:00. Pemesanan dibuka 3 sampai 5 hari sebelum hari naik bus.","note":"","tels":[{"label":"Saluran pemesanan","tel":"0809-080650","ext":"","addr":""},{"label":"Saluran pemesanan dengan suara otomatis","tel":"0800-065165","ext":"","addr":""}],"url":"https://0809080650.gov.taipei/"},{"id":"ltcride","cats":["transport","care"],"name":"Antar-jemput perawatan jangka panjang (antar-jemput berobat)","agency":"Dinas Sosial Pemerintah Kota Taipei","what":"Mobil dari program perawatan jangka panjang untuk mengantar-jemput orang yang tidak mampu mengurus diri sendiri antara rumah dan rumah sakit atau klinik, untuk berobat atau rehabilitasi.","who":"Orang yang tinggal di Kota Taipei dan menerima perawatan jangka panjang dengan tingkat kebutuhan level 2 atau lebih, termasuk pasien yang diterima dalam program PAC. Keluarga yang sudah mempekerjakan perawat asing juga bisa mendaftar.","how":"Telepon 1966 dulu untuk mendaftar perawatan jangka panjang. Setelah disetujui, pesan lewat internet atau LINE (@taipeicareride), paling lambat satu hari sebelum naik mobil.","note":"","tels":[{"label":"Saluran telepon perawatan jangka panjang","tel":"1966","ext":"","addr":""}],"url":"https://www.dosw.gov.taipei/cp.aspx?n=1847C5A001C1DC3C"},{"id":"wctaxi","cats":["transport"],"name":"Taksi universal (bisa membawa kursi roda)","agency":"Kantor Transportasi Umum, Dinas Perhubungan Pemerintah Kota Taipei","what":"Taksi dengan papan landai atau alat pengangkat. Orang yang duduk di kursi roda bisa langsung naik.","who":"Semua orang, terutama cocok untuk orang yang memakai kursi roda.","how":"Telepon saluran pemesanan taksi. Setelah tersambung, tekan 3, nanti dihubungkan ke armada taksi universal. Dari HP, teleponlah 55850.","note":"","tels":[{"label":"Saluran pemesanan taksi gratis (telepon rumah)","tel":"0800-055850","ext":"","addr":""},{"label":"Pesan taksi dari HP","tel":"55850","ext":"","addr":""}],"url":"https://pto.gov.taipei/cp.aspx?n=00988479A42B11C4"},{"id":"seniortaxi","cats":["transport"],"name":"Taksi untuk lansia dan penyandang disabilitas","agency":"Kantor Transportasi Umum, Dinas Perhubungan Pemerintah Kota Taipei","what":"Naik taksi dengan Kartu Lansia atau Kartu Kasih (kartu untuk penyandang disabilitas) Kota Taipei. Setiap perjalanan bisa memotong sebagian ongkos.","who":"Pemilik Kartu Lansia atau Kartu Kasih Kota Taipei, untuk dirinya sendiri.","how":"Telepon saluran pemesanan taksi, lalu tekan 0, dan katakan ingin naik taksi untuk lansia dan penyandang disabilitas. Saat turun, bayar dengan menempelkan kartu. Dari HP, teleponlah 55850.","note":"","tels":[{"label":"Saluran pemesanan taksi gratis (telepon rumah)","tel":"0800-055850","ext":"","addr":""},{"label":"Pesan taksi dari HP","tel":"55850","ext":"","addr":""}],"url":"https://pto.gov.taipei/News.aspx?n=2C4297730779B67A&sms=49DFD0964E3C4294"},{"id":"easycard","cats":["transport"],"name":"Kartu Lansia, Kartu Kasih, dan Kartu Pendamping Kasih","agency":"Dinas Sosial Pemerintah Kota Taipei; semua Kantor Distrik","what":"Kartu potongan harga transportasi dari Kota Taipei untuk lansia dan penyandang disabilitas. Pendamping yang diperlukan oleh penyandang disabilitas bisa membuat Kartu Pendamping Kasih.","who":"Lansia atau penyandang disabilitas yang terdaftar sebagai penduduk dan tinggal di Kota Taipei. Kartu Pendamping Kasih diberikan kepada 1 orang pendamping yang diperlukan oleh penyandang disabilitas kategori pertama atau kategori kedua.","how":"Bawa formulir pendaftaran, foto, KTP
