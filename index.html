ease call to check before you apply.","homeCard":"Taipei support services","homeCardSub":"Meals, aids, rides, long-term care, financial help"},"cats":{"medical":"Medical","care":"Long-term care","food":"Food","clothing":"Clothing & aids","housing":"Housing","transport":"Transport","money":"Financial help","caregiver":"Caregiver support"},"order":["medical","care","food","clothing","housing","transport","money","caregiver"],"items":[{"id":"er119","cats":["medical"],"name":"Possible stroke: call 119 now","agency":"Taipei City Fire Department; Ministry of Health and Welfare","what":"If the mouth suddenly droops to one side, an arm or leg on one side is suddenly weak, or speech is suddenly unclear, call 119 right away. The ambulance team will take the patient to a hospital that can treat acute stroke.","who":"Everyone.","how":"Call 119. Clearly say the address, the symptoms and the time they started. Do not drive a car or ride a scooter to the hospital yourself. To see which hospitals in Taipei are emergency responsibility hospitals, look at the list published by the Ministry of Health and Welfare.","note":"","tels":[{"label":"Emergency ambulance","tel":"119","ext":"","addr":""}],"url":"https://www.mohw.gov.tw/dl-97025-23d029a4-14c2-4ae9-a057-7a32d3885839.html"},{"id":"pac","cats":["medical"],"name":"Post-acute care for stroke (PAC)","agency":"National Health Insurance Administration, Ministry of Health and Welfare","what":"After the stroke is stable, the patient gets intensive rehabilitation for a period of time at a partner hospital. There are three types: inpatient, day care and home-based.","who":"Patients within 1 month after an acute stroke who have moderate to moderately severe loss of function, are medically stable, and can still improve with rehabilitation. The medical team does the assessment.","how":"While in hospital, ask the medical team or the discharge planning team to assess the patient and help with the referral. You can find the hospitals that offer PAC on the National Health Insurance Administration website. Care usually lasts 3–6 weeks, and 12 weeks at most.","note":"","tels":[{"label":"NHI information hotline","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-5499-734a5-2898-1.html"},{"id":"catastrophic","cats":["medical","money"],"name":"Catastrophic illness status (acute cerebrovascular disease)","agency":"National Health Insurance Administration, Ministry of Health and Welfare","what":"Acute stroke counts as a catastrophic illness. Within 1 month after the stroke, you do not pay the NHI co-payment for medical care related to the stroke.","who":"Patients with acute cerebrovascular disease (stroke). It is valid for 1 month after the stroke.","how":"You do not need to apply. The doctor decides. If the patient moves to another hospital within 1 month, ask the first hospital for a medical certificate that shows the date of diagnosis, and take it to the next hospital.","note":"If problems remain after 1 month, you can apply separately for a disability certificate or for long-term care services.","tels":[{"label":"NHI information hotline","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-13699-f25bd-2957-1.html"},{"id":"homemed","cats":["medical"],"name":"Home medical care (NHI Integrated Home Health Care Program)","agency":"National Health Insurance Administration, Ministry of Health and Welfare","what":"Doctors, nurses and other staff come to the home to see the patient, prescribe medicine and give care. This is for patients who find it very hard to go out to see a doctor.","who":"People who live at home, find it very hard to go out for medical care because of disability or illness, and are assessed by a doctor as needing medical care.","how":"Ask the hospital or clinic the patient already goes to whether it offers home medical care. You can also ask the Long-term Care Management Center for a referral, or call the NHI information hotline.","note":"","tels":[{"label":"NHI information hotline","tel":"0800-030-598","ext":"","addr":""}],"url":"https://www.nhi.gov.tw/ch/cp-5195-2e804-2875-1.html"},{"id":"disacert","cats":["medical","money"],"name":"Disability certificate (disability assessment)","agency":"Department of Social Welfare and Department of Health, Taipei City Government; District Office where the household is registered","what":"If the stroke leaves a long-term loss of function, you can apply for an assessment. Only after you get a disability certificate can you apply for benefits such as disability subsidies, the Rehabus and a parking permit.","who":"People with a long-term loss of function after a stroke. The assessment is done at a designated hospital.","how":"Bring the application form, a copy of the ID card, 3 photos (1-inch size) taken in the last 3 months, and a personal seal (name stamp) to the District Office where the household is registered. Then go to a designated hospital for the assessment. People who are bedbound and cannot go out can apply for an assessment at home.","note":"Ask the attending doctor when is the right time to apply.","tels":[{"label":"Dept. of Social Welfare, Disability Welfare Division","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=26BB4C5F2992FAFB"},{"id":"ltc1966","cats":["care"],"name":"Long-term care hotline 1966 / Taipei City Long-term Care Management Center","agency":"Ministry of Health and Welfare; Department of Health, Taipei City Government","what":"The main place to apply for long-term care services. After you apply, a care manager visits the home to assess the patient, then decides the long-term care level and which services can be used.","who":"People who live in Taipei, need care from others, and meet one of these: age 65 or older, Indigenous people age 55 or older, have a disability certificate, have dementia, or are patients accepted into PAC.","how":"Call 1966, or apply on the Taipei City long-term care information website. If the patient is in hospital, you can go directly to the hospital's discharge planning team.","note":"","tels":[{"label":"Long-term care hotline","tel":"1966","ext":"","addr":""},{"label":"Taipei City Long-term Care Management Center","tel":"02-2537-1099","ext":"","addr":"臺北市中山區錦州街233號1樓"},{"label":"Songshan District Health Center (for local questions)","tel":"02-2767-1757","ext":"","addr":""}],"url":"https://ltc.health.gov.taipei/tplcPublic/"},{"id":"discharge","cats":["care"],"name":"Discharge planning linked to long-term care","agency":"Department of Health, Taipei City Government; Ministry of Health and Welfare","what":"While the patient is in hospital, the hospital first completes the long-term care assessment and arranges services. After the patient goes home, they can soon start using help such as home services, assistive devices or transport.","who":"Patients who can do fewer daily tasks than before after the hospital stay and need long-term care services at home.","how":"While in hospital, tell the hospital's discharge planning case manager or social worker.","note":"","tels":[{"label":"Long-term care hotline","tel":"1966","ext":"","addr":""}],"url":"https://health.gov.taipei/News_Content.aspx?n=BB5A41BA1E6CA260&sms=72544237BBE4C5F6&s=51A8504C99587CA7"},{"id":"homecare","cats":["care"],"name":"Long-term care home services (a care worker comes to the home)","agency":"Department of Health and Department of Social Welfare, Taipei City Government; Ministry of Health and Welfare","what":"A care worker comes to the home to help with bathing, dressing, eating, taking medicine, turning in bed, getting in and out of bed, and going with the patient to medical visits.","who":"People assessed by the Long-term Care Management Center as long-term care level 2 or higher.","how":"Call 1966 to apply. After the assessment, the case manager arranges a service provider.","note":"The government pays most of the cost. The share you pay depends on the family's financial situation, as decided by the Long-term Care Management Center. Families who already hire a foreign caregiver generally cannot use home services. During gaps, such as when the foreign caregiver goes home on leave or leaves Taiwan, the family can use them if they have proof.","tels":[{"label":"Long-term care hotline","tel":"1966","ext":"","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=D46C608F5B4E3D8D"},{"id":"daycare","cats":["care"],"name":"Long-term care day care (day care center)","agency":"Department of Social Welfare and Department of Health, Taipei City Government","what":"During the day, the patient goes to a day care center, where staff look after them. There is lunch, a rest time after lunch and activities. The patient goes home in the late afternoon.","who":"Long-term care level 2 or higher, and also one of these: age 65 or older, have a disability certificate, have dementia, Indigenous people age 55 or older, or patients accepted into PAC.","how":"Call 1966 or apply on the Taipei City long-term care information website. After the assessment, the case manager finds a matching day care center.","note":"","tels":[{"label":"Long-term care hotline","tel":"1966","ext":"","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=3E3C1D86A51BF473"},{"id":"reable","cats":["care"],"name":"Long-term care professional services (home reablement)","agency":"Ministry of Health and Welfare; Taipei City Long-term Care Management Center","what":"A therapist, nurse or dietitian comes to the home for a short period. They teach the patient to do daily tasks on their own, and teach family members and caregivers care skills, such as moving the patient (for example, from bed to chair), eating, and home safety.","who":"Long-term care clients assessed by the Long-term Care Management Center.","how":"Ask through 1966 or your case manager. Each training goal is usually completed within 6 months.","note":"","tels":[{"label":"Long-term care hotline","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/cp-6451-70123-207.html"},{"id":"respite","cats":["care","caregiver"],"name":"Long-term care respite services","agency":"Ministry of Health and Welfare; Taipei City Long-term Care Management Center","what":"Gives the family member or caregiver who looks after the patient a break. A care worker can come to the home, or the patient can stay in a care facility for a short time or go to a day care center during the day.","who":"Long-term care level 2–8, with a caregiver at home. Families who hire a foreign caregiver can also use it.","how":"Call 1966 to apply for an assessment. Then the case manager makes the arrangements.","note":"The amount you can use each year is decided by the Long-term Care Management Center.","tels":[{"label":"Long-term care hotline","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/np-6454-207.html"},{"id":"meals","cats":["food"],"name":"Meal service for people who need help with daily activities (home delivery)","agency":"Department of Social Welfare, Taipei City Government; Taipei City Long-term Care Management Center","what":"People who need help with daily activities and cannot buy or cook meals on their own can have meals delivered to the home. For low-income and middle-to-low-income households, the government helps pay for the meals.","who":"Older adults age 65 or older who need help with daily activities, Indigenous people age 55 or older who need help with daily activities, people with dementia, people with disabilities who need help with daily activities, and people receiving PAC. If someone already prepares meals, or someone looks after the person during the day, the service may not be approved.","how":"Call 1966 or apply on the Taipei City long-term care information website. The Long-term Care Management Center will do the assessment.","note":"For other families, call to ask how much you pay for each meal.","tels":[{"label":"Long-term care hotline","tel":"1966","ext":"","addr":""},{"label":"Department of Social Welfare contact","tel":"1999","ext":"1669、1665","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=8AC319BAED528FB5"},{"id":"dining","cats":["food"],"name":"Community care centers (shared meals)","agency":"Department of Social Welfare, Taipei City Government","what":"Places in the community with shared meals and health classes, so older people can go out and eat with others.","who":"Older adults age 60 or older. Times and fees are different at each center.","how":"On the Department of Social Welfare website, find a center near your home that serves meals, then call it directly.","note":"If the person has trouble moving around, ask the center first whether they can join.","tels":[{"label":"Dept. of Social Welfare, Senior Welfare Division","tel":"1999","ext":"6966～6968","addr":""}],"url":"https://dosw.gov.taipei/News_Content.aspx?n=222C9779823FA161&sms=E2A8B6B533500CB0&s=10DED4DB1CD357DC"},{"id":"nutrition","cats":["food"],"name":"Taipei City Community Nutrition Promotion Center (nutrition advice)","agency":"Department of Health, Taipei City Government","what":"Free one-to-one advice from a dietitian, in person or by video call. Good for older people who cannot eat enough or keep losing weight.","who":"Older adults age 65 or older.","how":"Call the booking line or add the official LINE account to book.","note":"For eating problems caused by trouble swallowing, ask the hospital's speech therapist or dietitian first.","tels":[{"label":"Nutrition advice booking line","tel":"02-2303-1297","ext":"","addr":""}],"url":"https://health.gov.taipei/cp.aspx?n=DB71E3DF2CB595C4&s=CB031B7D0A1607E9"},{"id":"aidcenter","cats":["clothing"],"name":"Taipei City Assistive Device Centers","agency":"Department of Social Welfare, Taipei City Government (run by private organizations under contract)","what":"Gives advice and assessments for assistive devices, repairs them, and lends used devices for a short time. The centers also accept applications for assistive device subsidies.","who":"People with disabilities and people eligible for long-term care who live in Taipei, and their families.","how":"First call to book an assessment or a loan, then bring your documents to the center.","note":"Each center has different opening hours. Call to check before you go.","tels":[{"label":"West District Assistive Device Center","tel":"02-2523-7902","ext":"","addr":"臺北市中山區長安西路5巷2號"},{"label":"South District Assistive Device Center","tel":"02-2720-7364","ext":"","addr":"臺北市信義區大道路116號3樓之2（廣慈衛福大樓）"},{"label":"Heyi Assistive Device Center","tel":"02-7713-7760","ext":"","addr":"臺北市中山區玉門街1號（臺北悠活村）"}],"url":"https://tpap.taipei/app37/cognitionView/index"},{"id":"ltcaids","cats":["clothing","housing"],"name":"Long-term care assistive devices and home accessibility improvements","agency":"Ministry of Health and Welfare; Taipei City Long-term Care Management Center","what":"Long-term care helps pay to buy or rent assistive devices, such as wheelchairs, walkers and air mattresses. It also helps pay for installing handrails and ramps and for bathroom improvements. The amount is given once every 3 years.","who":"People at long-term care level 2 or higher who are assessed as needing assistive devices. Families who hire a foreign caregiver can also use it.","how":"Call 1966 to apply for long-term care. After that assessment, go to an assistive device center for a device assessment. Then buy or rent from a long-term care contracted supplier and pay only your own share.","note":"Get the assessment first, then buy. If you buy first and apply later, you may not get the subsidy.","tels":[{"label":"Long-term care hotline","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/LTC/np-6453-207.html"},{"id":"disaids","cats":["clothing","money"],"name":"Assistive device subsidy for people with disabilities","agency":"Social and Family Affairs Administration, Ministry of Health and Welfare; Department of Social Welfare, Taipei City Government","what":"People with a disability certificate who buy assistive devices can apply for a subsidy, depending on the item. This is a different program from long-term care assistive devices.","who":"People with a disability certificate who meet the rules for the item.","how":"Apply at an assistive device center or the Department of Social Welfare. For items that need an assessment, you must be assessed and approved before you buy.","note":"Ask the assistive device center whether you can apply for this and for long-term care assistive devices at the same time.","tels":[{"label":"Dept. of Social Welfare, Disability Welfare Division","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://laws.gov.taipei/law/LawSearch/LawExport/FL002581?type=0"},{"id":"residential","cats":["housing","money"],"name":"Subsidy for people living in residential care facilities","agency":"Ministry of Health and Welfare; Department of Social Welfare and Department of Health, Taipei City Government","what":"People living in a long-term care facility, a nursing home or a residential facility for people with disabilities can apply for a subsidy for the cost of living there.","who":"People who live in an eligible facility and are at long-term care level 4 or higher, or have a disability certificate at the moderate level or higher.","how":"Apply to the Department of Social Welfare or the Department of Health, depending on the type of facility. You can call 1966 first to ask.","note":"","tels":[{"label":"Long-term care hotline","tel":"1966","ext":"","addr":""},{"label":"Dept. of Social Welfare, Senior Welfare Division (senior care facilities)","tel":"1999","ext":"6966","addr":""},{"label":"Dept. of Social Welfare, Disability Welfare Division (residential facilities for people with disabilities)","tel":"1999","ext":"6963","addr":""},{"label":"Dept. of Health, Long-term Care Division (nursing homes, long-term care facilities)","tel":"1999","ext":"1877","addr":""}],"url":"https://1966.gov.tw/LTC/cp-6457-69925-207.html"},{"id":"socialhousing","cats":["housing"],"name":"Taipei City social housing","agency":"Department of Urban Development, Taipei City Government; Taipei Housing and Urban Regeneration Center","what":"When social housing opens for rent, some units are kept for disadvantaged families. Some social housing also has accessible units.","who":"Families that meet the rules to rent social housing. Disadvantaged families, such as people with disabilities or older adults age 65 or older, can apply for the units kept for them.","how":"Watch for rental announcements from the Department of Urban Development or the Taipei Housing and Urban Regeneration Center. Apply during the application period. The order is then decided by a public lottery.","note":"The number of units kept and the conditions are different for each project. The rental announcement has the final rules.","tels":[{"label":"Taipei City hotline","tel":"1999","ext":"","addr":""}],"url":"https://udd.gov.taipei/"},{"id":"rehabbus","cats":["transport"],"name":"Taipei City Rehabus (accessible minibus)","agency":"Public Transportation Office, Department of Transportation, Taipei City Government","what":"Accessible minibuses for people with disabilities. You can get on while sitting in your wheelchair. Use it for medical visits or for going out.","who":"People who have a Taipei City disability certificate and live in Taipei. 1 companion can ride along.","how":"Call the booking line or book online. Bookings are taken every day from 8:00 to 17:00, starting 3 to 5 days before the ride.","note":"","tels":[{"label":"Booking line","tel":"0809-080650","ext":"","addr":""},{"label":"Voice booking line","tel":"0800-065165","ext":"","addr":""}],"url":"https://0809080650.gov.taipei/"},{"id":"ltcride","cats":["transport","care"],"name":"Long-term care transport (rides to medical visits)","agency":"Department of Social Welfare, Taipei City Government","what":"Long-term care vehicles that take people who need help with daily activities between home and a hospital or clinic, for medical visits or rehabilitation.","who":"Long-term care clients who live in Taipei and are at long-term care level 2 or higher, including patients accepted into PAC. Families who hire a foreign caregiver can also apply.","how":"First call 1966 to apply for long-term care. After approval, book online or on LINE (@taipeicareride) no later than the day before the ride.","note":"","tels":[{"label":"Long-term care hotline","tel":"1966","ext":"","addr":""}],"url":"https://www.dosw.gov.taipei/cp.aspx?n=1847C5A001C1DC3C"},{"id":"wctaxi","cats":["transport"],"name":"Universal taxi (takes wheelchairs)","agency":"Public Transportation Office, Department of Transportation, Taipei City Government","what":"Taxis with a ramp or a lift, so people can get in while sitting in a wheelchair.","who":"Everyone. Especially good for wheelchair users.","how":"Call the taxi booking line. After it connects, press 3 to be transferred to the universal taxi fleet. From a mobile phone, call 55850.","note":"","tels":[{"label":"Free taxi booking line (landline)","tel":"0800-055850","ext":"","addr":""},{"label":"Taxi booking from a mobile phone","tel":"55850","ext":"","addr":""}],"url":"https://pto.gov.taipei/cp.aspx?n=00988479A42B11C4"},{"id":"seniortaxi","cats":["transport"],"name":"Senior Card and Disability Card taxi","agency":"Public Transportation Office, Department of Transportation, Taipei City Government","what":"Use a Taipei City Senior Card or Disability Card to take a taxi. Part of the fare is covered on each ride.","who":"Only the person who holds the Taipei City Senior Card or Disability Card.","how":"Call the taxi booking line, press 0, and say you want a Senior Card and Disability Card taxi. Tap your card to pay when you get out. From a mobile phone, call 55850.","note":"","tels":[{"label":"Free taxi booking line (landline)","tel":"0800-055850","ext":"","addr":""},{"label":"Taxi booking from a mobile phone","tel":"55850","ext":"","addr":""}],"url":"https://pto.gov.taipei/News.aspx?n=2C4297730779B67A&sms=49DFD0964E3C4294"},{"id":"easycard","cats":["transport"],"name":"Senior Card, Disability Card and Companion Card","agency":"Department of Social Welfare, Taipei City Government; District Offices","what":"Travel discount cards that Taipei City gives to older adults and people with disabilities. The necessary companion of a person with a disability can get a Companion Card.","who":"Older adults or people with disabilities who are registered residents of Taipei and live in Taipei. The Companion Card is for 1 necessary companion of a person with a Category 1 or Category 2 disability.","how":"Bring the application form, a photo, and the ID card or disability certificate to any District Office. Someone else can apply for you.","note":"","tels":[{"label":"Department of Social Welfare","tel":"1999","ext":"6966～6968","addr":""}],"url":"https://laws.gov.taipei/law/LawSearch/LawExport/FL038239?type=0"},{"id":"parking","cats":["transport"],"name":"Parking permit for people with disabilities","agency":"Department of Social Welfare, Taipei City Government","what":"A permit that lets you park in parking spaces for people with disabilities. When you park, put it behind the front windshield.","who":"People with disabilities who are registered residents of Taipei and are assessed as having trouble moving around. A family member can apply for them. Only one permit per person.","how":"Apply at the Taipei City Hall Joint Service Center, online through the Taipei City online service website (service.taipei), or by mail.","note":"","tels":[{"label":"Dept. of Social Welfare, Disability Welfare Division","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://www.dosw.gov.taipei/cp.aspx?n=411918B6262745BE"},{"id":"disallow","cats":["money"],"name":"Living allowance for people with disabilities","agency":"Department of Social Welfare, Taipei City Government; District Office where the household is registered","what":"People with disabilities whose families have limited money can get a living allowance every month.","who":"People who are registered residents of Taipei and live in Taipei, have a disability certificate, and whose family income and assets are below the set limits.","how":"Bring the ID card, the application form, and a copy of the bank passbook cover to the Social Affairs Section of the District Office where the household is registered.","note":"You must have a disability certificate first. The income and asset limits change every year. Please call to check.","tels":[{"label":"Dept. of Social Welfare, Disability Welfare Division","tel":"1999","ext":"1358、1617、6964","addr":""}],"url":"https://dosw.gov.taipei/News_Content.aspx?n=91F35523B74F69AC&s=8D79133341A528E3"},{"id":"carerallow","cats":["money","caregiver"],"name":"Special care allowance for middle-to-low-income older adults","agency":"Department of Social Welfare, Taipei City Government; District Senior Service Centers","what":"If a family member stays home to care full-time for an older person with severe disability, and cannot work because of this, they can get a care allowance every month.","who":"The older person receives the middle-to-low-income senior living allowance, has severe or very severe disability, is cared for by a family member, and does not have a hired caregiver, home services or day care.","how":"Call the senior service center in the district where you live. They will help you apply.","note":"Eligibility and amounts may change. Please call to check before you apply.","tels":[{"label":"Songshan Senior Service Center","tel":"02-2768-5636","ext":"","addr":""},{"label":"Xinyi Senior Service Center","tel":"02-8787-0300","ext":"","addr":""},{"label":"Da'an Senior Service Center","tel":"02-2708-6255","ext":"","addr":""},{"label":"Zhongshan Senior Housing and Service Center","tel":"02-2542-0006","ext":"","addr":""},{"label":"Neihu Senior Service Center","tel":"02-2632-5560","ext":"","addr":""},{"label":"Nangang Senior Service Center","tel":"02-2653-5311","ext":"","addr":""},{"label":"Zhongzheng Senior Service Center","tel":"02-2381-4571","ext":"","addr":""},{"label":"Datong Senior Service Center","tel":"02-2592-9808","ext":"","addr":""},{"label":"Wanhua Senior Service Center","tel":"02-2361-0666","ext":"","addr":""},{"label":"Wenshan Senior Service Center","tel":"02-2234-4893","ext":"","addr":""},{"label":"Shilin Senior Service Center","tel":"02-2838-1571","ext":"","addr":""},{"label":"Beitou Senior Service Center","tel":"02-2892-9702","ext":"","addr":""}],"url":"https://elders.gov.taipei/News_Content.aspx?n=40A74DAD56B74FC0&sms=21884AF41A49B03F&s=451E3C675205415B"},{"id":"hospcarer","cats":["money"],"name":"Subsidy for a hired caregiver during a hospital stay","agency":"Department of Social Welfare, Taipei City Government","what":"Taipei residents with financial difficulties who are in hospital because of a sudden serious illness can apply for help with the cost of hiring a caregiver.","who":"Low-income households in Taipei, people eligible for the middle-to-low-income senior living allowance, or people the Department of Social Welfare is already helping (its open cases).","how":"While in hospital, first ask the hospital social worker, or call the Department of Social Welfare.","note":"Call to check the subsidy amount and the number of days.","tels":[{"label":"Dept. of Social Welfare, Social Work Division","tel":"02-2720-8889","ext":"1633","addr":""}],"url":"https://elders.gov.taipei/News_Content.aspx?n=40A74DAD56B74FC0&sms=21884AF41A49B03F&s=46DFDD2811FCC6DD"},{"id":"relief","cats":["money"],"name":"Emergency assistance","agency":"Department of Social Welfare, Taipei City Government; Social Welfare Service Centers, District Offices","what":"When a family member suddenly becomes seriously ill or injured and the family suddenly cannot get by, you can apply for a one-time payment.","who":"Registered residents of Taipei who, in the last 3 months, had a family member become seriously ill or injured, or whose main earner can no longer work, or a similar situation.","how":"Bring the proof documents to a Social Welfare Service Center or the District Office where the household is registered.","note":"","tels":[{"label":"Dept. of Social Welfare, Social Assistance Division","tel":"1999","ext":"1609","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=0BF751F1B9F07AA1"},{"id":"relief2","cats":["money"],"name":"Emergency relief (formerly \"Immediate Care\")","agency":"Department of Social Welfare, Taipei City Government; District Offices","what":"If a family member is seriously injured or ill, needs treatment for 1 month or more and cannot work, or someone lost their job to care for a family member, the family can get relief money quickly.","who":"Families who had one of the problems above in the last 3 months. Generally, you can apply only once for the same event.","how":"Apply at the District Office.","note":"","tels":[{"label":"Dept. of Social Welfare, Social Assistance Division","tel":"1999","ext":"1609","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=7011FE50261D43B5"},{"id":"carersupport","cats":["caregiver"],"name":"Family caregiver support centers and caregiver helpline","agency":"Department of Social Welfare, Taipei City Government; Ministry of Health and Welfare","what":"A place to turn to when caregivers are tired or do not know how to give care: care skills classes, stress relief activities, support groups and counseling. Temporary care for the patient can be arranged while you attend classes.","who":"Caregivers in long-term care families and in families of people with disabilities. Family members in homes with a foreign caregiver can also use it.","how":"Call the center for the district where you live. If you want to talk about caregiving stress first, call the helpline.","note":"","tels":[{"label":"Family caregiver helpline (nationwide)","tel":"0800-507272","ext":"","addr":""},{"label":"Center for Zhongshan, Songshan and Nangang districts","tel":"02-7703-1972","ext":"","addr":"臺北市中山區建國北路二段129號7樓"},{"label":"Center for Xinyi District","tel":"02-2578-0285","ext":"217、218","addr":""},{"label":"Center for Da'an District","tel":"02-2367-6646","ext":"8536、8721","addr":""},{"label":"Center for Zhongzheng and Neihu districts","tel":"02-2311-4678","ext":"","addr":""},{"label":"Center for Wenshan District","tel":"02-2234-2199","ext":"","addr":""},{"label":"Center for Wanhua and Datong districts (long-term care families)","tel":"02-2308-5739","ext":"","addr":""},{"label":"Center for Datong District (families of people with disabilities)","tel":"02-2550-6658","ext":"","addr":""},{"label":"Center for Beitou and Shilin districts","tel":"02-2838-1571","ext":"214","addr":""}],"url":"https://dosw.gov.taipei/cp.aspx?n=70898293C7B4ABE5"},{"id":"foreignhire","cats":["caregiver"],"name":"Hiring a foreign caregiver and the 1955 hotline","agency":"Workforce Development Agency, Ministry of Labor; Taipei City Long-term Care Management Center","what":"If you want to hire a foreign caregiver, first check that the patient is eligible. Employers and foreign caregivers can both call 1955 with any problem. It is free, open 24 hours, and has service in many languages.","who":"The patient is assessed by a designated hospital as needing full-day care, or meets certain conditions, such as certain disabilities. People age 80 or older do not need the medical assessment.","how":"After the assessment at a designated hospital, send the documents to the Taipei City Long-term Care Management Center. Then apply to the Ministry of Labor by following the process.","note":"1955 has service in many languages, including Indonesian, Vietnamese and Thai.","tels":[{"label":"1955 Labor Consultation and Complaint Hotline (24 hours)","tel":"1955","ext":"","addr":""},{"label":"Direct Hiring Service Center","tel":"02-6613-0811","ext":"","addr":""}],"url":"https://dhsc.wda.gov.tw/Industry?MenuId=fea6ae19-627e-4418-8662-bc2b2e85977d"},{"id":"foreignltc","cats":["caregiver","care"],"name":"Long-term care services for families with a foreign caregiver","agency":"Ministry of Health and Welfare; Taipei City Long-term Care Management Center","what":"Families with a foreign caregiver can also use professional services, transport, assistive devices, home accessibility improvements and respite services. When the foreign caregiver is on leave, you can apply for respite services.","who":"The family has a foreign caregiver, and the patient is at long-term care level 2 or higher. During gaps, such as when the foreign caregiver goes home on leave or leaves Taiwan, the family can use all long-term care services if they have proof.","how":"Call 1966 and ask the Long-term Care Management Center to come to the home for an assessment.","note":"","tels":[{"label":"Long-term care hotline","tel":"1966","ext":"","addr":""}],"url":"https://1966.gov.tw/Ltc/cp-6460-69943-207.html"}]}},"id":{"code":"id","name":"Indonesia","htmlLang":"id","speech":"id-ID","locale":"id-ID","glyph":"A","rangeWord":" sampai ","say":[["119","satu satu sembilan"],["1966","satu sembilan enam enam"],["722","tujuh dua dua"]],"ui":{"brand":"Edukasi Stroke PAC","trial":"Versi uji coba","tabHome":"Beranda","tabLearn":"Materi","tabCheck":"Daftar","tabQuiz":"Kuis","homeTitle":"Masa emas rehabilitasi setelah stroke","homeIntro":"Edukasi perawatan pasca-akut untuk pasien dan keluarga. Setiap materi sekitar 3 menit. Bisa dibaca, bisa juga didengarkan.","todayTitle":"Daftar perawatan hari ini","todayDone":"Selesai {n} / {m} hal","unitsHeading":"Materi edukasi","aboutTitle":"Tentang materi edukasi ini","about":["Ini versi uji coba. Sebelum diluncurkan, isinya harus diperiksa oleh tim medis.","Isinya adalah penjelasan umum. Keadaan setiap pasien berbeda. Ikutilah petunjuk dokter penanggung jawab dan tim perawatan.","Catatan centang hanya disimpan di perangkat ini. Catatan tidak diunggah. Nama dan data rekam medis juga tidak dicatat.","Terjemahan ini masih berupa d esejahteraan Taiwan, serta pengumuman Pemerintah Kota Taipei dan instansi terkait: sumber daya perawatan jangka panjang dan layanan ramah","MedicoNotes, gambar penjelasan \"Stroke localization\" (merujuk buku teks seperti Adams' Principles of Neurology): hubungan pembuluh darah dan gejala","Detail perawatan lain, misalnya jarak waktu membalik badan, hal yang perlu diperhatikan saat minum obat, dan menepuk punggung, ditulis sesuai kebiasaan perawatan umum di Taiwan. Sebelum diluncurkan, isinya harus diperiksa oleh tim medis rumah sakit."],"srcNote":"Pedoman ini adalah saran untuk tenaga kesehatan. Keadaan setiap pasien berbeda. Untuk pengobatan yang sebenarnya, ikutilah petunjuk dokter penanggung jawab dan tim perawatan.","unitSrcLabel":"Bab pedoman yang menjadi dasar materi ini","unitSrcOther":"Sebagian isi materi ini juga merujuk pada sistem di Taiwan atau pedoman lain.","srcGo":"Lihat sumber","secs":{"2.1":"Organisasi dan tingkat layanan perawatan rehabilitasi setelah stroke","2.2":"Rehabilitasi selama rawat inap fase akut","3.1":"Mencegah kerusakan kulit dan kekakuan sendi","3.2":"Mencegah bekuan darah di pembuluh vena","3.3":"Pengobatan gangguan buang air kecil dan besar","3.4":"Penilaian, pencegahan, dan pengobatan nyeri bahu pada sisi yang lemah","3.5":"Nyeri saraf pusat setelah stroke","3.6":"Mencegah jatuh","3.7":"Penilaian kesehatan jiwa dan penanganan depresi serta kecemasan setelah stroke (termasuk emosi dan perilaku)","3.8":"Tulang keropos (osteoporosis) setelah stroke","3.9":"Tidur dan kelelahan setelah stroke","4.1":"Penilaian disabilitas dan kebutuhan rehabilitasi","4.2":"Penilaian gangguan gerak, aktivitas, dan kemampuan berpindah","4.4":"Penilaian kemampuan berpikir (kognitif) dan persepsi","4.5":"Penilaian indra (rasa raba, penglihatan, pendengaran)","5.1":"Aktivitas fisik","5.3":"Penanganan otot kaku (spastisitas)","5.4":"Keseimbangan dan gerakan tidak terkoordinasi (ataksia)","5.5":"Cara berjalan dan kemampuan berpindah","5.6":"Aktivitas lengan dan tangan (termasuk kegiatan sehari-hari, rasa raba, dan rasa posisi tubuh)","5.7":"Alat bantu, alat kesehatan, penyangga (ortosis), dan kursi roda","5.8":"Perubahan dan pengelolaan gaya hidup","5.9":"Pengobatan gangguan penglihatan","5.10":"Pemeriksaan menelan, penanganan, dan gizi","6.1":"Pengobatan tanpa obat untuk gangguan berpikir (termasuk ingatan)","6.2":"Gangguan komunikasi yang didapat (misalnya afasia)","6.3":"Gangguan gerak bicara: disartria dan apraksia bicara","6.4":"Mengabaikan satu sisi ruang (neglect satu sisi)","7.1":"Kesinambungan layanan medis dan rehabilitasi dari rehabilitasi sampai ke komunitas","7.2":"Keterlibatan dan dukungan bagi perawat keluarga","7.3":"Rujukan ke sumber daya komunitas","7.4":"Rehabilitasi di komunitas dan rehabilitasi jarak jauh","7.6":"Ikut serta dalam kegiatan santai, hiburan, dan sosial","7.7":"Kembali bekerja","7.8":"Kembali mengemudi"}},"sos":{"title":"Tanda peringatan stroke berulang","items":[["Senyum","Sudut mulut miring, kedua sisi wajah tidak sama"],["Angkat kedua tangan","Kedua tangan diangkat lurus ke depan, satu tangan lemah dan turun"],["Ucapkan halo","Bicara tidak jelas atau tidak bisa bicara"]],"call":"Jika ada salah satu tanda ini, segera telepon {n} dan catat waktu mulai gejalanya."},"caps":{"journey":[["Pengobatan akut",""],["Rehab PAC",""],["Pulang ke rumah",""]],"team":[["Fisioterapi","Berjalan dan keseimbangan"],["Terapi okupasi","Kegiatan sehari-hari"],["Terapi wicara","Bicara dan menelan"]],"arm":[["Lakukan ini","Topang lengan pakai bantal"],["Jangan begini","Menarik lengan yang lemah"]],"eat":[["Lakukan ini","Tegak, suapan kecil, pelan"],["Jangan begini","Makan sambil berbaring"]],"after":[["Duduk 30 menit","Jangan langsung berbaring"],["Bersihkan mulut","Setiap selesai makan"],["Periksa pipi","Ada sisa makanan?"]],"steps":[["Di tempat tidur","Duduk 30 detik"],["Di tepi tempat tidur","Duduk 30 detik"],["Berdiri mantap","30 detik, baru jalan"]],"safe":[["Pegangan","Kamar mandi, dekat kloset"],["Alas antiselip","Lantai kamar mandi"],["Lampu malam","Nyalakan satu saat malam"],["Jalur bebas barang","Rapikan barang dan kabel"]],"three":[["Obat tepat waktu",""],["Tensi setiap hari",""],["Kontrol terjadwal",""]],"bp722":[["7 hari","Ukur berturut-turut"],["2 kali","Sekali pagi, sekali malam"],["Ukur 2 kali","Setiap kali mengukur"]],"life":[["Tidak merokok",""],["Irit garam, minyak",""],["Makan banyak sayur",""],["Terus bergerak",""]],"talk":[["Berhadapan","Pelan, kalimat pendek"],["Gambar dan isyarat","Bantu sampaikan maksud"]],"rest":[["Istirahat teratur","Pendamping pun makan, tidur"],["Telepon 1966","Tanya layanan respite"]],"devices":[["Walker",""],["Kursi roda",""],["Tongkat kaki empat",""]],"angle":{"cap":"Saat dan setelah memberi makan lewat selang, naikkan bagian kepala tempat tidur 30–45 derajat","aria":"Saat memberi makan lewat selang, bagian kepala tempat tidur dinaikkan 30 sampai 45 derajat"},"weeks":{"cap":"Lama perawatan PAC (minggu)","legend":["Pada dasarnya 3–6 minggu","Setelah dinilai, bisa diperpanjang satu kali, paling lama 12 minggu","Dinilai setiap 3 minggu"],"aria":"Lama perawatan PAC: pada dasarnya 3 sampai 6 minggu, bisa diperpanjang satu kali sampai paling lama 12 minggu, dinilai setiap 3 minggu"},"exer1":[["Angkat pinggul","Berbaring, angkat bokong"],["Angkat tangan","Dulu setinggi bahu saja"],["Gerak engkel kaki","Tarik naik, tekan turun"]],"exer2":[["Duduk ke berdiri","Pegang kursi, baru berdiri"],["Pindah berat badan","Geser pelan ke kiri, kanan"],["Berjalan","Harus ada yang menemani"]],"cane":[["Lakukan ini","Tongkat di sisi yang kuat"],["Jangan begini","Di sisi yang lemah"]],"stairs":[["Naik tangga","Kaki yang kuat naik dulu"],["Turun tangga","Kaki yang lemah turun dulu"]],"homeaids":[["Kursi mandi","Mandi sambil duduk"],["Kursi toilet","Di samping tempat tidur"],["Penyangga kaki","Periksa kulit setiap hari"]],"handtools":[["Lap meja","Dorong, tarik kembali"],["Jepit jemuran","Buka, lalu jepitkan"],["Pungut balok","Masukkan ke gelas"]],"balancetools":[["Kursi kokoh","Latihan duduk ke berdiri"],["Pegang meja dapur","Geser berat kiri-kanan"]],"mindtools":[["Lihat cermin","Latihan berekspresi"],["Sebut nama","Gelas, sendok"],["Lihat kalender","Lihat tanggal tiap hari"]],"safetools":[["Lonceng kecil","Panggil saat perlu"],["Selotip warna","Tempel di ambang pintu"],["Lampu malam","Jalan tidur ke toilet"]],"posture":[["Ke sisi lemah","Bahu maju, ganjal punggung"],["Ke sisi kuat","Sisi lemah di atas bantal"],["Telentang","Bantal tipis di bawah bahu"],["Duduk di kasur","Bersandar, tangan di meja"]],"turning":[["Atur tangan","Jangan tertindih badan"],["Topang bahu+bokong","Jangan tarik lengan"],["Bantal di punggung","Isi celah"],["Kaki jepit bantal","Agar tidak saling menekan"]],"donts":[["Jangan tarik lengan","Bisa melukai bahu"],["Tanpa bantal keras","Di bawah lutut"],["Jari kaki bebas","Selimut harus longgar"],["Tanpa benda keras","Kecuali saran terapis"]],"brain":[["Stroke otak kiri","Tangan & kaki kanan lemah"],["Stroke otak kanan","Tangan & kaki kiri lemah"]],"progress":[["Duduk stabil",""],["Berdiri",""],["Berjalan",""]],"homecare":[["Ukur tensi","Pagi dan malam, jam tetap"],["Minum air","Sedikit tapi sering"],["Gerak engkel kaki","Cegah gumpalan darah"],["Minum obat teratur","Jangan berhenti sendiri"]],"standex":[["Langkah ke depan","Kaki yang lemah di belakang"],["Jinjit","Naik pelan, turun pelan"],["Memutar badan","Kedua kaki tetap diam"],["Angkat lutut","Jangan terlalu tinggi"]],"evalflow":[["Di awal","Menilai, membuat rencana"],["Selama terapi","Menilai lagi, mengubah"],["Sebelum selesai","Menilai hasil"]],"balance3":[["Tingkat 1","Duduk/berdiri stabil"],["Tingkat 2","Condong tetap tidak jatuh"],["Tingkat 3","Didorong pelan tetap stabil"]],"stretch":[["Regangkan pelan","Tahan sebentar, tidak nyeri"],["Jangan dipaksa","Bisa cedera"]],"lobes":[["Lobus depan","Gerak, keputusan, sifat"],["Lobus atas","Rasa, perkiraan posisi"],["Lobus samping","Ingatan, paham ucapan"],["Lobus belakang","Melihat"]],"mindmove":[["Bayangkan","Bayangkan gerakan dalam hati"],["Coba sendiri","Coba bergerak sendiri"],["Dibantu","Ditopang, bergerak bersama"]],"handex":[["Genggam","Genggam bola lembut"],["Lepas","Buka jari-jari"],["Sentuh","Sentuh gelas"],["Angkat","Angkat pergelangan tangan"]],"armex":[["Ke depan","Ambil barang di depan"],["Angkat ke atas","Tidak lebih tinggi dari bahu"],["Buka ke samping","Tidak lebih tinggi dari bahu"]],"legsteps":[["Berdiri",""],["Pindah berat badan",""],["Angkat kaki",""],["Melangkah",""]],"timeline":[["0–3 bulan","Kemajuan paling cepat"],["3–6 bulan","Kemajuan melambat"],["6–12 bulan","Masih mungkin membaik"],["Setelah 1 tahun","Latihan tetap bermanfaat"]],"stickex":[["Pegang tongkat","Dorong ke depan, tarik"],["Pasak","Lihat lubang, pelan-pelan"]],"footdrop":[["Angkat punggung kaki","Kaki tidak terseret"],["Ujung kaki terkulai","Mudah tersandung"]],"swallowex":[["Gembungkan pipi","Monyong, buka mulut"],["Gerakkan lidah","Julur, geser, angkat"],["Menelan kosong","Telan air liur 1 kali"],["Duduk tegak","Jangan sambil berbaring"]]},"units":[{"title":"Mengenal PAC, perawatan pasca-akut","desc":"Apa itu PAC, siapa yang bisa ikut, berapa lama perawatannya","body":[{"t":"h","x":"Apa itu perawatan pasca-akut"},{"t":"p","x":"Setelah pengobatan akut stroke selesai dan kondisi pasien stabil, ada masa ketika fungsi tubuh pulih lebih cepat. Program Perawatan Pasca-Akut dari Asuransi Kesehatan Nasional Taiwan (NHI) disingkat PAC. Pada masa inilah tim dari berbagai profesi mengatur rehabilitasi yang intensif. Tujuannya membantu pasien kembali mampu mengurus diri sendiri sehari-hari dan pulang ke rumah dengan lancar."},{"t":"fig","id":"journey"},{"t":"h","x":"Siapa yang bisa ikut"},{"t":"p","x":"Tim medis menilai apakah pasien cocok untuk ikut. Syarat utamanya sebagai berikut:"},{"t":"ul","x":["Dalam 1 bulan setelah serangan stroke akut. Pada keadaan khusus, bisa dilonggarkan sampai dalam 40 hari.","Setelah stroke, ada gangguan fungsi tingkat sedang sampai sedang-berat.","Kondisi sudah stabil selama 72 jam atau lebih.","Punya potensi rehabilitasi: bisa bekerja sama untuk belajar, bisa duduk selama 1 jam penuh dengan ditopang, dan mau ikut rehabilitasi secara aktif."]},{"t":"h","x":"Berapa lama perawatannya"},{"t":"p","x":"Pada dasarnya 3–6 minggu. Jika setelah dinilai tim masih diperlukan, perawatan bisa diperpanjang satu kali, paling lama sampai 12 minggu. Selama itu, kemajuan pasien dinilai setiap 3 minggu."},{"t":"fig","id":"weeks"},{"t":"h","x":"Tiga model perawatan"},{"t":"modes","x":[{"dt":"Model rawat inap","dd":"Pasien tinggal di rumah sakit untuk rehabilitasi. Intensitas tinggi: terapi 3–5 kali sehari. Intensitas biasa: terapi 1–2 kali sehari."},{"dt":"Model perawatan siang hari","dd":"Pasien datang ke rumah sakit pada siang hari untuk rehabilitasi, kira-kira dari pukul 9 pagi sampai pukul 5 sore. Terapi 2–4 kali sehari. Malam hari pasien pulang ke rumah untuk beristirahat."},{"dt":"Model di rumah","dd":"Untuk pasien yang tidak bisa rawat inap, ikut perawatan siang hari, atau datang ke rawat jalan untuk rehabilitasi. Terapis datang ke rumah untuk memberikan terapi. Setiap kali 30–50 menit, 1–6 kali seminggu."}]},{"t":"p","x":"Model yang tersedia di setiap rumah sakit berbeda. Silakan pastikan kepada manajer kasus PAC."},{"t":"h","x":"Kapan perawatan berakhir"},{"t":"ul","x":["Fungsi pasien maju dengan jelas, sehingga bisa pulang dan melakukan rehabilitasi sendiri.","Tidak ada kemajuan pada 2 kali penilaian berturut-turut.","Kondisi penyakit berubah dan pasien perlu menjalani pengobatan lain lebih dahulu.","Sudah mencapai batas 12 minggu."]},{"t":"key","h":"PAC selesai, rehabilitasi belum selesai","p":"Pemulihan bisa berlangsung berbulan-bulan sampai bertahun-tahun. Setelah PAC selesai, latihan bisa dilanjutkan di poliklinik, di komunitas, atau di rumah. Jika kemampuan berubah atau ada tujuan baru, minta dokter menilai ulang dan mengatur rehabilitasi lagi."},{"t":"key","h":"Yang bisa dilakukan keluarga","ul":["Ikut penjelasan dan diskusi dengan tim, dan pahami tujuan rehabilitasi.","Belajar cara merawat dari terapis dan perawat.","Sejak awal, bicarakan dengan tim tentang rencana setelah pasien pulang dari rumah sakit."]},{"t":"key","h":"Cara memulai rehabilitasi","ul":["Pada hari pertama setelah stroke (dalam 24 jam), pasien belum cocok turun dari tempat tidur untuk melakukan aktivitas berat. Setelah itu, tim medis akan mengatur turun dari tempat tidur dan rehabilitasi selangkah demi selangkah sesuai kondisi pasien.","Rehabilitasi yang dikerjakan bersama oleh tim dari berbagai profesi, seperti dokter, perawat, dan terapis, hasilnya lebih baik. Rehabilitasi di rumah setelah pulang juga harus dinilai dan diatur oleh tim profesional. Keluarga menemani latihan sesuai rencana tim, bukan melatih pasien sendiri tanpa arahan."]}]},{"title":"Cara menjalani rehabilitasi","desc":"Anggota tim, cara keluarga membantu, kapan harus berhenti","body":[{"t":"h","x":"Apa yang dikerjakan tim rehabilitasi"},{"t":"ul","x":["Fisioterapi: latihan membalik badan, duduk, berdiri, berjalan, dan keseimbangan.","Terapi okupasi: latihan gerakan tangan, serta kegiatan sehari-hari seperti berpakaian, makan, dan ke toilet.","Terapi wicara: latihan berbicara, memahami, dan menelan."]},{"t":"fig","id":"team"},{"t":"p","x":"Di tim juga ada dokter, perawat, ahli gizi, apoteker, psikolog, dan pekerja sosial. Jika ada pertanyaan, silakan sampaikan."},{"t":"h","x":"Setiap saat di kamar rawat adalah rehabilitasi"},{"t":"p","x":"Gerakan yang diajarkan terapis harus dipakai dalam kehidupan sehari-hari. Hal yang bisa dilakukan pasien sendiri, misalnya mencuci muka, berpakaian, dan makan, biarkan pasien melakukannya sendiri. Keluarga mengawasi di dekatnya dan membantu bila perlu. Jangan mengerjakan semuanya untuk pasien."},{"t":"h","x":"Lindungi sisi yang lemah"},{"t":"ul","x":["Saat membantu pasien bangun atau berpindah, jangan menarik lengan di sisi yang lemah, supaya bahu tidak cedera.","Saat pasien berbaring atau duduk, topang lengan yang lemah dengan bantal.","Jika pasien lama berbaring di tempat tidur, bantu membalik badannya kira-kira setiap 2 jam."]},{"t":"fig","id":"arm"},{"t":"weak"},{"t":"key","h":"Sampaikan jika bahu terasa sakit","ul":["Nyeri bahu sangat sering terjadi setelah stroke. Jika bahu sakit, ada cekungan di bahu (bahu bergeser sebagian/subluksasi), atau bahu sangat kaku, minta dokter dan terapis memeriksanya.","Alat penyangga posisi atau gendongan lengan (sling) bisa menopang bahu supaya cekungan tidak makin parah. Suntikan, stimulasi listrik, dan cara lain bisa membantu mengurangi nyeri bahu. Cocok atau tidak, tanyakan kepada tim medis.","Sebelum pulang, minta terapis mengajari keluarga cara meletakkan dan menggerakkan bahu sisi yang lemah, lalu peragakan langsung di depan terapis."]},{"t":"warn","h":"Jika ada keadaan berikut, berhenti dahulu dan beri tahu tenaga medis","ul":["Pusing, wajah pucat, keringat dingin","Dada terasa tertekan, napas sangat terengah-engah","Sakit kepala hebat yang tiba-tiba","Tangan dan kaki lebih lemah dari biasanya, atau bicara tiba-tiba menjadi tidak jelas"]},{"t":"key","h":"Kemajuan bisa cepat, bisa lambat","p":"Kecepatan pemulihan setiap orang berbeda. Tim menilai setiap 3 minggu sekali dan menyesuaikan isi rehabilitasi sesuai hasilnya. Jumlah dan intensitas latihan harus cukup supaya ada hasil. Terapis yang mengaturnya sesuai keadaan pasien."}]},{"title":"Menelan dan keamanan makan","desc":"Tanda peringatan tersedak, cara makan yang aman","body":[{"t":"h","x":"Mengapa menelan perlu diperhatikan"},{"t":"p","x":"Setelah stroke, kemampuan menelan sering menurun. Jika makanan atau air tersedak masuk ke saluran napas, bisa terjadi radang paru-paru (pneumonia aspirasi). Sebagian pasien tidak batuk saat tersedak, jadi keluarga perlu ikut mengamati."},{"t":"warn","h":"Tanda peringatan gangguan menelan","ul":["Batuk atau tersedak saat makan atau minum air","Setelah makan, suara menjadi basah dan terdengar berdahak","Makanan tertahan di mulut dan tidak bisa ditelan, atau keluar dari sudut mulut","Satu kali makan memakan waktu sangat lama","Demam berulang, dahak bertambah banyak"],"p":"Jika ada keadaan ini, beri tahu perawat atau terapis wicara."},{"t":"key","h":"Lakukan penilaian menelan lebih dulu","ul":["Setelah stroke, sebelum pertama kali makan, minum, atau minum obat, harus dilakukan penilaian menelan lebih dulu.","Jika ada dugaan masalah menelan, dokter mungkin mengatur pemeriksaan menelan dengan rontgen video atau endoskopi, untuk melihat apakah ada makanan atau minuman yang masuk ke saluran napas, dan mencari jenis makanan yang paling aman.","Jika pil tidak bisa ditelan, jangan menggerus sendiri atau mencari cara lain. Tanyakan dulu kepada dokter, perawat, atau apoteker.","Orang yang sulit menelan mudah makan terlalu sedikit dan berat badannya turun. Minta ahli gizi ikut menilai."]},{"t":"h","x":"Cara makan yang aman"},{"t":"fig","id":"eat"},{"t":"ul","x":["Pasien makan hanya saat sudah benar-benar sadar dan terjaga.","Duduk tegak dahulu, baru makan. Atur posisi sesuai cara yang diajarkan terapis wicara.","Makan dengan suapan kecil dan pelan-pelan. Pastikan makanan sudah tertelan habis sebelum suapan berikutnya.","Saat menyuapi, masukkan makanan ke mulut dari sisi yang kuat.","Jika terapis wicara mengajarkan \"setelah menelan, telan sekali lagi\" (tanpa makanan di mulut, telan ludah sekali lagi), lakukan sesuai ajaran itu.","Saat makan, pusatkan perhatian pada makan. Jangan makan sambil berbicara.","Setelah makan, duduk paling sedikit 30 menit sebelum berbaring.","Setelah makan, bersihkan mulut. Periksa juga apakah ada sisa makanan di dalam pipi pada sisi yang lemah."]},{"t":"fig","id":"after"},{"t":"warn","h":"Apa yang harus dilakukan jika tersedak saat makan","ul":["Jika pasien masih bisa batuk dan bicara: segera hentikan pemberian makan, condongkan badan pasien ke depan, dan dorong pasien untuk batuk sekuat tenaga sendiri. Saat ini jangan menepuk punggung, dan jangan lanjutkan memberi makan.","Jika batuk tidak bersuara, tidak bisa bicara, tidak bisa bernapas, atau bibir membiru: segera telepon 119, lalu bergantian tepuk punggung 5 kali dan tekan perut 5 kali (manuver Heimlich), sampai benda keluar atau petugas ambulans datang.","Jika pasien tidak bisa dibangunkan, mulai CPR dan ikuti petunjuk petugas 119.","Keluarga dan pendamping disarankan ikut kursus CPR dan manuver Heimlich.","Jika dalam beberapa hari setelah tersedak muncul demam, batuk terus-menerus, atau napas sangat sesak, segera ke dokter. Ini mungkin pneumonia aspirasi.","Setelah kondisi stabil, minta terapis wicara menilai ulang kemampuan menelan."]},{"t":"h","x":"Kelunakan dan kekentalan makanan"},{"t":"p","x":"Seberapa halus makanan harus dipotong dan apakah air perlu diberi pengental, ikutilah saran terapis wicara dan ahli gizi. Jangan mengubahnya sendiri."},{"t":"key","h":"Pasien yang memakai selang makan (selang NGT)","ul":["Sebelum memberi makan lewat selang, pastikan dahulu posisi selang dan tanda ukurannya.","Saat memberi makan lewat selang, naikkan bagian kepala tempat tidur 30–45 derajat.","Setelah memberi makan lewat selang, pertahankan posisi yang sama paling sedikit 30 menit sampai 1 jam."],"figBottom":"angle"},{"t":"h","x":"Latihan menelan"},{"t":"fig","id":"swallowex"},{"t":"p","x":"Latihan menelan harus dinilai dulu oleh terapis wicara, lalu dilakukan sesuai rencana. Di bawah ini latihan yang umum. Latihan mana dan berapa kali, tanyakan dulu kepada terapis wicara."},{"t":"ul","x":["Latihan sambil duduk tegak atau setengah duduk. Jangan latihan sambil berbaring.","Pipi: gembungkan pipi, monyongkan bibir, buka mulut.","Lidah: julurkan keluar, gerakkan ke kiri dan kanan, angkat ke atas.","Menelan kosong: tanpa makanan di mulut, telan air liur satu kali. Jika air liur sangat banyak atau sering tersedak air liur, tanya terapis wicara dulu.","Gerakan pelan dan lembut. Jangan menahan napas saat mengeluarkan tenaga. Jika lelah, berhenti.","Jika saat latihan tersedak atau batuk, sangat sesak napas, atau warna wajah berubah: segera berhenti dan beri tahu perawat atau staf medis."]},{"t":"key","h":"Hati-hati dengan makanan ini","ul":["Air putih dan sup yang encer paling mudah membuat tersedak.","Butir nasi yang kering, kacang, daun sayur, dan makanan yang banyak remahnya juga mudah membuat tersedak atau tersangkut.","Makanan yang campuran kuah dan butiran, seperti bubur nasi atau nasi dicampur kuah, serta makanan yang lengket seperti bola ketan, mochi, dan kue keranjang (kue beras ketan), juga sangat mudah membuat tersedak atau tercekik.","Boleh dimakan atau tidak, dan bagaimana cara mengubahnya, misalnya diberi pengental atau diblender halus, ikuti saran terapis wicara dan ahli gizi.","Jangan memaksa menyuapi, jangan menyuruh cepat-cepat, dan jangan biarkan pasien minum air dengan tegukan besar."]},{"t":"warn","h":"Menelan harus dinilai","ul":["Jangan menganggap menelan sudah aman hanya karena beberapa suap tidak ada masalah.","Setelah makan atau minum, jika suara menjadi basah, ada bunyi berdeguk, atau menjadi serak; setelah makan sering dada sesak, napas menjadi cepat, atau demam tanpa sebab jelas: semua harus diberi tahu kepada perawat atau staf medis."]}]},{"title":"Mencegah jatuh","desc":"Tiga langkah turun dari tempat tidur, hal penting keamanan di kamar rawat dan di rumah","body":[{"t":"h","x":"Mengapa mudah jatuh setelah stroke"},{"t":"p","x":"Tangan dan kaki di satu sisi lemah, keseimbangan menurun, pusing, dan terburu-buru ke toilet. Semua ini menambah kemungkinan jatuh. Jatuh bisa menyebabkan patah tulang atau cedera kepala, sehingga rehabilitasi terhenti."},{"t":"key","h":"Tiga langkah turun dari tempat tidur","figTop":"steps","ul":["Bangun dan duduk dahulu di atas tempat tidur selama 30 detik.","Turunkan kaki, lalu duduk lagi di tepi tempat tidur selama 30 detik.","Berdiri, lalu berdiri dengan mantap selama 30 detik. Jika tidak pusing, baru mulai berjalan."]},{"t":"h","x":"Selama dirawat di rumah sakit"},{"t":"ul","x":["Turun dari tempat tidur dan ke toilet harus selalu ditemani. Jika perlu bantuan, tekan bel panggil. Jangan memaksakan diri melakukannya sendiri.","Naikkan pagar tempat tidur, atur tinggi tempat tidur ke posisi paling rendah, dan kunci roda tempat tidur.","Letakkan barang yang sering dipakai di sisi yang kuat, di tempat yang bisa dijangkau tangan.","Pakai sepatu antiselip yang pas di kaki. Jangan pakai sandal. Celana jangan terlalu panjang.","Jika lantai basah, beri tahu petugas."]},{"t":"h","x":"Duduk di kursi roda dan berpindah"},{"t":"ul","x":["Sebelum naik ke atau turun dari kursi roda, kunci dahulu rem di kedua sisi dan lipat pijakan kaki.","Untuk cara berpindah, ikuti langkah-langkah yang diajarkan terapis."]},{"t":"h","x":"Setelah pulang ke rumah"},{"t":"ul","x":["Pasang pegangan di kamar mandi dan di samping kloset. Pasang alas antiselip di lantai.","Singkirkan barang-barang, kabel listrik, dan karpet kecil dari jalur jalan.","Nyalakan satu lampu kecil pada malam hari."]},{"t":"key","h":"Rencana pencegahan jatuh","ul":["Minta terapis menilai risiko jatuh dan membuat rencana pencegahan jatuh sesuai hasilnya.","Setelah pulang, minta tim medis menilai ulang paling sedikit sekali setahun. Jika baru-baru ini jatuh atau hampir jatuh, segera beri tahu tim lebih awal.","Latihan keseimbangan bisa mengurangi jatuh. Tanyakan kepada terapis apakah cocok berlatih tai chi, atau latihan \"berjalan sambil melakukan hal sederhana\", misalnya berjalan sambil menghitung angka. Berlatihlah dulu dengan bimbingan terapis.","Setelah stroke, karena kurang bergerak, tulang mudah menjadi keropos, sehingga lebih mudah patah saat jatuh. Tanyakan kepada dokter apakah perlu menilai risiko patah tulang.","Tongkat, walker, atau penyangga pergelangan kaki yang cocok bisa membantu keseimbangan dan mengurangi jatuh. Minta terapis menilai dan menyesuaikannya dulu sebelum dipakai."]},{"t":"fig","id":"safe"},{"t":"warn","h":"Jika pasien jatuh","ul":["Jangan terburu-buru menarik pasien untuk bangun. Lihat dahulu apakah pasien sadar dan bagian mana yang sakit.","Jika sedang dirawat di rumah sakit, segera tekan bel panggil.","Jika di rumah kepala pasien terbentur, sakit sampai tidak bisa bergerak, atau kesadarannya menurun, telepon 119."]}]},{"title":"Mencegah stroke berulang","desc":"Minum obat tepat waktu, mengukur tekanan darah, mengenal tanda peringatan stroke berulang","body":[{"t":"h","x":"Orang yang pernah stroke perlu mencegah stroke terjadi lagi"},{"t":"p","x":"Orang yang pernah stroke lebih besar kemungkinannya terkena stroke lagi dibandingkan orang pada umumnya. Mengendalikan tekanan darah (tensi), gula darah, dan lemak darah dengan baik bisa menurunkan kemungkinan itu."},{"t":"fig","id":"three"},{"t":"h","x":"Minum obat tepat waktu"},{"t":"ul","x":["Obat pencegah gumpalan darah, serta obat pengendali tekanan darah, gula darah, dan lemak darah, semuanya harus diminum setiap hari sesuai petunjuk dokter.","Jangan menghentikan atau mengurangi obat sendiri karena merasa sudah jauh lebih baik.","Jika ada perdarahan yang sulit berhenti, tinja berwarna hitam, atau tinja berdarah, secepatnya beri tahu dokter.","Dokter memilih obat pencegah gumpalan darah sesuai penyebab stroke. Sebagian orang, di awal setelah stroke, minum dua macam obat antiplatelet sekaligus untuk waktu singkat, lalu biasanya kembali ke satu macam saja. Kapan diganti, dokter yang memutuskan.","Untuk orang yang punya fibrilasi atrium (detak jantung tidak teratur), dokter biasanya memberi obat pengencer darah (antikoagulan) untuk mencegah stroke lagi. Orang yang minum obat jenis ini perlu tes darah secara rutin sesuai jadwal dari dokter, untuk memeriksa fungsi hati dan ginjal.","Setelah stroke, biasanya lemak darah juga perlu dikendalikan. Untuk orang yang punya masalah pengerasan pembuluh darah, dokter mungkin menetapkan target kolesterol jahat (LDL) di bawah 70 mg/dL."]},{"t":"key","h":"Mengukur tekanan darah “722”","figTop":"bp722","ul":["7: ukur selama 7 hari berturut-turut.","2: ukur satu kali setelah bangun pagi dan satu kali sebelum tidur malam.","2: setiap kali mengukur, ukur dua kali."],"p":"Catat angkanya, lalu bawa saat kontrol untuk ditunjukkan kepada dokter. Setelah stroke, biasanya tekanan darah dianjurkan di bawah 130/80 mmHg (angka atas di bawah 130, angka bawah di bawah 80). Tekanan darah harus mencapai target, tetapi terlalu rendah sampai pusing juga tidak baik. Target setiap orang ikuti petunjuk dokter. Jangan mengubah obat sendiri. Ukur di lengan yang tidak terkena stroke, dan selalu di lengan yang sama."},{"t":"h","x":"Kebiasaan hidup"},{"t":"fig","id":"life"},{"t":"ul","x":["Tidak merokok, kurangi minuman beralkohol.","Makan dengan sedikit minyak, sedikit gula, dan sedikit garam. Perbanyak sayur dan makanan berserat tinggi.","Terus bergerak aktif sesuai saran terapis.","Jika merasa detak jantung tidak teratur, berdebar-debar, atau dada terasa tertekan, beri tahu dokter.","Kontrol ke dokter sesuai jadwal.","Jika tubuh mampu, lakukan olahraga intensitas sedang paling sedikit 4 kali seminggu, setiap kali paling sedikit 10 menit, misalnya jalan cepat sampai agak terengah-engah tetapi masih bisa bicara. Jika belum bisa, bergerak sedikit tetap lebih baik daripada tidak bergerak sama sekali. Sebelum mulai, tanyakan dulu kepada dokter atau terapis berapa banyak olahraga yang cocok.","Bisa mengikuti pola \"diet Mediterania\": banyak makan sayur, buah, biji-bijian utuh, kacang-kacangan, kacang (seperti almon), dan ikan; pakai minyak nabati seperti minyak zaitun sebagai pengganti lemak babi dan mentega; kurangi daging merah dan makanan olahan. Pasien yang punya masalah menelan, diabetes, atau penyakit ginjal, tanyakan dulu kepada ahli gizi."]},{"t":"sos"},{"t":"ul","x":["Jangan menyetir mobil atau mengendarai motor sendiri ke rumah sakit.","Saat menunggu ambulans, jangan beri pasien makanan, minuman, atau obat.","Jangan menunggu gejala hilang sendiri.","Makin cepat sampai di rumah sakit, makin baik. Pengobatan untuk membuka kembali pembuluh darah ada batas waktunya. Contohnya, obat penghancur gumpalan darah umumnya diberikan dalam 4,5 jam setelah gejala mulai. Jadi, jika muncul tanda peringatan, segera telepon 119. Jangan menunggu."]}]},{"title":"Emosi dan komunikasi","desc":"Perubahan emosi setelah stroke, cara berbicara dengan pasien, istirahat bagi pendamping pasien","body":[{"t":"h","x":"Perubahan emosi setelah stroke"},{"t":"p","x":"Setelah stroke, suasana hati yang murung, mudah menangis, atau mudah marah adalah hal yang sering terjadi. Hal ini berkaitan dengan cedera pada otak dan perubahan hidup yang tiba-tiba. Ini bukan karena pasien kurang tegar."},{"t":"warn","h":"Kenali masalah emosi sejak dini","ul":["Murung sepanjang hari, tidak berminat pada apa pun","Sering tegang, khawatir, atau gelisah","Tidak mau rehabilitasi, tidak mau berbicara","Tidur tidak nyenyak atau tidak nafsu makan","Sering berkata bahwa dirinya membebani keluarga"],"p":"Depresi dan kecemasan sangat sering terjadi setelah stroke dan bisa muncul kapan saja. Tidak perlu menunggu lama baru disampaikan. Sebaiknya emosi diperiksa secara rutin, misalnya selama dirawat di rumah sakit, sekitar 3 bulan dan 6 bulan setelah stroke, dan saat kontrol berikutnya. Jika belum pernah diperiksa, mintalah tim medis menilainya. Untuk orang yang sulit berbicara juga ada cara penilaian yang cocok. Depresi dan kecemasan bisa diobati. Dokter mungkin merujuk ke dokter jiwa (psikiater) atau psikolog, untuk terapi bicara (psikoterapi) atau obat. Jangan membeli obat sendiri. Jika pasien berkata ingin mati atau ingin menyakiti diri sendiri, segera beri tahu dokter atau perawat, atau telepon layanan telepon kesehatan jiwa 1925 (24 jam)."},{"t":"key","h":"Tidur nyenyak juga bagian dari rehabilitasi","ul":["Tidur dan bangun pada jam yang sama. Siang hari lebih banyak bangun dan bergerak. Jika mengantuk boleh tidur sebentar, tetapi jangan terlalu lama.","Sebelum tidur, kurangi melihat HP dan TV. Setelah tengah hari, jangan minum kopi atau teh kental.","Jika saat tidur mendengkur sangat keras, napas berhenti sebentar, atau siang hari terus sangat mengantuk, mungkin ada henti napas saat tidur (sleep apnea). Beri tahu dokter.","Jika malam hari terus tidak bisa tidur, sering cemas, atau sedih, beri tahu dokter. Jangan minum obat tidur atau obat penenang sendiri dalam waktu lama, dan jangan minum alkohol supaya bisa tidur."]},{"t":"key","h":"Mudah lelah setelah stroke","p":"Setelah stroke, pasien sangat mudah lelah, dan rasa lelah ini tidak banyak berkurang walaupun sudah istirahat. Ini disebut kelelahan pasca-stroke dan sangat sering terjadi. Beri tahu tim medis, karena ada cara untuk mengurangi lelah dan memperbaiki tidur. Jangan membeli sendiri obat penambah tenaga atau obat untuk mengatasi lelah."},{"t":"h","x":"Berkomunikasi dengan pasien yang sulit berbicara"},{"t":"fig","id":"talk"},{"t":"ul","x":["Berbicaralah berhadapan, lebih pelan, dengan kalimat yang lebih pendek.","Sampaikan satu hal saja setiap kali.","Lebih sering gunakan pertanyaan yang bisa dijawab “ya” atau “tidak”.","Sertai dengan isyarat tangan, gambar, atau benda nyata.","Beri pasien waktu untuk menjawab. Jangan terburu-buru menyelesaikan ucapannya.","Berbicaralah seperti kepada orang dewasa. Jangan memperlakukan pasien seperti anak kecil.","Jika pasien seperti kurang jelas mendengar, minta pemeriksaan pendengaran. Untuk pasien yang sangat sulit bicara, terapis wicara bisa mengajari keluarga cara berkomunikasi, dan bisa juga memakai alat bantu seperti papan komunikasi, kartu gambar, atau tablet."]},{"t":"key","h":"Latihan bicara selangkah demi selangkah","ul":["Latihan bicara berbeda sesuai masalahnya. Apa yang dilatih dan bagaimana caranya, ikuti saran terapis wicara dulu.","Jika terapis menyarankan cara ini: mulai dari kata sederhana, misalnya \"ya\", \"air\". Lalu latih menyebut nama benda sehari-hari, misalnya gelas, sendok. Terakhir latih kalimat pendek, misalnya \"saya mau minum\".","Boleh juga mulai dengan latihan memahami perintah sederhana, misalnya \"angkat tangan\" atau \"buka mulut\". Saat mengucapkannya, tunjukkan juga dengan gerakan tangan. Lalu pasien mengikuti terapis berbicara pelan-pelan.","Untuk pasien yang bicaranya tidak jelas, terapis mungkin mengajari dia bicara lebih pelan, lebih keras, dan membuka mulut lebih lebar.","Latih sedikit setiap hari. Beri dia waktu untuk bicara pelan-pelan. Jangan buru-buru, dan jangan terus membetulkan. Jika tidak bisa mengucapkan, boleh menunjuk, menulis, atau memakai kartu gambar. Jika benar, beri dia pujian."]},{"t":"h","x":"Orang yang merawat pasien (pendamping) juga perlu menjaga diri sendiri"},{"t":"ul","x":["Anggota keluarga merawat secara bergantian. Jangan satu orang menanggung semuanya.","Perawat keluarga harus punya waktu istirahat dan makan yang tetap.","Sejak pasien dirawat di rumah sakit, perawat keluarga sudah bisa ikut edukasi dan pelatihan cara merawat. Setelah belajar, peragakan di depan perawat atau terapis untuk memastikan sudah bisa.","Jika merasa tidak sanggup lagi, tidak bisa tidur, atau sedih, bicaralah dengan perawat atau pekerja sosial. Bisa juga minta tim merujuk ke kelompok dukungan bagi perawat keluarga.","Jika merasa kesepian atau jarang bergaul dengan orang lain, pasien bisa ikut perkumpulan sesama pasien atau kelompok dukungan. Perubahan kehidupan seksual, mengompol, dan masalah lain yang membuat malu untuk dibicarakan juga sering terjadi. Jangan ragu bertanya kepada dokter atau perawat."]},{"t":"fig","id":"rest"},{"t":"key","h":"Saluran telepon perawatan jangka panjang 1966","p":"Telepon 1966 untuk bertanya tentang sumber daya perawatan jangka panjang, seperti layanan pengganti sementara bagi pendamping (respite) dan layanan di rumah."}]},{"title":"Persiapan pulang dari rumah sakit","desc":"Hal yang harus dikuasai sebelum pulang, lingkungan rumah, sumber daya perawatan jangka panjang","body":[{"t":"h","x":"Hal yang harus dikuasai sebelum pulang"},{"t":"ul","x":["Membantu pasien membalik badan, naik-turun tempat tidur, dan naik-turun kursi roda dengan aman.","Cara menyuapi atau memberi makan lewat selang makan (selang NGT).","Kegunaan setiap obat dan waktu minumnya.","Gerakan rehabilitasi yang harus diteruskan di rumah.","Jika ada selang, misalnya selang makan (selang NGT) atau selang kencing (kateter urine), pelajari cara merawatnya."]},{"t":"p","x":"Untuk hal yang belum Anda yakini, sebelum pulang mintalah perawat atau terapis mengajarkannya sekali lagi, lalu praktikkan langsung di depan mereka."},{"t":"h","x":"Lingkungan rumah"},{"t":"ul","x":["Tinggi tempat tidur harus memudahkan naik dan turun. Sisakan ruang di samping tempat tidur agar kursi roda bisa mendekat.","Pasang pegangan di kamar mandi dan di samping kloset. Lantai harus antiselip.","Jaga jalur jalan tetap lapang. Singkirkan barang-barang dan kabel listrik."]},{"t":"fig","id":"safe"},{"t":"h","x":"Alat bantu"},{"t":"fig","id":"devices"},{"t":"p","x":"Alat bantu mana yang diperlukan, misalnya alat bantu jalan (walker), kursi roda, atau kursi toilet (commode), tanyakan dahulu kepada terapis sebelum menyiapkannya. Tentang bantuan biaya alat bantu, Anda bisa bertanya ke Pusat Manajemen Perawatan Jangka Panjang di tiap kabupaten atau kota."},{"t":"h","x":"Sumber daya perawatan jangka panjang"},{"t":"p","x":"Sejak masih dirawat di rumah sakit, Anda sudah bisa meminta perawat layanan persiapan pulang untuk membantu merujuk ke penilaian perawatan jangka panjang. Anda juga bisa menelepon 1966 sendiri. Layanannya antara lain layanan di rumah, pemulihan kemampuan di rumah, antar-jemput, dan layanan pengganti sementara bagi pendamping (respite)."},{"t":"key","h":"Setelah pulang dari rumah sakit","figTop":"three","ul":["Catat tanggal kontrol dan poli (bagian) yang dituju.","Minum obat tepat waktu dan ukur tekanan darah setiap hari.","Teruskan rehabilitasi, jangan terputus."]},{"t":"key","h":"Setelah pulang dari rumah sakit","ul":["Jika setelah pulang sulit sering datang ke rumah sakit, tanyakan kepada tim medis apakah bisa kontrol atau rehabilitasi lewat video, atau terapis datang ke rumah.","Setelah stroke, jangan memutuskan sendiri untuk menyetir mobil atau mengendarai motor lagi. Orang yang punya masalah penglihatan, perhatian, kemampuan menilai, atau tangan dan kaki harus lebih dulu menjalani penilaian resmi kemampuan mengemudi. Tanyakan kepada dokter cara mengaturnya.","Jika pasien ingin kembali bekerja, beri tahu tim medis sedini mungkin. Tim bisa menilai kemampuan dan merujuk ke layanan rehabilitasi kerja.","Ceritakan kepada tim kegiatan yang dulu disukai pasien, misalnya menyanyi, berkebun, main catur, atau kegiatan perkumpulan. Kegiatan ini juga bisa menjadi bagian dari rehabilitasi.","Saat kontrol, minta dokter memeriksa bersama memakai \"Daftar Periksa Pasca-Stroke (Post-Stroke Checklist)\": pencegahan stroke berulang, merawat diri sendiri, bergerak, kekakuan otot, nyeri, buang air kecil dan besar, komunikasi, perasaan, daya ingat dan berpikir, ikut serta dalam kehidupan sehari-hari, hubungan dengan keluarga, dan lain-lain. Jika ada masalah, dokter akan merujuk ke layanan yang sesuai."]},{"t":"warn","h":"Jika ada keadaan berikut, segera cari pertolongan medis","ul":["Tanda peringatan stroke berulang: mulut miring, tangan dan kaki di satu sisi lemah, bicara tidak jelas. Telepon 119","Demam, batuk, dahak bertambah banyak","Kesadaran menurun, atau sulit dibangunkan","Jatuh dan cedera","Kejang"]}]},{"title":"Olahraga di rumah","desc":"Cara terus berolahraga setelah pulang, cara melindungi bahu, kapan harus berhenti","body":[{"t":"h","x":"Mengapa tetap perlu berolahraga setelah pulang"},{"t":"p","x":"Setelah stroke, fungsi tubuh pulih dengan latihan yang terus-menerus. Jika setelah pulang pasien tidak bergerak sama sekali, otot menjadi lemah, sendi menjadi kaku, dan pasien juga lebih mudah jatuh. Berolahraga setiap hari secara rutin bisa menjaga hasil rehabilitasi."},{"t":"key","h":"Sebelum mulai berolahraga","ul":["Jenis gerakan dan berapa kali melakukannya, ikuti cara yang dibuat terapis untuk pasien.","Pilih waktu saat pasien segar. Jangan berolahraga tepat setelah makan kenyang.","Harus ada orang yang mengawasi di dekatnya, dan sekitarnya bebas dari barang-barang.","Jika biasa mengukur tekanan darah, ukur dulu satu kali. Jika tekanan darah jauh lebih tinggi dari biasanya, atau badan terasa tidak enak, jangan berolahraga dulu, dan beri tahu tenaga medis."]},{"t":"h","x":"Gerakan yang bisa dilakukan sambil berbaring di tempat tidur"},{"t":"fig","id":"exer1"},{"t":"ul","x":["Angkat pinggul: berbaring, kedua kaki ditekuk dan telapak kaki menapak rata di tempat tidur. Pelan-pelan angkat bokong, tahan beberapa detik, lalu turunkan. Jangan menahan napas. Jika kaki yang lemah jatuh ke samping, minta keluarga memegangi lututnya.","Angkat kedua tangan: jari kedua tangan saling menggenggam. Tangan yang kuat menuntun tangan yang lemah, pelan-pelan diangkat ke atas. Mula-mula cukup sampai setinggi bahu. Jika ingin mengangkat lebih tinggi, tanyakan dulu kepada terapis.","Gerak pergelangan kaki: telapak kaki ditarik ke atas, lalu ditekan ke bawah. Gerakan ini membantu peredaran darah."]},{"t":"weak"},{"t":"h","x":"Gerakan sambil duduk dan berdiri"},{"t":"fig","id":"exer2"},{"t":"ul","x":["Dari duduk ke berdiri: duduk di kursi yang kokoh dan punya sandaran tangan. Kedua telapak kaki menapak rata, sedikit ditarik ke belakang. Condongkan badan ke depan, lalu berdiri. Setelah itu duduk kembali pelan-pelan. Keluarga berdiri di sisi yang lemah untuk menjaga.","Memindahkan berat badan: saat duduk, gerakkan badan pelan-pelan ke kiri dan ke kanan untuk melatih keseimbangan.","Berjalan: harus selalu ada yang menemani. Pendamping berdiri di sisi yang lemah, sedikit di belakang pasien. Pakai alat bantu sesuai saran terapis, lalu tambah waktu berjalan sedikit demi sedikit."]},{"t":"h","x":"Empat latihan sambil berdiri berpegangan"},{"t":"fig","id":"standex"},{"t":"key","h":"Tanya terapis dulu","p":"Empat latihan ini cocok untuk orang yang sudah bisa berdiri stabil sambil berpegangan. Boleh dilakukan atau tidak, dan berapa kali, tanya terapis dulu. Jumlah di bawah hanya contoh, boleh mulai dari lebih sedikit. Jika saat latihan terasa nyeri dada, pusing, atau sangat sesak napas, segera berhenti dan duduk istirahat."},{"t":"ul","x":["Tangan yang kuat berpegangan erat pada meja atau pegangan. Jika tangan yang lemah bisa diletakkan di meja, letakkan dengan baik. Jangan biarkan tergantung atau tertarik. Berdiri di tempat yang rata, pakai sepatu antiselip, dan taruh kursi di belakang supaya bisa langsung duduk jika lelah.","Langkah ke depan: kaki yang kuat melangkah kecil ke depan, kaki yang lemah tetap di belakang. Tumit menapak rata, lutut lurus tetapi jangan dikunci. Lutut depan sedikit ditekuk, badan pelan-pelan maju, tahan sekitar 5 detik, lalu pelan-pelan kembali. Tarik kaki kembali dan berdiri stabil dengan dua kaki. Bisa 8–10 kali. Jika lutut kaki belakang lemas, jangan lakukan dulu.","Jinjit: kedua kaki bersama-sama pelan-pelan mengangkat tumit, lalu pelan-pelan turunkan. Badan jangan jatuh ke depan. 8 kali satu set, lakukan 2 set.","Memutar badan: kedua kaki tetap diam. Badan atas pelan-pelan diputar ke kiri, lalu pelan-pelan ke kanan, hanya sampai terasa nyaman. Kepala ikut berputar pelan bersama badan. Jika pusing, berhenti. Setiap sisi 10 kali, lakukan 2 set.","Angkat lutut: kaki yang lemah pelan-pelan mengangkat lutut, lalu pelan-pelan turunkan. Badan tetap tegak, jangan miring ke samping. 8–12 kali satu set, lakukan 2 set. Jangan angkat terlalu tinggi. Jika tidak stabil, lakukan sambil duduk di kursi.","Jangan menahan napas selama latihan. Keluarga berdiri di sisi yang lemah untuk menjaga."]},{"t":"key","h":"Lindungi bahu di sisi yang lemah","ul":["Saat membantu pasien bangun, membalik badan, berpindah, atau berpakaian, jangan menarik lengan yang lemah.","Saat duduk, letakkan tangan yang lemah di sandaran tangan, di atas meja, atau di atas bantal supaya tertopang dengan baik.","Jangan berlatih menarik lengan dengan tali atau katrol yang digantung di tempat tinggi.","Jika terasa sakit saat tangan diangkat tinggi, berhenti dulu dan beri tahu terapis."]},{"t":"warn","h":"Jika ada keadaan ini, segera hentikan olahraga","ul":["Nyeri dada, dada terasa sesak, napas sangat terengah-engah: berhenti dan istirahat dulu. Jika setelah beberapa menit tidak membaik, telepon 119","Pusing, keluar keringat dingin, wajah pucat","Sendi atau otot sangat sakit","Tiba-tiba sakit kepala hebat, penglihatan kabur, atau jatuh dan kepala terbentur: telepon 119","Tangan dan kaki tiba-tiba lebih lemah, mulut miring, atau bicara tidak jelas: mungkin stroke berulang, segera telepon 119"]},{"t":"key","h":"Latihan setiap hari, dan harus cukup","p":"Berolahraga setiap hari pada jam yang sama. Jumlah dan intensitas latihan harus cukup supaya ada hasil. Terapis yang mengaturnya sesuai keadaan pasien, lalu ditambah pelan-pelan. Latihan dalam sehari boleh dibagi beberapa kali, dengan istirahat di antaranya. Di \"Daftar\" Anda bisa mencentang apakah hari ini sudah berolahraga."},{"t":"key","h":"Olahraga harus lengkap","ul":["Olahraga di rumah harus mencakup olahraga aerobik yang membuat jantung berdetak lebih cepat, misalnya berjalan atau mengayuh sepeda statis, dan juga latihan kekuatan otot. Kedua kaki harus dilatih, bukan hanya kaki yang kuat.","Setelah PAC selesai, tanyakan kepada terapis apakah pasien cocok ikut kelas olahraga di komunitas."]}]},{"title":"Memakai alat bantu","desc":"Tongkat, walker, naik-turun tangga, kursi roda, dan alat bantu di rumah","body":[{"t":"h","x":"Dinilai dulu, baru pilih alat bantu"},{"t":"p","x":"Alat bantu harus dipilih sesuai kemampuan pasien. Mintalah terapis atau Pusat Alat Bantu menilai dulu, baru beli atau sewa. Pusat Alat Bantu di Kota Taipei bisa melakukan penilaian dan meminjamkan alat bantu bekas. Ada juga bantuan biaya alat bantu dari program perawatan jangka panjang dan untuk penyandang disabilitas."},{"t":"golink","x":"Lihat Pusat Alat Bantu dan bantuan biaya di Kota Taipei","tab":"res","rescat":"clothing"},{"t":"h","x":"Tongkat dan walker"},{"t":"fig","id":"cane"},{"t":"weak"},{"t":"ul","x":["Tongkat dipegang dengan tangan di sisi yang kuat.","Saat berjalan, tongkat dan kaki yang lemah maju bersama-sama, lalu kaki yang kuat melangkah.","Saat memakai walker (alat bantu jalan), letakkan walker ke depan dulu sampai stabil. Kaki yang lemah melangkah masuk lebih dulu, lalu kaki yang kuat. Jangan berjalan sambil mendorong walker. Untuk walker beroda, pakailah sesuai cara yang diajarkan terapis.","Periksa karet di bagian bawah tongkat dan walker secara rutin. Jika sudah aus, harus diganti."]},{"t":"h","x":"Naik dan turun tangga"},{"t":"fig","id":"stairs"},{"t":"ul","x":["Naik tangga: kaki yang kuat naik dulu, lalu kaki yang lemah menyusul.","Turun tangga: kaki yang lemah turun dulu, lalu kaki yang kuat menyusul.","Tangan yang kuat berpegangan pada pegangan tangga. Tongkat bisa dibawakan oleh keluarga.","Keluarga berdiri di sisi yang lemah. Saat naik, berdiri di belakang pasien, satu anak tangga lebih rendah. Saat turun, berdiri di depan pasien, satu anak tangga lebih rendah.","Untuk tangga tanpa pegangan, mintalah terapis mengajari dulu sebelum menaikinya."]},{"t":"h","x":"Kursi roda"},{"t":"ul","x":["Sebelum naik atau turun dari kursi roda, kunci rem di kedua sisi, dan lipat pijakan kaki.","Saat duduk, bokong harus duduk sampai ke belakang, punggung bersandar dengan baik, dan tangan yang lemah diletakkan di sandaran tangan atau papan meja.","Orang yang lama duduk di kursi roda bisa memakai bantalan duduk antitekanan. Ubah posisi duduk secara teratur sesuai cara yang diajarkan terapis, untuk mencegah luka tekan."]},{"t":"h","x":"Alat bantu di rumah"},{"t":"fig","id":"homeaids"},{"t":"ul","x":["Kursi mandi: mandi sambil duduk lebih aman. Kaki kursi harus memakai alas antiselip. Coba suhu air dulu dengan tangan di sisi yang kuat, supaya tidak tersiram air panas.","Kursi toilet (commode): pada malam hari bisa diletakkan di samping tempat tidur, supaya pasie
