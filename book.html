:30,"t":"約每 2 小時翻一次，依護理師評估"}]},{"img":"sctransfer","text":"天氣很好，阿傑要扶爸爸坐輪椅，到公園曬太陽。","spots":[{"x":86,"y":80,"t":"煞車拉好，腳踏板收起來"},{"x":52,"y":45,"t":"扶腰或腰帶，不拉手"},{"x":40,"y":78,"t":"膝蓋頂住他無力那一側的膝蓋"}],"q":{"t":"輪椅要放在哪裡？","o":[{"t":"放在有力的那一側，斜 45 度","ok":true,"fb":"對！往有力側轉，他自己的腳使得上力。"},{"t":"放在正對面，坐下去最方便","ok":false,"fb":"正對面要轉半圈，最容易跌倒。"}]}},{"img":"nightpath","text":"半夜兩點，阿明伯說要上廁所。媽媽怕吵醒大家。","spots":[{"x":55,"y":45,"t":"開燈，走道裝夜燈"},{"x":72,"y":82,"t":"地上不放雜物、電線"},{"x":26,"y":48,"t":"先坐床邊 30 秒、站 30 秒，再走"}],"q":{"t":"媽媽應該怎麼做？","o":[{"t":"開燈，讓他先坐床邊 30 秒，穿好鞋","ok":true,"fb":"對！先坐再站不會頭暈，燈開了才看得到路。"},{"t":"不開燈，直接扶他起來","ok":false,"fb":"暗處最容易跌倒。"}]}},{"img":"scbp","text":"早上量血壓，185/100。阿明伯說沒有哪裡不舒服。","spots":[{"x":68,"y":62,"t":"722：連續 7 天，早晚各一次，每次量兩遍"},{"x":52,"y":54,"t":"量之前先坐著休息 5 分鐘"}],"q":{"t":"阿傑應該怎麼做？","o":[{"t":"讓他坐著休息幾分鐘，再量一次","ok":true,"fb":"對！休息後還是 180/120 以上，當天聯絡醫師。"},{"t":"馬上多給一顆降血壓藥","ok":false,"fb":"不可以自己加藥，血壓降太快也危險。"}]}},{"img":"scmed","text":"晚上九點，小慧發現早上的藥忘了吃。","spots":[{"x":40,"y":86,"t":"分格藥盒分早、中、晚"},{"x":55,"y":62,"t":"不確定就打電話問藥局或醫院"}],"q":{"t":"小慧應該怎麼做？","o":[{"t":"看藥袋說明，不確定就打電話問","ok":true,"fb":"對！每種藥漏吃的處理不一樣，問最保險。"},{"t":"早上的和晚上的一起吃","ok":false,"fb":"一次吃兩倍可能太多，尤其是抗凝血劑和降血壓藥。"}]}},{"img":"sccomm","text":"白天陪阿明伯的看護 Siti，聽不懂他想要什麼，阿明伯越來越急。","spots":[{"x":42,"y":52,"t":"圖卡：水、廁所、痛、冷、熱"},{"x":22,"y":32,"t":"問是非題，點頭搖頭就好"}],"q":{"t":"Siti 可以怎麼做？","o":[{"t":"拿圖卡讓他用手指","ok":true,"fb":"對！說不出來的人，常常還能指。"},{"t":"一直問：「什麼？你說什麼？」","ok":false,"fb":"一直追問會讓他更急、更說不出來。"}]}},{"img":"scmood","text":"有一天，阿明伯看著窗外說：「這樣活著，有什麼意思。」","spots":[{"x":58,"y":70,"t":"握著他的手，先聽他說"},{"x":18,"y":35,"t":"中風後心情低落很常見，可以治療"}],"q":{"t":"小慧可以怎麼回應？","o":[{"t":"坐下來聽他說，回診時告訴醫師","ok":true,"fb":"對！願意說出來就是求救。有想傷害自己，撥 1925 或告訴醫護；有立即危險撥 119。"},{"t":"「不要亂講，想開一點。」","ok":false,"fb":"否定他的感受，他以後就不會再說了。"}]}},{"img":"caregiver","text":"照顧好幾個月，媽媽也累了。醫院的社工師說：「照顧別人，也要照顧自己。」","spots":[{"x":80,"y":85,"t":"撥 1966 長照專線，問喘息服務"},{"x":22,"y":60,"t":"累了要說出來，家人輪流照顧"}]},{"img":"home","end":true,"text":"一天一點點，阿明伯越來越好。全家人一起，就不怕。","remember":["臉歪、手舉不起、說話不清：撥 119","坐直、小口、吞完再餵","扶肩扶臀翻身，不拉手","輪椅放有力側，煞車拉好","半夜開燈，坐 30 秒再站","血壓 180/120 以上：休息再量，當天聯絡醫師","照顧者也要休息：1966"]}]},"en":{"ui":{"title":"Grandpa Ming Comes Home","sub":"A family's stroke care story","start":"Start reading","prev":"Back","next":"Next","read":"Read aloud","stop":"Stop","tapHint":"Tap the glowing circles to find tips","choose":"What would you do?","right":"Correct","wrong":"Think again","tryAgain":"Try again","found":"Found {n} / {m} tips","page":"Page {i} / {n}","again":"Read again","toApp":"Practice in the app","remember":"Remember together","score":"{n} / {m} correct on first try","noVoice":"This phone has no read-aloud voice for this language. Please read the text or ask a family member.","disclaimer":"This book is for education only. Follow your care team's instructions.","lang":"Language","close":"Close","weak":"Orange = weak side"},"pages":[{},{"text":"Sunday breakfast. Grandpa Ming suddenly slurs his words, his mouth droops, and he cannot lift his right arm. His son Jie is frightened.","spots":[{"t":"F Face: ask him to smile – one side droops"},{"t":"A Arm: raise both arms – one drifts down"},{"t":"T Time: note the time it started, call 119 now"}],"q":{"t":"What should Jie do?","o":[{"t":"Call 119 right away and note the time","fb":"Yes! A drooping face, weak arm or unclear speech are stroke warning signs. Every minute counts."},{"t":"He probably slept badly – let him rest","fb":"Don't wait. Clot-opening treatment only works within a time limit."},{"t":"Give him water and his usual pills","fb":"Nothing to eat or drink – he may choke. Call 119 first."}]}},{"text":"After emergency care, Grandpa Ming moves to the post-acute care (PAC) ward. Doctors, therapists and nurses practise with him.","spots":[{"t":"Physical therapy: standing and walking with a rail"},{"t":"Occupational therapy: hand use, dressing, eating"},{"t":"The team checks progress every 2–3 weeks"}]},{"text":"Before his first meal, the speech therapist says: \"Sit up straight first, then eat.\"","spots":[{"t":"Sit upright at 90°, back supported"},{"t":"Tuck the chin down slightly"},{"t":"Food texture as the speech therapist advises"}]},{"text":"His daughter Hui picks up a spoon to feed her dad some porridge.","spots":[{"t":"One small spoonful at a time"},{"t":"Watch him swallow and check his mouth is empty before the next bite"},{"t":"Coughing or a wet voice: stop first"}],"q":{"t":"What is the safer way to feed him?","o":[{"t":"A small spoonful, placed on his strong side","fb":"Yes! Small bites on the strong side lower the risk of choking."},{"t":"Big bites to finish quickly","fb":"Big bites can cause choking or go into the airway."},{"t":"Chat with him while feeding","fb":"Talking while eating can cause choking. Chat after the meal."}]}},{"text":"Lying still too long can injure the skin. Hui learns to turn her dad in bed.","spots":[{"t":"One hand on the shoulder, one on the hip – turn together"},{"t":"Bend his knees first – turning is easier"}],"q":{"t":"How should she turn him?","o":[{"t":"Shoulder and hip together, rolling toward herself","fb":"Yes! The body turns as one, no twisting."},{"t":"Pull his weak arm to roll him over","fb":"Pulling the weak arm can injure the shoulder."}]}},{"text":"After turning, pillows support him. Grandpa Ming feels much better.","spots":[{"t":"A pillow between the legs"},{"t":"Rest the weak arm on a pillow"},{"t":"Turn about every 2 hours, as the nurse advises"}]},{"text":"It's a lovely day. Jie helps his dad into the wheelchair to sit in the park.","spots":[{"t":"Brakes on, footrests up"},{"t":"Hold the waist or belt – never pull the arm"},{"t":"Brace his weak-side knee with your knee"}],"q":{"t":"Where should the wheelchair go?","o":[{"t":"On his strong side, at 45 degrees","fb":"Yes! Turning toward the strong side lets his own leg help."},{"t":"Straight in front – easiest to sit down","fb":"Facing him means a half turn – the easiest way to fall."}]}},{"text":"2 a.m. Grandpa Ming needs the toilet. Grandma doesn't want to wake everyone.","spots":[{"t":"Turn on the light; use night lights in the hallway"},{"t":"Keep the floor clear of clutter and cords"},{"t":"Sit on the bed edge 30 seconds, stand 30 seconds, then walk"}],"q":{"t":"What should Grandma do?","o":[{"t":"Turn on the light, sit him up for 30 seconds, put on shoes","fb":"Yes! Sitting first prevents dizziness, and light shows the way."},{"t":"Leave the light off and help him straight up","fb":"Dark rooms are where falls happen most."}]}},{"text":"Morning blood pressure: 185/100. Grandpa Ming says he feels fine.","spots":[{"t":"722: 7 days in a row, morning and evening, 2 readings each time"},{"t":"Sit and rest 5 minutes before measuring"}],"q":{"t":"What should Jie do?","o":[{"t":"Let him rest a few minutes, then measure again","fb":"Yes! If it's still 180/120 or higher after rest, contact the doctor that day."},{"t":"Give an extra blood pressure pill right away","fb":"Never add pills yourself – dropping too fast is dangerous too."}]}},{"text":"9 p.m. Hui realises the morning pills were missed.","spots":[{"t":"A pill box with morning, noon and night sections"},{"t":"If unsure, call the pharmacy or hospital"}],"q":{"t":"What should Hui do?","o":[{"t":"Check the pill bag instructions; if unsure, call and ask","fb":"Yes! Each medicine is handled differently – asking is safest."},{"t":"Take the morning and evening pills together","fb":"A double dose may be too much, especially blood thinners and blood pressure pills."}]}},{"text":"Siti, the daytime caregiver, can't understand what Grandpa Ming wants. He gets more and more upset.","spots":[{"t":"Picture cards: water, toilet, pain, cold, hot"},{"t":"Ask yes/no questions – a nod or shake is enough"}],"q":{"t":"What can Siti do?","o":[{"t":"Show picture cards so he can point","fb":"Yes! People who can't speak can often still point."},{"t":"Keep asking: \"What? What did you say?\"","fb":"Repeated questions make him more upset and less able to speak."}]}},{"text":"One day Grandpa Ming looks out the window and says: \"What's the point of living like this?\"","spots":[{"t":"Hold his hand and listen first"},{"t":"Low mood after stroke is common and treatable"}],"q":{"t":"How can Hui respond?","o":[{"t":"Sit and listen, then tell the doctor at the next visit","fb":"Yes! Speaking up is a call for help. If he thinks of harming himself, call 1925 or tell the care team; in immediate danger call 119."},{"t":"\"Don't talk nonsense. Cheer up.\"","fb":"Dismissing his feelings means he won't share them again."}]}},{"text":"After months of caring, Grandma is tired too. The hospital social worker says: \"To care for others, care for yourself.\"","spots":[{"t":"Call 1966, the long-term care line, about respite services"},{"t":"Say when you're tired; family members take turns"}]},{"text":"A little better each day. With the whole family together, there's nothing to fear.","remember":["Face droops, arm weak, speech unclear: call 119","Sit upright, small bites, swallow before the next","Turn with shoulder and hip – never pull the arm","Wheelchair on the strong side, brakes on","At night: light on, sit 30 seconds before standing","BP 180/120 or higher: rest, re-measure, contact the doctor that day","Caregivers need rest too: 1966"]}]},"id":{"ui":{"title":"Kakek Ming Pulang ke Rumah","sub":"Kisah keluarga merawat pasien stroke","start":"Mulai membaca","prev":"Kembali","next":"Lanjut","read":"Bacakan","stop":"Berhenti","tapHint":"Ketuk lingkaran yang bersinar untuk melihat tips","choose":"Apa yang akan Anda lakukan?","right":"Benar","wrong":"Pikirkan lagi","tryAgain":"Coba lagi","found":"Ditemukan {n} / {m} tips","page":"Halaman {i} / {n}","again":"Baca lagi","toApp":"Latihan di aplikasi","remember":"Ingat bersama","score":"Benar {n} / {m} pada percobaan pertama","noVoice":"Ponsel ini tidak punya suara untuk bahasa ini. Silakan baca teksnya atau minta keluarga membacakan.","disclaimer":"Buku ini untuk edukasi. Ikuti petunjuk tim medis Anda.","lang":"Bahasa","close":"Tutup","weak":"Oranye = sisi yang lemah"},"pages":[{},{"text":"Minggu pagi saat sarapan, Kakek Ming tiba-tiba bicara pelo, mulutnya mencong, dan tangan kanannya tidak bisa diangkat. Anaknya, Jie, sangat terkejut.","spots":[{"t":"F Wajah: minta dia tersenyum – satu sisi turun"},{"t":"A Lengan: angkat kedua tangan – satu turun"},{"t":"T Waktu: catat jam mulainya, segera telepon 119"}],"q":{"t":"Apa yang harus Jie lakukan?","o":[{"t":"Segera telepon 119 dan catat waktunya","fb":"Benar! Wajah mencong, tangan lemah, bicara pelo adalah tanda stroke. Setiap menit penting."},{"t":"Mungkin kurang tidur, biarkan istirahat","fb":"Jangan menunggu. Pengobatan untuk membuka sumbatan ada batas waktunya."},{"t":"Beri minum air dan obat biasanya","fb":"Jangan beri makan atau minum, bisa tersedak. Telepon 119 dulu."}]}},{"text":"Setelah gawat darurat, Kakek Ming pindah ke ruang perawatan pasca-akut (PAC). Dokter, terapis, dan perawat berlatih bersamanya.","spots":[{"t":"Fisioterapi: latihan berdiri dan berjalan berpegangan"},{"t":"Terapi okupasi: latihan tangan, berpakaian, makan"},{"t":"Tim menilai kemajuan setiap 2–3 minggu"}]},{"text":"Sebelum makan pertama, terapis wicara berkata: \"Duduk tegak dulu, baru makan.\"","spots":[{"t":"Duduk tegak 90°, punggung bersandar"},{"t":"Dagu sedikit ditekuk ke bawah"},{"t":"Tekstur makanan sesuai saran terapis wicara"}]},{"text":"Putrinya, Hui, mengambil sendok untuk menyuapi ayahnya bubur.","spots":[{"t":"Satu sendok kecil setiap kali"},{"t":"Pastikan sudah ditelan dan mulut kosong sebelum suapan berikutnya"},{"t":"Batuk atau suara basah: berhenti dulu"}],"q":{"t":"Cara menyuapi yang lebih aman?","o":[{"t":"Satu sendok kecil, dari sisi yang kuat","fb":"Benar! Suapan kecil dari sisi kuat mengurangi risiko tersedak."},{"t":"Suapan besar supaya cepat selesai","fb":"Suapan besar mudah tersedak atau masuk ke saluran napas."},{"t":"Mengajak ngobrol sambil menyuapi","fb":"Bicara sambil makan mudah tersedak. Ngobrol setelah makan."}]}},{"text":"Berbaring terlalu lama bisa melukai kulit. Hui belajar membalikkan badan ayahnya.","spots":[{"t":"Satu tangan di bahu, satu di pinggul – balikkan bersamaan"},{"t":"Tekuk lututnya dulu, lebih mudah dibalik"}],"q":{"t":"Bagaimana cara membalikkan badannya?","o":[{"t":"Pegang bahu dan pinggul, balikkan ke arah Anda","fb":"Benar! Badan berputar bersamaan, tidak terpelintir."},{"t":"Tarik tangannya yang lemah","fb":"Menarik tangan yang lemah bisa mencederai bahu."}]}},{"text":"Setelah dibalik, diganjal bantal. Kakek Ming jauh lebih nyaman.","spots":[{"t":"Bantal di antara kedua kaki"},{"t":"Tangan yang lemah diletakkan di atas bantal"},{"t":"Balikkan sekitar setiap 2 jam, sesuai penilaian perawat"}]},{"text":"Cuaca cerah. Jie membantu ayahnya duduk di kursi roda untuk berjemur di taman.","spots":[{"t":"Rem dipasang, pijakan kaki dilipat"},{"t":"Pegang pinggang atau sabuk, jangan tarik tangan"},{"t":"Lutut Anda menahan lutut sisi yang lemah"}],"q":{"t":"Di mana kursi roda diletakkan?","o":[{"t":"Di sisi yang kuat, miring 45 derajat","fb":"Benar! Berputar ke sisi kuat, kakinya sendiri bisa membantu."},{"t":"Tepat di depannya, paling mudah duduk","fb":"Harus berputar setengah lingkaran – paling mudah jatuh."}]}},{"text":"Jam 2 pagi, Kakek Ming ingin ke toilet. Nenek tidak ingin membangunkan semua orang.","spots":[{"t":"Nyalakan lampu, pasang lampu malam di lorong"},{"t":"Lantai bebas barang dan kabel"},{"t":"Duduk di tepi ranjang 30 detik, berdiri 30 detik, baru berjalan"}],"q":{"t":"Apa yang harus Nenek lakukan?","o":[{"t":"Nyalakan lampu, duduk 30 detik dulu, pakai sandal","fb":"Benar! Duduk dulu mencegah pusing, lampu membuat jalan terlihat."},{"t":"Tidak menyalakan lampu, langsung bantu berdiri","fb":"Tempat gelap paling mudah membuat jatuh."}]}},{"text":"Pagi hari tekanan darah 185/100. Kakek Ming bilang tidak merasa apa-apa.","spots":[{"t":"722: 7 hari berturut-turut, pagi dan malam, ukur 2 kali setiap kali"},{"t":"Duduk istirahat 5 menit sebelum mengukur"}],"q":{"t":"Apa yang harus Jie lakukan?","o":[{"t":"Biarkan duduk istirahat beberapa menit, lalu ukur lagi","fb":"Benar! Jika setelah istirahat masih 180/120 atau lebih, hubungi dokter hari itu juga."},{"t":"Langsung beri tambahan satu obat darah tinggi","fb":"Jangan menambah obat sendiri, tekanan turun terlalu cepat juga berbahaya."}]}},{"text":"Jam 9 malam, Hui sadar obat pagi lupa diminum.","spots":[{"t":"Kotak obat dengan sekat pagi, siang, malam"},{"t":"Jika ragu, telepon apotek atau rumah sakit"}],"q":{"t":"Apa yang harus Hui lakukan?","o":[{"t":"Baca petunjuk di kantong obat; jika ragu, telepon dan tanyakan","fb":"Benar! Setiap obat berbeda cara menanganinya, bertanya paling aman."},{"t":"Minum obat pagi dan malam sekaligus","fb":"Dosis ganda bisa berlebihan, terutama pengencer darah dan obat darah tinggi."}]}},{"text":"Siti, perawat yang menemani di siang hari, tidak mengerti apa yang Kakek Ming inginkan. Kakek makin gelisah.","spots":[{"t":"Kartu gambar: air, toilet, sakit, dingin, panas"},{"t":"Ajukan pertanyaan ya/tidak – cukup mengangguk atau menggeleng"}],"q":{"t":"Apa yang bisa Siti lakukan?","o":[{"t":"Tunjukkan kartu gambar agar dia bisa menunjuk","fb":"Benar! Orang yang sulit bicara sering masih bisa menunjuk."},{"t":"Terus bertanya: \"Apa? Bapak bilang apa?\"","fb":"Terus ditanya membuat dia makin gelisah dan makin sulit bicara."}]}},{"text":"Suatu hari Kakek Ming menatap jendela dan berkata: \"Apa gunanya hidup seperti ini.\"","spots":[{"t":"Genggam tangannya, dengarkan dulu"},{"t":"Sedih setelah stroke sering terjadi dan bisa diobati"}],"q":{"t":"Bagaimana Hui bisa menanggapi?","o":[{"t":"Duduk dan dengarkan, lalu beri tahu dokter saat kontrol","fb":"Benar! Mau bercerita berarti minta tolong. Jika ada pikiran menyakiti diri, telepon 1925 atau beri tahu tim medis; jika bahaya segera, telepon 119."},{"t":"\"Jangan bicara sembarangan, bersemangatlah.\"","fb":"Menolak perasaannya membuat dia tidak mau bercerita lagi."}]}},{"text":"Setelah berbulan-bulan merawat, Nenek juga lelah. Pekerja sosial rumah sakit berkata: \"Merawat orang lain, rawat juga diri sendiri.\"","spots":[{"t":"Telepon 1966, layanan perawatan jangka panjang, tanyakan layanan istirahat (respite)"},{"t":"Katakan jika lelah, keluarga bergantian merawat"}]},{"text":"Sedikit demi sedikit, Kakek Ming makin membaik. Bersama keluarga, tidak perlu takut.","remember":["Wajah mencong, tangan lemah, bicara pelo: telepon 119","Duduk tegak, suapan kecil, telan dulu baru suapan berikutnya","Balikkan badan lewat bahu dan pinggul, jangan tarik tangan","Kursi roda di sisi kuat, rem dipasang","Malam hari: nyalakan lampu, duduk 30 detik baru berdiri","Tekanan darah 180/120 atau lebih: istirahat, ukur lagi, hubungi dokter hari itu","Perawat juga perlu istirahat: 1966"]}]},"vi":{"ui":{"title":"Ông Minh về nhà","sub":"Câu chuyện một gia đình chăm sóc người đột quỵ","start":"Bắt đầu đọc","prev":"Trước","next":"Sau","read":"Đọc to","stop":"Dừng","tapHint":"Chạm vào vòng tròn phát sáng để xem bí quyết","choose":"Bạn sẽ làm gì?","right":"Đúng rồi","wrong":"Nghĩ lại nhé","tryAgain":"Chọn lại","found":"Đã tìm thấy {n} / {m} bí quyết","page":"Trang {i} / {n}","again":"Đọc lại","toApp":"Luyện tập trong ứng dụng","remember":"Cả nhà cùng nhớ","score":"Đúng {n} / {m} câu ngay lần đầu","noVoice":"Điện thoại này không có giọng đọc cho ngôn ngữ này. Hãy đọc chữ hoặc nhờ người nhà đọc giúp.","disclaimer":"Sách này chỉ để giáo dục sức khỏe. Hãy làm theo hướng dẫn của đội ngũ y tế.","lang":"Ngôn ngữ","close":"Đóng","weak":"Màu cam = bên yếu"},"pages":[{},{"text":"Bữa sáng Chủ nhật, ông Minh đột nhiên nói ngọng, miệng méo, tay phải không nhấc lên được. Con trai Kiệt rất hoảng.","spots":[{"t":"F Mặt: bảo ông cười – một bên bị xệ"},{"t":"A Tay: giơ hai tay – một bên rơi xuống"},{"t":"T Thời gian: ghi giờ bắt đầu, gọi 119 ngay"}],"q":{"t":"Kiệt nên làm gì?","o":[{"t":"Gọi 119 ngay và ghi lại giờ bắt đầu","fb":"Đúng! Méo mặt, yếu tay, nói không rõ là dấu hiệu đột quỵ. Mỗi phút đều quan trọng."},{"t":"Chắc ngủ không ngon, để ông nghỉ xem sao","fb":"Không được chờ. Điều trị làm thông mạch máu có giới hạn thời gian."},{"t":"Cho ông uống nước và thuốc thường ngày","fb":"Không cho ăn uống, có thể bị sặc. Gọi 119 trước."}]}},{"text":"Sau cấp cứu, ông Minh chuyển sang khoa chăm sóc sau cấp tính (PAC). Bác sĩ, chuyên viên trị liệu và điều dưỡng cùng tập với ông.","spots":[{"t":"Vật lý trị liệu: vịn tay vịn tập đứng, tập đi"},{"t":"Hoạt động trị liệu: tập tay, mặc áo, ăn uống"},{"t":"Cả nhóm đánh giá tiến bộ mỗi 2–3 tuần"}]},{"text":"Trước bữa ăn đầu tiên, chuyên viên ngôn ngữ trị liệu nói: \"Ngồi thẳng trước, rồi mới ăn.\"","spots":[{"t":"Ngồi thẳng 90 độ, lưng tựa chắc"},{"t":"Hơi cúi cằm xuống"},{"t":"Độ mềm, đặc của thức ăn theo hướng dẫn của chuyên viên"}]},{"text":"Con gái Huệ cầm thìa, định đút cháo cho bố.","spots":[{"t":"Mỗi lần một thìa nhỏ"},{"t":"Nhìn ông nuốt xong, miệng trống rồi mới đút tiếp"},{"t":"Ho hoặc giọng bị ướt: dừng lại trước"}],"q":{"t":"Huệ đút thế nào thì an toàn hơn?","o":[{"t":"Một thìa nhỏ, đưa vào bên khỏe","fb":"Đúng! Miếng nhỏ, từ bên khỏe, ít bị sặc hơn."},{"t":"Một miếng to cho nhanh xong","fb":"Miếng to dễ sặc, có thể vào khí quản."},{"t":"Vừa đút vừa hỏi chuyện","fb":"Vừa ăn vừa nói dễ bị sặc. Ăn xong hãy nói chuyện."}]}},{"text":"Nằm lâu quá sẽ bị loét da. Huệ học cách trở mình cho bố.","spots":[{"t":"Một tay đỡ vai, một tay đỡ hông, cùng lật"},{"t":"Co gối ông lên trước, lật dễ hơn"}],"q":{"t":"Trở mình cho ông thế nào?","o":[{"t":"Một tay đỡ vai, một tay đỡ hông, lật về phía mình","fb":"Đúng! Cả người cùng xoay, không bị vặn."},{"t":"Kéo tay bên yếu để lật ông","fb":"Kéo tay yếu có thể làm tổn thương vai."}]}},{"text":"Lật xong, kê gối cẩn thận, ông Minh dễ chịu hơn nhiều.","spots":[{"t":"Kẹp một chiếc gối giữa hai chân"},{"t":"Đặt tay bên yếu lên gối"},{"t":"Khoảng 2 giờ lật một lần, theo đánh giá của điều dưỡng"}]},{"text":"Trời đẹp, Kiệt đỡ bố ngồi xe lăn ra công viên phơi nắng.","spots":[{"t":"Khóa phanh, gập bàn để chân lên"},{"t":"Đỡ eo hoặc thắt lưng, không kéo tay"},{"t":"Dùng gối mình chặn gối bên yếu của ông"}],"q":{"t":"Đặt xe lăn ở đâu?","o":[{"t":"Bên khỏe, chếch 45 độ","fb":"Đúng! Xoay về bên khỏe, chân ông tự dùng được sức."},{"t":"Ngay đối diện, ngồi xuống tiện nhất","fb":"Đối diện phải xoay nửa vòng, dễ ngã nhất."}]}},{"text":"Hai giờ sáng, ông Minh muốn đi vệ sinh. Bà sợ đánh thức cả nhà.","spots":[{"t":"Bật đèn, lắp đèn ngủ ở lối đi"},{"t":"Sàn nhà không để đồ đạc, dây điện"},{"t":"Ngồi mép giường 30 giây, đứng 30 giây rồi mới đi"}],"q":{"t":"Bà nên làm gì?","o":[{"t":"Bật đèn, cho ông ngồi mép giường 30 giây, đi dép vào","fb":"Đúng! Ngồi trước rồi đứng sẽ không chóng mặt, có đèn mới thấy đường."},{"t":"Không bật đèn, đỡ ông dậy luôn","fb":"Chỗ tối là nơi dễ ngã nhất."}]}},{"text":"Buổi sáng đo huyết áp: 185/100. Ông Minh nói không thấy khó chịu gì.","spots":[{"t":"722: 7 ngày liên tục, sáng tối mỗi lần, mỗi lần đo 2 lượt"},{"t":"Ngồi nghỉ 5 phút trước khi đo"}],"q":{"t":"Kiệt nên làm gì?","o":[{"t":"Cho ông ngồi nghỉ vài phút rồi đo lại","fb":"Đúng! Nghỉ xong vẫn từ 180/120 trở lên thì liên hệ bác sĩ ngay trong ngày."},{"t":"Cho uống thêm một viên thuốc huyết áp ngay","fb":"Không tự ý thêm thuốc, huyết áp hạ quá nhanh cũng nguy hiểm."}]}},{"text":"Chín giờ tối, Huệ phát hiện thuốc buổi sáng quên uống.","spots":[{"t":"Hộp thuốc chia ngăn sáng, trưa, tối"},{"t":"Không chắc thì gọi hỏi nhà thuốc hoặc bệnh viện"}],"q":{"t":"Huệ nên làm gì?","o":[{"t":"Xem hướng dẫn trên túi thuốc, không chắc thì gọi hỏi","fb":"Đúng! Mỗi loại thuốc quên uống xử lý khác nhau, hỏi là an toàn nhất."},{"t":"Uống gộp thuốc sáng và tối","fb":"Uống gấp đôi có thể quá liều, nhất là thuốc chống đông và thuốc huyết áp."}]}},{"text":"Siti, người chăm sóc ban ngày, không hiểu ông Minh muốn gì. Ông càng lúc càng sốt ruột.","spots":[{"t":"Thẻ hình: nước, nhà vệ sinh, đau, lạnh, nóng"},{"t":"Hỏi câu có/không, chỉ cần gật hay lắc đầu"}],"q":{"t":"Siti có thể làm gì?","o":[{"t":"Đưa thẻ const SAY={zh:[["119","一一九"],["1966","一九六六"],["1925","一九二五"],["722","七二二"],["185/100","一百八十五、一百"],["180/120","一百八十、一百二十"],["PAC","P A C"],["/","、"]]};
let lang=(()=>{const q=new URLSearchParams(location.search).get("lang");if(q&&DATA[q])return q;try{const s=localStorage.getItem("pac.book.lang")||(JSON.parse(localStorage.getItem("pac.lang")||"null"));if(s&&DATA[s])return s}catch(e){}return "zh"})();
let cur=0,seen={},answered={},firstTry={},reading=false;
const $=s=>document.querySelector(s);
const D=()=>DATA[lang]||DATA.zh;
const P=i=>{const z=DATA.zh.pages[i],l=(DATA[lang]||{}).pages;return Object.assign({},z,l&&l[i]?l[i]:{},{img:z.img,cover:z.cover,end:z.end,spots:(z.spots||[]).map((s,k)=>Object.assign({},s,{t:l&&l[i]&&l[i].spots?l[i].spots[k].t:s.t})),q:z.q?{t:(l&&l[i]&&l[i].q?l[i].q.t:z.q.t),o:z.q.o.map((o,k)=>Object.assign({},o,l&&l[i]&&l[i].q?{t:l[i].q.o[k].t,fb:l[i].q.o[k].fb}:{}))}:null})};
const U=k=>(D().ui[k]!==undefined?D().ui[k]:DATA.zh.ui[k]);
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N=DATA.zh.pages.length;
const QN=DATA.zh.pages.filter(p=>p.q).length;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2600)}
/* speech */
function voiceFor(){const tag=LANGS.find(l=>l[0]===lang)[2],vs=speechSynthesis.getVoices();const base=tag.slice(0,2);return vs.find(v=>v.lang.replace("_","-")===tag)||(lang==="zh"?vs.find(v=>/zh[-_](TW|Hant)/i.test(v.lang)):null)||vs.find(v=>v.lang.toLowerCase().startsWith(base))}
function sayText(t){(SAY[lang]||[]).forEach(([a,b])=>{t=t.split(a).join(b)});return t}
function speak(text,onend){if(!("speechSynthesis" in window)){toast(U("noVoice"));return}speechSynthesis.cancel();const v=voiceFor();if(!v&&speechSynthesis.getVoices().length){toast(U("noVoice"))}const u=new SpeechSynthesisUtterance(sayText(text));u.lang=LANGS.find(l=>l[0]===lang)[2];if(v)u.voice=v;u.rate=lang==="zh"?0.85:0.9;u.onend=onend||null;speechSynthesis.speak(u)}
function stopSpeak(){reading=false;try{speechSynthesis.cancel()}catch(e){}$("#read").setAttribute("aria-pressed","false");$("#readTxt").textContent=U("read")}
function pageText(i){const p=P(i);if(p.cover)return U("title")+"。"+U("sub");let t=p.text||"";if(p.q)t+="。"+p.q.t;if(p.end)t+="。"+U("remember")+"："+p.remember.join("。");return t}
function readPage(){if(!reading)return;speak(pageText(cur),()=>{if(reading){$("#read").setAttribute("aria-pressed","false");reading=false;$("#readTxt").textContent=U("read")}})}
$("#read").onclick=()=>{if(reading){stopSpeak();return}reading=true;$("#read").setAttribute("aria-pressed","true");$("#readTxt").textContent=U("stop");readPage()};
/* render */
function render(dir){
 const st=$("#stage");while(st.children.length>1)st.firstElementChild.remove();const old=st.firstElementChild;
 const p=P(cur),el=document.createElement("section");el.className="page "+(dir>0?"in-right":dir<0?"in-left":"");
 let h="";
 if(p.cover){h=`<div class="cover"><div class="pic"><img src="img/${p.img}.webp" alt="" width="800" height="600"></div><h2>${esc(U("title"))}</h2><p>${esc(U("sub"))}</p><div class="legend"><i></i>${esc(U("weak"))}</div><div><button class="big" data-go="1" type="button">${esc(U("start"))} ›</button></div><p class="note">${esc(U("disclaimer"))}</p></div>`}
 else{
  h+=`<div class="pic"><img src="img/${p.img}.webp" alt="" width="800" height="600">`;
  (p.spots||[]).forEach((s,k)=>{const sn=(seen[cur]||{})[k];h+=`<button class="spot${sn?" seen":""}" style="left:${s.x}%;top:${s.y}%" data-spot="${k}" type="button" aria-label="${esc(s.t)}">${sn?"✓":k+1}</button>`});
  h+=`<div id="tipBox"></div></div>`;
  h+=`<p class="story">${esc(p.text)}</p>`;
  if(p.spots&&p.spots.length){const n=Object.keys(seen[cur]||{}).length;h+=`<p class="hint">${n?`<b>${esc(fmt(U("found"),{n,m:p.spots.length}))}</b>`:esc(U("tapHint"))}</p>`}
  if(p.q){const a=answered[cur];h+=`<div class="q"><h2>${esc(p.q.t)}</h2>`;p.q.o.forEach((o,k)=>{let c="";if(a&&a.k===k)c=o.ok?" good":" bad";h+=`<button class="opt${c}" data-opt="${k}" type="button">${esc(o.t)}</button>`});if(a){const o=p.q.o[a.k];h+=`<div class="fb ${o.ok?"good":"bad"}" role="status"><b>${esc(o.ok?U("right"):U("wrong"))}</b>${esc(o.fb)}</div>`}h+=`</div>`}
  if(p.end){const sc=Object.values(firstTry).filter(Boolean).length;h+=`<div class="remember"><h3>${esc(U("remember"))}</h3><ul>${p.remember.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div><p class="score" style="text-align:center">${esc(fmt(U("score"),{n:sc,m:QN}))}</p><div class="endbtns"><button class="big ghost" data-go="0" type="button">↺ ${esc(U("again"))}</button><a class="big" href="index.html#train">${esc(U("toApp"))} ›</a></div><p class="note" style="text-align:center">${esc(U("disclaimer"))}</p>`}
 }
 el.innerHTML=h;
 if(old&&dir){old.className="page "+(dir>0?"out-left":"out-right");setTimeout(()=>old.remove(),450);st.appendChild(el)}else{st.innerHTML="";st.appendChild(el)}
 $("#ttl").textContent=U("title");$("#prev").textContent="‹ "+U("prev");$("#next").textContent=U("next")+" ›";$("#prev").disabled=cur===0;$("#next").disabled=cur===N-1;
 $("#pgTxt").textContent=fmt(U("page"),{i:cur+1,n:N});
 $("#dots").innerHTML=Array.from({length:N},(_,i)=>`<span class="${i===cur?"on":""}"></span>`).join("");
 if(!reading)$("#readTxt").textContent=U("read");
 document.documentElement.lang=LANGS.find(l=>l[0]===lang)[2];
}
function go(i){if(i<0||i>=N||i===cur)return;const d=i>cur?1:-1;cur=i;if(i===0){seen={};answered={};firstTry={}}render(d);window.scrollTo({top:0,behavior:"smooth"});if(reading)readPage()}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-spot],[data-opt],[data-go],.tipx");if(!t||t.closest(".out-left,.out-right"))return;
 if(t.dataset.go!==undefined){go(+t.dataset.go);return}
 if(t.classList.contains("tipx")){$("#tipBox").innerHTML="";return}
 const p=P(cur);
 if(t.dataset.spot!==undefined){const k=+t.dataset.spot;seen[cur]=seen[cur]||{};seen[cur][k]=1;t.classList.add("seen");t.textContent="✓";$("#tipBox").innerHTML=`<div class="tip" role="status">${esc(p.spots[k].t)}<button class="tipx" type="button" aria-label="${esc(U("close"))}">×</button></div>`;const n=Object.keys(seen[cur]).length,hint=document.querySelector(".hint");if(hint)hint.innerHTML=`<b>${esc(fmt(U("found"),{n,m:p.spots.length}))}</b>`;if(reading)speak(p.spots[k].t);return}
 if(t.dataset.opt!==undefined){const k=+t.dataset.opt;if(!(cur in firstTry))firstTry[cur]=!!p.q.o[k].ok;answered[cur]={k};render(0);const fb=document.querySelector(".fb");if(fb)fb.scrollIntoView({behavior:"smooth",block:"nearest"});if(reading)speak((p.q.o[k].ok?U("right"):U("wrong"))+"。"+p.q.o[k].fb)}
});
$("#prev").onclick=()=>go(cur-1);$("#next").onclick=()=>go(cur+1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
let sx=null,sy=null;$("#stage").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("#stage").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1));sx=null},{passive:true});
const sel=$("#lang");sel.innerHTML=LANGS.filter(l=>DATA[l[0]]).map(l=>`<option value="${l[0]}">${l[1]}</option>`).join("");sel.value=lang;
sel.onchange=()=>{lang=sel.value;try{localStorage.setItem("pac.book.lang",lang)}catch(e){}stopSpeak();$("#langLbl").textContent=U("lang");render(0)};
$("#langLbl").textContent=U("lang");
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{};
render(0);
</script>
</body>
</html>
